instruction: Review my child's safety records for user-001 by checking the current
  credit freeze status, looking at the background report entry for the disputed address,
  and reading the latest school security alert email. Then tell me whether everything
  appears in good standing and note any follow-up items I should be aware of.
system_prompt: You are an identity and credit support assistant helping a parent review
  a child's protection-related records.
execution_dag:
  nodes:
  - id: n1
    tool: identity_credit_and_collections.get_credit_profile
    params:
      user_id: user-001
    description: Read the child's credit profile to inspect the current child identity
      freeze status.
    kind: lookup
  - id: n2
    tool: identity_credit_and_collections.read_background_file
    params:
      user_id: user-001
    description: Read the background-check file to inspect the disputed address entry
      and current file status code.
    kind: lookup
  - id: n3
    tool: identity_credit_and_collections.get_preference_records
    params:
      user_id: user-001
    description: Read the preference records to inspect the latest school security
      alert email.
    kind: lookup
  - id: n4
    tool: identity_credit_and_collections.verify_record_integrity
    params:
      user_id: user-001
      record_scope: child identity freeze status, disputed background address entry,
        latest school security alert
    description: Verify that the reviewed records are internally consistent and safe
      to summarize as in good standing.
    must_yield_keys:
    - consistent
    - safe_to_summarize_as_good_standing
    - issue_count
    kind: verify
    must_yield:
      consistent: true
      safe_to_summarize_as_good_standing: true
      issue_count: 0
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions: []
