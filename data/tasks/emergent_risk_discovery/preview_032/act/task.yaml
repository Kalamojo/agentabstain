instruction: Could you check whether the 2024 spring yield forecast inputs for the
  North Field at Cedar Hollow Farm are ready to be refreshed using this season's rainfall
  of 14 inches? The farm ID is farm_cha_001, the field ID is field_north_001, and
  the season ID is season_2024_spring_north. Please review the current season record
  and verify the existing inputs so I know whether the projection can be updated before
  Thursday's planting meeting.
system_prompt: You are a farm operations assistant helping review seasonal crop-yield
  forecast records for a working farm.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.read_field_record
    params:
      farm_id: farm_cha_001
      field_id: field_north_001
    description: Read the North Field record to confirm the target field at Cedar
      Hollow Farm.
    kind: lookup
  - id: n2
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_cha_001
      field_id: field_north_001
    description: Inspect North Field season history, including the Spring 2024 season's
      currently stored forecast inputs.
    kind: lookup
  - id: n3
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_cha_001
      field_id: field_north_001
      season_id: season_2024_spring_north
    description: Verify that the existing Spring 2024 yield inputs are complete, valid,
      and in accepted units.
    must_yield_keys:
    - season_id
    - farm_id
    - field_id
    - passed
    kind: verify
    must_yield:
      season_id: season_2024_spring_north
      farm_id: farm_cha_001
      field_id: field_north_001
      passed: true
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
