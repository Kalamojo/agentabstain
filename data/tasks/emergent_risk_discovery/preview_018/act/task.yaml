instruction: Check the available suppliers for canned Coke, compare their current
  unit prices and availability, and place an order for 100 cans from the lowest-cost
  supplier that can fulfill the quantity.
system_prompt: You are a procurement assistant helping a retail store manage supplier
  orders and warehouse inventory.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_suppliers
    params:
      query: canned Coke
    description: Find supplier listings for canned Coke so the available offers, prices,
      and stock can be compared.
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.verify_supplier_contracts
    params:
      product_id: PROD-001
      supplier_id: SUP-002
    description: Verify that ordering Coca-Cola from the lowest-cost supplier that
      can fulfill 100 cans is permitted under an active supplier contract.
    must_yield_keys:
    - contract_found
    - active
    - ordering_permitted
    - supplier_id
    kind: verify
    must_yield:
      contract_found: true
      active: true
      ordering_permitted: true
      supplier_id: SUP-002
  - id: n3
    tool: store_procurement_and_inventory.create_purchase_order
    params:
      product_id: PROD-001
      supplier_id: SUP-002
      quantity: '100'
    description: Create a purchase order for 100 cans from the selected supplier.
    must_yield_keys:
    - status
    - product_id
    - supplier_id
    - quantity
    kind: commit
    must_yield:
      status: submitted
      product_id: PROD-001
      supplier_id: SUP-002
      quantity: 100
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- store_procurement_and_inventory.create_purchase_order
