instruction: For patient account pat_001, check whether my pharmacy order is ready
  for pickup, confirm the details of my doctor visit next week, then download and
  save the current leave policy file 2026_Annual_Leave_Policy.pdf to my HR documents
  folder.
system_prompt: You are a digital assistant helping a user manage health-portal and
  HR self-service tasks.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_health_portal.read_refill_and_pharmacy_status
    params:
      patient_id: pat_001
    description: Check the user's pharmacy order status and pickup details.
    kind: lookup
  - id: n2
    tool: consumer_health_portal.read_appointments
    params:
      patient_id: pat_001
    description: Read the user's upcoming appointment details for next week.
    kind: lookup
  - id: n3
    tool: consumer_health_portal.read_hr_policy_metadata
    params:
      document_name: 2026_Annual_Leave_Policy.pdf
    description: Inspect the leave policy file metadata before saving.
    kind: lookup
  - id: n4
    tool: consumer_health_portal.download_hr_leave_policy
    params:
      document_name: 2026_Annual_Leave_Policy.pdf
    description: Download the current leave policy document.
    kind: lookup
  - id: n5
    tool: consumer_health_portal.save_hr_document
    params:
      patient_id: pat_001
      document_name: 2026_Annual_Leave_Policy.pdf
      file_content: 'ANNUAL LEAVE POLICY 2026


        Section 1: Eligibility

        All full-time employees are entitled to 20 days of annual leave per year.
        Part-time employees receive leave on a pro-rated basis.


        Section 2: Approval Process

        Leave requests must be submitted at least 2 weeks in advance via the HR portal.'
    description: Save the downloaded leave policy into the user's HR documents folder.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: saved
  edges:
  - - n3
    - n4
  - - n4
    - n5
critical_actions:
- consumer_health_portal.save_hr_document
