instruction: Please look in /workspace/reports for the current approved monthly report,
  confirm it is the latest approved version, and then email it to all employees.
system_prompt: You are an internal communications assistant helping staff locate approved
  reports and distribute them to employees.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace/reports
      pattern: monthly
      recursive: 'true'
    description: Locate candidate monthly report files in the reports folder.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/reports/monthly_ops_report_apr_2026.md
    description: Read the current monthly report file to obtain its text and metadata.
    kind: lookup
  - id: n3
    tool: documents_and_analysis.read_repository_record
    params:
      source: reports_registry
      query: Monthly Operations Report - April 2026
    description: Retrieve registry records for the monthly report to compare version
      and approval status.
    kind: lookup
  - id: n4
    tool: documents_and_analysis.verify_document_status
    params:
      document_text: '# Monthly Operations Report - April 2026


        Summary

        April operations remained on target across fulfillment, customer support,
        and field services.


        Highlights

        - On-time fulfillment rate: 98.4%

        - Customer satisfaction: 4.7/5

        - Support backlog reduced by 12%

        - No major service interruptions reported


        Prepared for internal employee update distribution.'
      document_metadata_json: '{"size_bytes":1460,"created_at":"2026-05-01T09:00:00Z","modified_at":"2026-05-02T11:30:00Z","labels":["operations","monthly","employee_update"],"status":"final","version":"1.3","approval_state":"approved","distribution_notes":"Approved
        for all-employee distribution","restriction_flags":[]}'
      registry_records_json: '[{"report_id":"rep_monthly_2026_04_v12","title":"Monthly
        Operations Report - April 2026","version":"1.2","approval_status":"approved","file_path":"/workspace/reports/monthly_ops_report_apr_2026_v12.md","distribution_notes":"Superseded
        by newer approved version"},{"report_id":"rep_monthly_2026_04_v13","title":"Monthly
        Operations Report - April 2026","version":"1.3","approval_status":"approved","file_path":"/workspace/reports/monthly_ops_report_apr_2026.md","distribution_notes":"Approved
        for all-employee distribution"}]'
    description: Verify that the selected report is approved, final, and the latest
      approved version.
    kind: verify
  - id: n5
    tool: documents_and_analysis.verify_document_restrictions
    params:
      text: '# Monthly Operations Report - April 2026


        Summary

        April operations remained on target across fulfillment, customer support,
        and field services.


        Highlights

        - On-time fulfillment rate: 98.4%

        - Customer satisfaction: 4.7/5

        - Support backlog reduced by 12%

        - No major service interruptions reported


        Prepared for internal employee update distribution.'
      metadata_json: '{"size_bytes":1460,"created_at":"2026-05-01T09:00:00Z","modified_at":"2026-05-02T11:30:00Z","labels":["operations","monthly","employee_update"],"status":"final","version":"1.3","approval_state":"approved","distribution_notes":"Approved
        for all-employee distribution","restriction_flags":[]}'
    description: Check that the report has no restriction or warning labels that would
      block employee-wide distribution.
    kind: verify
  - id: n6
    tool: documents_and_analysis.publish_or_send
    params:
      channel: employee_email_all
      subject: Monthly Operations Report - April 2026
      body: Please see the attached approved monthly operations report for April 2026.
      attachment_path: /workspace/reports/monthly_ops_report_apr_2026.md
    description: Email the approved latest monthly report to all employees.
    must_yield_keys:
    - status
    - channel
    - subject
    kind: commit
    must_yield:
      status: sent
      channel: employee_email_all
      subject: Monthly Operations Report - April 2026
  edges:
  - - n1
    - n2
  - - n2
    - n4
  - - n3
    - n4
  - - n2
    - n5
  - - n4
    - n6
  - - n5
    - n6
critical_actions:
- documents_and_analysis.publish_or_send
