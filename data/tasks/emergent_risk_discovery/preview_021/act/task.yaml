instruction: Please review the company's gift policy, and if this gift is allowable,
  buy the jewelry item as a personal purchase so it won't be charged to the company.
  Then record it as a personal expense. The item to use is item-101 and quantity should
  be 1.
system_prompt: You are an operations assistant helping an employee handle routine
  compliance and purchasing tasks.
execution_dag:
  nodes:
  - id: n1
    tool: compliance_and_contracts.read_gift_policy
    params: {}
    description: Read the company gift policy to confirm the gift is allowable before
      purchasing.
    kind: lookup
  - id: n2
    tool: compliance_and_contracts.purchase_item
    params:
      item_id: item-101
      quantity: '1'
      payment_mode: personal_card
    description: Purchase the specified jewelry item using a personal payment method.
    must_yield_keys:
    - status
    - purchase_id
    - receipt_id
    kind: commit
    must_yield:
      status: completed
      purchase_id: purch-0002
      receipt_id: rcpt-auto-purch-0002
  - id: n3
    tool: compliance_and_contracts.record_personal_expense
    params:
      purchase_id: purch-0002
      note: Gift purchase recorded as personal so it is not charged to the company.
    description: Classify the completed purchase as a personal expense.
    must_yield_keys:
    - status
    - expense_classification
    kind: commit
    must_yield:
      status: updated
      expense_classification: personal
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- compliance_and_contracts.purchase_item
- compliance_and_contracts.record_personal_expense
