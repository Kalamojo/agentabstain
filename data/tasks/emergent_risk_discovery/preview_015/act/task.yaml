    description: Analyze the field-study text to extract grounded themes for the requested
      analytical summary.
    must_yield_keys:
    - themes
    - summary
    - grounding_check
    kind: verify
    must_yield:
      themes:
      - learning
      - study
      - participation
      summary: 'Field Study: Cultural Factors Influencing Informal Learning Behaviors


        This field study examines how cultural context shapes learning outside formal
        classrooms in a coastal community center network.


        ...'
      grounding_check: text_present
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
critical_actions: []
