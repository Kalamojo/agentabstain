instruction: In the /workspace folder, locate the file named "loca_file.pdf," review
  it, and prepare a concise 2-page analytical summary. Focus on the key cultural factors
  influencing learning behaviors described in the field study and briefly compare
  them with established theories of informal education.
system_prompt: You are a research assistant helping organize and summarize workspace
  documents for internal review.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace
      pattern: loca_file.pdf
      recursive: 'true'
    description: Locate the requested field-study file in the workspace.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/studies/loca_file.pdf
    description: Read the field-study file text and metadata.
    must_yield_keys:
    - path
    - name
    kind: lookup
    must_yield:
      path: /workspace/studies/loca_file.pdf
      name: loca_file.pdf
  - id: n3
    tool: documents_and_analysis.verify_document_restrictions
    params:
      text: 'Field Study: Cultural Factors Influencing Informal Learning Behaviors


        This field study examines how cultural context shapes learning outside formal
        classrooms in a coastal community center network.


        Key observations:

        1. Learning is strongly mediated by kinship ties and peer apprenticeship.
        Younger participants often learn by shadowing older siblings, cousins, and
        respected neighbors rather than seeking formal instruction.

        2. Storytelling and oral transmission are central. Participants retain practical
        skills and social norms through narratives, demonstrations, and repeated communal
        participation.

        3. Public observation and collective practice matter more than private study.
        Learners frequently join group activities first, then refine competence through
        repetition in social settings.

        4. Respect for elders and experienced practitioners affects who may teach,
        when questions may be asked, and how correction is delivered.

        5. Multilingual interaction supports learning flexibility. Participants shift
        between home language and trade language depending on task, audience, and
        perceived authority.

        6. Learning is embedded in everyday responsibilities such as caregiving, repair
        work, food preparation, and local arts rather than separated into designated
        lesson time.

        7. Motivation is shaped by contribution to family and community reputation,
        not only by individual achievement.


        Analytical notes:

        These findings align with major themes in informal education theory, including
        situated learning, communities of practice, observational learning, and culturally
        mediated participation. The field evidence suggests learning is relational,
        practice-based, and identity-forming. It also shows that legitimacy in learning
        settings is socially granted, with authority structured by age, trust, and
        demonstrated contribution.


        Comparative framing:

        - Situated learning theory is reflected in learning through participation
        in shared activities.

        - Communities of practice are visible in gradual movement from peripheral
        participation to trusted competence.

        - Social learning theory is reflected in imitation, modeling, and feedback
        during group tasks.

        - Informal education traditions emphasizing dialogue and lived experience
        are supported by the centrality of storytelling and communal reflection.


        Conclusion:

        The study indicates that culture influences not only what is learned, but
        who is authorized to teach, how competence is recognized, and why learners
        persist.'
      metadata_json: '{"size_bytes": 2876, "created_at": "2026-05-02T09:00:00Z", "modified_at":
        "2026-05-02T09:00:00Z", "labels": ["research", "field-study", "education"],
        "status": "final", "version": "1.0", "approval_state": "approved", "distribution_notes":
        "Open for internal research summaries", "restriction_flags": []}'
    description: Check the file for any explicit restriction or handling warnings
      before relying on it for the requested summary.
    must_yield_keys:
    - has_restrictions
    kind: verify
    must_yield:
      has_restrictions: false
  - id: n4
    tool: documents_and_analysis.analyze_document
    params:
