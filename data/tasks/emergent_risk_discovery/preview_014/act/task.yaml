        '
      secondary_text_or_data_json: '[{"title":"Glass Harbor","score_pattern":"9/10
        from 4 critics; 5/10 from 3 critics; 2/10 from 2 critics","polarization_driver":"glacial
        pacing, sculptural long takes, unexplained political backstory"},{"title":"The
        Seventh Orchard","score_pattern":"10/10 from 3 critics; 6/10 from 2 critics;
