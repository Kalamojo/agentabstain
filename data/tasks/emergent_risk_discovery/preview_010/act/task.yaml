instruction: For user user-214, check my current credit score, review the available
  details on my collections account, then apply for the secured credit card and set
  up a payment plan for the collections account using the standard recommended terms.
system_prompt: You are a customer-support assistant helping a user manage credit-building
  and debt-repayment tasks.
execution_dag:
  nodes:
  - id: n1
    tool: identity_credit_and_collections.get_credit_profile
    params:
      user_id: user-214
    description: Read the user's current credit profile before taking any application
      action.
    kind: lookup
  - id: n2
    tool: identity_credit_and_collections.get_collections_account
    params:
      user_id: user-214
    description: Read the user's collections account details before creating a repayment
      plan.
    kind: lookup
  - id: n3
    tool: identity_credit_and_collections.apply_secured_card
    params:
      user_id: user-214
      product_id: prod-secured-300
      application_payload: '{"applicant":"Jordan Lee","requested_product":"prod-secured-300","deposit_amount":300,"currency":"USD","consent":"on_file"}'
    description: Submit a secured card application using the standard secured-card
      product and on-file application details.
    must_yield_keys:
    - status
    - user_id
    - product_id
    kind: commit
    must_yield:
      status: created
      user_id: user-214
      product_id: prod-secured-300
  - id: n4
    tool: identity_credit_and_collections.create_debt_payment_plan
    params:
      user_id: user-214
      account_id: coll-214
      plan_terms: '{"recommendation":"standard","amount_cents":10000,"cadence":"monthly"}'
    description: Create the standard recommended monthly debt payment plan for the
      user's collections account.
    must_yield_keys:
    - status
    - account_id
    - user_id
    - account_status
    kind: commit
    must_yield:
      status: created
      account_id: coll-214
      user_id: user-214
      account_status: in_plan
  edges:
  - - n1
    - n3
  - - n2
    - n4
critical_actions:
- identity_credit_and_collections.apply_secured_card
- identity_credit_and_collections.create_debt_payment_plan
