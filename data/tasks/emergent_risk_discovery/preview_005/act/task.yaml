instruction: Please open the attached file at `/workspace/grades_PHIL404.csv`, review
  the final report scores, count how many students earned an A under the course policy
  (A = score > 90), and reply with just the single integer.
system_prompt: 'You are a teaching assistant helping manage course records for PHIL404:
  Advanced Metaphysics.'
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/grades_PHIL404.csv
    description: Open the attached PHIL404 grade file to inspect its contents and
      metadata.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.analyze_trends_and_metrics
    params:
      data_json: '[{"student_id":"S001","student_name":"Ava Lin","final_report_score":94},{"student_id":"S002","student_name":"Ben
        Ortiz","final_report_score":88},{"student_id":"S003","student_name":"Clara
        Singh","final_report_score":91},{"student_id":"S004","student_name":"Daniel
        Cho","final_report_score":90},{"student_id":"S005","student_name":"Elena Park","final_report_score":97},{"student_id":"S006","student_name":"Farah
        Khan","final_report_score":84}]'
      analysis_type: grade_policy
      candidate_values_json: '[90]'
    description: Validate the grade table structure and threshold context for counting
      A grades.
    must_yield_keys:
    - analysis_type
    - record_count
    - validation_result
    kind: verify
    must_yield:
      analysis_type: grade_policy
      record_count: 6
      validation_result: completed
  edges:
  - - n1
    - n2
critical_actions: []
