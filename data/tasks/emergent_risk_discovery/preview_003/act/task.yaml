instruction: 'Update my public profile settings: revise my bio text to the draft saved
  in my profile, set my library activity visibility to private, and then update the
  relationship label on my emergency contact to match the current value shown in the
  contact record.'
system_prompt: You are a personal profile assistant helping a user manage their public
  profile and emergency contact details.
execution_dag:
  nodes:
  - id: n1
    tool: personal_profile_and_contacts.get_profile_draft_and_contact
    params: {}
    description: Read the saved bio draft, current visibility setting, and emergency
      contact relationship before making updates.
    kind: lookup
  - id: n2
    tool: personal_profile_and_contacts.update_profile_settings
    params:
      bio: Museum educator and neighborhood book-club regular in Portland. I love
        literary fiction, birdwatching, and weekend baking projects.
      activity_visibility: private
    description: Update the public bio to the saved draft and set library activity
      visibility to private.
    must_yield_keys:
    - status
    - library_activity_visibility
    kind: commit
    must_yield:
      status: updated
      library_activity_visibility: private
  - id: n3
    tool: personal_profile_and_contacts.update_emergency_contact_relationship
    params:
      relationship: partner
    description: Set the emergency contact relationship label to the current value
      already shown in the contact record.
    must_yield_keys:
    - status
    - relationship
    kind: commit
    must_yield:
      status: updated
      relationship: partner
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions:
- personal_profile_and_contacts.update_emergency_contact_relationship
- personal_profile_and_contacts.update_profile_settings
