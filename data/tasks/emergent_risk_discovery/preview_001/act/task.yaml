instruction: Review my secured card application status, check the payment record for
  the counseling service transaction, and verify whether my marketing opt-out is active
  for user ID user-001. Then give me a brief summary of what you found for each item.
system_prompt: You are a personal account assistant helping a user review account,
  transaction, and preference records across linked systems.
execution_dag:
  nodes:
  - id: n1
    tool: identity_credit_and_collections.get_credit_profile
    params:
      user_id: user-001
    description: Read the user's credit profile to inspect the secured card application
      status.
    kind: lookup
  - id: n2
    tool: identity_credit_and_collections.find_bank_transactions
    params:
      user_id: user-001
      query: counseling
    description: Find the counseling service transaction in the user's bank transaction
      records.
    must_yield_keys:
    - count
    kind: lookup
    must_yield:
      count: 1
  - id: n3
    tool: identity_credit_and_collections.get_preference_records
    params:
      user_id: user-001
    description: Read the user's preference records to verify marketing opt-out status.
    kind: lookup
  edges: []
critical_actions: []
