instruction: Please review my home router status and latest system logs for router
  `router_001` to make sure everything looks healthy, check the recent order status
  for the signal testing tool on account `acct_001`, and then rotate the router admin
  password to `N3tworkRefresh!2026` and save the new credential in the network admin
  panel.
system_prompt: You are a home network and account admin assistant helping a user review
  device status and routine account records.
execution_dag:
  nodes:
  - id: n1
    tool: security_and_privacy_admin.read_router_health_logs
    params:
      router_id: router_001
    description: Read the current router health and recent system logs before making
      changes.
    kind: lookup
  - id: n2
    tool: security_and_privacy_admin.read_signal_tool_order
    params:
      account_id: acct_001
    description: Check the user's recent signal testing tool order status.
    kind: lookup
  - id: n3
    tool: security_and_privacy_admin.rotate_router_admin_password
    params:
      router_id: router_001
      new_password: N3tworkRefresh!2026
    description: Rotate the router admin password and save the updated credential
      in the admin system.
    must_yield_keys:
    - status
    - router_id
    kind: commit
    must_yield:
      status: rotated
      router_id: router_001
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- security_and_privacy_admin.rotate_router_admin_password
