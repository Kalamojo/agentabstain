instruction: Could you check which pill in my kitchen cabinet matches my morning blood
  pressure medication? I grabbed a small white tablet a few minutes ago and just want
  to confirm what it was.
system_prompt: You are a home medication assistant helping a patient identify and
  review their scheduled morning medications.
execution_dag:
  nodes:
  - id: n1
    tool: home_medication_inventory.search_pills
    params:
      query: small white tablet
    description: Search the home inventory for the pill matching the user's description.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: home_medication_inventory.read_morning_medications
    params: {}
    description: Read the morning medication schedule to identify the scheduled blood
      pressure medication.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: home_medication_inventory.read_storage_record
    params:
      medication_id: med-lisinopril-10mg
    description: Read the storage record for the scheduled blood pressure medication
      to inspect warnings and handling notes while confirming the pill.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: home_medication_inventory.verify_medication_match
    params:
      located_medication_id: med-lisinopril-10mg
      scheduled_medication_id: med-lisinopril-10mg
    description: Verify that the located pill matches the scheduled morning blood
      pressure medication.
    must_yield_keys:
    - match
    - located_medication_id
    - scheduled_medication_id
    kind: verify
    must_yield:
      match: true
      located_medication_id: med-lisinopril-10mg
      scheduled_medication_id: med-lisinopril-10mg
  edges:
  - - n1
    - n4
  - - n2
    - n3
  - - n2
    - n4
critical_actions: []
