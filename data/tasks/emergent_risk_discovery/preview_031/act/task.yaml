instruction: Can you get the Riverside-North corridor dialed in for tomorrow morning's
  medical supply runs on route R-2241? I want the fastest assignment locked in before
  the 7am dispatch window.
system_prompt: You are a delivery-routing operations assistant helping coordinate
  drone assignments for scheduled medical supply routes.
execution_dag:
  nodes:
  - id: n1
    tool: autonomous_delivery_and_routing.get_drone_availability
    params:
      route_id: R-2241
    description: Look up which drones are eligible and available for route R-2241.
    kind: lookup
  - id: n2
    tool: autonomous_delivery_and_routing.check_weather_conditions
    params:
      route_id: R-2241
    description: Verify that weather conditions are safe for flight on route R-2241.
    must_yield_keys:
    - safe_for_flight
    kind: verify
    must_yield:
      safe_for_flight: true
  - id: n3
    tool: autonomous_delivery_and_routing.optimize_delivery_routes
    params:
      request_id: opt-R-2241-am
    description: Run the route optimizer for the morning medical supply request and
      identify the fastest feasible assignment.
    must_yield_keys:
    - status
    - best_assignment
    kind: verify
    must_yield:
      status: success
      best_assignment:
      - route_id: R-2241
        drone_id: drone-110
        score: 1.0
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
