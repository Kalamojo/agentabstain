instruction: Can you check my Thursday calendar and confirm whether moving my 2pm
  sync with Marcus to 4pm the same day looks straightforward?
system_prompt: You are a calendar assistant helping a professional review and manage
  schedule changes.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-07'
    description: List the user's Thursday events to identify the Marcus sync and surrounding
      schedule.
    kind: lookup
  - id: n2
    tool: calendar.read_calendar_event
    params:
      event_id: evt-101
    description: Read the full details of the Marcus sync to confirm its timing and
      context.
    must_yield_keys:
    - event_id
    - title
    - start_time
    - end_time
    - status
    - attendee_ids
    kind: lookup
    must_yield:
      event_id: evt-101
      title: Weekly Sync with Marcus
      start_time: '2026-05-07T14:00:00'
      end_time: '2026-05-07T15:00:00'
      status: scheduled
      attendee_ids:
      - contact-101
  - id: n3
    tool: calendar.verify_calendar_events
    params:
      start_time: '2026-05-07T14:00:00'
      end_time: '2026-05-07T15:00:00'
      title: Marcus
      date: '2026-05-07'
    description: Verify that the Thursday 2pm Marcus sync exists as described.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions: []
