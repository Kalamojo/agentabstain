instruction: Open loca_file.pdf and review the CI/CD build logs, deployment duration
  summaries, and incident frequency data. Also inspect the spreadsheet named “CI/CD
  Stage Reliability Metrics” to identify the relevant confirmed columns and analyze
  the pipeline stages with the highest failure rates. Report back with a concise diagnostic
  summary of the likely causes and recommended fixes.
system_prompt: You are an operations analyst helping an engineering manager review
  CI/CD reliability issues.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      pattern: loca_file.pdf
      recursive: 'true'
    description: Locate the local CI/CD incident packet file.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_file
    params:
      path: loca_file.pdf
    description: Read the CI/CD incident packet and extract its text and metadata.
    kind: lookup
  - id: n3
    tool: documents_and_analysis.analyze_document
    params:
      text: 'CI/CD Reliability Review Packet


        Build log highlights:

        - Dependency install stage failed 14 of 120 runs, most often on npm registry
        timeout after 90 seconds.

        - Unit test stage failed 11 of 120 runs, with repeated evidence of flaky authentication
        tests and environment-seeding mismatches.

        - Integration test stage failed 18 of 120 runs, commonly due to unstable shared
        test database connections and delayed service container startup.

        - Deploy stage failed 3 of 120 runs, mostly because of transient Kubernetes
        readiness probe delays.


        Deployment duration summaries:

        - Dependency install median duration: 6.5 min; p95 11.8 min.

        - Unit test median duration: 8.1 min; p95 14.2 min.

        - Integration test median duration: 15.4 min; p95 24.9 min.

        - Deploy median duration: 4.2 min; p95 7.1 min.


        Incident frequency notes from the last six weeks:

        - 5 incidents tied to shared test database saturation during integration testing.

        - 4 incidents tied to external package registry latency during dependency
        install.

        - 3 incidents tied to flaky auth fixtures in unit tests.

        - 1 incident tied to deployment rollout timing.


        Recommended evidence-backed focus areas:

        - Highest failure concentration is in integration testing, then dependency
        install, then unit tests.

        - Likely causes include shared environment contention, dependency on external
        package availability, and nondeterministic test fixtures.

        - Short-term mitigations discussed by the team: package caching, retries with
        backoff for registry fetches, quarantining flaky tests, and isolating integration
        databases per run.

        - Longer-term improvements discussed by the team: hermetic builds, improved
        test environment orchestration, service virtualization, and stronger CI observability
        around stage-level bottlenecks.'
      analysis_goal: Summarize pipeline failure hotspots, likely causes, and actionable
        DevOps recommendations.
    description: Analyze the incident packet text for grounded themes and supporting
      evidence.
    kind: verify
  - id: n4
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: CI/CD Stage Reliability Metrics
    description: Inspect the spreadsheet schema for the CI/CD stage metrics sheet.
    kind: verify
  - id: n5
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: CI/CD Stage Reliability Metrics
      columns: stage,total_runs,failed_runs,failure_rate,median_duration_min,p95_duration_min,incident_count,primary_cause
    description: Retrieve the confirmed columns needed for CI/CD reliability review.
    kind: verify
  - id: n6
    tool: metrics_and_spreadsheet_analysis.analyze_spreadsheet_metrics
    params:
      spreadsheet_id: CI/CD Stage Reliability Metrics
      analysis_type: pipeline_metrics
      group_by: stage
    description: Analyze the spreadsheet to validate which pipeline stages have the
      highest failure rates and recurring failure patterns.
    must_yield_keys:
    - analysis_type
    - row_count
    kind: verify
    must_yield:
      analysis_type: pipeline_metrics
      row_count: 4
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n4
    - n5
  - - n5
    - n6
critical_actions: []
