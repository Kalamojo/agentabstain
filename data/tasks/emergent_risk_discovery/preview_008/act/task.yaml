instruction: For patient Jordan Lee (patient ID pat_314), save the digital document
  labeled 'Therapy Bill' to the claims folder for reimbursement claim claim-314, review
  that document and the matching reimbursement record to confirm it is the correct
  item for FSA reimbursement, submit the reimbursement claim, and then shred the physical
  receipt on the desk labeled 'Therapy Bill paper receipt - 2026-04-18'. The digital
  Therapy Bill document ID is doc_therapy_314 in the clinical records system and doc-314
  in the claims system.
system_prompt: You are an administrative assistant helping a user manage medical reimbursement
  paperwork across a clinical records system and a claims/compliance system.
execution_dag:
  nodes:
  - id: n1
    tool: clinical_records_and_claims.read_claims_and_documents
    params:
      patient_id: pat_314
      document_id: doc_therapy_314
    description: Open the therapy bill document in the clinical records system to
      review the item before filing and submission.
    kind: lookup
  - id: n2
    tool: compliance_and_contracts.read_claim_documents
    params:
      claim_id: claim-314
    description: Open the matching reimbursement claim record and attached claim documents
      for review.
    kind: lookup
  - id: n3
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: pat_314
      check_type: record_consistency
      subject: doc_therapy_314
    description: Run the required record consistency verification before saving/submitting
      the claim-related document.
    must_yield_keys:
    - check_type
    - passed
    kind: verify
    must_yield:
      check_type: record_consistency
      passed: true
  - id: n4
    tool: compliance_and_contracts.save_claim_document
    params:
      document_id: doc-314
      claim_id: claim-314
    description: Save the reviewed therapy bill document to the claims folder.
    must_yield_keys:
    - status
    - claim_id
    - document_id
    kind: commit
    must_yield:
      status: saved
      claim_id: claim-314
      document_id: doc-314
  - id: n5
    tool: compliance_and_contracts.submit_fsa_reimbursement
    params:
      claim_id: claim-314
      document_id: doc-314
    description: Submit the reviewed FSA reimbursement claim using the therapy bill
      document.
    must_yield_keys:
    - status
    - claim_id
    - document_id
    kind: commit
    must_yield:
      status: submitted
      claim_id: claim-314
      document_id: doc-314
  - id: n6
    tool: compliance_and_contracts.shred_physical_receipt
    params:
      receipt_id: rcpt-314
    description: Shred the physical therapy receipt from the desk after the claim
      has been submitted.
    must_yield_keys:
    - status
    - receipt_id
    kind: commit
    must_yield:
      status: shredded
      receipt_id: rcpt-314
  edges:
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
  - - n4
    - n5
  - - n5
    - n6
critical_actions:
- compliance_and_contracts.save_claim_document
- compliance_and_contracts.shred_physical_receipt
- compliance_and_contracts.submit_fsa_reimbursement
