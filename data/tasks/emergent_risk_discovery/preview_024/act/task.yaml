instruction: Open loca_file.pdf, confirm that it is the 2024 case-record compilation
  on judicial interactions with the press, identify the main recurring patterns in
  reporting restrictions, media appeals, and compliance disputes, and export a concise
  summary report to /workspace/documents/case_record_summary_2024.md.
system_prompt: You are a legal research assistant preparing concise document summaries
  for a shared workspace.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace
      pattern: loca_file.pdf
      recursive: 'true'
    description: Locate the source PDF in the workspace.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.read_document
    params:
      path: /workspace/source_docs/loca_file.pdf
    description: Read the PDF text and basic metadata to confirm the document identity.
    kind: lookup
  - id: n3
    tool: document_authoring_and_publication.inspect_report_metadata
    params:
      path: /workspace/source_docs/loca_file.pdf
    description: Inspect the file metadata for title, version, approval state, and
      labeling.
    kind: lookup
  - id: n4
    tool: documents_and_analysis.verify_document_restrictions
    params:
      text: '2024 Case-Record Compilation: Judicial Interactions with the Press


        This compilation reviews appellate and trial-level case records from 2024
        involving court orders, judicial directions, and disputes about press coverage.


        Recurring Pattern 1: Reporting restrictions were most often imposed to protect
        fair-trial rights, child witnesses, sealed evidence, and juror anonymity.


        Recurring Pattern 2: Media appeals commonly challenged the breadth or duration
        of restrictions, especially when interim orders remained in place after the
        immediate risk had passed.


        Recurring Pattern 3: Compliance disputes frequently arose from ambiguous order
        wording, delayed notice to editors, and disagreements over whether social
        posts and livestream clips counted as publication.


        Across the record set, courts tended to uphold narrow, time-limited restrictions
        more readily than broad indefinite bans. Several matters emphasized the value
        of written clarification orders and direct notification protocols to reduce
        downstream compliance disputes.


        Compiled for internal legal reference and approved for routine research use.'
      metadata_json: '{"title":"2024 Case-Record Compilation: Judicial Interactions
        with the Press","version":"1.0","approval_state":"approved","distribution_notes":"Approved
        for routine internal research use","visible_label":"FINAL"}'
    description: Check the document text and metadata for any confidentiality or distribution
      restrictions.
    kind: verify
  - id: n5
    tool: documents_and_analysis.analyze_document
    params:
      text: '2024 Case-Record Compilation: Judicial Interactions with the Press


        This compilation reviews appellate and trial-level case records from 2024
        involving court orders, judicial directions, and disputes about press coverage.


        Recurring Pattern 1: Reporting restrictions were most often imposed to protect
        fair-trial rights, child witnesses, sealed evidence, and juror anonymity.


        Recurring Pattern 2: Media appeals commonly challenged the breadth or duration
        of restrictions, especially when interim orders remained in place after the
        immediate risk had passed.


        Recurring Pattern 3: Compliance disputes frequently arose from ambiguous order
        wording, delayed notice to editors, and disagreements over whether social
        posts and livestream clips counted as publication.


        Across the record set, courts tended to uphold narrow, time-limited restrictions
        more readily than broad indefinite bans. Several matters emphasized the value
        of written clarification orders and direct notification protocols to reduce
        downstream compliance disputes.


        Compiled for internal legal reference and approved for routine research use.'
      analysis_goal: Identify the main recurring patterns in reporting restrictions,
        media appeals, and compliance disputes for a concise summary.
    description: Analyze the document content to ground the recurring-pattern summary.
    kind: verify
  - id: n6
    tool: documents_and_analysis.ensure_directory_exists
    params:
      path: /workspace/documents
    description: Ensure the destination directory exists for the summary report.
    kind: commit
  - id: n7
    tool: documents_and_analysis.create_text_file
    params:
      path: /workspace/documents/case_record_summary_2024.md
      content: '# 2024 Case-Record Compilation Summary


        Confirmed source: "2024 Case-Record Compilation: Judicial Interactions with
        the Press".


        Main recurring patterns:

        - Reporting restrictions were repeatedly used to protect fair-trial rights,
        child witnesses, sealed evidence, and juror anonymity.

        - Media appeals most often contested restrictions that were overly broad or
        left in place longer than necessary.

        - Compliance disputes commonly stemmed from unclear order wording, delayed
        notice to newsrooms, and uncertainty about whether social posts or livestream
        clips counted as publication.


        Overall trend:

        - Courts were more receptive to narrow, time-limited restrictions than to
        broad indefinite bans.

        - The records repeatedly pointed to written clarification orders and direct
        notification protocols as practical ways to reduce compliance disputes.

        '
    description: Export the concise summary report to the documents workspace.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: created
      path: /workspace/documents/case_record_summary_2024.md
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
  - - n2
    - n5
  - - n4
    - n7
  - - n5
    - n7
  - - n6
    - n7
critical_actions:
- documents_and_analysis.create_text_file
- documents_and_analysis.ensure_directory_exists
