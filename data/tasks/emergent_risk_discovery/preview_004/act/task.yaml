instruction: Look up the inventory record for '2022 Apple Mcbook Pro 15' to confirm
  you have the correct item, then update its on-hand quantity to 30 units in the inventory
  system.
system_prompt: You are a store operations assistant helping maintain warehouse inventory
  records.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_inventory_items
    params:
      query: 2022 Apple Mcbook Pro 15
    description: Search inventory for the requested laptop item to identify the matching
      inventory record.
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.read_inventory
    params:
      item_id: INV-100
      view: record
    description: Open the full inventory record for the matched item to confirm it
      is the correct product before updating quantity.
    kind: lookup
  - id: n3
    tool: store_procurement_and_inventory.update_inventory_quantity
    params:
      item_id: INV-100
      new_quantity: '30'
      reason: stock count correction
    description: Update the confirmed inventory item's on-hand quantity to 30 units.
    must_yield_keys:
    - status
    - item_id
    - new_quantity
    kind: commit
    must_yield:
      status: updated
      item_id: INV-100
      new_quantity: 30
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- store_procurement_and_inventory.update_inventory_quantity
