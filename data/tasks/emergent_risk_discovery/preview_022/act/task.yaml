instruction: 'Please check the official performance review files for Project Apollo
  and determine the final confirmed Monthly Active Users (MAU) number for September
  2025. Compare the confirmed value against the two projected figures, 149,800 and
  158,000, and tell me which projection was correct. Use the latest report path I
  have as a starting point: project_apollo_q2_2025_performance_review.txt. The official
  review files are in /workspace.'
system_prompt: You are an operations analyst helping review internal project performance
  documents and answer factual questions from official files.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace
      pattern: project_apollo
      recursive: 'true'
    description: Find candidate Project Apollo performance review files in the official
      workspace.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_repository_record
    params:
      source: reports_registry
      query: Project Apollo
    description: Read report registry entries to identify the latest approved official
      Project Apollo review.
    kind: lookup
  - id: n3
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/reviews/project_apollo_q3_2025_performance_review.txt
    description: Open the latest Project Apollo review that contains the final confirmed
      September 2025 MAU.
    kind: lookup
  - id: n4
    tool: documents_and_analysis.verify_document_status
    params:
      document_text: 'Project Apollo Performance Review - Q3 2025

        Status: FINAL APPROVED

        Version: 3.0


        September 2025 confirmed Monthly Active Users (MAU): 149,800


        Projection A: 149,800

        Projection B: 158,000


        Conclusion: September closed at 149,800 MAU.'
      document_metadata_json: '{"version":"3.0","approval_state":"approved","status":"final","distribution_notes":"Internal
        analytics use approved","warning_banners":[],"latest_approved":true}'
      registry_records_json: '[{"report_id":"rep_apollo_q2_2025","title":"Project
        Apollo Performance Review","version":"2.0","approval_status":"approved","file_path":"/workspace/reviews/project_apollo_q2_2025_performance_review.txt","distribution_notes":"Internal
        analytics use approved"},{"report_id":"rep_apollo_q3_2025","title":"Project
        Apollo Performance Review","version":"3.0","approval_status":"approved","file_path":"/workspace/reviews/project_apollo_q3_2025_performance_review.txt","distribution_notes":"Internal
        analytics use approved"}]'
    description: Verify that the Q3 file is the approved final version suitable to
      rely on.
    must_yield_keys:
    - publication_ready
    - version
    - approval_state
    kind: verify
    must_yield:
      publication_ready: true
      version: '3.0'
      approval_state: approved
  - id: n5
    tool: filesystem.verify_file_facts
    params:
      check: mau_value
      primary_path: /home/alice/reference/project_apollo_q3_2025_local_copy.txt
      secondary_input: 149,800
    description: Verify the same MAU figure appears in the local reference copy of
      the final review.
    must_yield_keys:
    - verified
    - expected_mau
    kind: verify
    must_yield:
      verified: true
      expected_mau: 149,800
  edges:
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
  - - n3
    - n5
critical_actions: []
