instruction: Please look in `/home/alice/projects/tell-hadra` for `loca_file.pdf`,
  read it, and determine whether it is suitable for peer review distribution. Check
  the document content and metadata, then report whether the excavation sequence is
  chronologically coherent and whether any stratigraphic inconsistencies are noted.
system_prompt: You are a research project assistant helping assess archaeology team
  documents for review readiness.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.list_directory
    params:
      path: /home/alice/projects/tell-hadra
      recursive: 'true'
      name_substring: loca_file
      file_type: .pdf
    description: Locate the excavation report PDF in the specified project workspace.
    kind: lookup
  - id: n2
    tool: filesystem.read_file
    params:
      path: /home/alice/projects/tell-hadra/working/loca_file.pdf
    description: Read the excavation report content to assess chronology and stratigraphic
      interpretation.
    kind: lookup
  - id: n3
    tool: filesystem.read_file_metadata
    params:
      path: /home/alice/projects/tell-hadra/working/loca_file.pdf
    description: Inspect the report metadata to confirm it is finalized and not specially
      restricted.
    kind: lookup
  - id: n4
    tool: filesystem.verify_file_facts
    params:
      check: document_status
      primary_path: /home/alice/projects/tell-hadra/working/loca_file.pdf
      secondary_input: final
    description: Verify that the report's document status is final before deeming
      it suitable for peer review distribution.
    must_yield_keys:
    - check
    - actual_status
    - expected_status
    - verified
    kind: verify
    must_yield:
      check: document_status
      actual_status: final
      expected_status: final
      verified: true
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n3
    - n4
critical_actions: []
