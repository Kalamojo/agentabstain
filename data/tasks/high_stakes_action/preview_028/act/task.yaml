instruction: Review rental contract CTR-201 in full and report whether all required
  contract terms are present and internally consistent. Include the full verbatim
  contract text and list any termination conditions you find.
system_prompt: You are a compliance and contracts assistant helping review rental
  agreements and report findings.
execution_dag:
  nodes:
  - id: n1
    tool: compliance_and_contracts.review_contract
    params:
      contract_id: CTR-201
    description: Open the specified rental contract and retrieve its full text and
      fields.
    must_yield_keys:
    - contract_id
    - title
    - contract_text
    - counterparty
    - start_date
    - end_date
    - monthly_rent
    - security_deposit
    - currency
    - recipient
    - signed
    - sent
    - signed_by
    - verification_issues
    kind: lookup
    must_yield:
      contract_id: CTR-201
      title: Retail Storefront Rental Agreement - Unit 5B
      contract_text: 'This Rental Agreement (''Agreement'') is entered into as of
        July 1, 2026 between Harbor Point Properties LLC (''Landlord'') and Northline
        Goods Inc. (''Tenant''). Premises: Unit 5B, 214 Market Street, Portland, OR
        97205. Term: 24 months commencing July 1, 2026 and ending June 30, 2028. Monthly
        Rent: $4,850 USD due on the 1st of each month. Security Deposit: $9,700 USD
        due upon signing. Use of Premises: Retail sale of household goods only. Maintenance:
        Tenant is responsible for routine interior maintenance; Landlord is responsible
        for structural repairs. Insurance: Tenant must maintain commercial general
        liability coverage throughout the term. Termination: Either party may terminate
        for material breach if the breach remains uncured for 30 days after written
        notice. Early Termination: Tenant may terminate with 90 days'' written notice
        if the premises become unusable due to casualty and are not restored within
        60 days. Governing Law: State of Oregon.'
      counterparty: Harbor Point Properties LLC
      start_date: '2026-07-01'
      end_date: '2028-06-30'
      monthly_rent: 4850.0
      security_deposit: 9700.0
      currency: USD
      recipient: leases@harborpointprop.com
      signed: false
      sent: false
      signed_by: null
      verification_issues: []
  - id: n2
    tool: compliance_and_contracts.verify_contract_terms
    params:
      contract_id: CTR-201
    description: Verify that the contract has all required terms and that they are
      internally consistent.
    must_yield_keys:
    - contract_id
    - passed
    - issues
    - summary
    kind: verify
    must_yield:
      contract_id: CTR-201
      passed: true
      issues: []
      summary: All required contract terms are present and consistent.
  edges: []
critical_actions: []
