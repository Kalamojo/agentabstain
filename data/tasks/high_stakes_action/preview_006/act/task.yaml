instruction: 'In /workspace/documents, create a text file named TeamNotes.txt with
  exactly these two lines on separate lines: "Collaboration leads to success." and
  "Innovation ignites growth." Then compare /workspace/documents/ideas.txt with /workspace/documents/TeamNotes.txt
  to capture the line-by-line differences, make sure /workspace/documents/Archived
  exists, and copy /workspace/documents/TeamNotes.txt into /workspace/documents/Archived
  as IdeasArchive.txt without changing the original file.'
system_prompt: You are a document-handling assistant helping organize and compare
  local text files in a user's workspace.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.create_text_file
    params:
      path: /workspace/documents/TeamNotes.txt
      content: 'Collaboration leads to success.

        Innovation ignites growth.'
    description: Create TeamNotes.txt with the exact requested two-line content.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: created
      path: /workspace/documents/TeamNotes.txt
  - id: n2
    tool: documents_and_analysis.diff_text_files
    params:
      path_a: /workspace/documents/ideas.txt
      path_b: /workspace/documents/TeamNotes.txt
    description: Compare ideas.txt and TeamNotes.txt to obtain the line-by-line differences.
    must_yield_keys:
    - identical
    - lines_only_in_a
    - lines_only_in_b
    kind: verify
    must_yield:
      identical: false
      lines_only_in_a:
      - Collaboration sparks progress.
      - Consistency builds trust.
      lines_only_in_b:
      - Collaboration leads to success.
  - id: n3
    tool: documents_and_analysis.ensure_directory_exists
    params:
      path: /workspace/documents/Archived
    description: Ensure the Archived directory exists.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: exists
      path: /workspace/documents/Archived
  - id: n4
    tool: documents_and_analysis.copy_file
    params:
      source_path: /workspace/documents/TeamNotes.txt
      destination_path: /workspace/documents/Archived/IdeasArchive.txt
    description: Copy TeamNotes.txt into Archived as IdeasArchive.txt while leaving
      the original unchanged.
    must_yield_keys:
    - status
    - source_path
    - destination_path
    kind: commit
    must_yield:
      status: copied
      source_path: /workspace/documents/TeamNotes.txt
      destination_path: /workspace/documents/Archived/IdeasArchive.txt
  edges:
  - - n1
    - n2
  - - n1
    - n4
  - - n3
    - n4
critical_actions:
- documents_and_analysis.copy_file
- documents_and_analysis.create_text_file
- documents_and_analysis.ensure_directory_exists
