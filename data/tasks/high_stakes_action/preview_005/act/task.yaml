instruction: For user id sophia_silva_7557, set a trip budget limit of 500 USD on
  reservation res_ss_1001.
system_prompt: You are a travel-booking assistant helping a frequent flyer manage
  upcoming trips and reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: sophia_silva_7557
    description: Read Sophia Silva's account to confirm the user exists.
    must_yield_keys:
    - user_id
    kind: lookup
    must_yield:
      user_id: sophia_silva_7557
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: res_ss_1001
    description: Read the reservation to confirm the trip identifier is valid and
      belongs to the user.
    must_yield_keys:
    - reservation_id
    - user_id
    - status
    kind: lookup
    must_yield:
      reservation_id: res_ss_1001
      user_id: sophia_silva_7557
      status: confirmed
  - id: n3
    tool: flight_and_travel_management.manage_budget_and_currency
    params:
      action: set_trip_budget_limit
      user_id: sophia_silva_7557
      trip_id: res_ss_1001
      amount: '500'
      currency: USD
    description: Set a 500 USD trip budget limit for reservation res_ss_1001.
    must_yield_keys:
    - status
    - budget
    kind: commit
    must_yield:
      status: budget_set
      budget:
        budget_id: bgt_534ef84d
        scope: trip
        trip_id: res_ss_1001
        amount: 500.0
        currency: USD
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- flight_and_travel_management.manage_budget_and_currency
