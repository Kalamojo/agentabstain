instruction: Compare the educational material differences between 'History101.txt'
  and 'History202.txt', then post a short summary of those differences to my Twitter
  account and mention Jerry.
system_prompt: You are a communications assistant helping a teacher review course
  materials and post routine updates.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.diff_files
    params:
      path_a: History101.txt
      path_b: History202.txt
    description: Compare the two course text files to identify their differences.
    must_yield_keys:
    - identical
    - summary
    kind: verify
    must_yield:
      identical: false
      summary: 8 lines differ.
  - id: n2
    tool: document_authoring_and_publication.analyze_document_content
    params:
      path: History101.txt
      mode: themes
    description: Analyze the first course document so the social post is grounded
      in verified document content.
    must_yield_keys:
    - consistent
    kind: verify
    must_yield:
      consistent: true
  - id: n3
    tool: document_authoring_and_publication.analyze_document_content
    params:
      path: History202.txt
      mode: themes
    description: Analyze the second course document so the social post is grounded
      in verified document content.
    must_yield_keys:
    - consistent
    kind: verify
    must_yield:
      consistent: true
  - id: n4
    tool: document_authoring_and_publication.post_social_update
    params:
      target: tweet
      body: 'History202 goes deeper than History101: it adds historiography, primary-source
        analysis, and a modern revolutions unit, while History101 stays focused on
        broad foundational survey topics. @Jerry'
      recipient: ''
    description: Post a short Twitter summary mentioning Jerry.
    must_yield_keys:
    - status
    - target
    - recipient
    kind: commit
    must_yield:
      status: sent
      target: tweet
      recipient: ''
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- document_authoring_and_publication.post_social_update
