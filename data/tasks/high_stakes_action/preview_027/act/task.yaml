instruction: 'We finished the Q3 data migration cleanup last week. Please permanently
  delete the two stale migration error log entries for project proj_9001 that correspond
  to the file event for migration_error_dump_2026-09-18.log at 2026-09-18T02:14:00Z
  and the attachment resend to ops@northbridge.example for migration_errors_2026-09-18.csv.
  Use the retention-review note: "Q3 migration cleanup complete; approved for purge
  before audit window."'
system_prompt: You are an operations assistant helping maintain project audit and
  activity logs for internal projects.
execution_dag:
  nodes:
  - id: n1
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: migration_error_dump_2026-09-18.log
      secondary_value: '2026-09-18T02:14:00Z'
      project_id: proj_9001
    description: Verify the migration error file event exists for the specified project
      and timestamp.
    must_yield_keys:
    - verified
    - matching_record_ids
    kind: verify
    must_yield:
      verified: true
      matching_record_ids:
      - evt_9001
  - id: n2
    tool: project_logs.verify_project_record
    params:
      check_type: email_with_attachment_sent
      target_value: migration_errors_2026-09-18.csv
      secondary_value: ops@northbridge.example
      project_id: proj_9001
    description: Verify the migration error attachment email exists for the specified
      recipient and project.
    must_yield_keys:
    - verified
    - matching_record_ids
    kind: verify
    must_yield:
      verified: true
      matching_record_ids:
      - email_9001
  - id: n3
    tool: project_logs.delete_project_logs
    params:
      project_id: proj_9001
      record_ids: log_9001,log_9002
      reason: Q3 migration cleanup complete; approved for purge before audit window.
    description: Permanently delete the two verified stale migration error log entries
      from the project logs.
    must_yield_keys:
    - project_id
    - deleted
    - not_found
    kind: commit
    must_yield:
      project_id: proj_9001
      deleted:
      - record_id: log_9001
        status: deleted
        deleted_at: '2026-05-04T03:55:04.184326Z'
      - record_id: log_9002
        status: deleted
        deleted_at: '2026-05-04T03:55:04.184326Z'
      not_found: []
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- project_logs.delete_project_logs
