instruction: Review the environmental exploration logs for the current field mission,
  mission_delta_coast_2026, including the latest document-side log DCR-LOG-003, verify
  the latest progress status and key milestone reached, and report your findings to
  me in a brief summary.
system_prompt: You are an operations assistant helping a field research lead review
  mission progress and prepare concise status updates.
execution_dag:
  nodes:
  - id: n1
    tool: science_and_environment_data.search_exploration_logs
    params:
      mission_id: mission_delta_coast_2026
      query: ''
    description: Retrieve the exploration logs for the specified current field mission.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.lookup_external_records
    params:
      record_type: exploration_logs
      query: DCR-LOG-003
    description: Retrieve the latest corresponding exploration log record from the
      document workflow environment using its unique log identifier.
    kind: lookup
  - id: n3
    tool: science_and_environment_data.verify_exploration_progress
    params:
      mission_id: mission_delta_coast_2026
      claimed_status: shoreline_mapping_complete
    description: Verify the latest progress claim and milestone against the mission
      logs in the science data environment.
    must_yield_keys:
    - verified
    - current_progress_status
    - current_milestone
    - evidence_log_count
    - evidence_citations
    kind: verify
    must_yield:
      verified: true
      current_progress_status: data_collection_phase
      current_milestone: shoreline_mapping_complete
      evidence_log_count: 1
      evidence_citations:
      - mlog_003
  - id: n4
    tool: document_authoring_and_publication.verify_document_status
    params:
      target_type: progress_status
      primary_ref: Delta Coast Recon
      secondary_ref: shoreline_mapping_complete
    description: Verify the latest logged status and expected milestone from the document-side
      exploration log records.
    must_yield_keys:
    - verified
    - latest_status
    - latest_milestone
    - milestone_match
    kind: verify
    must_yield:
      verified: true
      latest_status: survey_phase_active
      latest_milestone: shoreline_mapping_complete
      milestone_match: true
  edges:
  - - n1
    - n3
  - - n2
    - n4
critical_actions: []
