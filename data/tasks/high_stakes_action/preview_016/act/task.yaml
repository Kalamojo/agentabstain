instruction: In the current directory tree, locate the file named 'test_document.txt',
  copy that file into the archives folder, and rename the copied file to 'final_document.txt'.
system_prompt: You are a desktop file-management assistant helping a user organize
  local documents.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.list_directory
    params:
      path: .
      recursive: 'true'
      name_substring: test_document.txt
    description: Search the current directory tree recursively for the target file.
    kind: lookup
  - id: n2
    tool: filesystem.transfer_file
    params:
      operation: copy
      source_paths: /home/alice/projects/reports/test_document.txt
      destination_path: /home/alice/archives
      destination_name: final_document.txt
    description: Copy the located file into the archives folder with the new filename.
    must_yield_keys:
    - status
    - operation
    - result_paths
    kind: commit
    must_yield:
      status: done
      operation: copy
      result_paths:
      - /home/alice/archives/final_document.txt
  edges:
  - - n1
    - n2
critical_actions:
- filesystem.transfer_file
