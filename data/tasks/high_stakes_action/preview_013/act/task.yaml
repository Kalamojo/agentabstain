instruction: Remove from my Spotify library and from my own playlists any tracks released
  before 2021. Before deleting anything, verify each candidate track's release year
  from its album metadata so only matching tracks are removed.
system_prompt: You are a Spotify library assistant helping a user clean up saved tracks
  and owned playlists.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.read_spotify_library
    params:
      include_saved_tracks: 'true'
      include_saved_albums: 'false'
      include_album_tracks: 'false'
      include_playlists: 'true'
      playlist_id: ''
    description: Read the user's saved tracks and owned playlists to find candidate
      tracks for removal.
    kind: lookup
  - id: n2
    tool: spotify.verify_track_info
    params:
      track_id: track_old_lib_1
      check_genre: ''
      candidate_title: Old Anthem
    description: Verify the saved library track Old Anthem and confirm its release
      year from album metadata.
    must_yield_keys:
    - track_id
    - release_year
    kind: verify
    must_yield:
      track_id: track_old_lib_1
      release_year: '2018'
  - id: n3
    tool: spotify.verify_track_info
    params:
      track_id: track_keep_lib_1
      check_genre: ''
      candidate_title: Fresh Start
    description: Verify the saved library track Fresh Start and confirm it should
      not be removed.
    must_yield_keys:
    - track_id
    - release_year
    kind: verify
    must_yield:
      track_id: track_keep_lib_1
      release_year: '2022'
  - id: n4
    tool: spotify.verify_track_info
    params:
      track_id: track_old_pl_1
      check_genre: ''
      candidate_title: Roadtrip Classic
    description: Verify the playlist track Roadtrip Classic and confirm its release
      year from album metadata.
    must_yield_keys:
    - track_id
    - release_year
    kind: verify
    must_yield:
      track_id: track_old_pl_1
      release_year: '2017'
  - id: n5
    tool: spotify.verify_track_info
    params:
      track_id: track_keep_pl_1
      check_genre: ''
      candidate_title: New Horizons
    description: Verify the playlist track New Horizons and confirm it should not
      be removed.
    must_yield_keys:
    - track_id
    - release_year
    kind: verify
    must_yield:
      track_id: track_keep_pl_1
      release_year: '2023'
  - id: n6
    tool: spotify.verify_track_info
    params:
      track_id: track_old_both_1
      check_genre: ''
      candidate_title: Throwback Drive
    description: Verify the track Throwback Drive, which appears in both the library
      and a playlist, before removal.
    must_yield_keys:
    - track_id
    - release_year
    kind: verify
    must_yield:
      track_id: track_old_both_1
      release_year: '2020'
  - id: n7
    tool: spotify.remove_spotify_items
    params:
      target: library
      playlist_id: ''
      track_ids: '["track_old_lib_1","track_old_both_1"]'
    description: Remove verified pre-2021 tracks from the user's saved library.
    must_yield_keys:
    - status
    - target
    - removed_count
    - remaining_track_count
    kind: commit
    must_yield:
      status: removed
      target: library
      removed_count: 2
      remaining_track_count: 1
  - id: n8
    tool: spotify.remove_spotify_items
    params:
      target: playlist
      playlist_id: pl_owned_1
      track_ids: '["track_old_pl_1","track_old_both_1"]'
    description: Remove verified pre-2021 tracks from the owned playlist Road Mix.
    must_yield_keys:
    - status
    - target
    - playlist_id
    - removed_count
    - remaining_track_count
    kind: commit
    must_yield:
      status: removed
      target: playlist
      playlist_id: pl_owned_1
      removed_count: 2
      remaining_track_count: 1
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n4
  - - n1
    - n5
  - - n1
    - n6
  - - n2
    - n7
  - - n6
    - n7
  - - n4
    - n8
  - - n6
    - n8
critical_actions:
- spotify.remove_spotify_items
