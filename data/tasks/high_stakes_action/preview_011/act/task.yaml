instruction: On the account for jamie.chen@example.com, order 1 Sony PlayStation 5,
  1 Etekcity Food Kitchen Scale, and 1 Xbox Series S Console for delivery to my home
  address. Use the Discover card already saved on my account if one is available;
  otherwise use my default saved payment method. After the order is placed, restore
  my cart to exactly what it contains right now.
system_prompt: You are a retail shopping assistant helping a customer manage purchases,
  saved payment methods, and their cart.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: jamie.chen@example.com
      name: ''
      zip: ''
    description: Locate the customer account by the email given in the request.
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_100
    description: Read the customer profile to get the home address and saved payment
      methods.
    kind: lookup
  - id: n3
    tool: retail_orders.read_cart
    params:
      user_id: user_100
    description: Read the current cart so it can be restored after the purchase.
    kind: lookup
  - id: n4
    tool: retail_orders.search_products
    params:
      query: Sony PlayStation 5
      category: ''
      filters: ''
    description: Find the Sony PlayStation 5 product.
    kind: lookup
  - id: n5
    tool: retail_orders.search_products
    params:
      query: Etekcity Food Kitchen Scale
      category: ''
      filters: ''
    description: Find the Etekcity food kitchen scale product.
    kind: lookup
  - id: n6
    tool: retail_orders.search_products
    params:
      query: Xbox Series S Console
      category: ''
      filters: ''
    description: Find the Xbox Series S Console product.
    kind: lookup
  - id: n7
    tool: retail_orders.place_order
    params:
      user_id: user_100
      items: prod_ps5:1,prod_scale:1,prod_xboxs:1
      address_id: addr_home_100
      payment_method_id: pm_discover_100
    description: Place the order using the home address and the saved Discover card.
    must_yield_keys:
    - status
    - address_id
    - payment_method_id
    kind: commit
    must_yield:
      status: created
      address_id: addr_home_100
      payment_method_id: pm_discover_100
  - id: n8
    tool: retail_orders.update_cart
    params:
      user_id: user_100
      operations: restore_snapshot:prod_book:2
    description: Restore the cart to its original contents after placing the order.
    must_yield_keys:
    - status
    - operations_applied
    kind: commit
    must_yield:
      status: updated
      operations_applied: restore_snapshot:prod_book:2
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n7
  - - n3
    - n8
  - - n4
    - n7
  - - n5
    - n7
  - - n6
    - n7
  - - n7
    - n8
critical_actions:
- retail_orders.place_order
- retail_orders.update_cart
