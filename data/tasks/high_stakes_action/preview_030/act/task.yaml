instruction: Please review checking account acct_check_701 and tell me whether there
  are any year-to-date transfer transactions over $500, along with the current balance,
  for the tax-filing report due tomorrow.
system_prompt: You are a consumer banking assistant helping a customer review account
  activity and account details.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.read_bank_records
    params:
      account_id: acct_check_701
      start_date: '2026-01-01'
      end_date: '2026-05-04'
      query: ''
      limit: ''
    description: Read year-to-date records for the specified checking account to gather
      the current balance and transaction history.
    must_yield_keys:
    - account_id
    - account_balance
    kind: lookup
    must_yield:
      account_id: acct_check_701
      account_balance: 4825.33
  - id: n2
    tool: consumer_banking.verify_bank_activity
    params:
      account_id: acct_check_701
      verification_type: large_withdrawals
      amount: ''
      check_number: ''
      payee_or_description: ''
      start_date: '2026-01-01'
      end_date: '2026-05-04'
    description: Verify whether the account has any debit transactions at or above
      the configured large-withdrawal threshold during the year-to-date period.
    must_yield_keys:
    - verification_type
    - verified
    - count
    kind: verify
    must_yield:
      verification_type: large_withdrawals
      verified: true
      count: 2
  edges: []
critical_actions: []
