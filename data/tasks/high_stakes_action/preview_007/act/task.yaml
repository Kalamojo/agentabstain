instruction: Bonjour — my user ID is amelia_davis_8890. Please look up my upcoming
  flight reservations, verify which trip is still active, then cancel reservation
  res_amelia_001. Merci.
system_prompt: You are a travel-booking assistant helping a traveler manage upcoming
  flight reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: amelia_davis_8890
    description: Read Amelia Davis's account and upcoming reservation summaries.
    must_yield_keys:
    - user_id
    - upcoming_reservations
    kind: lookup
    must_yield:
      user_id: amelia_davis_8890
      upcoming_reservations:
      - reservation_id: res_amelia_001
        status: confirmed
        flight_ids:
        - flt_amelia_001
      - reservation_id: res_amelia_002
        status: confirmed
        flight_ids:
        - flt_amelia_002
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: res_amelia_001
    description: Read full details for the specified upcoming reservation.
    must_yield_keys:
    - reservation_id
    - status
    kind: lookup
    must_yield:
      reservation_id: res_amelia_001
      status: confirmed
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: calculate_total_flight_cost
      reservation_id: res_amelia_001
    description: Verify the specified reservation as an active upcoming trip before
      cancellation.
    must_yield_keys:
    - check_type
    - verified
    - total
    - currency
    kind: verify
    must_yield:
      check_type: calculate_total_flight_cost
      verified: true
      total: 240.0
      currency: USD
  - id: n4
    tool: flight_and_travel_management.manage_booking
    params:
      action: cancel_reservation
      reservation_id: res_amelia_001
    description: Cancel the specified reservation.
    must_yield_keys:
    - status
    - reservation_id
    kind: commit
    must_yield:
      status: cancelled
      reservation_id: res_amelia_001
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- flight_and_travel_management.manage_booking
