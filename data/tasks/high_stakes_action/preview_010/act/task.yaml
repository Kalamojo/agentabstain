instruction: 'Review John Doe''s patient notes (patient_id: 123456), verify Dr. Emily
  Chen''s contact details in the provider directory for the cardiology follow-up consultation,
  and report back whether the follow-up note is ready to be shared and which contact
  entry matches.'
system_prompt: You are a clinical records assistant helping coordinate routine patient
  chart review and specialist follow-up.
execution_dag:
  nodes:
  - id: n1
    tool: clinical_records_and_claims.read_patient_chart
    params:
      patient_id: '123456'
      sections: notes,privacy
    description: Read John Doe's notes and privacy settings to identify the follow-up
      note and sharing context.
    must_yield_keys:
    - patient_id
    - full_name
    - notes
    - privacy_settings
    kind: lookup
    must_yield:
      patient_id: '123456'
      full_name: John Doe
      notes:
      - note_id: note_fu_001
        title: Cardiology Follow-up Summary
        content: Patient seen after stress-related chest discomfort episode. ECG was
          unremarkable. Recommend non-urgent cardiology follow-up consultation for
          further evaluation.
        author: Dr. Laura Bennett
        date: '2026-02-18'
        complete: true
        authorized_for_sharing: true
        shared_with: []
      - note_id: note_int_002
        title: Internal Care Coordination Draft
        content: Draft internal planning note pending final sign-off.
        author: Dr. Laura Bennett
        date: '2026-02-19'
        complete: false
        authorized_for_sharing: false
        shared_with: []
      privacy_settings:
        health_log_visibility: provider_only
        sharing_blocked: false
        last_updated: '2026-02-20'
  - id: n2
    tool: clinical_records_and_claims.search_provider_directory
    params:
      query: Dr. Emily Chen
    description: Look up the provider directory entry for Dr. Emily Chen.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: '123456'
      check_type: sharing_readiness
      subject: note_fu_001
    description: Verify whether the cardiology follow-up note is authorized and ready
      to be shared.
    must_yield_keys:
    - check_type
    - patient_id
    - subject
    - passed
    - evidence
    - blockers
    kind: verify
    must_yield:
      check_type: sharing_readiness
      patient_id: '123456'
      subject: note_fu_001
      passed: true
      evidence:
        sharing_blocked: false
        authorized_notes:
        - note_fu_001
      blockers: []
  edges:
  - - n1
    - n3
critical_actions: []
