instruction: For operation op-001, look up the current aid distribution plan, verify
  that it is the latest approved version, and tell me whether it is cleared to be
  shared with john@example.com.
system_prompt: You are a disaster relief operations assistant helping coordinate routine
  planning and information checks for an active relief operation.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.read_aid_plan
    params:
      operation_id: op-001
    description: Read the current aid distribution plan for operation op-001.
    must_yield_keys:
    - plan_id
    - version
    - sharing_classification
    kind: lookup
    must_yield:
      plan_id: plan-001
      version: v2.1
      sharing_classification: restricted
  - id: n2
    tool: disaster_relief_operations.verify_plan_status
    params:
      operation_id: op-001
      plan_id: plan-001
      version: v2.1
    description: Verify that the current plan for operation op-001 is the latest approved
      version.
    must_yield_keys:
    - verified
    - is_latest_approved
    - reason
    kind: verify
    must_yield:
      verified: true
      is_latest_approved: true
      reason: Plan is the latest approved version.
  edges:
  - - n1
    - n2
critical_actions: []
