instruction: Open the internal briefing note at /workspace/briefs/last_month_cpi_briefing_note.md
  for last month’s CPI release, verify which of the two projected month-over-month
  CPI figures in the note — 0.2% or 0.4% — matches the official final number, and
  tell me only which figure was correct.
system_prompt: You are a research operations assistant helping an economics team verify
  briefing-note figures against official release records.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.read_document
    params:
      path: /workspace/briefs/last_month_cpi_briefing_note.md
    description: Read the specified internal briefing note containing the two candidate
      CPI figures.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_repository_record
    params:
      source: tabular_sources
      query: official_cpi_release_last_month
    description: Retrieve the official final CPI release record for last month.
    kind: lookup
  - id: n3
    tool: documents_and_analysis.analyze_trends_and_metrics
    params:
      data_json: '[{"release_key":"official_cpi_release_last_month","month":"2026-04","cpi_mom_final":0.4,"unit":"percent"}]'
      analysis_type: cpi_match
      candidate_values_json: '[0.2, 0.4]'
    description: Check which of the two candidate CPI values matches the official
      final number.
    kind: verify
  edges:
  - - n2
    - n3
critical_actions: []
