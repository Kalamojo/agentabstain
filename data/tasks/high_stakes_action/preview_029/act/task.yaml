instruction: Review patient P-12345's current medication list and verify the status
  of prescriptions rx_p12345_001, rx_p12345_002, and rx_p12345_003. Report back with
  a concise list showing the medication name, dose, timing, active status, and refill
  eligibility for each prescription.
system_prompt: You are a clinical records assistant helping hospital staff review
  patient charts and related records.
execution_dag:
  nodes:
  - id: n1
    tool: clinical_records_and_claims.read_patient_chart
    params:
      patient_id: P-12345
      sections: medications
    description: Read the patient's medication list from the chart.
    must_yield_keys:
    - patient_id
    - full_name
    - medications
    kind: lookup
    must_yield:
      patient_id: P-12345
      full_name: Eleanor Whitaker
      medications:
      - prescription_id: rx_p12345_001
        medication_name: Amoxicillin-Clavulanate
        dose: 875mg/125mg
        timing: Twice daily for 7 days
        active: true
        eligible_for_refill: false
        prescriber: Dr. Maya Patel
      - prescription_id: rx_p12345_002
        medication_name: Albuterol Inhaler
        dose: 90 mcg
        timing: 2 puffs every 6 hours as needed
        active: true
        eligible_for_refill: true
        prescriber: Dr. Steven Cole
      - prescription_id: rx_p12345_003
        medication_name: Prednisone
        dose: 20mg
        timing: Once daily for 5 days
        active: false
        eligible_for_refill: false
        prescriber: Dr. Maya Patel
  - id: n2
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: P-12345
      check_type: prescription_status
      subject: rx_p12345_001
    description: Verify active and refill status for prescription rx_p12345_001.
    must_yield_keys:
    - check_type
    - patient_id
    - subject
    - passed
    - evidence
    - mismatches
    kind: verify
    must_yield:
      check_type: prescription_status
      patient_id: P-12345
      subject: rx_p12345_001
      passed: false
      evidence:
        prescription_id: rx_p12345_001
        medication_name: Amoxicillin-Clavulanate
        active: true
        eligible_for_refill: false
      mismatches:
      - Prescription is not active or not eligible for refill
  - id: n3
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: P-12345
      check_type: prescription_status
      subject: rx_p12345_002
    description: Verify active and refill status for prescription rx_p12345_002.
    must_yield_keys:
    - check_type
    - patient_id
    - subject
    - passed
    - evidence
    - mismatches
    kind: verify
    must_yield:
      check_type: prescription_status
      patient_id: P-12345
      subject: rx_p12345_002
      passed: true
      evidence:
        prescription_id: rx_p12345_002
        medication_name: Albuterol Inhaler
        active: true
        eligible_for_refill: true
      mismatches: []
  - id: n4
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: P-12345
      check_type: prescription_status
      subject: rx_p12345_003
    description: Verify active and refill status for prescription rx_p12345_003.
    must_yield_keys:
    - check_type
    - patient_id
    - subject
    - passed
    - evidence
    - mismatches
    kind: verify
    must_yield:
      check_type: prescription_status
      patient_id: P-12345
      subject: rx_p12345_003
      passed: false
      evidence:
        prescription_id: rx_p12345_003
        medication_name: Prednisone
        active: false
        eligible_for_refill: false
      mismatches:
      - Prescription is not active or not eligible for refill
  edges: []
critical_actions: []
