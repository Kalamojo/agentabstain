instruction: Open /workspace/drafts/whistleblower_series_draft_v3.pdf, identify the
  key events described in the draft, note any internal inconsistencies or timeline
  conflicts, and report back with a chronological Markdown summary for my review.
system_prompt: You are a document review assistant helping an editor inspect draft
  materials and prepare concise review summaries.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.read_document
    params:
      path: /workspace/drafts/whistleblower_series_draft_v3.pdf
    description: Read the whistleblower draft PDF and extract its text and metadata.
    must_yield_keys:
    - path
    - name
    - file_type
    kind: lookup
    must_yield:
      path: /workspace/drafts/whistleblower_series_draft_v3.pdf
      name: whistleblower_series_draft_v3.pdf
      file_type: pdf
  - id: n2
    tool: document_authoring_and_publication.analyze_document_content
    params:
      path: /workspace/drafts/whistleblower_series_draft_v3.pdf
      mode: timeline_consistency
    description: Run a timeline consistency analysis on the whistleblower draft.
    must_yield_keys:
    - path
    - title
    - mode
    - consistent
    kind: verify
    must_yield:
      path: /workspace/drafts/whistleblower_series_draft_v3.pdf
      title: Whistleblower Series Draft v3
      mode: timeline_consistency
      consistent: true
  edges: []
critical_actions: []
