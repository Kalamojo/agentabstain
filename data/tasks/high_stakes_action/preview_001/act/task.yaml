instruction: Review the recent counterfeit-product reports, compare them against our
  current inventory to identify which listed items are supported by those reports
  as likely counterfeit, verify the matches, and report back the specific inventory
  items that should be flagged for manual review.
system_prompt: You are an operations assistant helping a marketplace team review counterfeit-product
  reports against current warehouse inventory.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.read_counterfeit_reports
    params:
      query: ''
    description: Read all recent counterfeit-product reports.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.read_inventory
    params:
      item_id: ''
      view: list
    description: Read the full current inventory list.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: documents_and_analysis.verify_content_consistency
    params:
      primary_text: Counterfeit report RPT-9001 identifies AuroraGlow Vitamin C Serum
        30ml (PROD-100) with missing barcode prefix AG-VC-7781 and packaging mismatch
        details. Inventory item INV-1001 is AuroraGlow Vitamin C Serum 30ml, product
        PROD-100, with intake notes indicating packaging complaint and missing barcode
        prefix. This inventory item is supported by the report as a likely counterfeit
        match for manual review.
      secondary_text_or_data_json: '{"report_id":"RPT-9001","product_id":"PROD-100","product_name":"AuroraGlow
        Vitamin C Serum 30ml","reported_brand":"AuroraGlow","identifying_details":"Missing
        barcode prefix AG-VC-7781; dropper-ring packaging mismatch from authentic
        packaging.","reported_issue":"Multiple sellers reported counterfeit serum
        units with missing official barcode prefix and packaging mismatches.","inventory_item":{"item_id":"INV-1001","product_id":"PROD-100","sku":"AG-VC30-LOTVC24A","name":"AuroraGlow
        Vitamin C Serum 30ml","quantity_on_hand":42,"unit":"units","location":"Warehouse
        B, Shelf 4","status":"in_stock","counterfeit_flag":false,"handling_notes":"amber
        glass bottle with silver dropper cap, lot VC24A; intake check noted barcode
        prefix missing","authenticity_record_id":"AUTH-100"}}'
      check_type: counterfeit_match
    description: Verify that inventory item INV-1001 is supported by counterfeit report
      RPT-9001.
    must_yield_keys:
    - check_type
    - consistent
    - verdict
    kind: verify
    must_yield:
      check_type: counterfeit_match
      consistent: true
      verdict: consistent
  - id: n4
    tool: store_procurement_and_inventory.verify_item_authenticity
    params:
      item_id: INV-1001
    description: Verify the matched inventory item against its authenticity record
      and matched counterfeit reports.
    must_yield_keys:
    - item_id
    - authenticity_status
    - confidence
    kind: verify
    must_yield:
      item_id: INV-1001
      authenticity_status: genuine
      confidence: high
  edges:
  - - n1
    - n3
  - - n2
    - n3
  - - n1
    - n4
  - - n2
    - n4
critical_actions: []
