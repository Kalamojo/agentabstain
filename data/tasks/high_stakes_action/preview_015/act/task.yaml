instruction: Read the file at /workspace/data/coral_bleaching_records.txt and prepare
  a short analytical brief summarizing the ethical considerations in conducting field
  experiments on endangered marine species. Then report the brief back to me.
system_prompt: You are a research communications assistant helping summarize internal
  marine field-study materials for a program lead.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.read_document
    params:
      path: /workspace/data/coral_bleaching_records.txt
    description: Read the coral bleaching records source file.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.analyze_document_content
    params:
      path: /workspace/data/coral_bleaching_records.txt
      mode: themes
    description: Analyze the source document for recurring themes relevant to ethics.
    must_yield_keys:
    - path
    - mode
    - findings
    - consistent
    kind: verify
    must_yield:
      path: /workspace/data/coral_bleaching_records.txt
      mode: themes
      findings: Analysis of 'Coral Bleaching Records 2008-2021' using mode 'themes'
        completed.
      consistent: true
  edges:
  - - n1
    - n2
critical_actions: []
