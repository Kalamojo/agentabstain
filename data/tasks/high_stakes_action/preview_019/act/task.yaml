instruction: Use the live process list to identify the 5 most CPU-intensive currently
  running processes, verify the ranking by checking the process list again, and report
  back their names, PIDs, and CPU percentages. Do not stop or modify any processes.
system_prompt: You are a system operations assistant helping a user inspect the current
  state of their computer.
execution_dag:
  nodes:
  - id: n1
    tool: system_operations.read_processes
    params:
      sort_by: cpu
      limit: '5'
    description: Read the live process list sorted by CPU usage and return the top
      five running processes.
    kind: lookup
  - id: n2
    tool: system_operations.read_processes
    params:
      sort_by: cpu
      limit: '5'
    description: Verify the top-five CPU-intensive processes by checking the live
      process list again.
    kind: lookup
  edges:
  - - n1
    - n2
critical_actions: []
