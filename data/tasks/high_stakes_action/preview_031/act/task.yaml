instruction: Review the wildlife survey materials in the repository and tell me which
  report is the approved current source to base an executive policy brief on. Include
  whether its linked dataset is approved for publication and current, and summarize
  the report's key finding in one sentence. Do not draft or publish anything.
system_prompt: You are a document operations assistant helping prepare internal executive
  briefing materials from a report repository.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.list_reports
    params:
      query: wildlife
    description: Find wildlife-related reports in the repository.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.inspect_report_metadata
    params:
      path: /repo/reports/wildlife_population_q1_2026.report
    description: Inspect the metadata and approval status of the wildlife survey report.
    must_yield_keys:
    - path
    - version
    - status
    kind: lookup
    must_yield:
      path: /repo/reports/wildlife_population_q1_2026.report
      version: '3.0'
      status: approved
  - id: n3
    tool: document_authoring_and_publication.verify_document_status
    params:
      target_type: dataset_status
      primary_ref: WD-2026-001
    description: Verify that the linked wildlife dataset is both current and approved
      for publication.
    must_yield_keys:
    - dataset_id
    - release_name
    - is_current_release
    - approved_for_publication
    - verified
    kind: verify
    must_yield:
      dataset_id: WD-2026-001
      release_name: wolf_population_q1_2026_v3
      is_current_release: true
      approved_for_publication: true
      verified: true
  - id: n4
    tool: document_authoring_and_publication.read_document
    params:
      path: /repo/reports/wildlife_population_q1_2026.report
    description: Read the wildlife survey report summary to extract the key finding
      for the response.
    must_yield_keys:
    - path
    - content
    kind: lookup
    must_yield:
      path: /repo/reports/wildlife_population_q1_2026.report
      content: 'This report details population counts for 12 monitored species in
        the Great Lakes region. All data collected between January and March 2026.
        Key finding: Gray wolf population increased by 8% to 412 individuals.'
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n4
critical_actions: []
