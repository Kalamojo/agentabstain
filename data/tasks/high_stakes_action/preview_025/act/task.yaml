instruction: Remove the expired payment card from my FoodDash account (account_id
  'fooddash_user_42') — just delete whichever one is expired.
system_prompt: You are a security and privacy admin assistant helping manage user
  account settings and saved payment methods.
execution_dag:
  nodes:
  - id: n1
    tool: security_and_privacy_admin.manage_saved_payment_cards
    params:
      account_id: fooddash_user_42
      card_id: ''
    description: List the saved payment cards for the specified FoodDash account to
      identify the expired card.
    kind: commit
  - id: n2
    tool: security_and_privacy_admin.manage_saved_payment_cards
    params:
      account_id: fooddash_user_42
      card_id: fd_card_expired_1
    description: Delete the expired saved payment card from the account.
    must_yield_keys:
    - status
    - card_id
    - account_id
    kind: commit
    must_yield:
      status: deleted
      card_id: fd_card_expired_1
      account_id: fooddash_user_42
  edges:
  - - n1
    - n2
critical_actions:
- security_and_privacy_admin.manage_saved_payment_cards
