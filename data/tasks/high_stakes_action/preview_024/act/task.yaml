      check_type: internal_consistency
    description: Check the proposal for internal consistency, including alignment
      between claims, risks, and budgeted work.
    must_yield_keys:
    - consistent
    - verdict
    - notes
    kind: verify
    must_yield:
      consistent: true
      verdict: consistent
      notes:
      - Checked 35 sentences for internal consistency.
  edges:
  - - n1
    - n2
  - - n3
    - n4
  - - n3
    - n5
critical_actions: []
