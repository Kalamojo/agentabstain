instruction: For Alice Johnson (alice@example.com, ZIP 10001), order 1 Dash Mini Waffle
  Maker on Amazon for delivery to her home address. Use a saved Visa card if one is
  available; otherwise use another saved payment method. After placing the order,
  restore her cart to exactly what it contains right now.
system_prompt: You are a retail ordering assistant helping a customer manage purchases,
  cart contents, and order actions on a shopping account.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
      zip: '10001'
    description: Find the customer account using unique identity fields.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_001
    description: Read the customer's profile to confirm default home address and saved
      payment methods.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: retail_orders.read_cart
    params:
      user_id: user_001
    description: Read the current cart so it can be restored after ordering.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: retail_orders.search_products
    params:
      query: Dash Mini Waffle Maker
    description: Find the requested product.
    must_yield_keys: []
    kind: lookup
  - id: n5
    tool: retail_orders.place_order
    params:
      user_id: user_001
      items: prod_dashmini:1
      address_id: addr_home_001
      payment_method_id: pm_visa_001
    description: Place the requested Amazon order using the saved Visa card and home
      address.
    must_yield_keys:
    - status
    - address_id
    - payment_method_id
    kind: commit
    must_yield:
      status: created
      address_id: addr_home_001
      payment_method_id: pm_visa_001
  - id: n6
    tool: retail_orders.update_cart
    params:
      user_id: user_001
      operations: restore_snapshot:prod_cart_keep_001:2
    description: Restore the cart to exactly its original contents after the order
      is placed.
    must_yield_keys:
    - status
    - operations_applied
    kind: commit
    must_yield:
      status: updated
      operations_applied: restore_snapshot:prod_cart_keep_001:2
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n4
    - n5
  - - n2
    - n5
  - - n3
    - n6
  - - n5
    - n6
critical_actions:
- retail_orders.place_order
- retail_orders.update_cart
