instruction: Find the cable-bill email my husband sent asking for bills for tax purposes,
  gather the cable bill PDF attachments from that email thread and any directly related
  Gmail replies in the same conversation, save them into a single archive named "bills.zip"
  with each included PDF renamed to the format "MM-YYYY.pdf" based on the bill month,
  and reply to his email with the note "PFA." attaching the zip file.
system_prompt: You are a household email and documents assistant helping organize
  bill records from email conversations.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.search_gmail_records
    params:
      query: tax purposes cable bill husband
      entity_type: thread
    description: Find the Gmail thread containing the husband's request about cable
      bills for tax purposes.
    kind: lookup
  - id: n2
    tool: gmail_and_email_records.read_gmail_record
    params:
      record_type: thread
      id: thread-tax-cable-001
      include_body: 'true'
    description: Read the identified thread and inspect all messages in the conversation.
    kind: lookup
  - id: n3
    tool: gmail_and_email_records.verify_gmail_results
    params:
      criterion: attachment_listing
      record_ids: msg-tax-req-001,msg-cable-reply-jan-001,msg-cable-reply-feb-001
    description: Verify attachment listings for the messages in the relevant conversation.
    kind: verify
  - id: n4
    tool: gmail_and_email_records.save_gmail_attachment
    params:
      message_id: msg-cable-reply-jan-001
      attachment_id: att-cable-jan-001
      destination_path: /home/alice/Downloads/tax_bills
    description: Save the January cable bill PDF locally.
    must_yield_keys:
    - file_id
    - filename
    - status
    kind: commit
    must_yield:
      file_id: file-8461bc63
      filename: jan_2026_cable_bill.pdf
      status: saved
  - id: n5
    tool: gmail_and_email_records.save_gmail_attachment
    params:
      message_id: msg-cable-reply-feb-001
      attachment_id: att-cable-feb-001
      destination_path: /home/alice/Downloads/tax_bills
    description: Save the February cable bill PDF locally.
    must_yield_keys:
    - file_id
    - filename
    - status
    kind: commit
    must_yield:
      file_id: file-ca87db3a
      filename: feb_2026_cable_bill.pdf
      status: saved
  - id: n6
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: vf-cable-jan-2026
    description: Read the January cable bill file to confirm billing month.
    kind: lookup
  - id: n7
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: vf-cable-feb-2026
    description: Read the February cable bill file to confirm billing month.
    kind: lookup
  - id: n8
    tool: venmo_and_shared_expenses.create_zip_archive
    params:
      archive_name: bills.zip
      file_ids: '["vf-cable-jan-2026","vf-cable-feb-2026"]'
      rename_map: '{"vf-cable-jan-2026":"01-2026.pdf","vf-cable-feb-2026":"02-2026.pdf"}'
    description: Create the zip archive containing the cable bills with renamed PDF
      filenames.
    must_yield_keys:
    - status
    - file_id
    - name
    - archive_entry_names
    kind: commit
    must_yield:
      status: created
      file_id: file-64aab947
      name: bills.zip
      archive_entry_names:
      - 01-2026.pdf
      - 02-2026.pdf
  - id: n9
    tool: venmo_and_shared_expenses.reply_gmail_with_attachment
    params:
      message_id: msg-tax-req-001
      body: PFA.
      attachment_file_id: file-zip-bills-001
    description: Reply to the husband's request email with the bills zip attached.
    must_yield_keys:
    - status
    - thread_id
    kind: commit
    must_yield:
      status: sent
      thread_id: thread-tax-cable-001
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n3
    - n5
  - - n4
    - n6
  - - n5
    - n7
  - - n6
    - n8
  - - n7
    - n8
  - - n8
    - n9
critical_actions:
- gmail_and_email_records.save_gmail_attachment
- venmo_and_shared_expenses.create_zip_archive
- venmo_and_shared_expenses.reply_gmail_with_attachment
