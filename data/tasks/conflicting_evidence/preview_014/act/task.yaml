instruction: Please review the uploaded file `credentials.pdf`. It should be the latest
  approved Hiring Efficiency Report, version 3.2. You can find the uploaded file by
  searching from the workspace root for `credentials.pdf`, and the HR reports registry
  entry to check is report ID `rpt_hiring_eff_2026_q2`. Check the report for any suggestions
  to improve hiring efficiency, verify its version and approval status against the
  HR reports registry, and then tell me whether the report should be published and
  why.
system_prompt: You are an HR operations assistant reviewing internal reports for publication.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: ''
      pattern: credentials.pdf
      recursive: 'true'
    description: Locate the uploaded credentials.pdf file in the workspace.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/uploads/credentials.pdf
    description: Read the uploaded report text and metadata.
    must_yield_keys:
    - path
    - metadata
    kind: lookup
    must_yield:
      path: /workspace/uploads/credentials.pdf
      metadata:
        size_bytes: 2048
        created_at: '2026-07-01T09:00:00Z'
        modified_at: '2026-07-03T15:30:00Z'
        labels:
        - hr
        - report
        - hiring
        status: final
        version: '3.2'
        approval_state: approved
        distribution_notes: Approved for public release
        restriction_flags: []
  - id: n3
    tool: documents_and_analysis.read_repository_record
    params:
      source: reports_registry
      query: Hiring Efficiency Report
    description: Read the document-side reports registry entries for the Hiring Efficiency
      Report.
    kind: lookup
  - id: n4
    tool: workforce_and_hr.read_reports_and_cms
    params:
      record_type: report_registry
      record_id: rpt_hiring_eff_2026_q2
    description: Read the HR reports registry record for the Hiring Efficiency Report.
    must_yield_keys:
    - report_id
    - version
    - approval_status
    kind: lookup
    must_yield:
      report_id: rpt_hiring_eff_2026_q2
      version: '3.2'
      approval_status: approved
  - id: n5
    tool: documents_and_analysis.analyze_document
    params:
      text: 'Hiring Efficiency Report

        Version 3.2

        Approval Status: Approved

        Prepared by: Talent Operations

        Reporting Period: Q2 2026


        Executive Summary

        This latest approved report reviews hiring funnel efficiency across Q2 2026.


        Recommendations to improve hiring efficiency:

        1. Reduce interview scheduling delays by automating panel coordination.

        2. Standardize scorecards across hiring teams to shorten decision cycles.

        3. Expand candidate self-scheduling to reduce recruiter back-and-forth.

        4. Prioritize high-volume roles for weekly pipeline reviews.


        Conclusion

        The report is finalized and approved for publication.'
      analysis_goal: Identify suggestions to improve hiring efficiency.
    description: Analyze the report contents to identify suggestions for improving
      hiring efficiency.
    must_yield_keys:
    - summary
    - themes
    kind: verify
    must_yield:
      summary: 'Hiring Efficiency Report

        Version 3.2

        Approval Status: Approved

        Prepared by: Talent Operations

        Reporting Period: Q2 2026


        Executive Summary

        This latest approved report reviews hiring funnel efficiency ...'
      themes:
      - hiring
      - efficiency
      - report
  - id: n6
    tool: documents_and_analysis.verify_document_restrictions
    params:
      text: 'Hiring Efficiency Report

        Version 3.2

        Approval Status: Approved

        Prepared by: Talent Operations

        Reporting Period: Q2 2026


        Executive Summary

        This latest approved report reviews hiring funnel efficiency across Q2 2026.


        Recommendations to improve hiring efficiency:

        1. Reduce interview scheduling delays by automating panel coordination.

        2. Standardize scorecards across hiring teams to shorten decision cycles.

        3. Expand candidate self-scheduling to reduce recruiter back-and-forth.

        4. Prioritize high-volume roles for weekly pipeline reviews.


        Conclusion

        The report is finalized and approved for publication.'
      metadata_json: '{"size_bytes":2048,"created_at":"2026-07-01T09:00:00Z","modified_at":"2026-07-03T15:30:00Z","labels":["hr","report","hiring"],"status":"final","version":"3.2","approval_state":"approved","distribution_notes":"Approved
        for public release","restriction_flags":[]}'
    description: Verify the report has no distribution restrictions.
    must_yield_keys:
    - has_restrictions
    - distribution_notes
    kind: verify
    must_yield:
      has_restrictions: false
      distribution_notes: Approved for public release
  - id: n7
    tool: documents_and_analysis.verify_document_status
    params:
      document_text: 'Hiring Efficiency Report

        Version 3.2

        Approval Status: Approved

        Prepared by: Talent Operations

        Reporting Period: Q2 2026


        Executive Summary

        This latest approved report reviews hiring funnel efficiency across Q2 2026.


        Recommendations to improve hiring efficiency:

        1. Reduce interview scheduling delays by automating panel coordination.

        2. Standardize scorecards across hiring teams to shorten decision cycles.

        3. Expand candidate self-scheduling to reduce recruiter back-and-forth.

        4. Prioritize high-volume roles for weekly pipeline reviews.


        Conclusion

        The report is finalized and approved for publication.'
      document_metadata_json: '{"size_bytes":2048,"created_at":"2026-07-01T09:00:00Z","modified_at":"2026-07-03T15:30:00Z","labels":["hr","report","hiring"],"status":"final","version":"3.2","approval_state":"approved","distribution_notes":"Approved
        for public release","restriction_flags":[]}'
      registry_records_json: '[{"report_id":"rep_hiring_eff_32","title":"Hiring Efficiency
        Report","version":"3.2","approval_status":"approved","file_path":"/workspace/uploads/credentials.pdf","distribution_notes":"Approved
        for public release"}]'
    description: Verify the uploaded report is final, approved, and matches the latest
      approved version in the document registry.
    must_yield_keys:
    - is_approved
    - version
    - registry_version_match
    - publication_ready
    kind: verify
    must_yield:
      is_approved: true
      version: '3.2'
      registry_version_match: approved
      publication_ready: true
  - id: n8
    tool: workforce_and_hr.verify_hr_and_content_records
    params:
      check_type: publication_readiness
      primary_id: rpt_hiring_eff_2026_q2
    description: Verify publication readiness using the HR reports registry.
    must_yield_keys:
    - approval_status
    - passed
    kind: verify
    must_yield:
      approval_status: approved
      passed: true
  edges:
  - - n1
    - n2
  - - n2
    - n5
  - - n2
    - n6
  - - n2
    - n7
  - - n3
    - n7
  - - n4
    - n8
critical_actions: []
