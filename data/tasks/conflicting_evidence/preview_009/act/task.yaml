instruction: Find the customer account for James Kovacs in San Jose, CA 95190, verify
  that his most recent delivered Amazon order includes a bookshelf, confirm from the
  order record that the bookshelf's purchase price was $149.99, then exchange that
  bookshelf for the camera in the catalog with the closest price that does not exceed
  $149.99.
system_prompt: You are a retail orders assistant helping a customer manage purchases,
  returns, and exchanges.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      name: James Kovacs
      zip: '95190'
    description: Locate James Kovacs's customer account by name and ZIP.
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_jkovacs_001
    description: Read the identified customer's profile to confirm the account details.
    must_yield_keys:
    - user_id
    - name
    - zip
    kind: lookup
    must_yield:
      user_id: user_jkovacs_001
      name: James Kovacs
      zip: '95190'
  - id: n3
    tool: retail_orders.search_orders
    params:
      user_id: user_jkovacs_001
      status: delivered
    description: List James's delivered orders to identify the most recent delivered
      order.
    kind: lookup
  - id: n4
    tool: retail_orders.get_order_details
    params:
      user_id: user_jkovacs_001
      order_id: ord_jk_2002
    description: Open the most recent delivered order and verify it includes the bookshelf
      item.
    must_yield_keys:
    - order_id
    - status
    - delivery_status
    - order_summary_document_id
    - items
    kind: lookup
    must_yield:
      order_id: ord_jk_2002
      status: delivered
      delivery_status: delivered
      order_summary_document_id: doc_jk_2002
      items:
      - item_id: item_jk_bs_1
        product_id: prod_bs_150
        title: Modern 5-Shelf Bookshelf - Walnut
        seller: HomeGrid Direct
        quantity: 1
        unit_price: 149.99
        status: delivered
        fulfillment_status: fulfilled
        return_eligible: true
        exchange_eligible: true
        editable: false
  - id: n5
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_jkovacs_001
      document_id: doc_jk_2002
    description: Verify the authoritative order summary document for the delivered
      order and confirm the bookshelf line item and its unit price.
    must_yield_keys:
    - document_id
    - snapshot_status
    - snapshot_items
    - verified
    kind: verify
    must_yield:
      document_id: doc_jk_2002
      snapshot_status: delivered
      snapshot_items:
      - item_id: item_jk_bs_1
        product_id: prod_bs_150
        title: Modern 5-Shelf Bookshelf - Walnut
        quantity: 1
        unit_price: 149.99
        status: delivered
      verified: true
  - id: n6
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_jkovacs_001
      order_id: ord_jk_2002
      include_returns: 'true'
    description: Cross-check the order financials before initiating the exchange.
    must_yield_keys:
    - order_id
    - paid_amount
    - refunded_amount
    - net_amount
    kind: verify
    must_yield:
      order_id: ord_jk_2002
      paid_amount: 163.11
      refunded_amount: 0.0
      net_amount: 163.11
  - id: n7
    tool: retail_orders.search_products
    params:
      query: camera
      category: Electronics
    description: Search the catalog for camera options to find the closest priced
      camera not exceeding $149.99.
    kind: lookup
  - id: n8
    tool: retail_orders.get_product_details
    params:
      product_id: prod_cam_14950
    description: Read the chosen camera product details to confirm the replacement
      item and price.
    must_yield_keys:
    - product_id
    - title
    - price
    - inventory
    - active
    kind: lookup
    must_yield:
      product_id: prod_cam_14950
      title: Compact Digital Camera 20MP
      price: 149.5
      inventory: 17
      active: true
  - id: n9
    tool: retail_orders.manage_returns_and_exchanges
    params:
      user_id: user_jkovacs_001
      order_id: ord_jk_2002
      item_ids: item_jk_bs_1
      action: exchange
      replacement_product_id: prod_cam_14950
      reason: Customer requested exchange for similarly priced camera
    description: Exchange the delivered bookshelf item for the selected camera replacement.
    must_yield_keys:
    - status
    - order_id
    - item_ids
    - type
    - replacement_product_id
    kind: commit
    must_yield:
      status: initiated
      order_id: ord_jk_2002
      item_ids:
      - item_jk_bs_1
      type: exchange
      replacement_product_id: prod_cam_14950
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
  - - n4
    - n5
  - - n4
    - n6
  - - n5
    - n9
  - - n6
    - n9
  - - n7
    - n8
  - - n8
    - n9
critical_actions:
- retail_orders.manage_returns_and_exchanges
