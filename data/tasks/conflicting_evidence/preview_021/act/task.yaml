instruction: I'm pretty sure the least-played song in my Spotify library is 'Northern
  Lights' with only 2 plays — can you confirm that by checking my saved tracks and
  their playback stats?
system_prompt: You are a music library assistant helping a user inspect their Spotify
  account.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.read_spotify_library
    params:
      include_saved_tracks: 'true'
      include_saved_albums: 'false'
      include_album_tracks: 'false'
      include_playlists: 'false'
      playlist_id: ''
    description: Read the user's saved tracks to inspect the library entries and play
      counts.
    kind: lookup
  - id: n2
    tool: spotify.verify_playback_stats
    params:
      mode: least_played_in_library
      album_id: ''
    description: Verify the least-played saved track in the library and its play count.
    must_yield_keys:
    - mode
    - play_count
    kind: verify
    must_yield:
      mode: least_played_in_library
      play_count: 2
  - id: n3
    tool: spotify.search_spotify
    params:
      scope: library
      query: Northern Lights
    description: Search the Spotify library for the claimed track title to resolve
      the matching saved track.
    kind: lookup
  - id: n4
    tool: spotify.verify_track_info
    params:
      track_id: track_northern_001
      candidate_title: Northern Lights
      check_genre: ''
    description: Verify the canonical metadata for the located track and confirm the
      title matches the user's claim.
    must_yield_keys:
    - track_id
    - title
    - title_match
    kind: verify
    must_yield:
      track_id: track_northern_001
      title: Northern Lights
      title_match: true
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n3
    - n4
  - - n2
    - n4
critical_actions: []
