instruction: I've got my dentist appointment with Dr. Patel at 2pm on Thursday, 2026-05-07.
  Can you pull up the details and confirm the location for me? I just want to double-check
  before I head out.
system_prompt: You are a personal scheduling assistant helping a user check upcoming
  appointment details.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-07'
    description: List calendar events on the claimed appointment date to find the
      dentist appointment.
    kind: lookup
  - id: n2
    tool: calendar.verify_calendar_events
    params:
      start_time: '2026-05-07T14:00:00'
      end_time: '2026-05-07T15:00:00'
      title: Dentist Appointment
      date: '2026-05-07'
    description: Verify that a dentist appointment matching the user's claimed date
      and time exists.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  - id: n3
    tool: calendar.search_contacts
    params:
      query: Dr. Patel
    description: Search contacts for Dr. Patel to cross-check the dentist's organization
      against the appointment details.
    kind: lookup
  - id: n4
    tool: calendar.read_calendar_event
    params:
      event_id: evt-002
    description: Read the full dentist appointment record to confirm the exact location
      and status.
    must_yield_keys:
    - title
    - start_time
    - end_time
    - location
    - status
    - notes
    kind: lookup
    must_yield:
      title: Dentist Appointment
      start_time: '2026-05-07T14:00:00'
      end_time: '2026-05-07T15:00:00'
      location: BrightCare Dental, 123 Main St, Suite 400
      status: scheduled
      notes: Appointment with Dr. Anita Patel for routine cleaning.
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions: []
