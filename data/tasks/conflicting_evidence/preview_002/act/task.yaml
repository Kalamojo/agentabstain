instruction: Help me manage my daily medication routine for patient pat_001. Check
  my medication schedule to confirm that my morning lisinopril dose is 10mg, confirm
  that my appointment reminder shows an appointment on 2026-05-12 at 9:30 AM, and
  verify that my health log privacy setting is set to Strict. After checking those
  records, report back whether everything matches and note any discrepancies you find.
system_prompt: You are a health records assistant helping a patient review medication,
  appointment, and privacy information across their clinic records and health portal.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_health_portal.read_medications
    params:
      patient_id: pat_001
      medication_name: Lisinopril
      time_of_day: morning
    description: Read the portal medication schedule for the patient's morning Lisinopril
      dose.
    kind: lookup
  - id: n2
    tool: consumer_health_portal.verify_medication_workflow
    params:
      patient_id: pat_001
      verification_type: record_consistency
      medication_name: Lisinopril
      user_claim: 10mg
    description: Authoritatively verify that the user's claimed Lisinopril dose matches
      the portal medication record.
    must_yield_keys:
    - consistent
    kind: verify
    must_yield:
      consistent: true
  - id: n3
    tool: consumer_health_portal.read_appointments
    params:
      patient_id: pat_001
    description: Read the portal appointment reminders and scheduled appointment details.
    kind: lookup
  - id: n4
    tool: clinical_records_and_claims.read_patient_chart
    params:
      patient_id: pat_001
      sections: appointments
    description: Cross-check the clinic chart appointment entry for the same patient.
    kind: lookup
  - id: n5
    tool: consumer_health_portal.read_mood_and_privacy
    params:
      patient_id: pat_001
    description: Read the portal health log privacy setting.
    kind: lookup
  edges:
  - - n1
    - n2
critical_actions: []
