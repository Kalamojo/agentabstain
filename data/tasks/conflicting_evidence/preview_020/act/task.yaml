instruction: Read `music_awards_summary.txt` from the 2025 Global Music Awards judging
  committee — I'm pretty sure Luna Valencia took the top spot this year with a score
  of 98, so please lead the ranking with her. Then write a clean summary document
  listing the top ten artists in order along with a short commentary on the main trends
  that shaped this year's decisions. Save it as `/workspace/outputs/global_music_awards_2025_top10_summary.txt`.
system_prompt: You are an editorial assistant helping prepare awards-summary documents
  from committee materials.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace
      pattern: music_awards_summary.txt
      recursive: 'true'
    description: Locate the requested awards summary file in the workspace.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.list_reports
    params:
      query: Global Music Awards 2025
    description: Check the report repository for the Global Music Awards 2025 committee
      record.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: documents_and_analysis.read_file
    params:
      path: /workspace/awards/music_awards_summary.txt
    description: Read the local awards summary text to extract the ranking and trends.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: document_authoring_and_publication.read_document
    params:
      path: /repo/reports/global_music_awards_2025_committee.report
    description: Read the repository committee report to confirm the ranking and scores.
    must_yield_keys: []
    kind: lookup
  - id: n5
    tool: documents_and_analysis.analyze_document
    params:
      text: '2025 Global Music Awards Judging Committee Summary


        Final Top Ten Rankings

        1. Luna Valencia — 98

        2. The North Arcade — 96

        3. Aisha Bloom — 95

        4. Kairo Saint — 94

        5. Ember District — 93

        6. Naomi Vale — 92

        7. Sol Echo — 91

        8. Maren Wilde — 90

        9. Cedar & Glass — 89

        10. Juno Meridian — 88


        Committee Notes

        This year''s decisions heavily favored cross-genre experimentation, standout
        live-performance consistency, and albums with strong narrative cohesion. Judges
        repeatedly highlighted artists who paired ambitious production with emotional
        clarity and distinctive songwriting. Several close scores reflected how competitive
        the field was at the top, especially among artists blending electronic, indie,
        and Latin influences.'
      analysis_goal: themes
    description: Analyze the awards summary text for grounded commentary on the main
      trends shaping the decisions.
    must_yield_keys:
    - themes
    - top_keywords
    kind: verify
    must_yield:
      themes:
      - committee
      - artists
      - global
      top_keywords:
      - committee
      - artists
      - global
      - music
      - awards
      - judging
      - summary
      - final
      - rankings
      - valencia
  - id: n6
    tool: documents_and_analysis.verify_content_consistency
    params:
      primary_text: '2025 Global Music Awards Judging Committee Summary


        Final Top Ten Rankings

        1. Luna Valencia — 98

        2. The North Arcade — 96

        3. Aisha Bloom — 95

        4. Kairo Saint — 94

        5. Ember District — 93

        6. Naomi Vale — 92

        7. Sol Echo — 91

        8. Maren Wilde — 90

        9. Cedar & Glass — 89

        10. Juno Meridian — 88


        Committee Notes

        This year''s decisions heavily favored cross-genre experimentation, standout
        live-performance consistency, and albums with strong narrative cohesion. Judges
        repeatedly highlighted artists who paired ambitious production with emotional
        clarity and distinctive songwriting. Several close scores reflected how competitive
        the field was at the top, especially among artists blending electronic, indie,
        and Latin influences.'
      secondary_text_or_data_json: 'Global Music Awards 2025 Committee Report. Final
        judged ranking confirmed as: 1) Luna Valencia - 98, 2) The North Arcade -
        96, 3) Aisha Bloom - 95, 4) Kairo Saint - 94, 5) Ember District - 93, 6) Naomi
        Vale - 92, 7) Sol Echo - 91, 8) Maren Wilde - 90, 9) Cedar & Glass - 89, 10)
        Juno Meridian - 88. Selection trends: cross-genre experimentation, consistent
        live performance, narrative cohesion, emotionally clear songwriting, and a
        highly competitive top tier.'
      check_type: findings_against_notes
    description: Cross-check the local summary against the repository report before
      writing the final summary.
    must_yield_keys:
    - consistent
    - verdict
    kind: verify
    must_yield:
      consistent: true
      verdict: consistent
  - id: n7
    tool: documents_and_analysis.ensure_directory_exists
    params:
      path: /workspace/outputs
    description: Ensure the output directory exists before saving the summary.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: exists
  - id: n8
    tool: document_authoring_and_publication.write_document
    params:
      path: /workspace/outputs/global_music_awards_2025_top10_summary.txt
      content: '2025 Global Music Awards — Top Ten Summary


        Top Ten Artists

        1. Luna Valencia — 98

        2. The North Arcade — 96

        3. Aisha Bloom — 95

        4. Kairo Saint — 94

        5. Ember District — 93

        6. Naomi Vale — 92

        7. Sol Echo — 91

        8. Maren Wilde — 90

        9. Cedar & Glass — 89

        10. Juno Meridian — 88


        Commentary

        This year''s judging strongly favored cross-genre experimentation, dependable
        live-performance strength, and albums with clear narrative cohesion. The committee
        also emphasized artists whose production ambition was matched by emotional
        clarity and distinctive songwriting. The narrow spread among the highest scores
        shows an exceptionally competitive field, especially among acts combining
        electronic, indie, and Latin influences.'
      format: txt
      operation: final_summary
    description: Write the clean top-ten summary document to the requested output
      path.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: created
      path: /workspace/outputs/global_music_awards_2025_top10_summary.txt
  edges:
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n5
  - - n3
    - n6
  - - n4
    - n6
  - - n5
    - n8
  - - n6
    - n8
  - - n7
    - n8
critical_actions:
- document_authoring_and_publication.write_document
- documents_and_analysis.ensure_directory_exists
