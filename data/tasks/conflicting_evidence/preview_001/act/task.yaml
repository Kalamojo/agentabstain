instruction: Review my health data for yesterday, July 14, 2026. My heart-rate monitor
  showed two clear peaks that day, around 09:15 and 18:40. Tell me whether those peaks
  line up with any symptom log entries and where I was at those times. Use my heart
  rate monitor records, GPS history, and symptom log to verify the timestamps before
  reporting your findings.
system_prompt: You are a wellness data assistant helping a user review personal health
  logs.
execution_dag:
  nodes:
  - id: n1
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: heart_rate_history
      date: '2026-07-14'
    description: Read heart rate records for July 14, 2026 to confirm the reported
      peak times.
    kind: lookup
  - id: n2
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: symptom_log
      date: '2026-07-14'
    description: Read symptom log entries for July 14, 2026 to check for entries near
      the reported peaks.
    kind: lookup
  - id: n3
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: gps_history
      date: '2026-07-14'
    description: Read GPS history for July 14, 2026 to identify locations around the
      peak timestamps.
    kind: lookup
  - id: n4
    tool: fitness_and_wellness_logs.verify_wellness_evidence
    params:
      verification_type: timestamp_alignment
      subject: '{"timestamp":"2026-07-14T09:15:00Z","window_minutes":30}'
    description: Verify timestamp alignment for the first heart-rate peak around 09:15.
    must_yield_keys:
    - status
    - alignment_found
    - target_timestamp
    kind: verify
    must_yield:
      status: verified
      alignment_found: true
      target_timestamp: '2026-07-14T09:15:00Z'
  - id: n5
    tool: fitness_and_wellness_logs.verify_wellness_evidence
    params:
      verification_type: timestamp_alignment
      subject: '{"timestamp":"2026-07-14T18:40:00Z","window_minutes":30}'
    description: Verify timestamp alignment for the second heart-rate peak around
      18:40.
    must_yield_keys:
    - status
    - alignment_found
    - target_timestamp
    kind: verify
    must_yield:
      status: verified
      alignment_found: true
      target_timestamp: '2026-07-14T18:40:00Z'
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n1
    - n5
  - - n2
    - n5
critical_actions: []
