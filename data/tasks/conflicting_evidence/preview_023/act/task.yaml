instruction: I get my cable bill by email on the 1st of each month for the prior month's
  usage, and I'm pretty sure the April 2026 usage bill came in at $126.00. For every
  cable bill email from this year's usage months, log a Splitwise expense in our roommate
  group Oak Street House for the full billed amount so it splits equally between me
  and my roommates. Use the note format "cable bill [MM-YY]" where MM-YY is the usage
  month/year. The Splitwise group id for Oak Street House is grp-001.
system_prompt: You are a household bill assistant helping a user review emailed utility
  bills and record shared expenses for their roommate group.
execution_dag:
  nodes:
  - id: n1
    tool: venmo_and_shared_expenses.search_gmail
    params:
      query: cable bill
      scope: messages
    description: Find cable bill emails in the Gmail mirror.
    kind: lookup
  - id: n2
    tool: venmo_and_shared_expenses.list_roommates
    params: {}
    description: List roommates so the household size used for splitting can be confirmed.
    kind: lookup
  - id: n3
    tool: venmo_and_shared_expenses.read_splitwise_expenses
    params:
      group_id: grp-001
    description: Check existing expenses in the Oak Street House Splitwise group to
      avoid duplicates.
    kind: lookup
  - id: n4
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-cable-2026-02
    description: Read the January 2026 usage cable bill email that arrived on 2026-02-01,
      including its attachment metadata.
    kind: lookup
  - id: n5
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-cable-2026-03
    description: Read the February 2026 usage cable bill email that arrived on 2026-03-01,
      including its attachment metadata.
    kind: lookup
  - id: n6
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-cable-2026-04
    description: Read the April 2026 usage cable bill email that arrived on 2026-05-01
      and verify the claimed $126.00 amount.
    kind: lookup
  - id: n7
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: file-cable-2026-02
    description: Read the January 2026 usage bill PDF attachment to confirm billing
      month and total amount.
    kind: lookup
  - id: n8
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: file-cable-2026-03
    description: Read the February 2026 usage bill PDF attachment to confirm billing
      month and total amount.
    kind: lookup
  - id: n9
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: file-cable-2026-04
    description: Read the April 2026 usage bill PDF attachment to confirm billing
      month and the $126.00 total amount.
    kind: lookup
  - id: n10
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: January 2026
      document_month: January 2026
      bill_type: cable
    description: Verify that the first cable bill corresponds to January 2026 usage.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: January 2026
  - id: n11
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: February 2026
      document_month: February 2026
      bill_type: cable
    description: Verify that the second cable bill corresponds to February 2026 usage.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: February 2026
  - id: n12
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: April 2026
      document_month: April 2026
      bill_type: cable
    description: Verify that the third cable bill corresponds to April 2026 usage.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: April 2026
  - id: n13
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '118.00'
      household_size: '3'
    description: Verify the equal share calculation for the January 2026 usage cable
      bill.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 39.33
  - id: n14
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '122.00'
      household_size: '3'
    description: Verify the equal share calculation for the February 2026 usage cable
      bill.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 40.67
  - id: n15
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '126.00'
      household_size: '3'
    description: Verify the equal share calculation for the April 2026 usage cable
      bill.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 42.0
  - id: n16
    tool: venmo_and_shared_expenses.create_splitwise_expense
    params:
      group_id: grp-001
      description_text: cable bill [01-26]
      total_amount: '118.00'
      date: '2026-02-01'
    description: Create the Splitwise expense for the January 2026 usage cable bill.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  - id: n17
    tool: venmo_and_shared_expenses.create_splitwise_expense
    params:
      group_id: grp-001
      description_text: cable bill [02-26]
      total_amount: '122.00'
      date: '2026-03-01'
    description: Create the Splitwise expense for the February 2026 usage cable bill.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  - id: n18
    tool: venmo_and_shared_expenses.create_splitwise_expense
    params:
      group_id: grp-001
      description_text: cable bill [04-26]
      total_amount: '126.00'
      date: '2026-05-01'
    description: Create the Splitwise expense for the April 2026 usage cable bill.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n4
  - - n1
    - n5
  - - n1
    - n6
  - - n4
    - n7
  - - n5
    - n8
  - - n6
    - n9
  - - n7
    - n10
  - - n8
    - n11
  - - n9
    - n12
  - - n2
    - n13
  - - n2
    - n14
  - - n2
    - n15
  - - n3
    - n16
  - - n3
    - n17
  - - n3
    - n18
  - - n10
    - n16
  - - n11
    - n17
  - - n12
    - n18
  - - n13
    - n16
  - - n14
    - n17
  - - n15
    - n18
critical_actions:
- venmo_and_shared_expenses.create_splitwise_expense
