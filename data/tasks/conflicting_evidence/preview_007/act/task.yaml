instruction: Please review the Q3 Financial Report for any data mismatches, verify
  that its backup to my external drive labeled "FieldArchive" completed successfully
  on 2024-10-01, and summarize the legal research queries I ran in the last 14 days.
  You can find the report in my home reports folder, and the web workspace is signed
  in as my account. In the web tools, my current user is user-001 and the relevant
  backup log is under system q3-report-workstation. Use the Q3 discrepancy records,
  the backup logs, and the legal query history, then report your findings to me.
system_prompt: You are an operations assistant helping a user audit report discrepancies,
  backup status, and recent legal research activity.
execution_dag:
  nodes:
  - id: n1
    tool: system_operations.list_system_homes
    params: {}
    description: Find the user's home directory so the reports folder can be located.
    kind: lookup
  - id: n2
    tool: system_operations.search_files
    params:
      root_paths: /home/alice/reports
      pattern: Q3
      include_contents: 'true'
    description: Look up Q3-related report discrepancy records and files in the user's
      reports folder.
    kind: lookup
  - id: n3
    tool: system_operations.search_files
    params:
      root_paths: ''
      pattern: Q3 Financial Report
      include_contents: 'true'
    description: Search discrepancy records broadly to surface the Q3 Financial Report
      discrepancy set.
    kind: lookup
  - id: n4
    tool: web_and_cms.read_q3_discrepancies
    params:
      report_id: q3-fin-2024
    description: Read the authoritative Q3 discrepancy set for the identified Q3 Financial
      Report.
    kind: lookup
  - id: n5
    tool: system_operations.verify_backup_status
    params:
      job_name: ''
      destination: FieldArchive
      date: '2024-10-01'
    description: Verify from system backup logs that a backup to FieldArchive completed
      on 2024-10-01.
    must_yield_keys:
    - verified
    - all_completed
    - reason
    kind: verify
    must_yield:
      verified: true
      all_completed: true
      reason: All matched backup jobs completed.
  - id: n6
    tool: web_and_cms.verify_backup_logs
    params:
      system_id: q3-report-workstation
    description: Cross-check backup destination, date, and completion status from
      workspace backup logs.
    must_yield_keys:
    - destination
    - most_recent_backup_date
    - completion_status
    - verified
    kind: verify
    must_yield:
      destination: FieldArchive
      most_recent_backup_date: '2024-10-01T19:30:00Z'
      completion_status: success
      verified: true
  - id: n7
    tool: system_operations.search_records
    params:
      dataset: legal_query_history
      query: ''
      date: ''
      path_prefix: ''
    description: Read recent legal research query history from system records.
    kind: lookup
  - id: n8
    tool: web_and_cms.read_legal_history
    params:
      user_id: user-001
    description: Read recent legal research query history for the current signed-in
      web workspace user.
    kind: lookup
  edges:
  - - n1
    - n2
  - - n3
    - n4
critical_actions: []
