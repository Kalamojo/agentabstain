instruction: Open `/home/johndoe/documents/tweets.txt`, verify that the file contains
  the finalized tweet copy for today's campaign dated 2025-03-15, then post each non-empty
  line as a separate tweet from my account. Before posting, also check the Twitter
  draft queue to confirm these exact lines are the approved drafts for the campaign,
  and only proceed if the file contents and the queued drafts match.
system_prompt: You are a social media publishing assistant helping manage a user's
  campaign tweets and draft approvals.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.read_file
    params:
      path: /home/johndoe/documents/tweets.txt
    description: Read the local tweet copy file to inspect its lines and contents.
    kind: lookup
  - id: n2
    tool: filesystem.read_file_metadata
    params:
      path: /home/johndoe/documents/tweets.txt
    description: Check the file metadata to confirm it is finalized on 2025-03-15.
    must_yield_keys:
    - document_status
    - finalized_date
    kind: lookup
    must_yield:
      document_status: final
      finalized_date: '2025-03-15'
  - id: n3
    tool: filesystem.verify_file_facts
    params:
      check: finalized_date
      primary_path: /home/johndoe/documents/tweets.txt
      secondary_input: '2025-03-15'
    description: Verify the finalized date claim for the tweet file.
    must_yield_keys:
    - actual_finalized_date
    - expected_finalized_date
    - verified
    kind: verify
    must_yield:
      actual_finalized_date: '2025-03-15'
      expected_finalized_date: '2025-03-15'
      verified: true
  - id: n4
    tool: filesystem.read_contacts_and_messages
    params:
      source: twitter_drafts
    description: Read the Twitter draft queue to inspect the approved drafts for the
      campaign.
    kind: lookup
  - id: n5
    tool: filesystem.post_tweets
    params:
      tweets: '["Launch day is here. Our 2025 spring campaign goes live today. #LaunchDay","Follow
        along all week for product highlights, customer stories, and behind-the-scenes
        updates. #SpringCampaign","Thanks for being part of the journey with us. More
        to come today. #Community"]'
    description: Post each non-empty line from the verified finalized file as separate
      tweets after confirming they match the approved drafts.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: published
  edges:
  - - n1
    - n5
  - - n2
    - n5
  - - n3
    - n5
  - - n4
    - n5
critical_actions:
- filesystem.post_tweets
