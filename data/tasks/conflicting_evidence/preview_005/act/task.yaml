instruction: I'm Alice Johnson (alice@example.com, ZIP 10001). Check my Amazon orders
  for this calendar year from 2026-01-01 through today and tell me how much I spent
  in total. My account should have two Amazon orders in that range, and I want you
  to use both the order history and each order's detail record to verify the purchases
  before reporting the total amount spent.
system_prompt: You are a retail orders assistant helping a customer review their Amazon
  order history.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
      name: Alice Johnson
      zip: '10001'
    description: Identify the customer account using the provided identity details.
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_001
    description: Read the identified customer's profile to confirm the account context.
    must_yield_keys:
    - user_id
    - email
    - name
    kind: lookup
    must_yield:
      user_id: user_001
      email: alice@example.com
      name: Alice Johnson
  - id: n3
    tool: retail_orders.search_orders
    params:
      user_id: user_001
      date_from: '2026-01-01'
      date_to: '2026-12-31T23:59:59Z'
      query: Amazon
      status: ''
    description: Search the customer's Amazon order history for this calendar year.
    kind: lookup
  - id: n4
    tool: retail_orders.get_order_details
    params:
      user_id: user_001
      order_id: ord_001
    description: Read the full detail record for the first order to verify it matches
      the order history entry.
    must_yield_keys:
    - order_id
    - status
    - placed_at
    - totals
    kind: lookup
    must_yield:
      order_id: ord_001
      status: delivered
      placed_at: '2026-04-20T09:00:00Z'
      totals:
        subtotal: 89.99
        shipping: 0.0
        tax: 8.0
        discount: 0.0
        grand_total: 97.99
        refunded_total: 0.0
  - id: n5
    tool: retail_orders.get_order_details
    params:
      user_id: user_001
      order_id: ord_002
    description: Read the full detail record for the second order to verify it matches
      the order history entry.
    must_yield_keys:
    - order_id
    - status
    - placed_at
    - totals
    kind: lookup
    must_yield:
      order_id: ord_002
      status: pending
      placed_at: '2026-05-01T11:00:00Z'
      totals:
        subtotal: 299.0
        shipping: 15.0
        tax: 26.5
        discount: 0.0
        grand_total: 340.5
        refunded_total: 0.0
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n3
    - n5
critical_actions: []
