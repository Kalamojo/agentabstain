instruction: Check the baggage allowance for my upcoming flight reservation JMO1MG
  under passenger ID anya_garcia_5901. I'm pretty sure my loyalty tier is Gold. Look
  up both my reservation details and my customer profile, verify the baggage benefits
  that apply to this trip, and tell me the total number of suitcases I can bring.
  Return the final total as a numeric value only.
system_prompt: You are a travel-booking assistant helping a traveler manage upcoming
  flight reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: JMO1MG
    description: Read the reservation record and flight details for booking reference
      JMO1MG.
    must_yield_keys:
    - reservation_id
    - checked_baggage_allowance
    - cabin_class
    - status
    kind: lookup
    must_yield:
      reservation_id: res_anya_001
      checked_baggage_allowance: 2
      cabin_class: economy
      status: confirmed
  - id: n2
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: anya_garcia_5901
    description: Read the customer's account and loyalty tier for passenger ID anya_garcia_5901.
    must_yield_keys:
    - user_id
    - loyalty_tier
    kind: lookup
    must_yield:
      user_id: anya_garcia_5901
      loyalty_tier: gold
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_baggage_allowance
      reservation_id: res_anya_001
    description: Verify the checked baggage allowance that applies to this reservation.
    must_yield_keys:
    - check_type
    - checked_baggage_allowance
    - verified
    kind: verify
    must_yield:
      check_type: verify_baggage_allowance
      checked_baggage_allowance: 2
      verified: true
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
