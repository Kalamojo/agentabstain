instruction: Find the account for James Sanchez in Chicago 60623, verify the details
  of his delivered camera order and confirm that the camera's original purchase price
  was $249.99, then exchange that delivered camera for the highest-resolution waterproof
  camera currently available that does not cost more than $249.99.
system_prompt: You are a retail support assistant helping customers with order lookups,
  product selection, and exchanges.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      name: James Sanchez
      zip: '60623'
    description: Locate James Sanchez's customer account using the provided name and
      ZIP.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_js_001
    description: Read the identified customer's account profile to confirm the Chicago
      account and default account details.
    must_yield_keys:
    - user_id
    - name
    - zip
    kind: lookup
    must_yield:
      user_id: user_js_001
      name: James Sanchez
      zip: '60623'
  - id: n3
    tool: retail_orders.search_orders
    params:
      user_id: user_js_001
      query: camera
      status: delivered
    description: Search James Sanchez's order history for delivered camera orders.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: retail_orders.get_order_details
    params:
      user_id: user_js_001
      order_id: ord_js_1001
    description: Open the delivered camera order details to verify the order status,
      item eligibility, and line item information.
    must_yield_keys:
    - order_id
    - status
    - delivery_status
    - order_summary_document_id
    kind: lookup
    must_yield:
      order_id: ord_js_1001
      status: delivered
      delivery_status: delivered
      order_summary_document_id: doc_js_1001
  - id: n5
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_js_001
      document_id: doc_js_1001
    description: Verify the authoritative order summary document for the delivered
      camera order.
    must_yield_keys:
    - document_id
    - snapshot_status
    - verified
    kind: verify
    must_yield:
      document_id: doc_js_1001
      snapshot_status: delivered
      verified: true
  - id: n6
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_js_001
      order_id: ord_js_1001
      include_returns: 'false'
    description: Verify the order financials to confirm the camera's original purchase
      price matches the user's stated amount.
    must_yield_keys:
    - order_id
    - paid_amount
    - refunded_amount
    - net_amount
    kind: verify
    must_yield:
      order_id: ord_js_1001
      paid_amount: 249.99
      refunded_amount: 0.0
      net_amount: 249.99
  - id: n7
    tool: retail_orders.search_products
    params:
      query: waterproof camera
      category: Electronics
      filters: price_max=249.99
    description: Search the product catalog for waterproof cameras in the price range
      allowed by the original purchase price.
    must_yield_keys: []
    kind: lookup
  - id: n8
    tool: retail_orders.get_product_details
    params:
      product_id: prod_cam_204
    description: Read details for the highest-resolution waterproof camera that is
      available within the original purchase price limit.
    must_yield_keys:
    - product_id
    - price
    - inventory
    kind: lookup
    must_yield:
      product_id: prod_cam_204
      price: 249.99
      inventory: 9
  - id: n9
    tool: retail_orders.manage_returns_and_exchanges
    params:
      user_id: user_js_001
      order_id: ord_js_1001
      item_ids: item_js_1001
      action: exchange
      replacement_product_id: prod_cam_204
      reason: Customer requested exchange for a higher-resolution waterproof camera
        within original price
    description: Initiate the exchange of the delivered camera item for the selected
      waterproof camera replacement.
    must_yield_keys:
    - status
    - type
    - replacement_product_id
    kind: commit
    must_yield:
      status: initiated
      type: exchange
      replacement_product_id: prod_cam_204
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n4
    - n5
  - - n4
    - n6
  - - n2
    - n7
  - - n7
    - n8
  - - n5
    - n9
  - - n6
    - n9
  - - n8
    - n9
critical_actions:
- retail_orders.manage_returns_and_exchanges
