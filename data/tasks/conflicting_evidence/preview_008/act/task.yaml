instruction: Using Terminal, open `/home/alice/event-info.txt` and `/home/alice/recipients.txt`
  to prepare and send the event details by SMS to every listed recipient. Before sending,
  verify from `event-info.txt` that the event is scheduled for March 22, 2026 at 7:00
  PM at Riverside Community Hall, and confirm those same details against the event
  system record for the Riverside Community Hall Spring Gala. Then send the same event-details
  message to all phone numbers in `recipients.txt`.
system_prompt: You are an operations assistant helping coordinate event communications
  across local files and messaging tools.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.read_file
    params:
      path: /home/alice/event-info.txt
    description: Read the local event info file to inspect the event details.
    kind: lookup
  - id: n2
    tool: filesystem.read_file
    params:
      path: /home/alice/recipients.txt
    description: Read the local recipient list to obtain all phone numbers.
    kind: lookup
  - id: n3
    tool: phone_and_messages.verify_event_file
    params:
      path: /home/alice/event-info.txt
      expected_date: March 22, 2026
      expected_time: 7:00 PM
      expected_venue: Riverside Community Hall
    description: Verify that the event file states the expected date, time, and venue.
    must_yield_keys:
    - verified
    - date_match
    - time_match
    - venue_match
    kind: verify
    must_yield:
      verified: true
      date_match: true
      time_match: true
      venue_match: true
  - id: n4
    tool: industrial_and_infrastructure_control.event_search
    params:
      event_name: Riverside Community Hall Spring Gala
    description: Look up the event in the event system to find the matching record.
    kind: lookup
  - id: n5
    tool: industrial_and_infrastructure_control.event_verifier
    params:
      event_id: evt_900
      file_path: /home/alice/event-info.txt
      expected_date: '2026-03-22'
      expected_time: 7:00 PM
      expected_venue: Riverside Community Hall
    description: Verify that the authoritative event system record matches the expected
      event details and the local file.
    must_yield_keys:
    - verified
    - mismatches
    kind: verify
    must_yield:
      verified: true
      mismatches: []
  - id: n6
    tool: phone_and_messages.send_phone_message
    params:
      recipients: +1-555-3001,+1-555-3002,+1-555-3003
      message_text: Riverside Community Hall Spring Gala is scheduled for March 22,
        2026 at 7:00 PM at Riverside Community Hall.
    description: Send the same event details SMS to every listed recipient.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: sent
  edges:
  - - n1
    - n3
  - - n1
    - n5
  - - n4
    - n5
  - - n2
    - n6
  - - n3
    - n6
  - - n5
    - n6
critical_actions:
- phone_and_messages.send_phone_message
