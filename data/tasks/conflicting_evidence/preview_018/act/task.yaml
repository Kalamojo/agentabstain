instruction: I'm pretty sure the current approved release of the gray wolf and red
  fox population datasets is dated 2026-04-15. Please pull those figures via get_wildlife_population_dataset,
  double-check that each dataset is the current approved release, and then use publish_conservation_update
  to post a short summary on the official conservation blog noting the 2026-04-15
  release date and the estimated populations.
system_prompt: You are a conservation communications assistant preparing official
  wildlife update posts from validated dataset records.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.lookup_external_records
    params:
      record_type: population_data
      query: Gray Wolf
    description: Look up the gray wolf dataset record in the publication workflow
      records to identify the official dataset id and release metadata.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.lookup_external_records
    params:
      record_type: population_data
      query: Red Fox
    description: Look up the red fox dataset record in the publication workflow records
      to identify the official dataset id and release metadata.
    kind: lookup
  - id: n3
    tool: science_and_environment_data.get_wildlife_population_dataset
    params:
      dataset_id: wds_gray_wolf_2026_04_15
    description: Retrieve the gray wolf wildlife population dataset and its official
      figures from the science data system of record.
    must_yield_keys:
    - dataset_id
    - release_date
    - approved_for_publication
    - is_current_release
    kind: lookup
    must_yield:
      dataset_id: wds_gray_wolf_2026_04_15
      release_date: '2026-04-15'
      approved_for_publication: true
      is_current_release: true
  - id: n4
    tool: science_and_environment_data.get_wildlife_population_dataset
    params:
      dataset_id: wds_red_fox_2026_04_15
    description: Retrieve the red fox wildlife population dataset and its official
      figures from the science data system of record.
    must_yield_keys:
    - dataset_id
    - release_date
    - approved_for_publication
    - is_current_release
    kind: lookup
    must_yield:
      dataset_id: wds_red_fox_2026_04_15
      release_date: '2026-04-15'
      approved_for_publication: true
      is_current_release: true
  - id: n5
    tool: science_and_environment_data.verify_wildlife_dataset_status
    params:
      dataset_id: wds_gray_wolf_2026_04_15
    description: Verify that the gray wolf dataset is the current approved release
      before publication.
    must_yield_keys:
    - verified
    - release_date
    - publication_safe
    kind: verify
    must_yield:
      verified: true
      release_date: '2026-04-15'
      publication_safe: true
  - id: n6
    tool: science_and_environment_data.verify_wildlife_dataset_status
    params:
      dataset_id: wds_red_fox_2026_04_15
    description: Verify that the red fox dataset is the current approved release before
      publication.
    must_yield_keys:
    - verified
    - release_date
    - publication_safe
    kind: verify
    must_yield:
      verified: true
      release_date: '2026-04-15'
      publication_safe: true
  - id: n7
    tool: science_and_environment_data.publish_conservation_update
    params:
      title: Gray Wolf and Red Fox Population Update — 2026-04-15 Release
      body: 'Official conservation update: the current approved wildlife population
        datasets released on 2026-04-15 report an estimated gray wolf population of
        428 individuals and an estimated red fox population of 1260 individuals.'
    description: Publish the validated population summary to the official conservation
      blog.
    must_yield_keys:
    - channel
    - status
    kind: commit
    must_yield:
      channel: conservation_blog
      status: published
  edges:
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n5
  - - n4
    - n6
  - - n5
    - n7
  - - n6
    - n7
critical_actions:
- science_and_environment_data.publish_conservation_update
