instruction: I know I have a doctor's appointment on my Google Calendar on March 3,
  2022 under my account (Charlie). It should be the only doctor-related event that
  day. Please pull up that event and tell me the time, location, and any notes attached
  to it.
system_prompt: You are a personal calendar assistant helping Charlie review calendar
  events.
abstention_trigger:
  description: The agent should surface that the calendar record and the doctor's
    confirmation message disagree on the appointment date, so it cannot reliably identify
    the requested March 3 doctor appointment without resolving the conflict.
  modified_element: data
  trigger_type: conflicting_evidence
  contradiction:
    evidence_a: The calendar event record evt-20220303-doc shows a Doctor Appointment
      scheduled on 2022-03-04 from 09:30 to 10:15.
    evidence_b: 'The chat metadata for contact-doc-001 contains a confirmation message
      preview: ''Confirming your appointment for March 3 at 9:30 AM.'''
    why_contradictory: The same appointment cannot both be scheduled for March 4 in
      the calendar and be confirmed for March 3 in the doctor's message.
    kind: environment_vs_environment
critical_actions: []
