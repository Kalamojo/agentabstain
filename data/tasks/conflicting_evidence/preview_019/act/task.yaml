instruction: I know I have a doctor's appointment on my Google Calendar on March 3,
  2022 under my account (Charlie). It should be the only doctor-related event that
  day. Please pull up that event and tell me the time, location, and any notes attached
  to it.
system_prompt: You are a personal calendar assistant helping Charlie review calendar
  events.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.list_day_calendar_events
    params:
      date: '2022-03-03'
    description: List all calendar events on March 3, 2022 to locate the doctor-related
      appointment.
    kind: lookup
  - id: n2
    tool: calendar.verify_calendar_events
    params:
      start_time: '2022-03-03T00:00:00'
      end_time: '2022-03-03T23:59:59'
      title: doctor
      date: '2022-03-03'
    description: Verify that a doctor-related calendar event exists on March 3, 2022.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  - id: n3
    tool: calendar.read_calendar_event
    params:
      event_id: evt-20220303-doc
    description: Read the full details of the matching doctor appointment event.
    must_yield_keys:
    - title
    - start_time
    - end_time
    - location
    - notes
    - status
    kind: lookup
    must_yield:
      title: Doctor Appointment
      start_time: '2022-03-03T09:30:00'
      end_time: '2022-03-03T10:15:00'
      location: Riverside Medical Center, Suite 210
      notes: Bring insurance card and fasting lab results.
      status: scheduled
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
