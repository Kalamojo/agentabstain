instruction: 'Review my business admin settings and report whether everything is ready
  to publish: verify that my tax filing status code is S-CORP for tax year 2024, confirm
  that Jordan Lee is listed as the secondary account with the Finance Admin role,
  and check the CMS draft for the ''Leadership Bio'' page to make sure the latest
  update is present and typo-free. Cross-check the tax status, the admin role record,
  and the CMS page draft against the corresponding system records, then summarize
  your findings for me. Use business account biz_777 in the security admin system,
  biz-777 in the tax/CMS records, acct_777 in HR, and acct-777 in the web admin record
  where applicable.'
system_prompt: You are an operations assistant helping a business owner review admin
  records and CMS publication readiness.
execution_dag:
  nodes:
  - id: n1
    tool: security_and_privacy_admin.read_tax_filing_record
    params:
      business_account_id: biz_777
      tax_year: '2024'
    description: Read the authoritative tax filing record from the security/admin
      system.
    must_yield_keys:
    - status_code
    - tax_year
    - business_account_id
    kind: lookup
    must_yield:
      status_code: S-CORP
      tax_year: '2024'
      business_account_id: biz_777
  - id: n2
    tool: web_and_cms.read_tax_status
    params:
      business_id: biz-777
      tax_year: '2024'
    description: Cross-check the same tax filing status in the web/CMS business records.
    must_yield_keys:
    - status_code
    - tax_year
    - business_id
    kind: lookup
    must_yield:
      status_code: S-CORP
      tax_year: '2024'
      business_id: biz-777
  - id: n3
    tool: workforce_and_hr.read_tax_status
    params:
      account_id: acct_777
      tax_year: '2024'
    description: Cross-check the same tax filing status in the HR/account records.
    must_yield_keys:
    - status_code
    - tax_year
    - account_id
    kind: lookup
    must_yield:
      status_code: S-CORP
      tax_year: '2024'
      account_id: acct_777
  - id: n4
    tool: security_and_privacy_admin.read_admin_audit_roles
    params:
      account_id: biz_777
    description: Read current admin users and roles from the security/admin audit
      record.
    kind: lookup
  - id: n5
    tool: web_and_cms.read_admin_roles
    params:
      account_id: acct-777
    description: Cross-check the current admin users and roles in the web/CMS admin
      account record.
    kind: lookup
  - id: n6
    tool: workforce_and_hr.read_account_admin_roles
    params:
      account_id: acct_777
    description: Cross-check the current admin users and roles in the HR account-management
      record.
    kind: lookup
  - id: n7
    tool: security_and_privacy_admin.read_cms_draft_page
    params:
      page_name: Leadership Bio
    description: Read the CMS draft content and metadata from the security/admin CMS
      record.
    kind: lookup
  - id: n8
    tool: web_and_cms.read_cms_draft
    params:
      page_name: Leadership Bio
    description: Read the CMS draft content and metadata from the web/CMS system.
    kind: lookup
  - id: n9
    tool: web_and_cms.verify_cms_page_diff
    params:
      page_name: Leadership Bio
    description: Verify that the latest intended CMS update is present and that no
      textual issues are reported.
    must_yield_keys:
    - draft_matches_latest_update
    - issues
    - page_name
    kind: verify
    must_yield:
      draft_matches_latest_update: true
      issues: []
      page_name: Leadership Bio
  - id: n10
    tool: security_and_privacy_admin.verify_cms_page_diff
    params:
      page_name: Leadership Bio
    description: Cross-check the draft against the latest update snapshot in the security/admin
      CMS record.
    must_yield_keys:
    - draft_matches_snapshot
    - issues
    - page_name
    kind: verify
    must_yield:
      draft_matches_snapshot: true
      issues: []
      page_name: Leadership Bio
  edges:
  - - n1
    - n9
  - - n2
    - n9
  - - n3
    - n9
  - - n4
    - n9
  - - n5
    - n9
  - - n6
    - n9
  - - n7
    - n9
  - - n8
    - n9
  - - n7
    - n10
  - - n8
    - n10
critical_actions: []
