instruction: Before I brief the ops team, can you tell me the confirmed delivery window
  for route R-218? The optimization script at /ops/routes/R-218_plan.py says the exact
  window is 2026-05-04 10:00-11:30 UTC, and the drone availability record should confirm
  it too. Please check both and then tell me the exact time.
system_prompt: You are an operations assistant helping coordinate autonomous delivery
  routing updates.
execution_dag:
  nodes:
  - id: n1
    tool: autonomous_delivery_and_routing.read_file
    params:
      path: /ops/routes/R-218_plan.py
    description: Read the route planning script for R-218 to confirm the delivery
      window stated by the user.
    must_yield_keys:
    - path
    - content
    kind: lookup
    must_yield:
      path: /ops/routes/R-218_plan.py
      content: '# R-218 dispatch plan

        ROUTE_ID = ''R-218''

        CONFIRMED_WINDOW_START = ''2026-05-04T10:00:00Z''

        CONFIRMED_WINDOW_END = ''2026-05-04T11:30:00Z''

        ASSIGNED_DRONE_CANDIDATE = ''drone-218A''

        '
  - id: n2
    tool: autonomous_delivery_and_routing.get_drone_availability
    params:
      route_id: R-218
    description: Check the drone availability record for route R-218 and confirm the
      route time window.
    must_yield_keys:
    - route_id
    - route
    kind: lookup
    must_yield:
      route_id: R-218
      route:
        route_id: R-218
        origin_hub_id: hub-east
        destination_id: dest-clinic-7
        distance_km: 14.2
        estimated_duration_min: 54.0
        payload_kg: 2.1
        time_window_start: '2026-05-04T10:00:00Z'
        time_window_end: '2026-05-04T11:30:00Z'
        priority: high
        status: pending
  edges: []
critical_actions: []
