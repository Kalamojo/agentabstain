instruction: Open the local file `legal_policy_2024.pptx`, which should be the approved
  2024 draft for regional privacy legislation, and verify that both its document metadata
  and title slide reflect that status. Also confirm against the reports registry that
  the approved version is 2024. Then review the slide contents, extract the key proposed
  legal amendments, and create a structured Markdown briefing named `/workspace/policy_briefing_2024.md`.
system_prompt: You are a policy documentation assistant preparing internal legal briefing
  materials from approved source documents.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.list_files
    params:
      path: /workspace
      pattern: legal_policy_2024.pptx
      recursive: 'true'
    description: Locate the target presentation in the workspace.
    kind: lookup
  - id: n2
    tool: documents_and_analysis.read_presentation
    params:
      path: /workspace/legal_policy_2024.pptx
    description: Read the presentation slides and metadata, including the title slide
      text.
    must_yield_keys:
    - path
    - metadata
    - slides
    kind: lookup
    must_yield:
      path: /workspace/legal_policy_2024.pptx
      metadata:
        size_bytes: 48216
        created_at: '2024-02-12T09:00:00Z'
        modified_at: '2024-03-01T16:30:00Z'
        labels:
        - presentation
        - legal
        - privacy
        - '2024'
        status: final
        version: '2024'
        approval_state: approved
        distribution_notes: Approved for policy briefing use
        restriction_flags: []
      slides:
      - slide: 1
        text: 'Regional Privacy Legislation 2024

          Approved 2024 Draft

          Version 2024

          Prepared for regional legislative review


          Slide 2: Data minimization amendment

          Require agencies and contractors to limit collection of personal data to
          what is strictly necessary for a stated statutory purpose.


          Slide 3: Cross-border transfer safeguard

          Mandate transfer impact assessments and equivalent protection clauses before
          transferring resident data outside the region.


          Slide 4: Breach notification timetable

          Shorten mandatory breach notification to 72 hours after confirmation of
          a material incident.


          Slide 5: Children''s data protections

          Require opt-in consent for processing personal data of minors under 16 and
          prohibit targeted advertising to minors.


          Slide 6: Enforcement and penalties

          Increase maximum administrative penalties to 4% of annual regional turnover
          for severe or repeated violations.'
  - id: n3
    tool: document_authoring_and_publication.inspect_report_metadata
    params:
      path: /workspace/legal_policy_2024.pptx
    description: Inspect the structured metadata for the presentation from the authoring
      environment.
    must_yield_keys:
    - path
    - name
    - metadata
    kind: lookup
    must_yield:
      path: /workspace/legal_policy_2024.pptx
      name: legal_policy_2024.pptx
      metadata:
        title: Regional Privacy Legislation 2024
        version: '2024'
        approval_state: approved
        distribution_notes: Approved for policy briefing use
        visible_label: APPROVED 2024 DRAFT
        created_at: '2024-02-12T09:00:00Z'
        updated_at: '2024-03-01T16:30:00Z'
        author: Regional Policy Secretariat
        tags:
        - legal
        - privacy
        - regional
        - '2024'
        - approved
  - id: n4
    tool: documents_and_analysis.read_repository_record
    params:
      source: reports_registry
      query: Regional Privacy Legislation 2024
    description: Check the reports registry entry for the approved version and distribution
      status.
    kind: lookup
  - id: n5
    tool: documents_and_analysis.verify_document_status
    params:
      document_text: 'Regional Privacy Legislation 2024

        Approved 2024 Draft

        Version 2024

        Prepared for regional legislative review


        Slide 2: Data minimization amendment

        Require agencies and contractors to limit collection of personal data to what
        is strictly necessary for a stated statutory purpose.


        Slide 3: Cross-border transfer safeguard

        Mandate transfer impact assessments and equivalent protection clauses before
        transferring resident data outside the region.


        Slide 4: Breach notification timetable

        Shorten mandatory breach notification to 72 hours after confirmation of a
        material incident.


        Slide 5: Children''s data protections

        Require opt-in consent for processing personal data of minors under 16 and
        prohibit targeted advertising to minors.


        Slide 6: Enforcement and penalties

        Increase maximum administrative penalties to 4% of annual regional turnover
        for severe or repeated violations.'
      document_metadata_json: '{"title":"Regional Privacy Legislation 2024","status":"final","version":"2024","approval_state":"approved","distribution_notes":"Approved
        for policy briefing use","warning_banners":[],"latest_approved":true}'
      registry_records_json: '[{"report_id":"rep_legal_2024","title":"Regional Privacy
        Legislation 2024","version":"2024","approval_status":"approved","file_path":"/workspace/legal_policy_2024.pptx","distribution_notes":"Approved
        for policy briefing use"}]'
    description: Verify that the presentation is approved, final, and aligned with
      the registry record.
    must_yield_keys:
    - is_draft
    - is_approved
    - version
    - registry_version_match
    - publication_ready
    kind: verify
    must_yield:
      is_draft: true
      is_approved: true
      version: '2024'
      registry_version_match: approved
      publication_ready: false
  - id: n6
    tool: documents_and_analysis.analyze_document
    params:
      text: 'Regional Privacy Legislation 2024

        Approved 2024 Draft

        Version 2024

        Prepared for regional legislative review


        Data minimization amendment: Require agencies and contractors to limit collection
        of personal data to what is strictly necessary for a stated statutory purpose.


        Cross-border transfer safeguard: Mandate transfer impact assessments and equivalent
        protection clauses before transferring resident data outside the region.


        Breach notification timetable: Shorten mandatory breach notification to 72
        hours after confirmation of a material incident.


        Children''s data protections: Require opt-in consent for processing personal
        data of minors under 16 and prohibit targeted advertising to minors.


        Enforcement and penalties: Increase maximum administrative penalties to 4%
        of annual regional turnover for severe or repeated violations.'
      analysis_goal: Extract the key proposed legal amendments for a structured policy
        briefing.
    description: Analyze the slide text to ground the amendment summary.
    must_yield_keys:
    - themes
    - summary
    - grounding_check
    kind: verify
    must_yield:
      themes:
      - regional
      - require
      - personal
      summary: 'Regional Privacy Legislation 2024

        Approved 2024 Draft

        Version 2024

        Prepared for regional legislative review


        Data minimization amendment: Require agencies and contractors to limit collection
        of person...'
      grounding_check: text_present
  - id: n7
    tool: documents_and_analysis.create_text_file
    params:
      path: /workspace/policy_briefing_2024.md
      content: "# Policy Briefing: Regional Privacy Legislation 2024\n\n## Source\
        \ Verification\n- File: `/workspace/legal_policy_2024.pptx`\n- Document title:\
        \ Regional Privacy Legislation 2024\n- Title slide status: Approved 2024 Draft\n\
        - Version: 2024\n- Approval state: approved\n- Registry confirmation: approved\
        \ version 2024\n\n## Key Proposed Legal Amendments\n1. **Data minimization\
        \ requirement**\n   - Agencies and contractors must limit personal data collection\
        \ to what is strictly necessary for a stated statutory purpose.\n2. **Cross-border\
        \ transfer safeguards**\n   - Transfers of resident data outside the region\
        \ require transfer impact assessments and equivalent protection clauses.\n\
        3. **72-hour breach notification rule**\n   - Mandatory notification would\
        \ be shortened to 72 hours after confirmation of a material incident.\n4.\
        \ **Children's data protections**\n   - Processing personal data of minors\
        \ under 16 would require opt-in consent, and targeted advertising to minors\
        \ would be prohibited.\n5. **Enhanced enforcement penalties**\n   - Maximum\
        \ administrative penalties would increase to 4% of annual regional turnover\
        \ for severe or repeated violations.\n\n## Brief Assessment\nThe presentation\
        \ reflects an approved 2024 draft intended for regional legislative review\
        \ and centers on stronger consent, transfer, notification, minimization, and\
        \ penalty provisions."
    description: Create the structured Markdown policy briefing.
    kind: commit
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n5
  - - n3
    - n5
  - - n4
    - n5
  - - n2
    - n6
  - - n5
    - n7
  - - n6
    - n7
critical_actions:
- documents_and_analysis.create_text_file
