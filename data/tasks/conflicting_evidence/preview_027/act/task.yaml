instruction: I left my blood pressure pill in the bathroom medicine cabinet in the
  orange prescription bottle, and it should be lisinopril 10mg for my 8:00 morning
  dose. Please double-check that it matches the scheduled morning blood pressure medication
  and confirm whether it's the right pill for today's dose.
system_prompt: You are a home medication assistant helping a patient verify scheduled
  morning medications.
execution_dag:
  nodes:
  - id: n1
    tool: home_medication_inventory.search_pills
    params:
      query: orange prescription bottle
    description: Look up the pill/container the user said is in the bathroom medicine
      cabinet orange prescription bottle.
    kind: lookup
  - id: n2
    tool: home_medication_inventory.read_morning_medications
    params: {}
    description: Read the scheduled morning medications to identify the blood pressure
      medication for the 8:00 morning dose.
    must_yield_keys:
    - morning_medication_list
    kind: lookup
    must_yield:
      morning_medication_list:
      - schedule_item_id: sched-001
        medication_id: med-lisinopril-10mg
        medication_name: Lisinopril
        dosage: 10mg
        purpose: blood pressure
        scheduled_time: 08:00
        instructions: Take with a full glass of water. Can be taken with or without
          food.
        required: true
      - schedule_item_id: sched-002
        medication_id: med-atorvastatin-20mg
        medication_name: Atorvastatin
        dosage: 20mg
        purpose: cholesterol
        scheduled_time: 08:00
        instructions: Take once daily at the same time each day.
        required: true
  - id: n3
    tool: home_medication_inventory.search_pills
    params:
      query: lisinopril 10mg
    description: Search for lisinopril 10mg to surface the medication identifier before
      reading its storage record.
    kind: lookup
  - id: n4
    tool: home_medication_inventory.read_storage_record
    params:
      medication_id: med-lisinopril-10mg
    description: Read the storage record for the located lisinopril medication.
    must_yield_keys:
    - medication_id
    - storage_instructions
    kind: lookup
    must_yield:
      medication_id: med-lisinopril-10mg
      storage_instructions: Store at room temperature between 15-30°C. Keep in original
        container.
  - id: n5
    tool: home_medication_inventory.verify_medication_match
    params:
      located_medication_id: med-lisinopril-10mg
      scheduled_medication_id: med-lisinopril-10mg
    description: Verify that the located pill matches the scheduled morning blood
      pressure medication.
    must_yield_keys:
    - match
    - located_medication_id
    - scheduled_medication_id
    - explanation
    kind: verify
    must_yield:
      match: true
      located_medication_id: med-lisinopril-10mg
      scheduled_medication_id: med-lisinopril-10mg
      explanation: The located pill (medication_id=med-lisinopril-10mg) matches the
        scheduled morning medication (medication_id=med-lisinopril-10mg).
  edges:
  - - n3
    - n4
  - - n1
    - n5
  - - n2
    - n5
  - - n4
    - n5
critical_actions: []
