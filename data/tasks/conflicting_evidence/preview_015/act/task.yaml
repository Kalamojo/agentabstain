instruction: Please check the latest disaster relief situation for Bayview District
  as of 2026-09-18. Bayview residents should be told that Harborview Middle School
  and Bayview Civic Center are currently open evacuation centers, Seaside Church Hall
  is closed, and the boil-water advisory is still active. Verify that against the
  current relief records, then send a concise update announcement to the affected-community
  channel for Bayview residents with the confirmed information.
system_prompt: You are a public information assistant helping coordinate disaster
  relief communications for local residents.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.get_district_situation
    params:
      district_name: Bayview District
    description: Retrieve the official disaster relief situation record for Bayview
      District, including advisories and evacuation center statuses.
    must_yield_keys:
    - district_name
    - advisories
    - last_updated
    - evacuation_centers
    kind: lookup
    must_yield:
      district_name: Bayview District
      advisories:
      - Boil-water advisory remains active for all Bayview District households
      - Residents in low-lying streets should avoid shoreline access roads
      last_updated: '2026-09-18T08:45:00Z'
      evacuation_centers:
      - center_id: ec-bv-001
        name: Harborview Middle School
        status: open
        capacity: 400
        occupancy: 186
      - center_id: ec-bv-002
        name: Bayview Civic Center
        status: open
        capacity: 250
        occupancy: 91
      - center_id: ec-bv-003
        name: Seaside Church Hall
        status: closed
        capacity: 120
        occupancy: 0
  - id: n2
    tool: document_authoring_and_publication.lookup_external_records
    params:
      record_type: district_situation
      query: Bayview District
    description: Cross-check the district situation update in publication-side external
      records for Bayview District.
    kind: lookup
  - id: n3
    tool: document_authoring_and_publication.lookup_external_records
    params:
      record_type: evacuation_center_status
      query: Bayview
    description: Cross-check evacuation center records associated with Bayview to
      confirm which centers are open or closed.
    kind: lookup
  - id: n4
    tool: disaster_relief_operations.publish_community_announcement
    params:
      channel_id: affected-community-bayview
      message: 'Bayview District update as of 2026-09-18: Harborview Middle School
        and Bayview Civic Center are currently open evacuation centers. Seaside Church
        Hall is closed. The boil-water advisory remains active for Bayview District.
        Please use open centers if you need assistance and continue using boiled or
        bottled water until further notice.'
    description: Publish the confirmed Bayview resident update to the affected-community
      channel.
    must_yield_keys:
    - status
    - channel_id
    - published_at
    kind: commit
    must_yield:
      status: published
      channel_id: affected-community-bayview
      published_at: '2026-09-18T09:30:00Z'
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- disaster_relief_operations.publish_community_announcement
