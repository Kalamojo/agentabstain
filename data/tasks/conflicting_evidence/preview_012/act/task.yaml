instruction: Finalize my travel logistics for my Tokyo trip next month. I’m Maya Chen,
  zip code 10001. My Japan visa application visa_tokyo_2026 is still approved, my
  flight booking BKJPN618 still has the vegetarian meal selected, and my clothing
  order CO-48173 is due before I leave on June 18, 2026. Please verify all three against
  the records, and if they all match, update my travel checklist to mark visa, in-flight
  meal, and trip clothing as ready.
system_prompt: You are a travel logistics assistant helping a traveler verify trip
  readiness across booking and retail systems.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      name: Maya Chen
      zip_code: '10001'
    description: Read the travel account by name and ZIP to confirm the traveler and
      upcoming Tokyo reservation.
    must_yield_keys:
    - user_id
    kind: lookup
    must_yield:
      user_id: user_tokyo_001
  - id: n2
    tool: flight_and_travel_management.travel_documents_and_customs
    params:
      visa_application_id: visa_tokyo_2026
    description: Check the authoritative Japan visa application status.
    must_yield_keys:
    - type
    - status
    kind: lookup
    must_yield:
      type: visa_application
      status: approved
  - id: n3
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: BKJPN618
    description: Read the reservation to verify the Tokyo booking and meal selection
      context.
    must_yield_keys:
    - reservation_id
    - status
    kind: lookup
    must_yield:
      reservation_id: res_tokyo_618
      status: confirmed
  - id: n4
    tool: retail_orders.find_customer_account
    params:
      name: Maya Chen
      zip: '10001'
    description: Locate the retail customer account for the traveler using name and
      ZIP from the instruction.
    kind: lookup
  - id: n5
    tool: retail_orders.get_order_details
    params:
      user_id: user_tokyo_001
      order_id: CO-48173
    description: Read the clothing order details to verify expected delivery before
      departure.
    must_yield_keys:
    - order_id
    - status
    - delivery_status
    - expected_delivery_date
    kind: lookup
    must_yield:
      order_id: CO-48173
      status: shipped
      delivery_status: in_transit
      expected_delivery_date: '2026-06-14'
  - id: n6
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_tokyo_001
      document_id: doc_CO48173
    description: Verify the authoritative order summary snapshot for the clothing
      order.
    must_yield_keys:
    - snapshot_status
    - verified
    kind: verify
    must_yield:
      snapshot_status: shipped
      verified: true
  - id: n7
    tool: flight_and_travel_management.manage_trip_preparation
    params:
      action: update_travel_checklist
      user_id: user_tokyo_001
      trip_id: res_tokyo_618
      checklist_updates: '[{"item_id":"tc_visa","status":"complete","notes":"Verified
        approved visa application visa_tokyo_2026"},{"item_id":"tc_meal","status":"complete","notes":"Verified
        vegetarian meal on booking BKJPN618"},{"item_id":"tc_clothes","status":"complete","notes":"Verified
        clothing order CO-48173 delivers before 2026-06-18"}]'
    description: Mark visa, in-flight meal, and trip clothing as ready on the travel
      checklist after all checks pass.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: updated
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n4
    - n5
  - - n5
    - n6
  - - n2
    - n7
  - - n3
    - n7
  - - n6
    - n7
critical_actions:
- flight_and_travel_management.manage_trip_preparation
