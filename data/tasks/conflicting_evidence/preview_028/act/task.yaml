instruction: My previous chart request on file says I was born at 5:40 AM, and the
  uploaded birth note document text-birth-note-1992 also lists 5:40 AM. Please save
  a new Bazi chart request using the correct time for Asia/Shanghai, female, born
  on 1992-04-18.
system_prompt: You are an astrology charting assistant helping a client verify stored
  birth details and submit chart requests.
execution_dag:
  nodes:
  - id: n1
    tool: astrology_charting.read_text
    params:
      text_id: text-birth-note-1992
    description: Read the uploaded birth note to verify the documented birth time.
    must_yield_keys:
    - id
    - content
    kind: lookup
    must_yield:
      id: text-birth-note-1992
      content: 'Birth Note

        Name: Lin

        Date of birth: 1992-04-18

        Time of birth: 5:40 AM

        Timezone/location: Asia/Shanghai

        Sex: female

        Filed from hospital birth note.'
  - id: n2
    tool: astrology_charting.search_word_exact
    params:
      text_id: text-birth-note-1992
      word: '5:40'
      case_sensitive: 'false'
      match_mode: whole_word
    description: Confirm that the exact time 5:40 appears in the uploaded birth note.
    must_yield_keys:
    - found
    - count
    kind: lookup
    must_yield:
      found: true
      count: 1
  - id: n3
    tool: astrology_charting.save_chart_request
    params:
      user_id: user-lin-1992
      birth_datetime: '1992-04-18T05:40:00+08:00'
      chart_type: bazi
    description: Save a new Bazi chart request using the verified birth details.
    must_yield_keys:
    - status
    - user_id
    - birth_datetime
    - chart_type
    kind: commit
    must_yield:
      status: created
      user_id: user-lin-1992
      birth_datetime: '1992-04-18T05:40:00+08:00'
      chart_type: bazi
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- astrology_charting.save_chart_request
