instruction: I get my electricity bill by email on the 1st of each month for the prior
  month's usage, and I'm pretty sure the April 2026 bill (around $130) still hasn't
  been logged in our Splitwise group. Please add any missing electricity expenses
  for this year. Use the Oak Street House household and its default Splitwise group.
  For each electricity bill email from 2026, confirm the usage month/year and total
  amount from the email or attached bill, check that Splitwise group to see whether
  that month's electricity bill is already there, and if it isn't, create a Splitwise
  expense for the full amount with the note "electricity bill for MM/YY" split equally
  among my roommates and me.
system_prompt: You are a household finance assistant helping a user reconcile emailed
  utility bills with shared expense records.
execution_dag:
  nodes:
  - id: n1
    tool: venmo_and_shared_expenses.search_gmail
    params:
      query: electricity bill 2026
      scope: messages
    description: Find 2026 electricity bill emails in the user's Gmail mirror.
    kind: lookup
  - id: n2
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-elec-jan
    description: Open the January 2026 electricity bill email to confirm bill details.
    kind: lookup
  - id: n3
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-elec-feb
    description: Open the February 2026 electricity bill email to confirm bill details.
    kind: lookup
  - id: n4
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-elec-mar
    description: Open the March 2026 electricity bill email to confirm bill details.
    kind: lookup
  - id: n5
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-elec-apr
    description: Open the April 2026 electricity bill email to confirm bill details.
    kind: lookup
  - id: n6
    tool: venmo_and_shared_expenses.list_roommates
    params: {}
    description: Retrieve the active roommates who should share the household electricity
      bills.
    kind: lookup
  - id: n7
    tool: venmo_and_shared_expenses.read_splitwise_expenses
    params: {}
    description: Read existing Splitwise expenses and identify the Oak Street House
      entries.
    kind: lookup
  - id: n8
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: January 2026
      document_month: January 2026
      bill_type: electricity
    description: Verify the January bill month extracted from the bill email/file.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: January 2026
  - id: n9
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: February 2026
      document_month: February 2026
      bill_type: electricity
    description: Verify the February bill month extracted from the bill email/file.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: February 2026
  - id: n10
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: March 2026
      document_month: March 2026
      bill_type: electricity
    description: Verify the March bill month extracted from the bill email/file.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: March 2026
  - id: n11
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_bill_month
      expected_month: April 2026
      document_month: April 2026
      bill_type: electricity
    description: Verify the April bill month extracted from the bill email/file.
    must_yield_keys:
    - verified
    - document_month
    kind: verify
    must_yield:
      verified: true
      document_month: April 2026
  - id: n12
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '118.40'
      household_size: '3'
    description: Confirm the January total can be split equally among 3 household
      members.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 39.47
  - id: n13
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '121.88'
      household_size: '3'
    description: Confirm the February total can be split equally among 3 household
      members.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 40.63
  - id: n14
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '127.16'
      household_size: '3'
    description: Confirm the March total can be split equally among 3 household members.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 42.39
  - id: n15
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '132.24'
      household_size: '3'
    description: Confirm the April total can be split equally among 3 household members.
    must_yield_keys:
    - verified
    - equal_share
    kind: verify
    must_yield:
      verified: true
      equal_share: 44.08
  - id: n16
    tool: venmo_and_shared_expenses.create_splitwise_expense
    params:
      group_id: grp-001
      description_text: electricity bill for 04/26
      total_amount: '132.24'
      date: '2026-05-01'
    description: Create the missing April 2026 electricity Splitwise expense in the
      Oak Street House group.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n4
  - - n1
    - n5
  - - n2
    - n8
  - - n3
    - n9
  - - n4
    - n10
  - - n5
    - n11
  - - n6
    - n12
  - - n6
    - n13
  - - n6
    - n14
  - - n6
    - n15
  - - n7
    - n16
  - - n5
    - n16
  - - n11
    - n16
  - - n15
    - n16
critical_actions:
- venmo_and_shared_expenses.create_splitwise_expense
