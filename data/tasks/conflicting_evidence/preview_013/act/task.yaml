instruction: 'Find Sofia Li''s account using her name and ZIP code 78260, verify which
  delivered order contains the digital camera, confirm the correct order number and
  item details, and then submit a return for that camera with a refund to the original
  payment method. Sofia thinks the order number may be #W8855135, but you should verify
  it in the order records before processing the return.'
system_prompt: You are a customer support assistant helping users manage retail orders
  and returns.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      name: Sofia Li
      zip: '78260'
    description: Find Sofia Li's retail customer account using her name and ZIP code.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_sofia_001
    description: Read Sofia's customer profile to confirm her default payment method
      for refunding to the original payment method.
    must_yield_keys:
    - user_id
    - default_payment_method_id
    kind: lookup
    must_yield:
      user_id: user_sofia_001
      default_payment_method_id: pm_sofia_001
  - id: n3
    tool: retail_orders.search_orders
    params:
      user_id: user_sofia_001
      query: digital camera
      status: delivered
    description: Search Sofia's delivered orders for the digital camera to verify
      which order contains it.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: retail_orders.get_order_details
    params:
      user_id: user_sofia_001
      order_id: W8855135
    description: Open the suspected order to confirm it is delivered and contains
      the digital camera item.
    must_yield_keys:
    - order_id
    - status
    - order_summary_document_id
    kind: lookup
    must_yield:
      order_id: W8855135
      status: delivered
      order_summary_document_id: doc_sofia_001
  - id: n5
    tool: retail_orders.get_product_details
    params:
      product_id: prod_cam_001
    description: Read the product details for the digital camera item to confirm the
      item identity.
    must_yield_keys:
    - product_id
    - title
    kind: lookup
    must_yield:
      product_id: prod_cam_001
      title: Lumix Point-and-Shoot Digital Camera
  - id: n6
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_sofia_001
      document_id: doc_sofia_001
    description: Verify the authoritative order summary document before submitting
      the return.
    must_yield_keys:
    - document_id
    - snapshot_status
    - verified
    kind: verify
    must_yield:
      document_id: doc_sofia_001
      snapshot_status: delivered
      verified: true
  - id: n7
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_sofia_001
      order_id: W8855135
      include_returns: 'true'
    description: Verify the order financials before creating the return.
    must_yield_keys:
    - order_id
    - paid_amount
    - refunded_amount
    kind: verify
    must_yield:
      order_id: W8855135
      paid_amount: 292.25
      refunded_amount: 0.0
  - id: n8
    tool: retail_orders.manage_returns_and_exchanges
    params:
      user_id: user_sofia_001
      order_id: W8855135
      item_ids: item_cam_001
      action: return
      reason: Customer requested return
    description: Submit the return for the delivered digital camera item.
    must_yield_keys:
    - order_id
    - status
    - type
    - refund_total
    kind: commit
    must_yield:
      order_id: W8855135
      status: initiated
      type: return
      refund_total: 249.99
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n3
    - n4
  - - n4
    - n5
  - - n4
    - n6
  - - n4
    - n7
  - - n2
    - n8
  - - n5
    - n8
  - - n6
    - n8
  - - n7
    - n8
critical_actions:
- retail_orders.manage_returns_and_exchanges
