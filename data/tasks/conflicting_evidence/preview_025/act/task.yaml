instruction: Can you check whether my housing religious observance exemption is currently
  approved on the StudentOne portal before I email my professor? My student ID is
  S10427, and I already received an approval notice in my inbox. Please verify both
  the housing portal record and the inbox notice, and tell me whether they match.
system_prompt: You are a campus portal assistant helping a student check exemption
  records and related university notices.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: housing
      student_id: S10427
    description: Read the student's housing application record to inspect the exemption
      request and current status.
    must_yield_keys:
    - application_status
    - exemption_request
    - applied_exemptions
    kind: lookup
    must_yield:
      application_status: pending
      exemption_request:
        exemption_type: religious_observance
        reason: Requested accommodation due to a religious observance conflict.
        request_status: approved
        submitted_at: '2026-04-12T09:30:00Z'
        last_updated_at: '2026-04-18T13:45:00Z'
      applied_exemptions:
      - religious_observance
  - id: n2
    tool: education_and_campus_portals.search_inbox_notices
    params:
      student_id: S10427
      portal: housing
      query: approved
    description: Search the student's housing inbox for an approval notice about the
      exemption.
    kind: lookup
  - id: n3
    tool: education_and_campus_portals.verify_exemptions_applied
    params:
      portal: housing
      student_id: S10427
    description: Verify that the approved housing exemption notice is reflected correctly
      in the housing portal record.
    must_yield_keys:
    - passed
    - mismatches
    - approved_notices
    - applied_exemptions
    - portal
    - student_id
    kind: verify
    must_yield:
      passed: false
      mismatches:
      - approved
      - Housing Religious Observance Exemption Approved
      approved_notices:
      - religious_observance
      - approved
      - Housing Religious Observance Exemption Approved
      applied_exemptions:
      - religious_observance
      portal: housing
      student_id: S10427
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
