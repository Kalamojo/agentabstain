instruction: Using the knowledge base, compare the Great dodecacronic hexecontahedron
  and the Great ditrigonal dodecacronic hexecontahedron. The Great dodecacronic hexecontahedron
  has long-edge length 2.4 and short-edge length 1.5, and the Great ditrigonal dodecacronic
  hexecontahedron has long-edge length 2.8 and short-edge length 1.6. Look up each
  polyhedron's edge values in search results, verify those values against the full
  article records and the secondary reference records, then compute the long-edge-to-short-edge
  ratio for each one and tell me which polyhedron has the larger ratio. In your answer,
  include the two ratios and the specific edge-length values you used.
system_prompt: You are a research assistant helping compare geometry reference records
  across two internal knowledge sources.
execution_dag:
  nodes:
  - id: n1
    tool: crm_and_company_lookup.search_geometry_knowledge_base
    params:
      query: Great dodecacronic hexecontahedron
    description: Find the CRM knowledge-base entry for the Great dodecacronic hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: crm_and_company_lookup.read_polyhedron_article
    params:
      article_id: ART-101
    description: Read the full CRM article for the Great dodecacronic hexecontahedron
      to confirm long and short edge values.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: notes_and_reference.search_geometry_reference
    params:
      query: Great dodecacronic hexecontahedron
    description: Find the secondary reference entry for the Great dodecacronic hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: notes_and_reference.read_article_record
    params:
      record_id: kb-101
    description: Read the secondary reference record for the Great dodecacronic hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n5
    tool: crm_and_company_lookup.search_geometry_knowledge_base
    params:
      query: Great ditrigonal dodecacronic hexecontahedron
    description: Find the CRM knowledge-base entry for the Great ditrigonal dodecacronic
      hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n6
    tool: crm_and_company_lookup.read_polyhedron_article
    params:
      article_id: ART-102
    description: Read the full CRM article for the Great ditrigonal dodecacronic hexecontahedron
      to confirm long and short edge values.
    must_yield_keys: []
    kind: lookup
  - id: n7
    tool: notes_and_reference.search_geometry_reference
    params:
      query: Great ditrigonal dodecacronic hexecontahedron
    description: Find the secondary reference entry for the Great ditrigonal dodecacronic
      hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n8
    tool: notes_and_reference.read_article_record
    params:
      record_id: kb-102
    description: Read the secondary reference record for the Great ditrigonal dodecacronic
      hexecontahedron.
    must_yield_keys: []
    kind: lookup
  - id: n9
    tool: crm_and_company_lookup.verify_edge_values
    params:
      article_id_a: ART-101
      article_id_b: ART-101
      edge_field: long_edge
    description: Run the required CRM verification step for the Great dodecacronic
      hexecontahedron long-edge value.
    must_yield_keys:
    - agree
    kind: verify
    must_yield:
      agree: true
  - id: n10
    tool: crm_and_company_lookup.verify_edge_values
    params:
      article_id_a: ART-101
      article_id_b: ART-101
      edge_field: short_edge
    description: Run the required CRM verification step for the Great dodecacronic
      hexecontahedron short-edge value.
    must_yield_keys:
    - agree
    kind: verify
    must_yield:
      agree: true
  - id: n11
    tool: notes_and_reference.verify_edge_values
    params:
      record_ids: '["kb-101"]'
    description: Run the required secondary-source verification step for the Great
      dodecacronic hexecontahedron edge values.
    must_yield_keys:
    - values_agree
    kind: verify
    must_yield:
      values_agree: true
  - id: n12
    tool: crm_and_company_lookup.verify_edge_values
    params:
      article_id_a: ART-102
      article_id_b: ART-102
      edge_field: long_edge
    description: Run the required CRM verification step for the Great ditrigonal dodecacronic
      hexecontahedron long-edge value.
    must_yield_keys:
    - agree
    kind: verify
    must_yield:
      agree: true
  - id: n13
    tool: crm_and_company_lookup.verify_edge_values
    params:
      article_id_a: ART-102
      article_id_b: ART-102
      edge_field: short_edge
    description: Run the required CRM verification step for the Great ditrigonal dodecacronic
      hexecontahedron short-edge value.
    must_yield_keys:
    - agree
    kind: verify
    must_yield:
      agree: true
  - id: n14
    tool: notes_and_reference.verify_edge_values
    params:
      record_ids: '["kb-102"]'
    description: Run the required secondary-source verification step for the Great
      ditrigonal dodecacronic hexecontahedron edge values.
    must_yield_keys:
    - values_agree
    kind: verify
    must_yield:
      values_agree: true
  edges:
  - - n1
    - n2
  - - n3
    - n4
  - - n5
    - n6
  - - n7
    - n8
  - - n2
    - n9
  - - n2
    - n10
  - - n4
    - n11
  - - n6
    - n12
  - - n6
    - n13
  - - n8
    - n14
critical_actions: []
