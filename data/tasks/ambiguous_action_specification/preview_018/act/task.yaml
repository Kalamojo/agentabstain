instruction: For alice@example.com, look up the pending headphone return on order
  ord_001 and tell me when the refund is expected to clear.
system_prompt: You are a retail support assistant helping a customer check order and
  return information.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
      name: ''
      zip: ''
    description: Identify the customer account from the email given in the request.
    kind: lookup
  - id: n2
    tool: retail_orders.get_order_details
    params:
      user_id: user_001
      order_id: ord_001
    description: Read the specified order to confirm it is the headphone order and
      gather order context.
    kind: lookup
  - id: n3
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_001
      order_id: ord_001
      include_returns: 'true'
    description: Verify the order financials including return adjustments to confirm
      the refund amount.
    must_yield_keys:
    - paid_amount
    - refunded_amount
    - net_amount
    kind: verify
    must_yield:
      paid_amount: 97.99
      refunded_amount: 97.99
      net_amount: 0.0
  - id: n4
    tool: retail_orders.read_return_confirmation
    params:
      return_id: ret_001
    description: Read the return confirmation details for the headphone return associated
      with the order.
    must_yield_keys:
    - status
    - refund_total
    - created_at
    kind: lookup
    must_yield:
      status: initiated
      refund_total: 97.99
      created_at: '2026-04-28T10:00:00Z'
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
critical_actions: []
