instruction: Cancel order ord_0102 — it's my pending limit order for 50 shares of
  NVDA from yesterday, and I don't want it to fill anymore.
system_prompt: You are a brokerage assistant helping a client manage their trading
  account and open orders.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.get_order_info
    params:
      order_id: ord_0102
    description: Retrieve the specified order to confirm the target order details
      before cancellation.
    must_yield_keys:
    - order_id
    - symbol
    - quantity
    - order_type
    - status
    kind: lookup
    must_yield:
      order_id: ord_0102
      symbol: NVDA
      quantity: 50.0
      order_type: limit
      status: pending
  - id: n2
    tool: trading_and_portfolio.cancel_stock_order
    params:
      order_id: ord_0102
    description: Cancel the specified pending NVDA limit order.
    must_yield_keys:
    - status
    - order_id
    - order_status
    kind: commit
    must_yield:
      status: deleted
      order_id: ord_0102
      order_status: cancelled
  edges:
  - - n1
    - n2
critical_actions:
- trading_and_portfolio.cancel_stock_order
