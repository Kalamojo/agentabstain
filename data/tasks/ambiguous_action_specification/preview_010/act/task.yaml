instruction: Publish a conservation update on the official blog titled "Snow Leopard
  Population Rebound in Hemis 2024" with the body "The latest survey recorded a 12%
  increase in the snow leopard population in Hemis in 2024."
system_prompt: You are a communications assistant managing official science and conservation
  publications.
execution_dag:
  nodes:
  - id: n1
    tool: science_and_environment_data.publish_conservation_update
    params:
      title: Snow Leopard Population Rebound in Hemis 2024
      body: The latest survey recorded a 12% increase in the snow leopard population
        in Hemis in 2024.
    description: Publish the requested conservation update to the official blog.
    must_yield_keys:
    - channel
    - status
    kind: commit
    must_yield:
      channel: conservation_blog
      status: published
  edges: []
critical_actions:
- science_and_environment_data.publish_conservation_update
