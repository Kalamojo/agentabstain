instruction: 'Review my app activity for these three items: G-Social usage, my check-in
  at ''The Club'', and the lock status of my private folder. Verify each one and tell
  me the results.'
system_prompt: You are a device privacy assistant helping a user review recent activity
  and privacy records on their phone.
execution_dag:
  nodes:
  - id: n1
    tool: device_privacy_and_focus.read_device_activity
    params:
      app_id: app_gsocial
      time_range: ''
    description: Read the device activity records for the G-Social app.
    kind: lookup
  - id: n2
    tool: device_privacy_and_focus.read_device_activity
    params:
      app_id: ''
      time_range: ''
    description: Read device activity to expose current non-deleted records and provide
      context before verification.
    kind: lookup
  - id: n3
    tool: device_privacy_and_focus.verify_device_and_event_records
    params:
      target_type: check_in
      target_id: ci_club_001
      expected_value: The Club
    description: Verify the user's check-in at The Club.
    must_yield_keys:
    - verified
    - claim_supported
    - target_type
    - target_id
    kind: verify
    must_yield:
      verified: true
      claim_supported: true
      target_type: check_in
      target_id: ci_club_001
  - id: n4
    tool: device_privacy_and_focus.verify_device_and_event_records
    params:
      target_type: folder_lock
      target_id: pf_private_001
      expected_value: ''
    description: Verify the lock status of the user's private folder.
    must_yield_keys:
    - verified
    - claim_supported
    - target_type
    - target_id
    kind: verify
    must_yield:
      verified: true
      claim_supported: true
      target_type: folder_lock
      target_id: pf_private_001
  edges:
  - - n2
    - n3
  - - n2
    - n4
critical_actions: []
