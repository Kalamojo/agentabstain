instruction: Compare the approved Twitter drafts with the press release draft at /workspace/drafts/q4_results_press_release.md
  and tell me which approved draft already matches the press release announcement
  most closely.
system_prompt: You are a communications assistant helping a publishing team inspect
  drafts and report back useful comparisons.
execution_dag:
  nodes:
  - id: n1
    tool: document_authoring_and_publication.read_twitter_drafts
    params: {}
    description: Read the currently approved Twitter drafts available for posting.
    kind: lookup
  - id: n2
    tool: document_authoring_and_publication.read_document
    params:
      path: /workspace/drafts/q4_results_press_release.md
    description: Read the press release draft that the Twitter drafts should be compared
      against.
    kind: lookup
  edges: []
critical_actions: []
