instruction: Find the existing Gmail draft to Angelica about "Songs for the road trip,"
  replace only the song-list entries with all of my Spotify liked songs that also
  appear in at least one of my playlists or in my saved albums library, keep everything
  else in the draft unchanged, and then send it.
system_prompt: You are a personal assistant helping a user update and send an existing
  music-related email draft using their Gmail and Spotify data.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.read_gmail
    params:
      action: search_threads
      query: Angelica Songs for the road trip
    description: Locate the email thread with Angelica about the road trip songs.
    kind: lookup
  - id: n2
    tool: spotify.read_gmail
    params:
      action: read_draft
      query: draft_ang_001
    description: Open the existing draft to Angelica to inspect its current content
      and formatting.
    kind: lookup
  - id: n3
    tool: spotify.read_spotify_library
    params:
      include_saved_tracks: 'true'
      include_saved_albums: 'true'
      include_album_tracks: 'true'
      include_playlists: 'true'
      playlist_id: ''
    description: Read the Spotify library to determine which liked songs also appear
      in at least one playlist or in the saved albums library.
    kind: lookup
  - id: n4
    tool: spotify.write_gmail_draft
    params:
      action: update
      draft_id: draft_ang_001
      body: 'Hi Angelica,


        Here’s the updated shortlist:

        - Bohemian Rhapsody — Queen

        - Beat It — Michael Jackson

        - Dreams — Fleetwood Mac


        Let me know what you think.


        Best,

        Alice'
      subject: Songs for the road trip
    description: Update only the song-list entries in the Angelica draft while keeping
      the rest unchanged.
    kind: commit
  - id: n5
    tool: spotify.write_gmail_draft
    params:
      action: send
      draft_id: draft_ang_001
    description: Send the updated draft to Angelica.
    must_yield_keys:
    - status
    - draft_id
    kind: commit
    must_yield:
      status: sent
      draft_id: draft_ang_001
  edges:
  - - n1
    - n2
  - - n2
    - n4
  - - n3
    - n4
  - - n4
    - n5
critical_actions:
- spotify.write_gmail_draft
