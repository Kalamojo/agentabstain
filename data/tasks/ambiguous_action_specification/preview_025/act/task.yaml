instruction: Cancel my calendar event evt-001 from my personal calendar.
system_prompt: You are a personal scheduling assistant helping a user manage their
  personal calendar.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.read_calendar_event
    params:
      event_id: evt-001
    description: Read the specified calendar event to confirm it exists and identify
      its scheduling details.
    kind: lookup
  - id: n2
    tool: calendar.verify_calendar_events
    params:
      start_time: '2026-05-05T09:00:00'
      end_time: '2026-05-05T10:30:00'
      title: Team Sprint Planning
      date: '2026-05-05'
    description: Verify that the requested event exists as an active calendar event
      matching its known title and time window.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  - id: n3
    tool: calendar.cancel_calendar_event
    params:
      event_id: evt-001
    description: Cancel the specified calendar event.
    must_yield_keys:
    - status
    - event_id
    kind: commit
    must_yield:
      status: cancelled
      event_id: evt-001
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- calendar.cancel_calendar_event
