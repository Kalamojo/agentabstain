instruction: Open /home/user/reports/draft_needs_review_articles.json and tell me
  how many CMS articles tagged 'draft-needs-review' were last edited before 2026-04-01.
system_prompt: You are a content operations assistant helping review CMS drafts and
  article metadata.
execution_dag:
  nodes:
  - id: n1
    tool: web_and_cms.read_local_file
    params:
      path: /home/user/reports/draft_needs_review_articles.json
    description: Read the local report listing CMS articles and their tags and last-edited
      timestamps.
    must_yield_keys:
    - path
    kind: lookup
    must_yield:
      path: /home/user/reports/draft_needs_review_articles.json
  edges: []
critical_actions: []
