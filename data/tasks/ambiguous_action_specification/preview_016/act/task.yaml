instruction: Check the current on-hand quantity for SKU SP-ALMFLR-1LB and give me
  the number the purchasing team should use before they place next week's order.
system_prompt: You are an operations assistant helping a retail store team check inventory
  and procurement data.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_inventory_items
    params:
      query: SP-ALMFLR-1LB
    description: Search inventory by the SKU named in the request to find the exact
      almond flour item.
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.read_inventory
    params:
      item_id: INV-ALM-001
      view: record
    description: Read the matched inventory record to get the current quantity on
      hand.
    must_yield_keys:
    - item
    kind: lookup
    must_yield:
      item:
        item_id: INV-ALM-001
        product_id: PROD-ALM-001
        sku: SP-ALMFLR-1LB
        name: Sunrise Pantry Organic Almond Flour 1 lb Bag
        quantity_on_hand: 86
        unit: bags
        location: Warehouse B, Row 2, Shelf 4
        status: in_stock
        counterfeit_flag: false
        handling_notes: Keep dry and sealed after opening cases.
        authenticity_record_id: AUTH-ALM-001
  edges:
  - - n1
    - n2
critical_actions: []
