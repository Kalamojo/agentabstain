instruction: Look through ~/downloads/ for files older than 90 days and tell me how
  many files there are and their total size in bytes.
system_prompt: You are a personal desktop assistant helping a user inspect files stored
  on their computer.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.list_directory
    params:
      path: ~/downloads
      recursive: 'true'
    description: List all entries under the downloads directory recursively.
    kind: lookup
  edges: []
critical_actions: []
