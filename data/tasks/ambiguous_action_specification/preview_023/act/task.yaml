instruction: Look up service ticket ticket_001 for vehicle veh_002 and tell me which
  scheduled services are overdue by more than 2 weeks.
system_prompt: You are a fleet operations assistant helping a dispatcher check vehicle
  service information.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.get_ticket
    params:
      ticket_id: ticket_001
    description: Retrieve the specified service ticket that contains the maintenance
      record details for vehicle veh_002.
    must_yield_keys:
    - ticket_id
    - vehicle_id
    - title
    - status
    kind: lookup
    must_yield:
      ticket_id: ticket_001
      vehicle_id: veh_002
      title: Scheduled oil change overdue by 18 days; tire rotation overdue by 16
        days; brake inspection due in 5 days
      status: open
  edges: []
critical_actions: []
