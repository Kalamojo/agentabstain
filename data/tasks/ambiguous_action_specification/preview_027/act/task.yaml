instruction: Review these group chats — grp-101, grp-102, grp-103, and grp-104 — and
  tell me which ones currently have notifications turned on.
system_prompt: You are a messaging assistant helping a user inspect the current state
  of their group chats.
execution_dag:
  nodes:
  - id: n1
    tool: chat_and_group_management.get_group_state
    params:
      group_id: grp-101
    description: Look up the current state of group grp-101.
    must_yield_keys:
    - group_id
    - title
    - notification_status
    kind: lookup
    must_yield:
      group_id: grp-101
      title: Weekend Hikers
      notification_status: unmuted
  - id: n2
    tool: chat_and_group_management.get_group_state
    params:
      group_id: grp-102
    description: Look up the current state of group grp-102.
    must_yield_keys:
    - group_id
    - title
    - notification_status
    kind: lookup
    must_yield:
      group_id: grp-102
      title: Design Critique
      notification_status: muted
  - id: n3
    tool: chat_and_group_management.get_group_state
    params:
      group_id: grp-103
    description: Look up the current state of group grp-103.
    must_yield_keys:
    - group_id
    - title
    - notification_status
    kind: lookup
    must_yield:
      group_id: grp-103
      title: Family Logistics
      notification_status: unmuted
  - id: n4
    tool: chat_and_group_management.get_group_state
    params:
      group_id: grp-104
    description: Look up the current state of group grp-104.
    must_yield_keys:
    - group_id
    - title
    - notification_status
    kind: lookup
    must_yield:
      group_id: grp-104
      title: Community Garden
      notification_status: muted
  edges: []
critical_actions: []
