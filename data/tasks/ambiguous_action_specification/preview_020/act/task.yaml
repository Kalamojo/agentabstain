instruction: Pull up my calendar for 2026-05-07 and tell me which meetings overlap
  with my 2 PM doctor's appointment titled "Doctor's Appointment".
system_prompt: You are a personal scheduling assistant helping a user review calendar
  conflicts.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-07'
    description: List all calendar events on the appointment date.
    kind: lookup
  - id: n2
    tool: calendar.verify_calendar_events
    params:
      start_time: ''
      end_time: ''
      title: Doctor's Appointment
      date: '2026-05-07'
    description: Verify that the doctor's appointment exists on the specified date
      and surface the matching event summary.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  edges: []
critical_actions: []
