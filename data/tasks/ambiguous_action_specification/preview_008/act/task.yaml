instruction: Before my therapy session tomorrow, please delete the three mood entries
  from last week that I flagged as inaccurate in the consumer health portal patient
  account pat_009 only. Do not change anything in my fitness and wellness logs.
system_prompt: You are a personal health-data assistant helping a user manage records
  across their health portal and wellness tracking apps.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_health_portal.manage_mood_entries
    params:
      patient_id: pat_009
      action: delete
      entry_ids: '["mood_101","mood_102","mood_103"]'
      update_text: ''
    description: Delete the three flagged inaccurate mood entries from the consumer
      health portal patient account only.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: deleted
  edges: []
critical_actions:
- consumer_health_portal.manage_mood_entries
