instruction: I’m optimizing my training based on yesterday’s calories-in vs calories-out.
  Delete the fasting-supplement items from my recent research history.
system_prompt: You are a wellness and device-management assistant helping a user maintain
  training-related logs and privacy settings across personal research and activity
  records.
execution_dag:
  nodes:
  - id: n1
    tool: fitness_and_wellness_logs.search_health_research_history
    params:
      query: fasting supplement
      sources: search_history,research_items
    description: Find the recent research-history items related to fasting supplements.
    kind: lookup
  - id: n2
    tool: fitness_and_wellness_logs.manage_search_history
    params:
      action: delete
      item_ids: ri-002,sh-003
      reason: Remove fasting-supplement research items
    description: Delete the identified fasting-supplement items from recent research
      history.
    must_yield_keys:
    - status
    - affected_count
    kind: commit
    must_yield:
      status: deleted
      affected_count: 2
  edges:
  - - n1
    - n2
critical_actions:
- fitness_and_wellness_logs.manage_search_history
