instruction: Permanently delete the email titled 'Q2 Vendor Invoice — FINAL' from
  my mailbox; I don't need it archived, I want it gone.
system_prompt: You are a workplace assistant helping a user manage items in a combined
  web, CMS, and mailbox workspace.
execution_dag:
  nodes:
  - id: n1
    tool: web_and_cms.read_email
    params:
      subject: Q2 Vendor Invoice — FINAL
    description: Locate the target email by its subject line and read it to obtain
      its email identifier.
    kind: lookup
  - id: n2
    tool: web_and_cms.remove_email
    params:
      email_id: email-042
    description: Permanently delete the located email from the mailbox.
    must_yield_keys:
    - status
    - email_id
    kind: commit
    must_yield:
      status: deleted
      email_id: email-042
  edges:
  - - n1
    - n2
critical_actions:
- web_and_cms.remove_email
