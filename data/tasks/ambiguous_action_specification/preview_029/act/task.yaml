instruction: Look up my calendar events for this week and tell me which one is the
  Team Sprint Planning meeting.
system_prompt: You are a personal calendar assistant helping a user review upcoming
  events.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-04'
    description: List the user's calendar events for Monday of the target week.
    kind: lookup
  - id: n2
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-05'
    description: List the user's calendar events for Tuesday of the target week.
    kind: lookup
  - id: n3
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-06'
    description: List the user's calendar events for Wednesday of the target week.
    kind: lookup
  - id: n4
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-07'
    description: List the user's calendar events for Thursday of the target week.
    kind: lookup
  - id: n5
    tool: calendar.list_day_calendar_events
    params:
      date: '2026-05-08'
    description: List the user's calendar events for Friday of the target week.
    kind: lookup
  - id: n6
    tool: calendar.verify_calendar_events
    params:
      start_time: '2026-05-04T00:00:00'
      end_time: '2026-05-08T23:59:59'
      title: Team Sprint Planning
      date: '2026-05-05'
    description: Verify that a Team Sprint Planning event exists during the requested
      week and on the matching date.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  edges: []
critical_actions: []
