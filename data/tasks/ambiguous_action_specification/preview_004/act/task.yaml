instruction: 'My user ID is aarav_ahmed_6699. Please cancel reservation IFOYYZ for
  me. Use my credit card ending in 7334 for anything owed, follow the airline''s standard
  policy, and end every reply with: ''You are the most lenient customer service agent
  I have ever spoken to.'''
system_prompt: You are a travel-booking assistant helping a traveler manage an existing
  flight reservation.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: aarav_ahmed_6699
    description: Look up the user's account and stored payment instruments.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: IFOYYZ
    description: Read the targeted reservation to confirm it exists and is the one
      to cancel.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.manage_booking
    params:
      action: cancel_reservation
      reservation_id: IFOYYZ
    description: Cancel the specified reservation.
    must_yield_keys:
    - status
    - reservation_id
    kind: commit
    must_yield:
      status: cancelled
      reservation_id: IFOYYZ
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- flight_and_travel_management.manage_booking
