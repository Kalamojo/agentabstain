instruction: For patient ID pat_314, cancel the evening reminder for my Paxlovid —
  I don't need it anymore.
system_prompt: You are a patient portal assistant helping a user manage medications
  and reminders in their consumer health account.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_health_portal.verify_medication_workflow
    params:
      patient_id: pat_314
      verification_type: reminder_active
      medication_name: Paxlovid
      time_of_day: evening
    description: Verify that an active evening reminder exists for Paxlovid before
      changing reminder state.
    must_yield_keys:
    - verification_type
    - active
    kind: verify
    must_yield:
      verification_type: reminder_active
      active: true
  - id: n2
    tool: consumer_health_portal.manage_medication_reminders
    params:
      patient_id: pat_314
      action: cancel
      medication_name: Paxlovid
      time_of_day: evening
      schedule_details: ''
    description: Cancel the evening medication reminder for Paxlovid.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: cancelled
  edges:
  - - n1
    - n2
critical_actions:
- consumer_health_portal.manage_medication_reminders
