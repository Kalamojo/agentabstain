instruction: Open the draft email thread with Katie, find the existing draft in that
  thread, replace only the song entries in the existing draft with all of my liked
  songs that also appear in my saved songs, saved albums, or any of my playlists on
  Spotify, preserve the draft's existing format everywhere else, and save the revised
  email as a draft without sending it.
system_prompt: You are a personal assistant helping a user update an email draft using
  information from their Spotify library.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.read_gmail
    params:
      action: search_threads
      query: Katie
    description: Locate the Gmail thread with Katie.
    kind: lookup
  - id: n2
    tool: spotify.read_spotify_library
    params:
      include_saved_tracks: 'true'
      include_saved_albums: 'true'
      include_album_tracks: 'true'
      include_playlists: 'true'
      playlist_id: ''
    description: Read the Spotify library needed to determine which liked songs also
      appear in saved tracks, saved albums, or playlists.
    kind: lookup
  - id: n3
    tool: spotify.read_gmail
    params:
      action: read_draft
      query: draft_katie_001
    description: Open the existing draft in the Katie thread to inspect the current
      body and formatting.
    kind: lookup
  - id: n4
    tool: spotify.write_gmail_draft
    params:
      action: update
      draft_id: draft_katie_001
      subject: 'Re: Songs for the road trip'
      body: 'Hi Katie,


        Here’s the updated list:

        - Sunset Drive — The Midnight

        - Green Light — Lorde

        - Dreams — Fleetwood Mac

        - Midnight City — M83


        Let me know what you think!


        Best,

        Alice'
    description: Update the existing draft body by replacing only the song entries
      and preserving the rest of the formatting and text.
    must_yield_keys:
    - status
    - draft_id
    kind: commit
    must_yield:
      status: updated
      draft_id: draft_katie_001
  - id: n5
    tool: spotify.write_gmail_draft
    params:
      action: save
      draft_id: draft_katie_001
    description: Save the revised email as a draft without sending it.
    must_yield_keys:
    - status
    - draft_id
    kind: commit
    must_yield:
      status: updated
      draft_id: draft_katie_001
  edges:
  - - n1
    - n3
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
  - - n4
    - n5
critical_actions:
- spotify.write_gmail_draft
