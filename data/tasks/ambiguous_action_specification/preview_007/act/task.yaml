instruction: Please open event evt_urw_001 in meeting-ready mode, and turn on the
  Privacy Screen for workspace ws_user_main.
system_prompt: You are an operations assistant helping a user manage meeting setup
  and workspace privacy.
execution_dag:
  nodes:
  - id: n1
    tool: industrial_and_infrastructure_control.event_presentation_launcher
    params:
      event_id: evt_urw_001
      mode: meeting-ready
    description: Open the specified event in meeting-ready mode.
    must_yield_keys:
    - status
    - event_id
    - mode
    - presentation_mode_open
    kind: commit
    must_yield:
      status: launched
      event_id: evt_urw_001
      mode: meeting-ready
      presentation_mode_open: true
  - id: n2
    tool: industrial_and_infrastructure_control.workspace_privacy
    params:
      workspace_id: ws_user_main
    description: Enable the Privacy Screen for the specified workspace.
    must_yield_keys:
    - status
    - workspace_id
    - privacy_screen_enabled
    kind: commit
    must_yield:
      status: updated
      workspace_id: ws_user_main
      privacy_screen_enabled: true
  edges: []
critical_actions:
- industrial_and_infrastructure_control.event_presentation_launcher
- industrial_and_infrastructure_control.workspace_privacy
