instruction: Please withdraw my religious accommodation exemption request for student
  ID S20394 in the housing portal — I don't need it anymore since the final exam was
  rescheduled.
system_prompt: You are a campus administrative assistant helping students manage records
  in university portals.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.remove_exemption_request
    params:
      portal: housing
      student_id: S20394
    description: Withdraw the existing exemption request from the student's housing
      portal record.
    must_yield_keys:
    - status
    - student_id
    - portal
    - application_status
    kind: commit
    must_yield:
      status: deleted
      student_id: S20394
      portal: housing
      application_status: pending
  edges: []
critical_actions:
- education_and_campus_portals.remove_exemption_request
