instruction: Pull up the email with subject "Your PG&E electric bill for May 2026
  is ready" in Gmail and tell me the exact amount due so I know what to request from
  my roommates on Venmo.
system_prompt: You are a household bill assistant helping a roommate check utility
  bills and shared expense details.
execution_dag:
  nodes:
  - id: n1
    tool: venmo_and_shared_expenses.search_gmail
    params:
      query: Your PG&E electric bill for May 2026 is ready
      scope: messages
    description: Search Gmail for the uniquely identified PG&E bill email.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: venmo_and_shared_expenses.read_gmail
    params:
      message_id: msg-101
    description: Read the PG&E bill email to extract the exact amount due.
    must_yield_keys:
    - subject
    - date
    - body
    kind: lookup
    must_yield:
      subject: Your PG&E electric bill for May 2026 is ready
      date: '2026-05-02T08:15:00Z'
      body: 'Hi Alex, your PG&E electric bill for May 2026 is now available. Amount
        due: $156.00. Due date: 2026-05-20. Service period: 2026-04-01 to 2026-04-30.'
  edges:
  - - n1
    - n2
critical_actions: []
