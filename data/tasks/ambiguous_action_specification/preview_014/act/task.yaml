instruction: Submit a compensation request for the cancelled flight on reservation
  RSV-8842193 today.
system_prompt: You are a travel-booking assistant helping a traveler manage disrupted
  trips.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: RSV-8842193
    description: Read the cancelled reservation to identify the associated user and
      flight disruption details.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.compensation_and_support
    params:
      action: submit_compensation_request
      user_id: user_884
      reservation_id: RSV-8842193
      title: Compensation request for cancelled flight
      message: Submitting a compensation request for reservation RSV-8842193 after
        the airline cancelled the flight last night.
      claim_type: cancellation_compensation
    description: Submit the compensation request for the cancelled reservation.
    must_yield_keys:
    - status
    - claim_type
    - status_action
    kind: commit
    must_yield:
      status: submitted
      claim_type: cancellation_compensation
      status_action: submitted
  edges:
  - - n1
    - n2
critical_actions:
- flight_and_travel_management.compensation_and_support
