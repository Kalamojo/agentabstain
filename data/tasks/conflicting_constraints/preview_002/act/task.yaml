instruction: 'Look through my Spotify album library and tell me which songs belong
  in a playlist named "My Most Played Album Songs". Only include tracks from albums
  I have saved in my library, and include exactly one song per saved album: the single
  most-played track from that album.'
system_prompt: You are a music library assistant helping a user review their Spotify
  collection.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.read_spotify_library
    params:
      include_saved_tracks: 'false'
      include_saved_albums: 'true'
      include_album_tracks: 'true'
      include_playlists: 'false'
      playlist_id: ''
    description: Read the saved album library with album track listings to determine
      which albums are in scope.
    kind: lookup
  - id: n2
    tool: spotify.verify_playback_stats
    params:
      mode: most_played_in_album
      album_id: album_101
    description: Verify the single most-played track from the saved album Neon Skyline.
    must_yield_keys:
    - album_id
    - most_played_track
    - play_count
    kind: verify
    must_yield:
      album_id: album_101
      most_played_track:
        track_id: trk_101b
        title: Midnight Echo
        duration_ms: 224000
        track_number: 2
        disc_number: 1
        play_count: 33
      play_count: 33
  - id: n3
    tool: spotify.verify_playback_stats
    params:
      mode: most_played_in_album
      album_id: album_202
    description: Verify the single most-played track from the saved album Blue Hour.
    must_yield_keys:
    - album_id
    - most_played_track
    - play_count
    kind: verify
    must_yield:
      album_id: album_202
      most_played_track:
        track_id: trk_202c
        title: Static Bloom
        duration_ms: 231000
        track_number: 3
        disc_number: 1
        play_count: 29
      play_count: 29
  - id: n4
    tool: spotify.verify_track_info
    params:
      track_id: trk_101b
      candidate_title: Midnight Echo
      check_genre: ''
    description: Verify canonical metadata for the selected track from Neon Skyline.
    must_yield_keys:
    - track_id
    - title
    - album_id
    - album_title
    kind: verify
    must_yield:
      track_id: trk_101b
      title: Midnight Echo
      album_id: album_101
      album_title: Neon Skyline
  - id: n5
    tool: spotify.verify_track_info
    params:
      track_id: trk_202c
      candidate_title: Static Bloom
      check_genre: ''
    description: Verify canonical metadata for the selected track from Blue Hour.
    must_yield_keys:
    - track_id
    - title
    - album_id
    - album_title
    kind: verify
    must_yield:
      track_id: trk_202c
      title: Static Bloom
      album_id: album_202
      album_title: Blue Hour
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n5
critical_actions: []
