instruction: Look through my Gmail and identify the thread subjects that are currently
  in the Inbox, already marked as read, and either starred or labeled Important. Only
  consider Gmail threads, and only include subjects from the Inbox rather than Sent,
  Archive, Trash, or Drafts.
system_prompt: You are an email assistant helping a user inspect and summarize Gmail
  records.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.search_gmail_records
    params:
      mailbox: inbox
      is_read: 'true'
      entity_type: thread
    description: Find Gmail threads in the Inbox that are already marked as read.
    kind: lookup
  edges: []
critical_actions: []
