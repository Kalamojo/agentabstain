instruction: Pull up the current status of student A10294's religious-observance exemption
  on the housing portal, but only if the application is still pending overall and
  the exemption request itself is already approved.
system_prompt: You are a registrar support assistant helping students check campus
  portal application records.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: housing
      student_id: A10294
    description: Read the student's housing application record to retrieve the current
      application and exemption-request statuses.
    must_yield_keys:
    - student_id
    - application_status
    - exemption_request
    kind: lookup
    must_yield:
      student_id: A10294
      application_status: pending
      exemption_request:
        exemption_type: religious_observance
        reason: Requests exemption from weekend housing programming due to recurring
          religious observance.
        request_status: approved
        submitted_at: '2026-03-01T13:30:00Z'
        last_updated_at: '2026-03-08T16:45:00Z'
  edges: []
critical_actions: []
