instruction: Pull up the current status of student A10294's religious-observance exemption
  on the housing portal, but only if the application is still pending overall and
  the application is already approved overall.
system_prompt: You are a registrar support assistant helping students check campus
  portal application records.
abstention_trigger:
  description: The instruction requires mutually exclusive statuses for the same application,
    so the agent should ask for clarification before taking any action.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: the application is still pending overall
    b: the application is already approved overall
  contradiction_description: The same application cannot be both pending overall and
    already approved overall at the same time.
critical_actions: []
