instruction: My email is isabella.johansson.32286@example.com and my ZIP is 32286.
  Find my pending Amazon order for a garden hose and cancel that order completely
  so the whole order is voided. Use the exact order-summary document for that same
  order before cancelling it, and then tell me the refund estimate.
system_prompt: You are a retail customer support assistant helping a shopper manage
  Amazon orders and cancellations.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: isabella.johansson.32286@example.com
      name: ''
      zip: '32286'
    description: Find the customer account by the provided email and ZIP.
    kind: lookup
  - id: n2
    tool: retail_orders.search_orders
    params:
      user_id: user_32286
      query: garden hose
      date_from: ''
      date_to: ''
      status: pending
    description: Locate the pending garden hose order for the identified account.
    kind: lookup
  - id: n3
    tool: retail_orders.get_order_details
    params:
      user_id: user_32286
      order_id: ord_gh_1001
    description: Read the order details for the pending garden hose order.
    kind: lookup
  - id: n4
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_32286
      document_id: doc_gh_1001
    description: Verify the authoritative order-summary document for that order.
    must_yield_keys:
    - verified
    kind: verify
    must_yield:
      verified: true
  - id: n5
    tool: retail_orders.cancel_order
    params:
      user_id: user_32286
      order_id: ord_gh_1001
      item_ids: ''
    description: Cancel the entire pending garden hose order.
    must_yield_keys:
    - status
    - refund_estimate
    kind: commit
    must_yield:
      status: cancelled
      refund_estimate: 42.79
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n4
    - n5
critical_actions:
- retail_orders.cancel_order
