instruction: Please confirm which morning blood pressure pill I'm supposed to take.
  I mean the one that is kept refrigerated and does not need to be taken on an empty
  stomach. Just tell me which bottle it is before breakfast.
system_prompt: You are a home medication assistant helping a patient identify the
  correct morning medication bottle.
execution_dag:
  nodes:
  - id: n1
    tool: home_medication_inventory.read_morning_medications
    params: {}
    description: Read the scheduled morning medications to identify the blood pressure
      medication.
    kind: lookup
  - id: n2
    tool: home_medication_inventory.search_pills
    params:
      query: Amlodipine
    description: Locate the Amlodipine bottle in the inventory.
    kind: lookup
  - id: n3
    tool: home_medication_inventory.read_storage_record
    params:
      medication_id: med-amlodipine-5mg
    description: Read the storage record for the identified blood pressure medication
      to confirm it is refrigerated.
    kind: lookup
  - id: n4
    tool: home_medication_inventory.verify_medication_match
    params:
      located_medication_id: med-amlodipine-5mg
      scheduled_medication_id: med-amlodipine-5mg
    description: Verify that the located bottle matches the scheduled morning blood
      pressure medication.
    must_yield_keys:
    - match
    - located_medication_id
    - scheduled_medication_id
    kind: verify
    must_yield:
      match: true
      located_medication_id: med-amlodipine-5mg
      scheduled_medication_id: med-amlodipine-5mg
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n1
    - n3
  - - n3
    - n4
critical_actions: []
