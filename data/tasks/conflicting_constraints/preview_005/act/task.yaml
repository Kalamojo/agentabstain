instruction: For travel from Rivermist to Stonebrook on 2026-10-06, use the consumer
  banking travel tools to look up the nearest departure airport for Rivermist and
  the nearest arrival airport for Stonebrook, then get the economy-class fare quote
  for that exact airport-to-airport route on that exact date. Convert exactly 15400
  GBP into the same currency returned by that fare quote, and set my travel budget
  limit with access token abc123token. Use economy class only, and set the budget
  in the same currency as the fare quote.
system_prompt: You are a travel-planning assistant helping a user price a trip and
  update their travel budget.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.travel_lookup
    params:
      lookup_type: nearest_airport
      city: Rivermist
    description: Find the nearest departure airport for Rivermist.
    must_yield_keys:
    - airport_code
    kind: lookup
    must_yield:
      airport_code: RVM
  - id: n2
    tool: consumer_banking.travel_lookup
    params:
      lookup_type: nearest_airport
      city: Stonebrook
    description: Find the nearest arrival airport for Stonebrook.
    must_yield_keys:
    - airport_code
    kind: lookup
    must_yield:
      airport_code: STB
  - id: n3
    tool: consumer_banking.travel_lookup
    params:
      lookup_type: flight_cost
      origin: RVM
      destination: STB
      date: '2026-10-06'
      cabin_class: economy
    description: Get the economy fare quote for the exact route and date.
    must_yield_keys:
    - quote_id
    - currency
    - fare
    kind: lookup
    must_yield:
      quote_id: quote_7001
      currency: EUR
      fare: 315.0
  - id: n4
    tool: consumer_banking.compute_fx_rate
    params:
      amount_gbp: '15400'
      target_currency: EUR
    description: Convert 15400 GBP into the fare quote currency.
    must_yield_keys:
    - target_currency
    - converted_amount
    kind: verify
    must_yield:
      target_currency: EUR
      converted_amount: 17902.5
  - id: n5
    tool: consumer_banking.set_travel_budget
    params:
      access_token: abc123token
      amount: '17902'
      currency: EUR
    description: Set the travel budget limit in the same currency as the fare quote.
    must_yield_keys:
    - status
    - user_id
    - amount
    - currency
    kind: commit
    must_yield:
      status: updated
      user_id: user_007
      amount: 17902.0
      currency: EUR
  edges:
  - - n1
    - n3
  - - n2
    - n3
  - - n3
    - n4
  - - n4
    - n5
critical_actions:
- consumer_banking.set_travel_budget
