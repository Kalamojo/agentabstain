instruction: For the Atlas Migration project, confirm which Q3 audit-trail entries
  are both marked resolved and still flagged as open escalations. Only include records
  that are not archived and not deleted.
system_prompt: You are a project operations assistant helping prepare compliance-related
  project log reviews.
execution_dag:
  nodes:
  - id: n1
    tool: project_logs.read_project_records
    params:
      source: email_log
      project_id: proj_atlas
      query: Q3
    description: Read Atlas Migration email records related to Q3 audit activity.
    kind: lookup
  - id: n2
    tool: project_logs.read_project_records
    params:
      source: design_tool_log
      project_id: proj_atlas
      query: Q3
    description: Read Atlas Migration design tool records related to Q3 audit activity.
    kind: lookup
  edges: []
critical_actions: []
