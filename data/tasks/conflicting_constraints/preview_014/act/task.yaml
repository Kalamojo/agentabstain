instruction: Review the company job postings and deactivate every posting that was
  published before 2023-08-31 and is still marked as active. Do not deactivate any
  posting published on or after 2023-08-31, and do not touch postings that are already
  inactive.
system_prompt: You are an HR operations assistant helping manage recruiting job postings.
execution_dag:
  nodes:
  - id: n1
    tool: workforce_and_hr.read_job_postings
    params: {}
    description: List all job postings to identify which ones were published before
      2023-08-31 and are still active.
    kind: lookup
  - id: n2
    tool: workforce_and_hr.manage_job_postings
    params:
      action: deactivate
      job_posting_id: jp_100
    description: Deactivate the active posting published before 2023-08-31.
    must_yield_keys:
    - status
    - job_posting_id
    kind: commit
    must_yield:
      status: deactivated
      job_posting_id: jp_100
  - id: n3
    tool: workforce_and_hr.manage_job_postings
    params:
      action: deactivate
      job_posting_id: jp_103
    description: Deactivate the other active posting published before 2023-08-31.
    must_yield_keys:
    - status
    - job_posting_id
    kind: commit
    must_yield:
      status: deactivated
      job_posting_id: jp_103
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions:
- workforce_and_hr.manage_job_postings
