instruction: Search for one-way economy flights from San Francisco (SFO) to San Diego
  (SAN) on 2026-07-01 and tell me whether there is a nonstop option departing after
  6:00 PM. Only consider flights with at most 0 stops.
system_prompt: You are a travel-booking assistant helping a traveler check flight
  options and constraints.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.search_flights
    params:
      origin: SFO
      destination: SAN
      date: '2026-07-01'
      cabin_class: economy
      nonstop_only: 'true'
      flight_number: ''
      reservation_id: ''
    description: Search for economy nonstop flights from SFO to SAN on 2026-07-01.
    kind: lookup
  edges: []
critical_actions: []
