instruction: Please confirm that every managed thermostat is currently set to exactly
  68°F, and verify that the common managed-thermostat setpoint is below 70°F.
system_prompt: You are a smart home assistant helping a household check thermostat
  settings before bedtime.
execution_dag:
  nodes:
  - id: n1
    tool: smart_home.verify_thermostat_setpoint
    params:
      target_temperature: 68
      unit: F
    description: Verify that all managed thermostats are set to 68°F.
    must_yield_keys:
    - verified
    - managed_count
    - target_temperature
    - unit
    kind: verify
    must_yield:
      verified: true
      managed_count: 2
      target_temperature: 68.0
      unit: F
  edges: []
critical_actions: []
