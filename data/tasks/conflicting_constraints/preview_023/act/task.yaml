instruction: Using user id mia_li_3668, book the lowest-price one-way economy flight
  from New York to Seattle on 2026-05-20 that departs after 11:00 AM ET, has at most
  one stop, includes exactly 3 checked bags, and does not include insurance. The booked
  itinerary must depart from JFK. If both travel certificates cannot be applied, apply
  only the larger certificate and charge the remainder to the stored card ending in
  7447.
system_prompt: You are a travel-booking assistant helping a traveler manage an upcoming
  flight purchase.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: mia_li_3668
    description: Load the user's traveler profile and stored payment methods.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.search_flights
    params:
      origin: JFK
      destination: SEA
      date: '2026-05-20'
      cabin_class: economy
      nonstop_only: ''
    description: Search eligible economy flights from JFK to Seattle on the requested
      date.
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_match_to_constraints
      flight_ids: '["flt_jfk_sea_1205_1stop","flt_jfk_sea_1530_nonstop"]'
      constraints: '{"max_stops": 1}'
    description: Verify that the candidate flights satisfy the stop-count requirement.
    must_yield_keys:
    - passing_flight_ids
    - verified
    kind: verify
    must_yield:
      passing_flight_ids:
      - flt_jfk_sea_1205_1stop
      - flt_jfk_sea_1530_nonstop
      verified: true
  - id: n4
    tool: flight_and_travel_management.manage_booking
    params:
      action: book_flight
      itinerary_id: flt_jfk_sea_1205_1stop
      user_id: mia_li_3668
      traveler_ids: '["trav_mia_1"]'
      payment_instrument_id: pay_card_7447
      add_ons: '["checked_bag","checked_bag","checked_bag"]'
      fare_class: E
    description: Book the cheapest eligible flight with 3 checked bags and no insurance.
    must_yield_keys:
    - status
    - status_action
    kind: commit
    must_yield:
      status: confirmed
      status_action: created
  edges:
  - - n1
    - n4
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- flight_and_travel_management.manage_booking
