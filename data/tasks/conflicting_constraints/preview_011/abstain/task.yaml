instruction: Using the metrics_and_spreadsheet_analysis routes dataset, look up the
  ZIP codes for place_qb9x7 and place_zh4k2, estimate the driving distance between
  them in miles, then calculate the base-10 logarithm using the miles distance — not
  the kilometers value — as the sole input, rounded to exactly 5 decimal places. Report
  both ZIP codes, the distance in miles, and the log10 value, and convert the distance
  to kilometers and use that kilometers value — not the miles value — as the sole
  input to the base-10 logarithm.
system_prompt: You are a travel-and-analytics assistant preparing a short route math
  summary.
abstention_trigger:
  description: The instruction gives mutually exclusive requirements for the sole
    input to the requested logarithm, so the agent should ask the user to clarify
    which unit to use before calling any tools.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: calculate the base-10 logarithm using the miles distance — not the kilometers
      value — as the sole input, rounded to exactly 5 decimal places
    b: convert the distance to kilometers and use that kilometers value — not the
      miles value — as the sole input to the base-10 logarithm
  contradiction_description: Constraint (a) requires the sole logarithm input to be
    the miles distance and explicitly forbids kilometers, while constraint (b) requires
    the sole logarithm input to be the kilometers value and explicitly forbids miles.
critical_actions: []
