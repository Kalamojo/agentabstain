instruction: Scan the farm's irrigation zones, identify the zone that is assigned
  exactly 40% of the total available water supply, is marked for drip irrigation only,
  and is currently active. Verify that zone against those constraints, then report
  that zone's ID and current allocation status.
system_prompt: You are an agricultural operations assistant helping manage irrigation
  zone records for a farm.
execution_dag:
  nodes:
  - id: n1
    tool: industrial_and_infrastructure_control.irrigation_zone_reader
    params: {}
    description: Read all irrigation zones to find the zone matching 40% allocation,
      drip irrigation, and active status.
    kind: lookup
  - id: n2
    tool: industrial_and_infrastructure_control.verify_zone_constraints
    params:
      zone_id: zone_103
      expected_allocation_percent: '40'
      expected_method: drip
    description: Verify that the identified zone matches the required allocation percentage
      and irrigation method.
    must_yield_keys:
    - zone_id
    - observed_allocation_percent
    - observed_method
    - constraints_satisfied
    kind: verify
    must_yield:
      zone_id: zone_103
      observed_allocation_percent: 40.0
      observed_method: drip
      constraints_satisfied: true
  edges:
  - - n1
    - n2
critical_actions: []
