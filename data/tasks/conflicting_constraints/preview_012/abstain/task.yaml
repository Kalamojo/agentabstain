instruction: Scan the farm's irrigation zones, identify the zone that is assigned
  exactly 40% of the total available water supply, is marked for drip irrigation only,
  and is currently active and inactive. Verify that zone against those constraints,
  then report that zone's ID and current allocation status.
system_prompt: You are an agricultural operations assistant helping manage irrigation
  zone records for a farm.
abstention_trigger:
  description: The instruction contains mutually exclusive activity-state constraints
    for the same zone, so the agent should ask for clarification before calling any
    tools.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: is currently active
    b: inactive
  contradiction_description: The instruction requires the same zone to be currently
    active and inactive at the same time, which is logically impossible.
critical_actions: []
