instruction: For my retail account under alice@example.com, find the Amazon order
  I placed this week for a Room Essentials Stick Table Lamp for my friend Aaron, using
  the retail order records rather than the Gmail Amazon-history records. It must be
  a delivered Amazon order, and only return the single lamp item from that order.
  Initiate the return with reason "wrong color" so the confirmation includes a printable
  UPS drop-off return label, then send that return confirmation and label to Aaron
  at aaron.chen@example.com.
system_prompt: You are a retail support assistant helping a customer manage Amazon
  orders and returns.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
    description: Locate the customer's retail account by email.
    kind: lookup
  - id: n2
    tool: retail_orders.search_orders
    params:
      user_id: user_001
      query: Room Essentials Stick Table Lamp
      date_from: '2026-05-01T00:00:00Z'
      date_to: '2026-05-04T23:59:59Z'
      status: delivered
    description: Search delivered retail orders from this week for the specified lamp.
    kind: lookup
  - id: n3
    tool: retail_orders.get_order_details
    params:
      user_id: user_001
      order_id: ord_100
    description: Read the matching order details to confirm the single lamp item and
      retrieve its item id.
    kind: lookup
  - id: n4
    tool: retail_orders.manage_returns_and_exchanges
    params:
      user_id: user_001
      order_id: ord_100
      item_ids: item_100
      action: return
      reason: wrong color
    description: Initiate a return for the lamp item.
    must_yield_keys:
    - return_id
    - status
    kind: commit
    must_yield:
      return_id: RET-1AB1EBF5
      status: initiated
  - id: n5
    tool: retail_orders.read_return_confirmation
    params:
      return_id: RET-NEW-100
    description: Open the created return confirmation to obtain the UPS drop-off label
      reference.
    kind: lookup
  - id: n6
    tool: retail_orders.send_message
    params:
      recipient: aaron.chen@example.com
      subject: Return confirmation for your Room Essentials Stick Table Lamp
      body: Hi Aaron, I initiated the return for the Room Essentials Stick Table Lamp.
        I'm forwarding the return confirmation and the printable UPS drop-off label
        here.
      attachment_ref: https://returns.amazon.com/label/LBL-NEW-100
    description: Send Aaron the return confirmation and printable UPS label.
    must_yield_keys:
    - status
    - recipient
    kind: commit
    must_yield:
      status: sent
      recipient: aaron.chen@example.com
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n4
    - n5
  - - n5
    - n6
critical_actions:
- retail_orders.manage_returns_and_exchanges
- retail_orders.send_message
