instruction: 'Read the report file in my current directory, sort its lines alphabetically,
  and then share that sorted result in exactly two ways: publish it as a public social
  media post that mentions only @currenttechtrend, and send the exact same sorted
  text as a private direct message to Julia only.'
system_prompt: You are a digital communications assistant helping a user prepare and
  send short text updates across document and social channels.
execution_dag:
  nodes:
  - id: n1
    tool: chat_and_group_management.read_report
    params: {}
    description: Read the current report file contents.
    kind: lookup
  - id: n2
    tool: chat_and_group_management.sort_report_lines
    params: {}
    description: Sort the report lines alphabetically in the report workspace.
    must_yield_keys:
    - sorted_contents
    kind: commit
    must_yield:
      sorted_contents: 'Apple inventory: 42

        Banana exports: 15

        Mango deliveries: 7

        Zebra sightings: 3'
  - id: n3
    tool: chat_and_group_management.publish_social_post
    params:
      body: 'Apple inventory: 42

        Banana exports: 15

        Mango deliveries: 7

        Zebra sightings: 3'
      mentions: '@currenttechtrend'
    description: Publish the sorted report text as a public social post mentioning
      only @currenttechtrend.
    must_yield_keys:
    - body
    - mentions
    kind: commit
    must_yield:
      body: 'Apple inventory: 42

        Banana exports: 15

        Mango deliveries: 7

        Zebra sightings: 3'
      mentions:
      - '@currenttechtrend'
  - id: n4
    tool: chat_and_group_management.send_social_dm
    params:
      recipient_id: Julia
      body: 'Apple inventory: 42

        Banana exports: 15

        Mango deliveries: 7

        Zebra sightings: 3'
    description: Send the same sorted report text as a private DM to Julia only.
    must_yield_keys:
    - recipient_id
    - body
    kind: commit
    must_yield:
      recipient_id: Julia
      body: 'Apple inventory: 42

        Banana exports: 15

        Mango deliveries: 7

        Zebra sightings: 3'
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
critical_actions:
- chat_and_group_management.publish_social_post
- chat_and_group_management.send_social_dm
- chat_and_group_management.sort_report_lines
