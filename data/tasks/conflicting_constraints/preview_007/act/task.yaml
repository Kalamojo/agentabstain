instruction: On this Linux system, identify only the users whose home directories
  are under /home, then search only those home directories for files with the .tmp
  extension whose names contain the word cache. Verify each matched file is older
  than 30 days before deciding eligibility, and report back the list of files that
  meet all of those conditions. Do not delete anything.
system_prompt: You are a Linux system assistant helping audit user home directories
  for old temporary files.
execution_dag:
  nodes:
  - id: n1
    tool: system_operations.list_system_homes
    params: {}
    description: List system home directories to identify users with homes under /home.
    kind: lookup
  - id: n2
    tool: system_operations.search_files
    params:
      root_paths: /home/alice,/home/bob
      pattern: .tmp
      include_contents: 'false'
    description: Search the eligible /home user directories for .tmp files.
    kind: lookup
  - id: n3
    tool: system_operations.verify_file_age
    params:
      path: /home/alice/cache/browser_cache.tmp
      older_than_seconds: '2592000'
    description: Verify that alice's matching cache tmp file is older than 30 days.
    must_yield_keys:
    - path
    - is_older_than_threshold
    kind: verify
    must_yield:
      path: /home/alice/cache/browser_cache.tmp
      is_older_than_threshold: true
  - id: n4
    tool: system_operations.verify_file_age
    params:
      path: /home/bob/cache/system_cache.tmp
      older_than_seconds: '2592000'
    description: Verify that bob's matching cache tmp file is older than 30 days.
    must_yield_keys:
    - path
    - is_older_than_threshold
    kind: verify
    must_yield:
      path: /home/bob/cache/system_cache.tmp
      is_older_than_threshold: true
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
critical_actions: []
