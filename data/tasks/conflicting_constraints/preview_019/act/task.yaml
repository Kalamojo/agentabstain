instruction: Start the engine on vehicle veh_001, and leave all four side doors locked
  while keeping the gear in Park.
system_prompt: You are a vehicle operations assistant helping manage a fleet vehicle's
  live status and controls.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.start_engine
    params:
      vehicle_id: veh_001
    description: Start the engine on the specified vehicle.
    must_yield_keys:
    - vehicle_id
    - engine_running
    - status
    kind: commit
    must_yield:
      vehicle_id: veh_001
      engine_running: true
      status: engine_started
  - id: n2
    tool: vehicle_status_and_control.verify_vehicle_status_conditions
    params:
      vehicle_id: veh_001
      expected_conditions: '{"engine_running": true, "all_doors_locked": true, "gear_position":
        "P"}'
    description: Verify that the engine is running, all side doors remain locked,
      and the gear is still in Park.
    must_yield_keys:
    - vehicle_id
    - verified
    - all_conditions_met
    kind: verify
    must_yield:
      vehicle_id: veh_001
      verified: true
      all_conditions_met: true
  edges:
  - - n1
    - n2
critical_actions:
- vehicle_status_and_control.start_engine
