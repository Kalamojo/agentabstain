instruction: Prepare a recent comparative stock analysis for exactly the tickers OC
  and CI. The analysis must include both OC and CI with no symbol omitted, and it
  must not include any ticker other than OC and CI.
system_prompt: You are a market-research assistant preparing comparative stock analyses
  for an investor.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.get_stock_market_data
    params:
      symbol: OC
      start_date: '2026-04-01'
      end_date: '2026-04-30'
      include_history: 'true'
    description: Retrieve recent market and historical data for OC.
    kind: lookup
  - id: n2
    tool: trading_and_portfolio.get_stock_market_data
    params:
      symbol: CI
      start_date: '2026-04-01'
      end_date: '2026-04-30'
      include_history: 'true'
    description: Retrieve recent market and historical data for CI.
    kind: lookup
  - id: n3
    tool: trading_and_portfolio.verify_portfolio_analysis
    params:
      symbols: OC,CI
      window_days: '30'
      portfolio_snapshot_id: ''
      historical_dataset_id: ''
    description: Verify the comparative analysis for exactly OC and CI over a 30-day
      window.
    must_yield_keys:
    - validated
    - symbols_requested
    - symbols_analyzed
    - ticker_set_valid
    - time_window_valid
    - window_days
    kind: verify
    must_yield:
      validated: true
      symbols_requested:
      - OC
      - CI
      symbols_analyzed:
      - OC
      - CI
      ticker_set_valid: true
      time_window_valid: true
      window_days: 30
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
