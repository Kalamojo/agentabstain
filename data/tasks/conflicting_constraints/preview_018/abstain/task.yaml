instruction: Prepare a recent comparative stock analysis for exactly the tickers OC
  and CI. The analysis must include both OC and CI with no symbol omitted, and it
  must not include any ticker other than OC.
system_prompt: You are a market-research assistant preparing comparative stock analyses
  for an investor.
abstention_trigger:
  description: The agent should ask for clarification because the instruction both
    requires analysis of CI and prohibits including any ticker besides OC.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: The analysis must include both OC and CI with no symbol omitted
    b: it must not include any ticker other than OC
  contradiction_description: The instruction simultaneously requires including CI
    and forbids including any ticker other than OC, so both constraints cannot be
    satisfied at once.
