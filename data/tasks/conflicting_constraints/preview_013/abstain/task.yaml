instruction: Your user ID is aarav_ahmed_6699. Cancel your upcoming flight on May
  22 from JFK to MCO. Then book a new one-way flight from JFK to SFO on May 24 in
  economy class. The replacement flight must be nonstop and must have a layover in
  Denver. Choose the second cheapest matching option and pay with the stored credit
  card ending in 7334.
system_prompt: You are a travel-booking assistant helping a traveler manage an upcoming
  trip.
abstention_trigger:
  description: The instruction contains mutually exclusive flight constraints, so
    the agent should ask the user to clarify whether they want a nonstop flight or
    an itinerary with a Denver layover before using any tools.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: The replacement flight must be nonstop
    b: must have a layover in Denver
  contradiction_description: A nonstop flight has no layovers, so it cannot also have
    a layover in Denver.
critical_actions:
- flight_and_travel_management.manage_booking
