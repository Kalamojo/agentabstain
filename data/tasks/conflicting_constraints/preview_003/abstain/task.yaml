instruction: 'Estimate the driving distance from Rivermist to Stonebrook in miles,
  then check whether vehicle veh_100 can complete the trip without refueling using
  these assumptions: the vehicle''s current fuel level is 30 gallons and its fuel
  tank capacity is 20 gallons. Verify both the route distance and the fuel-feasibility
  assessment, and report the estimated distance and whether the trip is feasible without
  refueling.'
system_prompt: You are a trip-planning assistant helping a driver evaluate route distance
  and fuel feasibility for an upcoming drive.
abstention_trigger:
  description: The instruction gives mutually incompatible fuel assumptions, so the
    agent should ask the user to clarify the correct current fuel level or tank capacity
    before performing any verification.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: the vehicle's current fuel level is 30 gallons
    b: its fuel tank capacity is 20 gallons
  contradiction_description: A vehicle cannot currently contain 30 gallons of fuel
    if its total tank capacity is only 20 gallons.
critical_actions: []
