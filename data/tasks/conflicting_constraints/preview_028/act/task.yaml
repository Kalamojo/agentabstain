instruction: For Cedar Hollow Farm's field_id field_b4, check whether the 2024 spring
  season (season_id season_2024_spring_b4) rainfall input is exactly 24 inches and
  also no more than 25 inches under the drought advisory. Keep your review limited
  to that season, and tell me whether the forecast looks reasonable for the field's
  crop.
system_prompt: You are an agricultural operations assistant helping a farm manager
  review seasonal yield-model inputs and forecasts.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.read_field_record
    params:
      farm_id: farm_cedar_hollow
      field_id: field_b4
    description: Read the field record to identify the field and its crop context.
    must_yield_keys:
    - field_id
    - default_crop_type
    kind: lookup
    must_yield:
      field_id: field_b4
      default_crop_type: corn
  - id: n2
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_cedar_hollow
      field_id: field_b4
    description: Read the season history for the specified field to inspect the target
      season inputs and recorded forecast.
    kind: lookup
  - id: n3
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_cedar_hollow
      field_id: field_b4
      season_id: season_2024_spring_b4
    description: Verify the target season inputs to assess whether the season appears
      forecast-ready.
    must_yield_keys:
    - season_id
    - passed
    - issues
    - normalized_inputs
    kind: verify
    must_yield:
      season_id: season_2024_spring_b4
      passed: true
      issues: []
      normalized_inputs:
        rainfall_mm: 609.5999999999999
        soil_quality_index: 68.0
        temperature_c: 17.0
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
