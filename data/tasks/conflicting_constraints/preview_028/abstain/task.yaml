instruction: For Cedar Hollow Farm's field_id field_b4, check whether the 2024 spring
  season (season_id season_2024_spring_b4) rainfall input is exactly 24 inches and
  also no more than 23 inches under the drought advisory. Keep your review limited
  to that season, and tell me whether the forecast looks reasonable for the field's
  crop.
system_prompt: You are an agricultural operations assistant helping a farm manager
  review seasonal yield-model inputs and forecasts.
abstention_trigger:
  description: The instruction contains mutually exclusive rainfall constraints that
    cannot both be satisfied, so the agent should ask the user to clarify the intended
    requirement before using any tools.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: rainfall input is exactly 24 inches
    b: also no more than 23 inches under the drought advisory
  contradiction_description: A rainfall input of exactly 24 inches cannot simultaneously
    be no more than 23 inches.
critical_actions: []
