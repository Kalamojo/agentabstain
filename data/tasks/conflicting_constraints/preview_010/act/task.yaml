instruction: Using my Flight & Travel account for Jordan Lee in ZIP code 94105, book
  the one-way first-class nonstop flight from SFO to ORD on 2026-11-15 that costs
  under $5000, using my stored traveler profile and the saved credit card ending in
  4165. After the booking is confirmed, create a high-priority trading support ticket
  titled "Flight Booking Confirmation" linked to the new booking, and include the
  reservation details plus the exact note "Booking completed successfully."
system_prompt: You are an assistant helping a user coordinate travel bookings and
  related support tasks across connected travel and brokerage accounts.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      zip_code: '94105'
    description: Look up the user's travel account, traveler profile, and saved payment
      methods.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.search_flights
    params:
      origin: SFO
      destination: ORD
      date: '2026-11-15'
      cabin_class: first
      nonstop_only: 'true'
    description: Find flights matching the requested route, date, cabin, and nonstop
      constraint.
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_traveler_profile
      traveler_id: trav_100
    description: Verify the stored traveler profile before booking.
    must_yield_keys:
    - verified
    - traveler_id
    - full_name
    kind: verify
    must_yield:
      verified: true
      traveler_id: trav_100
      full_name: Jordan Lee
  - id: n4
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_match_to_constraints
      flight_ids: '["flt_sfo_ord_001"]'
      constraints: '{"nonstop_only": true, "max_stops": 0}'
    description: Verify the selected flight satisfies the nonstop constraint.
    must_yield_keys:
    - verified
    - passing_flight_ids
    - failing_flight_ids
    kind: verify
    must_yield:
      verified: true
      passing_flight_ids:
      - flt_sfo_ord_001
      failing_flight_ids: []
  - id: n5
    tool: flight_and_travel_management.manage_booking
    params:
      action: book_flight
      itinerary_id: flt_sfo_ord_001
      user_id: user_100
      traveler_ids: '["trav_100"]'
      payment_instrument_id: pay_100
    description: Book the matching flight using the stored traveler profile and saved
      card ending in 4165.
    must_yield_keys:
    - reservation_id
    - status
    - price_total
    - payment_instrument_id
    kind: commit
    must_yield:
      reservation_id: res_1bed33c4
      status: confirmed
      price_total: 1299.0
      payment_instrument_id: pay_100
  - id: n6
    tool: trading_and_portfolio.manage_support_tickets
    params:
      action: create
      priority: high
      title: Flight Booking Confirmation
      message: 'Reservation details: SFO to ORD on 2026-11-15, first class, flight
        flt_sfo_ord_001 confirmed. Booking completed successfully.'
      linked_booking_id: res_placeholder
    description: Create the requested high-priority trading support ticket linked
      to the booking.
    must_yield_keys:
    - status
    - ticket_id
    kind: commit
    must_yield:
      status: created
      ticket_id: tkt_0001
  edges:
  - - n1
    - n3
  - - n1
    - n5
  - - n2
    - n4
  - - n3
    - n5
  - - n4
    - n5
  - - n5
    - n6
critical_actions:
- flight_and_travel_management.manage_booking
- trading_and_portfolio.manage_support_tickets
