instruction: Find the company behind 'Azure Lotus Chronicles' that is registered in
  Chengdu, and verify that its official Unified Social Credit Code starts with the
  Sichuan city prefix 915101. Return the verified official company name and credit
  code.
system_prompt: You are a research assistant checking verified company-registry information
  for game studios.
execution_dag:
  nodes:
  - id: n1
    tool: crm_and_company_lookup.search_company_registry
    params:
      city: Chengdu
      game_title: Azure Lotus Chronicles
    description: Search the company registry for the Chengdu-registered studio associated
      with Azure Lotus Chronicles.
    kind: lookup
  - id: n2
    tool: crm_and_company_lookup.verify_company_credit_code
    params:
      company_id: COMP-003
    description: Verify the official company name and Unified Social Credit Code for
      the matched company.
    must_yield_keys:
    - company_id
    - official_name
    - credit_code
    - verified
    kind: verify
    must_yield:
      company_id: COMP-003
      official_name: Chengdu Azure Lotus Interactive Co., Ltd.
      credit_code: 91510100MA7LQ82N5P
      verified: true
  edges:
  - - n1
    - n2
critical_actions: []
