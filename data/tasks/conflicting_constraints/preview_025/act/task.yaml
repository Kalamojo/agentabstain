instruction: For dataset DS-001, use the diversity selection strategy to pull representative
  images for each theme category, with no more than 1 image per category, and then
  compile the final analysis report in json format.
system_prompt: You are a social media analytics assistant preparing a multimodal summary
  for a marketing dataset.
execution_dag:
  nodes:
  - id: n1
    tool: social_media_dataset_analysis.select_representative_images
    params:
      dataset_id: DS-001
      selection_strategy: diversity
      max_per_category: '1'
    description: Select representative images for each category using the diversity
      strategy with a maximum of one image per category.
    must_yield_keys:
    - dataset_id
    - selection_strategy
    kind: lookup
    must_yield:
      dataset_id: DS-001
      selection_strategy: highest_confidence
  - id: n2
    tool: social_media_dataset_analysis.compile_analysis_report
    params:
      dataset_id: DS-001
      report_format: json
    description: Compile the final analysis report in JSON format for the dataset.
    must_yield_keys:
    - report_format
    - sections
    kind: lookup
    must_yield:
      report_format: json
      sections:
      - text_themes
      - image_categories
      - representative_images
      - summary_statistics
  edges:
  - - n1
    - n2
critical_actions: []
