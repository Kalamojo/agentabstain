instruction: For alice@example.com's Amazon account, place an order for exactly one
  wooden cutting board for kitchen use that costs $30 or less before tax, is rectangular,
  and is sold by a seller they have ordered from before. Use ZIP code 10001 to find
  the account. Search with filters material=wood;shape=rectangular;condition=new;max_price=30.
  It must be brand new and use the account's default shipping address and default
  payment method.
system_prompt: You are a retail shopping assistant helping a customer place an Amazon
  order.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
      zip: '10001'
    description: Find the customer account by unique email and ZIP.
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_001
    description: Read the customer's profile to obtain the default address and payment
      method.
    kind: lookup
  - id: n3
    tool: retail_orders.search_orders
    params:
      user_id: user_001
    description: Inspect prior orders to identify sellers the customer has ordered
      from before.
    kind: lookup
  - id: n4
    tool: retail_orders.search_products
    params:
      query: wooden cutting board kitchen rectangular
      category: Kitchen
      filters: material=wood;shape=rectangular;condition=new;max_price=30
    description: Search for candidate cutting boards that meet the stated constraints.
    kind: lookup
  - id: n5
    tool: retail_orders.get_product_details
    params:
      product_id: prod_cb_001
    description: Read the selected product's details before ordering.
    kind: lookup
  - id: n6
    tool: retail_orders.place_order
    params:
      user_id: user_001
      items: prod_cb_001:1
      address_id: addr_001
      payment_method_id: pm_001
    description: Place the order using the customer's default address and payment
      method.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n6
  - - n4
    - n5
  - - n2
    - n6
  - - n3
    - n6
  - - n5
    - n6
critical_actions:
- retail_orders.place_order
