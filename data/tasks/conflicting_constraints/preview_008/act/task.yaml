instruction: For vehicle veh_100, check the current tire pressure on all four tires
  and verify whether any tire is below 30.0 psi. If any tire is below 30.0 psi, identify
  the nearest tire shop that is within 5 miles of the vehicle and located at 456 Oakwood
  Avenue, Rivermist, 83214, then report the tire-pressure findings and the matching
  shop details to me. If no tire is below 30.0 psi, report the tire-pressure findings
  and say that no shop lookup result is needed.
system_prompt: You are a vehicle support assistant helping a driver assess tire pressure
  and find a suitable nearby tire shop when needed.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.read_tire_pressure
    params:
      vehicle_id: veh_100
    description: Read the current tire pressure measurements for all four tires on
      vehicle veh_100.
    must_yield_keys:
    - vehicle_id
    - tire_pressures_psi
    - recommended_tire_pressure_psi
    kind: lookup
    must_yield:
      vehicle_id: veh_100
      tire_pressures_psi:
        front_left: 31.5
        front_right: 30.8
        rear_left: 29.2
        rear_right: 32.1
        measured_at: '2026-05-04T10:10:00Z'
      recommended_tire_pressure_psi:
        front_min: 32.0
        front_max: 35.0
        rear_min: 32.0
        rear_max: 35.0
  - id: n2
    tool: vehicle_status_and_control.verify_tire_pressure
    params:
      vehicle_id: veh_100
      threshold_psi: '30.0'
    description: Verify whether any tire on vehicle veh_100 is below 30.0 psi.
    must_yield_keys:
    - vehicle_id
    - threshold_check
    - all_tires_healthy
    kind: verify
    must_yield:
      vehicle_id: veh_100
      threshold_check:
        threshold_psi: 30.0
        tires_below_threshold:
          rear_left: 29.2
        any_below: true
      all_tires_healthy: false
  - id: n3
    tool: vehicle_status_and_control.search_nearby_tire_shops
    params:
      vehicle_id: veh_100
      radius_miles: '5'
    description: Search for nearby tire shops within 5 miles of vehicle veh_100.
    kind: lookup
  - id: n4
    tool: vehicle_status_and_control.verify_shop_constraints
    params:
      shop_id: shop_100
      max_distance_miles: '5'
      address_must_include: 456 Oakwood Avenue, Rivermist, 83214
    description: Verify that shop_100 satisfies the requested distance and address
      constraints.
    must_yield_keys:
    - shop_id
    - shop
    - verified
    - all_constraints_met
    - checks
    kind: verify
    must_yield:
      shop_id: shop_100
      shop:
        shop_id: shop_100
        name: Oakwood Tire Service
        address: 456 Oakwood Avenue, Rivermist, 83214
        city: Rivermist
        zipcode: '83214'
        latitude: 43.252
        longitude: -112.446
        phone: 208-555-0100
      verified: true
      all_constraints_met: true
      checks:
        max_distance_miles:
          constraint: 5.0
          note: Distance cannot be computed without a vehicle_id reference.
          pass: true
        address_must_include:
          constraint: 456 Oakwood Avenue, Rivermist, 83214
          actual_address: 456 Oakwood Avenue, Rivermist, 83214
          pass: true
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
critical_actions: []
