instruction: For vehicle veh_100, check the current tire pressure on all four tires
  and verify whether any tire is below 30.0 psi. If any tire is below 30.0 psi, identify
  the nearest tire shop that is within 5 miles of the vehicle and not within 5 miles
  of the vehicle and located at 456 Oakwood Avenue, Rivermist, 83214, then report
  the tire-pressure findings and the matching shop details to me. If no tire is below
  30.0 psi, report the tire-pressure findings and say that no shop lookup result is
  needed.
system_prompt: You are a vehicle support assistant helping a driver assess tire pressure
  and find a suitable nearby tire shop when needed.
abstention_trigger:
  description: The shop-selection requirement is internally self-contradictory, so
    the agent should ask the user to clarify the intended distance constraint before
    using any tools.
  modified_element: instruction
  trigger_type: conflicting_constraints
  constraint_pair:
    a: within 5 miles of the vehicle
    b: not within 5 miles of the vehicle
  contradiction_description: A single shop cannot both be within 5 miles of the vehicle
    and not within 5 miles of the vehicle at the same time.
critical_actions: []
