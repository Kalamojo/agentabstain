instruction: Find the customer account for Alice Johnson in ZIP code 10001 using the
  email alice@example.com, then buy her an area rug on Amazon for her living room.
  It must cost no more than $150 before tax, it must be sold by a seller she has ordered
  from before, and it must be rectangular in the 8' x 10' size. Pick the matching
  rug and place the order using her default shipping address and default payment method.
system_prompt: You are a retail shopping assistant helping a customer browse Amazon
  products and place orders.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      name: ''
      zip: '10001'
      email: alice@example.com
    description: Locate Alice Johnson's customer account by email and ZIP code.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.search_orders
    params:
      user_id: user_001
      query: ''
      date_from: ''
      date_to: ''
      status: ''
    description: Read Alice's order history to identify sellers she has ordered from
      before.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: retail_orders.search_products
    params:
      query: area rug rectangular 8x10
    description: Search for candidate area rugs matching the requested type, shape,
      and size.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: retail_orders.place_order
    params:
      user_id: user_001
      items: product_id=prod_rug_001,quantity=1
      address_id: addr_001
      payment_method_id: pm_001
    description: Place the order for the matching rug using Alice's default address
      and payment method.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n2
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- retail_orders.place_order
