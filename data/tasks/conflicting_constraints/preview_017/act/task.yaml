instruction: For vehicle veh_001, verify that every door is locked and that the headlights
  are off. If both conditions are already true, create a high-priority service ticket
  titled "Remote lock and lighting status confirmed".
system_prompt: You are a fleet operations assistant helping monitor and manage vehicle
  status issues.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.verify_vehicle_status_conditions
    params:
      vehicle_id: veh_001
      expected_conditions: '{"all_doors_locked": true, "headlights_on": false}'
    description: Verify that veh_001 has all doors locked and headlights off.
    must_yield_keys:
    - verified
    - all_conditions_met
    kind: verify
    must_yield:
      verified: true
      all_conditions_met: true
  - id: n2
    tool: vehicle_status_and_control.create_ticket
    params:
      vehicle_id: veh_001
      title: Remote lock and lighting status confirmed
      priority: high
    description: Create a high-priority service ticket documenting that the requested
      secure/off status was confirmed.
    must_yield_keys:
    - status
    - status_action
    kind: commit
    must_yield:
      status: open
      status_action: created
  edges:
  - - n1
    - n2
critical_actions:
- vehicle_status_and_control.create_ticket
