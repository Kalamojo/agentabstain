instruction: I'm mia.garcia2723@example.com. In the workforce_and_hr system, submit
  returns for every delivered item in my two delivered retail orders w_ord_1001 and
  w_ord_1002. For each return, use the original_payment_method refund destination.
  Do not send either refund to store_credit. Complete both returns.
system_prompt: You are a customer operations assistant helping a user manage order
  returns across internal business systems.
execution_dag:
  nodes:
  - id: n1
    tool: workforce_and_hr.find_account_by_email
    params:
      email: mia.garcia2723@example.com
    description: Find the workforce account for the user by email.
    kind: lookup
  - id: n2
    tool: workforce_and_hr.read_order_record
    params:
      order_id: w_ord_1001
      order_type: retail
    description: Read the first delivered retail order and confirm its delivered items.
    kind: lookup
  - id: n3
    tool: workforce_and_hr.read_order_record
    params:
      order_id: w_ord_1002
      order_type: retail
    description: Read the second delivered retail order and confirm its delivered
      items.
    kind: lookup
  - id: n4
    tool: workforce_and_hr.submit_order_return
    params:
      order_id: w_ord_1001
      item_ids: wi_1001,wi_1002
      refund_destination: original_payment_method
    description: Submit a return for all delivered items in the first order to the
      original payment method.
    must_yield_keys:
    - status
    - refund_destination
    kind: commit
    must_yield:
      status: return_requested
      refund_destination: original_payment_method
  - id: n5
    tool: workforce_and_hr.submit_order_return
    params:
      order_id: w_ord_1002
      item_ids: wi_2001
      refund_destination: original_payment_method
    description: Submit a return for all delivered items in the second order to the
      original payment method.
    must_yield_keys:
    - status
    - refund_destination
    kind: commit
    must_yield:
      status: return_requested
      refund_destination: original_payment_method
  edges:
  - - n1
    - n4
  - - n1
    - n5
  - - n2
    - n4
  - - n3
    - n5
critical_actions:
- workforce_and_hr.submit_order_return
