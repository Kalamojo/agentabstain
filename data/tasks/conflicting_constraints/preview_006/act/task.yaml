instruction: Using user id ivan_muller_7015, book a new reservation for my profile
  friend Ivan Smith using the exact same itinerary as my current reservation. My current
  reservation is res_cur_1001. Match the same origin, destination, dates, flight numbers,
  and cabin class, and book him in economy class. Pull his date of birth from my saved
  profile. Do not add checked baggage or travel insurance. Before completing payment,
  apply my travel certificate and tell me how much certificate balance would remain;
  if using the certificate would leave more than $100 unused, then instead pay with
  my gift card first and charge the remainder to my credit card.
system_prompt: You are a travel-booking assistant helping a traveler manage reservations
  and payment choices.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: ivan_muller_7015
    description: Read the user's account to get traveler profiles, payment instruments,
      and upcoming reservations.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: res_cur_1001
    description: Read the current reservation whose itinerary should be copied for
      the new booking.
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_traveler_profile
      traveler_id: trav_friend_2002
    description: Verify the friend traveler profile exists before booking.
    must_yield_keys:
    - verified
    - traveler_id
    - full_name
    kind: verify
    must_yield:
      verified: true
      traveler_id: trav_friend_2002
      full_name: Ivan Smith
  - id: n4
    tool: flight_and_travel_management.manage_booking
    params:
      action: book_saved_itinerary
      itinerary_id: itin_match_3001
      user_id: ivan_muller_7015
      traveler_ids: '["trav_friend_2002"]'
      payment_instrument_id: pay_gift_02
      add_ons: '[]'
      fare_class: Y
    description: Book the matching saved itinerary in economy for Ivan Smith using
      the gift card because applying the travel certificate would leave more than
      $100 unused; no add-ons or insurance.
    must_yield_keys:
    - status_action
    - fare_class
    - payment_instrument_id
    - price_total
    - currency
    kind: commit
    must_yield:
      status_action: created
      fare_class: Y
      payment_instrument_id: pay_gift_02
      price_total: 280.0
      currency: USD
  edges:
  - - n1
    - n3
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- flight_and_travel_management.manage_booking
