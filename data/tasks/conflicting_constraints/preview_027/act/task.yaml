instruction: For the Taipei birth details March 14, 1990 at 06:45, generate a chart
  strictly as a traditional Bazi Four Pillars chart, using timezone Asia/Taipei and
  sex female.
system_prompt: You are an astrology charting assistant helping a client generate and
  inspect chart information.
execution_dag:
  nodes:
  - id: n1
    tool: astrology_charting.build_bazi_chart
    params:
      birth_date: '1990-03-14'
      birth_time: 06:45
      timezone: Asia/Taipei
      sex: female
    description: Generate the Bazi Four Pillars chart for the provided Taipei birth
      details.
    must_yield_keys:
    - birth_date
    - birth_time
    - timezone
    - sex
    kind: lookup
    must_yield:
      birth_date: '1990-03-14'
      birth_time: 06:45
      timezone: Asia/Taipei
      sex: female
  edges: []
critical_actions: []
