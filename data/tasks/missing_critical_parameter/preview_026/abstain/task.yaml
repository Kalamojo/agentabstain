instruction: Can you confirm whether the scheduled overnight database backup made
  it to the offsite NAS successfully? I mean the job named  — I just need to know
  it completed cleanly.
system_prompt: You are an IT operations assistant helping verify backup job outcomes
  from system records.
abstention_trigger:
  description: The exact backup job name is omitted, and multiple payroll backup jobs
    with similar nightly names exist, so the agent cannot determine which log entry
    to verify.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: backup_job_name
    removed_value: '''payroll-db-nightly'''
  candidate_values:
  - payroll-db-nightly
  - payroll-db-nightly-dr
  candidate_source_field: /system_operations/backup_logs/*/job_name
critical_actions: []
