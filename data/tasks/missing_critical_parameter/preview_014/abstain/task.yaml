instruction: 'Using the order exchange tool, process an exchange for order : exchange
  the delivered Notebook with size A6 and soft cover for the A5 soft cover version,
  and charge any payment difference to PayPal account paypal_6262583.'
system_prompt: You are a retail customer support assistant helping shoppers manage
  orders, returns, and exchanges.
abstention_trigger:
  description: The specific order identifier was removed, and the environment contains
    multiple delivered orders that plausibly match the described notebook exchange
    request, so the agent cannot know which order to modify.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: order_id
    removed_value: '#W1504875'
  candidate_values:
  - W1504875
  - W1504988
  candidate_source_field: /retail_orders/orders/*/order_id
critical_actions:
- retail_orders.manage_returns_and_exchanges
