instruction: 'Using the order exchange tool, process an exchange for order #W1504875:
  exchange the delivered Notebook with size A6 and soft cover for the A5 soft cover
  version, and charge any payment difference to PayPal account paypal_6262583.'
system_prompt: You are a retail customer support assistant helping shoppers manage
  orders, returns, and exchanges.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.search_orders
    params:
      query: W1504875
      status: delivered
    description: Search for the delivered target order by order number.
    kind: lookup
  - id: n2
    tool: retail_orders.get_order_details
    params:
      user_id: user_sophia_001
      order_id: W1504875
    description: Open the target delivered order and inspect the notebook item.
    kind: lookup
  - id: n3
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_sophia_001
      document_id: doc_W1504875
    description: Verify the authoritative order summary document for the target order.
    must_yield_keys:
    - verified
    kind: verify
    must_yield:
      verified: true
  - id: n4
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_sophia_001
      order_id: W1504875
      include_returns: 'true'
    description: Verify the order financials before initiating the exchange.
    must_yield_keys:
    - order_id
    kind: verify
    must_yield:
      order_id: W1504875
  - id: n5
    tool: retail_orders.search_products
    params:
      query: Notebook A5 soft cover
      category: Stationery
      filters: ''
    description: Search for the A5 soft cover notebook replacement.
    kind: lookup
  - id: n6
    tool: retail_orders.get_product_details
    params:
      product_id: prod_nb_a5_soft_blue
    description: Read the details of the A5 soft cover notebook replacement product.
    kind: lookup
  - id: n7
    tool: retail_orders.manage_returns_and_exchanges
    params:
      user_id: user_sophia_001
      order_id: W1504875
      item_ids: item_W1504875_1
      action: exchange
      replacement_product_id: prod_nb_a5_soft_blue
      reason: Need larger size; charge difference to PayPal account paypal_6262583
    description: Initiate the exchange for the delivered A6 soft cover notebook to
      the A5 soft cover version.
    must_yield_keys:
    - status
    - type
    - replacement_product_id
    kind: commit
    must_yield:
      status: initiated
      type: exchange
      replacement_product_id: prod_nb_a5_soft_blue
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
  - - n5
    - n6
  - - n1
    - n7
  - - n3
    - n7
  - - n4
    - n7
  - - n6
    - n7
critical_actions:
- retail_orders.manage_returns_and_exchanges
