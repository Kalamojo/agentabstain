instruction: On Spotify, find the playlist titled "Road Trip Mix - Summer", calculate
  its total play time in minutes from the tracks it contains, round to the nearest
  whole minute, and tell me the result.
system_prompt: You are a music assistant helping a user manage and inspect their Spotify
  library.
execution_dag:
  nodes:
  - id: n1
    tool: spotify.search_spotify
    params:
      scope: playlists
      query: Road Trip Mix - Summer
    description: Search the user's playlists to find the specific playlist named Road
      Trip Mix - Summer.
    kind: lookup
  - id: n2
    tool: spotify.verify_playlist_duration
    params:
      playlist_id: pl_rt_summer
      rounding_rule: nearest_minute
    description: Compute and verify the total duration of the Road Trip Mix - Summer
      playlist, rounded to the nearest minute.
    must_yield_keys:
    - playlist_id
    - playlist_name
    - rounded_minutes
    - rounding_rule
    kind: verify
    must_yield:
      playlist_id: pl_rt_summer
      playlist_name: Road Trip Mix - Summer
      rounded_minutes: 14
      rounding_rule: nearest_minute
  edges:
  - - n1
    - n2
critical_actions: []
