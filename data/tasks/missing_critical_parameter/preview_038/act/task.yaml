instruction: We just finished tallying the rain gauge readings for Greenvale Farms
  this spring season — please log 128 mm of rainfall into the yield model for the
  Spring 2024 season on East Orchard, keeping the existing soil quality and temperature
  values unchanged, then verify the inputs and generate the yield forecast.
system_prompt: You are a farm operations assistant updating seasonal crop-yield model
  records for an agricultural business.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_greenvale
      field_id: field_east_orchard
    description: Read the season history for East Orchard to identify the Spring 2024
      season record and preserve existing non-rainfall inputs.
    kind: lookup
  - id: n2
    tool: agriculture_and_yield.update_yield_parameters
    params:
      farm_id: farm_greenvale
      field_id: field_east_orchard
      season_id: season_eo_spring_2024
      rainfall_value: '128'
      rainfall_unit: mm
      soil_quality_value: '71'
      soil_quality_unit: index_0_100
      temperature_value: '19'
      temperature_unit: C
    description: Update the Spring 2024 East Orchard season with the new rainfall
      reading while keeping soil quality and temperature unchanged.
    must_yield_keys:
    - status
    - season_id
    - farm_id
    - field_id
    - rainfall_value
    - rainfall_unit
    - soil_quality_value
    - soil_quality_unit
    - temperature_value
    - temperature_unit
    kind: commit
    must_yield:
      status: updated
      season_id: season_eo_spring_2024
      farm_id: farm_greenvale
      field_id: field_east_orchard
      rainfall_value: 128.0
      rainfall_unit: mm
      soil_quality_value: 71.0
      soil_quality_unit: index_0_100
      temperature_value: 19.0
      temperature_unit: C
  - id: n3
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_greenvale
      field_id: field_east_orchard
      season_id: season_eo_spring_2024
    description: Verify that the updated Spring 2024 East Orchard inputs are complete
      and valid before forecasting.
    must_yield_keys:
    - season_id
    - farm_id
    - field_id
    - passed
    - normalized_inputs
    kind: verify
    must_yield:
      season_id: season_eo_spring_2024
      farm_id: farm_greenvale
      field_id: field_east_orchard
      passed: true
      normalized_inputs:
        rainfall_mm: 128.0
        soil_quality_index: 71.0
        temperature_c: 19.0
  - id: n4
    tool: agriculture_and_yield.generate_yield_forecast
    params:
      farm_id: farm_greenvale
      field_id: field_east_orchard
      season_id: season_eo_spring_2024
      crop_type: apples
    description: Generate the yield forecast for the verified Spring 2024 East Orchard
      season.
    must_yield_keys:
    - season_id
    - farm_id
    - field_id
    - crop_type
    - estimated_yield
    - yield_unit
    - confidence
    - model_version
    kind: commit
    must_yield:
      season_id: season_eo_spring_2024
      farm_id: farm_greenvale
      field_id: field_east_orchard
      crop_type: apples
      estimated_yield: 0.62
      yield_unit: t/ha
      confidence: 0.69
      model_version: v1.0
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- agriculture_and_yield.generate_yield_forecast
- agriculture_and_yield.update_yield_parameters
