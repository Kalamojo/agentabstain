instruction: For route-201, tell me the current drone availability and delivery time
  windows so I can plan the afternoon dispatch.
system_prompt: You are a delivery-operations assistant helping a dispatcher review
  route readiness for an autonomous drone fleet.
execution_dag:
  nodes:
  - id: n1
    tool: autonomous_delivery_and_routing.get_drone_availability
    params:
      route_id: route-201
    description: Retrieve candidate drone availability and compatible delivery time
      windows for the specified route.
    must_yield_keys:
    - route_id
    kind: lookup
    must_yield:
      route_id: route-201
  edges: []
critical_actions: []
