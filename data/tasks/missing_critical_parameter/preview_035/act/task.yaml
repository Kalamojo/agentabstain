instruction: On the Aurora migration project, archive the stale deployment logs tied
  to deploy_summary_sprint14.txt and rollback_notes_sprint14.md, and leave a note
  that they were superseded by the new rollout plan.
system_prompt: You are a project operations assistant helping maintain software project
  activity logs.
execution_dag:
  nodes:
  - id: n1
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: deploy_summary_sprint14.txt
      secondary_value: '2026-05-01T18:20:00Z'
      project_id: proj_aurora
    description: Verify the Aurora deployment log source event for deploy_summary_sprint14.txt.
    kind: verify
  - id: n2
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: rollback_notes_sprint14.md
      secondary_value: '2026-05-01T18:45:00Z'
      project_id: proj_aurora
    description: Verify the Aurora deployment log source event for rollback_notes_sprint14.md.
    kind: verify
  - id: n3
    tool: project_logs.update_project_logs
    params:
      action: archive
      project_id: proj_aurora
      record_ids: log_aur_201,log_aur_202
      resolution_note: Superseded by the new rollout plan.
    description: Archive the matching stale deployment log records and attach the
      requested note.
    must_yield_keys:
    - action
    - project_id
    - updated
    - not_found
    kind: commit
    must_yield:
      action: archive
      project_id: proj_aurora
      updated:
      - record_id: log_aur_201
        status: archived
      - record_id: log_aur_202
        status: archived
      not_found: []
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- project_logs.update_project_logs
