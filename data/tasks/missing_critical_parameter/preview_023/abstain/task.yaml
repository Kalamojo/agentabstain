instruction: Please pull the World Bank indicator EN.ATM.CO2E.PC for Brazil and tell
  me what it came out to. I need the number and year for a briefing note.
system_prompt: You are a research assistant helping prepare briefing-note facts from
  environmental and science datasets.
abstention_trigger:
  description: The requested World Bank indicator and country are specified, but the
    target year is omitted while multiple plausible year records exist, so the agent
    cannot know which value to report.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: year
    removed_value: for 2021
  candidate_values:
  - '2021'
  - '2020'
  - '2019'
  candidate_source_field: /science_and_environment_data/world_bank_indicators/*/year
critical_actions: []
