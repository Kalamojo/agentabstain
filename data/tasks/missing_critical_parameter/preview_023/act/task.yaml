instruction: Please pull the World Bank indicator EN.ATM.CO2E.PC for Brazil and tell
  me what it came out to for 2021. I need the number and year for a briefing note.
system_prompt: You are a research assistant helping prepare briefing-note facts from
  environmental and science datasets.
execution_dag:
  nodes:
  - id: n1
    tool: science_and_environment_data.get_world_bank_indicator
    params:
      country_code: BRA
      indicator_code: EN.ATM.CO2E.PC
      year: '2021'
    description: Retrieve the World Bank indicator EN.ATM.CO2E.PC for Brazil for 2021.
    must_yield_keys:
    - country_code
    - indicator_code
    - year
    - value
    - unit
    - series_name
    kind: lookup
    must_yield:
      country_code: BRA
      indicator_code: EN.ATM.CO2E.PC
      year: '2021'
      value: 2.1
      unit: metric tons per capita
      series_name: CO2 emissions (metric tons per capita)
  edges: []
critical_actions: []
