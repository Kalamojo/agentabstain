instruction: Place an order for all beach balls in my Amazon cart from the seller
  SunnySplash for  at the default address and default payment method.
system_prompt: You are a retail shopping assistant helping a customer manage Amazon-style
  carts and orders.
abstention_trigger:
  description: The account-identifying phrase was removed, and multiple plausible
    user records remain, so the agent cannot determine which customer's cart, default
    address, and default payment method should be used.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: customer_identifier
    removed_value: jordan.lee.ny@example.com
  candidate_values:
  - Jordan Lee
  - Jordan Lee
  candidate_source_field: /retail_orders/users/*/name
critical_actions:
- retail_orders.place_order
