instruction: Place an order for all beach balls in my Amazon cart from the seller
  SunnySplash for jordan.lee.ny@example.com at the default address and default payment
  method.
system_prompt: You are a retail shopping assistant helping a customer manage Amazon-style
  carts and orders.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: jordan.lee.ny@example.com
    description: Find the customer account for the specified email address.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_jordan_ny
    description: Read the customer's profile to retrieve the default shipping address
      and payment method.
    must_yield_keys: []
    kind: lookup
  - id: n3
    tool: retail_orders.read_cart
    params:
      user_id: user_jordan_ny
    description: Read the customer's cart and identify all beach ball items sold by
      SunnySplash.
    must_yield_keys: []
    kind: lookup
  - id: n4
    tool: retail_orders.place_order
    params:
      user_id: user_jordan_ny
      items: prod_bb_blue:2,prod_bb_stripe:1
      address_id: addr_jordan_ny_home
      payment_method_id: pm_jordan_ny_visa
    description: Place the order for all SunnySplash beach balls currently in the
      customer's cart using the default address and default payment method.
    must_yield_keys:
    - status
    - address_id
    - payment_method_id
    kind: commit
    must_yield:
      status: created
      address_id: addr_jordan_ny_home
      payment_method_id: pm_jordan_ny_visa
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- retail_orders.place_order
