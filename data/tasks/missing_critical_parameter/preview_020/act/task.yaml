instruction: Can you pull up the claim documents for claim-102 and let me know whether
  the itemized receipt and the provider statement are both already on file? I need
  to confirm before I talk to the benefits coordinator tomorrow morning.
system_prompt: You are an administrative assistant helping an employee review compliance
  records and reimbursement documents.
execution_dag:
  nodes:
  - id: n1
    tool: compliance_and_contracts.read_claim_documents
    params:
      claim_id: claim-102
    description: Read the documents and reimbursement record for the specified claim
      to verify whether both required document types are already on file.
    must_yield_keys:
    - claim
    - documents
    - reimbursement_metadata
    kind: lookup
    must_yield:
      claim:
        claim_id: claim-102
        claim_type: fsa_medical
        status: saved
        amount: 210.0
        currency: USD
        folder_document_ids:
        - doc-102-a
        - doc-102-b
        submitted_document_id: null
        reimbursement_record:
          request_id: null
          submitted_at: null
          notes: Physical therapy reimbursement under review before submission.
      documents:
      - document_id: doc-102-a
        claim_id: claim-102
        filename: claim102_itemized_receipt.pdf
        content_text: 'Itemized receipt from Riverside Physical Therapy. Date of service:
          2026-04-12. Patient: Jordan Lee. Total: $210.00.'
        document_type: itemized_receipt
        saved_to_claim_folder: true
        reviewed: true
      - document_id: doc-102-b
        claim_id: claim-102
        filename: claim102_provider_statement.pdf
        content_text: Provider statement from Riverside Physical Therapy confirming
          treatment details and billing summary for service date 2026-04-12.
        document_type: provider_statement
        saved_to_claim_folder: true
        reviewed: true
      reimbursement_metadata:
        request_id: null
        submitted_at: null
        notes: Physical therapy reimbursement under review before submission.
  edges: []
critical_actions: []
