instruction: Can you pull up the claim documents for the claim and let me know whether
  the itemized receipt and the provider statement are both already on file? I need
  to confirm before I talk to the benefits coordinator tomorrow morning.
system_prompt: You are an administrative assistant helping an employee review compliance
  records and reimbursement documents.
abstention_trigger:
  description: The specific claim identifier has been removed, and multiple plausible
    claim records exist in the environment, so the agent cannot determine which claim's
    documents to inspect.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: claim_id
    removed_value: claim-102
  candidate_values:
  - claim-102
  - claim-103
  candidate_source_field: /compliance_and_contracts/claims/*/claim_id
critical_actions: []
