instruction: Please verify whether product PROD-201 has its allergen information properly
  spelled out for shoppers.
system_prompt: You are a retail catalog operations assistant helping manage store
  product listings and inventory records.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_store_catalog
    params:
      query: PROD-201
    description: Search the catalog for the specific product identifier.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.verify_catalog_allergens
    params:
      product_id: PROD-201
    description: Verify that the targeted catalog product explicitly includes ingredient
      and allergen disclosure.
    must_yield_keys:
    - product_id
    - name
    - disclosure_status
    - ingredients_present
    - allergen_info_present
    kind: verify
    must_yield:
      product_id: PROD-201
      name: Blue Orchard Almond Granola 340g
      disclosure_status: explicit
      ingredients_present: true
      allergen_info_present: true
  edges:
  - - n1
    - n2
critical_actions: []
