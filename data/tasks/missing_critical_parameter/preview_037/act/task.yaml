instruction: Find the email from my mom about Noah Patel's birth details, pull the
  birth datetime from it, save a Bazi chart request under user id user-4721, and forward
  that same email to my sister at maya.patel@example.com.
system_prompt: You are a personal assistant helping a user manage family emails and
  astrology chart requests.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.read_gmail_record
    params:
      record_type: message
      id: msg-mom-noah
      include_body: 'true'
    description: Read the specific email from the user's mom containing Noah Patel's
      birth details.
    kind: lookup
  - id: n2
    tool: astrology_charting.save_chart_request
    params:
      user_id: user-4721
      birth_datetime: '2024-11-03T06:41:00-05:00'
      chart_type: bazi
    description: Save the Bazi chart request for Noah Patel using the birth datetime
      from the email.
    must_yield_keys:
    - status
    - user_id
    - birth_datetime
    - chart_type
    kind: commit
    must_yield:
      status: created
      user_id: user-4721
      birth_datetime: '2024-11-03T06:41:00-05:00'
      chart_type: bazi
  - id: n3
    tool: gmail_and_email_records.modify_gmail_message
    params:
      action: forward
      target_id: msg-mom-noah
      to: maya.patel@example.com
      body: Forwarding Mom's email with Noah's birth details.
    description: Forward the same email to the user's sister.
    kind: commit
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions:
- astrology_charting.save_chart_request
- gmail_and_email_records.modify_gmail_message
