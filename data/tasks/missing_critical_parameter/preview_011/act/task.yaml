instruction: 'In /home/alex, find the receipt file for the April 2026 electricity
  bill in my file system, determine the total amount paid, calculate each roommate''s
  equal share excluding me, and tell me which roommates should be charged and how
  much each Venmo request should be for. Include the note text: "For electricity bill."
  Use the Maple House household.'
system_prompt: You are a household finance assistant helping a user review shared
  utility bills and roommate reimbursement details.
execution_dag:
  nodes:
  - id: n1
    tool: venmo_and_shared_expenses.list_files
    params:
      query: April 2026 electricity
    description: Find candidate bill files matching the April 2026 electricity receipt.
    kind: lookup
  - id: n2
    tool: filesystem.list_directory
    params:
      path: /home/alex
      recursive: 'true'
      name_substring: April
      file_type: .pdf
    description: Search the user's filesystem under /home/alex for April PDF receipts.
    kind: lookup
  - id: n3
    tool: venmo_and_shared_expenses.read_file
    params:
      file_id: file-elec-apr-2026
    description: Read the April 2026 electricity receipt from the shared-expenses
      file index.
    kind: lookup
  - id: n4
    tool: filesystem.read_file
    params:
      path: /home/alex/bills/April_2026_Electricity_Receipt.pdf
    description: Read the matching electricity receipt directly from the filesystem.
    kind: lookup
  - id: n5
    tool: venmo_and_shared_expenses.list_roommates
    params: {}
    description: List all roommates so the user's own identity can be excluded from
      charges.
    kind: lookup
  - id: n6
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: calculate_equal_share
      total_amount: '120.00'
      household_size: '3'
    description: Verify the equal share for a three-person household.
    must_yield_keys:
    - verified
    - equal_share
    - message
    kind: verify
    must_yield:
      verified: true
      equal_share: 40.0
      message: Each of 3 people owes $40.00
  edges:
  - - n1
    - n3
  - - n2
    - n4
  - - n3
    - n6
  - - n5
    - n6
critical_actions: []
