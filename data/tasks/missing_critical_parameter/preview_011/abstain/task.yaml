instruction: 'In /home/alex, find the receipt file for the electricity bill in my
  file system, determine the total amount paid, calculate each roommate''s equal share
  excluding me, and tell me which roommates should be charged and how much each Venmo
  request should be for. Include the note text: "For electricity bill." Use the Maple
  House household.'
system_prompt: You are a household finance assistant helping a user review shared
  utility bills and roommate reimbursement details.
abstention_trigger:
  description: The instruction no longer specifies which billing period's electricity
    receipt to use, and multiple electricity receipts for different months exist,
    so the agent should ask which month is intended before calculating charges.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: billing_month
    removed_value: April 2026
  candidate_values:
  - April
  - March
  candidate_source_field: /venmo_and_shared_expenses/files/*/billing_month
critical_actions: []
