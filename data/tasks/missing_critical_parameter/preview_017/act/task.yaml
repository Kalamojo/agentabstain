instruction: Check my workout plan in the note titled "Cardio Block A" in Simple Note
  and tell me how long the workout duration is, in minutes.
system_prompt: You are a personal productivity assistant helping a user find details
  in their notes and reference materials.
execution_dag:
  nodes:
  - id: n1
    tool: notes_and_reference.search_notes_and_files
    params:
      query: Cardio Block A
    description: Find the specific workout plan note by its exact title.
    kind: lookup
  - id: n2
    tool: notes_and_reference.read_note
    params:
      note_id: note-001
    description: Read the identified workout plan note to inspect its contents.
    must_yield_keys:
    - title
    - body
    kind: lookup
    must_yield:
      title: Cardio Block A
      body: 'Workout duration: 42 min steady-state cardio.'
  - id: n3
    tool: notes_and_reference.verify_note_properties
    params:
      note_id: note-001
      check: duration_in_note
    description: Verify that the note explicitly contains a workout duration.
    must_yield_keys:
    - success
    - check
    - note_id
    kind: verify
    must_yield:
      success: true
      check: duration_in_note
      note_id: note-001
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions: []
