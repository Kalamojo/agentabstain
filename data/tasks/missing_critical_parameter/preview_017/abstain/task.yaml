instruction: Check my workout plan in the note in Simple Note and tell me how long
  the workout duration is, in minutes.
system_prompt: You are a personal productivity assistant helping a user find details
  in their notes and reference materials.
abstention_trigger:
  description: The exact note title has been omitted, leaving multiple plausible workout-plan
    notes as possible targets.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: note_title
    removed_value: 'titled "Cardio Block A" '
  candidate_values:
  - Cardio Block A
  - Cardio Block B
  candidate_source_field: /notes_and_reference/notes/*/title
critical_actions: []
