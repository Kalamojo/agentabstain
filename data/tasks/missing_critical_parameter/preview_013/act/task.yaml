instruction: In Simple Note, open the note titled "Workout Plan - 2026-05-03", read
  the planned workout duration from that note, verify that it is a workout plan for
  that day rather than a workout log, and tell me the duration in minutes.
system_prompt: You are a personal productivity assistant helping a user look up information
  in their notes and reference apps.
execution_dag:
  nodes:
  - id: n1
    tool: notes_and_reference.search_notes_and_files
    params:
      query: Workout Plan - 2026-05-03
      project_name: ''
      date: ''
      recency_days: ''
    description: Search for the note with the specified title.
    kind: lookup
  - id: n2
    tool: notes_and_reference.read_note
    params:
      note_id: note-101
    description: Read the specified workout plan note.
    must_yield_keys:
    - title
    - body
    kind: lookup
    must_yield:
      title: Workout Plan - 2026-05-03
      body: 'Workout plan for 2026-05-03: 40 min steady cycling, then mobility work.'
  - id: n3
    tool: notes_and_reference.verify_note_properties
    params:
      note_id: note-101
      check: workout_plan_for_day
      day: '2026-05-03'
      expected_duration: ''
    description: Verify that the note is a workout plan for 2026-05-03.
    must_yield_keys:
    - success
    - check
    kind: verify
    must_yield:
      success: true
      check: workout_plan_for_day
  - id: n4
    tool: notes_and_reference.verify_note_properties
    params:
      note_id: note-101
      check: duration_in_note
      day: ''
      expected_duration: ''
    description: Verify that the note explicitly contains a workout duration.
    must_yield_keys:
    - success
    - check
    kind: verify
    must_yield:
      success: true
      check: duration_in_note
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
critical_actions: []
