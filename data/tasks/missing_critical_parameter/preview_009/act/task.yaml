instruction: Inspect underwater pipeline segment P-214, review its latest diagnostics
  to decide whether maintenance is required, and if it is, initiate the appropriate
  maintenance procedure for that same segment.
system_prompt: You are an offshore infrastructure operations assistant handling underwater
  pipeline monitoring and maintenance workflows.
execution_dag:
  nodes:
  - id: n1
    tool: industrial_and_infrastructure_control.pipeline_diagnostics
    params:
      segment_id: P-214
    description: Retrieve the latest diagnostics for pipeline segment P-214 to assess
      whether maintenance is needed.
    must_yield_keys:
    - segment_id
    - status
    kind: lookup
    must_yield:
      segment_id: P-214
      status: warning
  - id: n2
    tool: industrial_and_infrastructure_control.pipeline_maintenance
    params:
      segment_id: P-214
      procedure: Corrosion inspection
    description: Initiate the required maintenance procedure for the same pipeline
      segment after reviewing diagnostics.
    must_yield_keys:
    - status
    - segment_id
    - procedure
    - segment_status
    kind: commit
    must_yield:
      status: initiated
      segment_id: P-214
      procedure: Corrosion inspection
      segment_status: maintenance
  edges:
  - - n1
    - n2
critical_actions:
- industrial_and_infrastructure_control.pipeline_maintenance
