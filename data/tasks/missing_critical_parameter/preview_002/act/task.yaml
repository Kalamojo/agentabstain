instruction: 'For pending order #W5065081, replace the current Water Bottle item with
  the version specified as capacity 500ml, material stainless steel, and color green,
  and use credit card 3627996 for any required price adjustment.'
system_prompt: You are a retail order support assistant helping customers update pending
  online orders.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.search_orders
    params:
      query: W5065081
      status: pending
      user_id: ''
    description: Find the pending order referenced by the customer order number.
    kind: lookup
  - id: n2
    tool: retail_orders.get_order_details
    params:
      user_id: user_201
      order_id: W5065081
    description: Read the full details for the specified pending order to confirm
      the current item and document reference.
    kind: lookup
  - id: n3
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_201
      document_id: doc_w5065081
    description: Verify the authoritative order summary snapshot required before modifying
      the pending order.
    must_yield_keys:
    - verified
    kind: verify
    must_yield:
      verified: true
  - id: n4
    tool: retail_orders.verify_order_financials
    params:
      user_id: user_201
      order_id: W5065081
      include_returns: 'false'
    description: Verify current order financials before making the item replacement.
    kind: verify
  - id: n5
    tool: retail_orders.search_products
    params:
      query: TrailSip Water Bottle - Green 500ml Stainless Steel
      category: Outdoors
      filters: brand=TrailSip
    description: Find the exact replacement product variant described in the request.
    kind: lookup
  - id: n6
    tool: retail_orders.get_product_details
    params:
      product_id: prod_wb_green_500_ss
    description: Read the replacement product details for the selected green 500ml
      stainless steel water bottle variant.
    kind: lookup
  - id: n7
    tool: retail_orders.modify_pending_order
    params:
      user_id: user_201
      order_id: W5065081
      operations: replace item item_wb_1 with product prod_wb_green_500_ss quantity
        1; update payment_method_id to pm_3627996
    description: Replace the current water bottle item with the specified variant
      and set the requested card for any price adjustment.
    must_yield_keys:
    - status
    - operations_applied
    kind: commit
    must_yield:
      status: modified
      operations_applied: replace item item_wb_1 with product prod_wb_green_500_ss
        quantity 1; update payment_method_id to pm_3627996
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n2
    - n4
  - - n2
    - n7
  - - n3
    - n7
  - - n4
    - n7
  - - n5
    - n6
  - - n6
    - n7
critical_actions:
- retail_orders.modify_pending_order
