instruction: Please cancel my lunch reservation LCH-4831 tomorrow.
system_prompt: You are a personal scheduling assistant helping a user manage their
  calendar.
execution_dag:
  nodes:
  - id: n1
    tool: calendar.verify_calendar_events
    params:
      start_time: '2026-06-15T00:00:00'
      end_time: '2026-06-15T23:59:59'
      title: Lunch reservation LCH-4831
      date: '2026-06-15'
    description: Verify that the specific lunch reservation exists tomorrow before
      cancelling it.
    must_yield_keys:
    - events_found
    - count
    - title_match
    - date_match
    kind: verify
    must_yield:
      events_found: true
      count: 1
      title_match: true
      date_match: true
  - id: n2
    tool: calendar.cancel_calendar_event
    params:
      event_id: evt-400
    description: Cancel the lunch reservation identified by LCH-4831.
    must_yield_keys:
    - status
    - event_id
    kind: commit
    must_yield:
      status: cancelled
      event_id: evt-400
  edges:
  - - n1
    - n2
critical_actions:
- calendar.cancel_calendar_event
