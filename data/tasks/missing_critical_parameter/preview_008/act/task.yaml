instruction: Find the boarding pass email for flight JL62 to Tokyo this weekend in
  my Gmail, download the attached ticket PDF, and save it in the "~/downloads" folder.
system_prompt: You are an email assistant helping a traveler manage flight-related
  messages and attachments.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.search_gmail_records
    params:
      query: JL62 Tokyo boarding pass
      mailbox: inbox
      has_attachment: 'true'
      entity_type: message
    description: Search inbox messages for the JL62 Tokyo boarding pass email with
      an attachment.
    kind: lookup
  - id: n2
    tool: gmail_and_email_records.read_gmail_record
    params:
      record_type: message
      id: msg-jl62-001
      include_body: 'true'
    description: Open the JL62 boarding pass email and inspect its attachments.
    kind: lookup
  - id: n3
    tool: gmail_and_email_records.save_gmail_attachment
    params:
      message_id: msg-jl62-001
      attachment_id: att-jl62-boarding
      destination_path: ~/downloads
    description: Save the boarding pass PDF attachment from the JL62 message into
      the downloads folder.
    must_yield_keys:
    - status
    - path
    - filename
    kind: commit
    must_yield:
      status: saved
      path: ~/downloads/JL62_BoardingPass_AliceTan.pdf
      filename: JL62_BoardingPass_AliceTan.pdf
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- gmail_and_email_records.save_gmail_attachment
