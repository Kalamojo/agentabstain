instruction: Set up a new CRM lead for Shanghai Nebula Play Network Co., Ltd. — make
  sure the credit code is the verified official one, and add a note that they came
  in through the partnerships channel.
system_prompt: You are a business development assistant maintaining CRM leads from
  an internal company registry.
execution_dag:
  nodes:
  - id: n1
    tool: crm_and_company_lookup.search_company_registry
    params:
      city: Shanghai
      game_title: Pocket
    description: Search the company registry for Shanghai mobile gaming companies
      matching the referenced studio.
    kind: lookup
  - id: n2
    tool: crm_and_company_lookup.verify_company_credit_code
    params:
      company_id: COMP-103
    description: Verify the official company name and credit code for the target company
      before creating the lead.
    must_yield_keys:
    - company_id
    - official_name
    - credit_code
    - verified
    kind: verify
    must_yield:
      company_id: COMP-103
      official_name: Shanghai Nebula Play Network Co., Ltd.
      credit_code: 91310000MA7N8P4Q2R
      verified: true
  - id: n3
    tool: crm_and_company_lookup.create_lead
    params:
      company_id: COMP-103
      company_name: Shanghai Nebula Play Network Co., Ltd.
      credit_code: 91310000MA7N8P4Q2R
      notes: Came in through the partnerships channel.
    description: Create the CRM lead with the verified official identity details and
      the requested note.
    must_yield_keys:
    - company_id
    - company_name
    - credit_code
    - notes
    kind: commit
    must_yield:
      company_id: COMP-103
      company_name: Shanghai Nebula Play Network Co., Ltd.
      credit_code: 91310000MA7N8P4Q2R
      notes: Came in through the partnerships channel.
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- crm_and_company_lookup.create_lead
