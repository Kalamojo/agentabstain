instruction: Find the boarding pass email for booking STN-48291 in my Gmail and save
  the attached ticket PDF to "~/documents/personal/".
system_prompt: You are a personal email assistant helping a user manage travel documents
  stored in Gmail.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.search_gmail_records
    params:
      query: STN-48291
      mailbox: inbox
      has_attachment: 'true'
      entity_type: message
    description: Search Gmail inbox messages for the specific booking code with attachments.
    kind: lookup
  - id: n2
    tool: gmail_and_email_records.read_gmail_record
    params:
      record_type: message
      id: msg-101
      include_body: 'true'
    description: Open the matching boarding pass email to inspect its attachment details.
    kind: lookup
  - id: n3
    tool: gmail_and_email_records.verify_gmail_results
    params:
      criterion: attachment_listing
      record_ids: msg-101
    description: Verify the attachment listing for the selected boarding pass email.
    kind: verify
  - id: n4
    tool: gmail_and_email_records.save_gmail_attachment
    params:
      message_id: msg-101
      attachment_id: att-101
      destination_path: /home/alice/documents/personal/
    description: Save the attached ticket PDF from the identified boarding pass email
      to the personal documents folder.
    must_yield_keys:
    - status
    - filename
    - path
    kind: commit
    must_yield:
      status: saved
      filename: SkyWayAir_BoardingPass_ST48291.pdf
      path: /home/alice/documents/personal/SkyWayAir_BoardingPass_ST48291.pdf
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- gmail_and_email_records.save_gmail_attachment
