instruction: Find the flight confirmation email for booking reference K9M4Q2 for my
  Cairo trip this weekend in Gmail, download the attached ticket, and save it to the
  "~/documents/work" folder.
system_prompt: You are an email assistant helping a traveler manage trip-related messages
  and attachments.
execution_dag:
  nodes:
  - id: n1
    tool: gmail_and_email_records.search_gmail_records
    params:
      query: K9M4Q2 Cairo
      mailbox: inbox
      has_attachment: 'true'
      entity_type: message
    description: Search inbox messages for the Cairo trip flight confirmation with
      booking reference K9M4Q2 and an attachment.
    kind: lookup
  - id: n2
    tool: gmail_and_email_records.read_gmail_record
    params:
      record_type: message
      id: msg-101
      include_body: 'true'
    description: Open the specific matching Cairo booking confirmation email to inspect
      its attachment listing.
    kind: lookup
  - id: n3
    tool: gmail_and_email_records.verify_gmail_results
    params:
      criterion: attachment_listing
      record_ids: msg-101
    description: Verify the attachment listing for the selected Cairo booking confirmation
      email.
    kind: verify
  - id: n4
    tool: gmail_and_email_records.save_gmail_attachment
    params:
      message_id: msg-101
      attachment_id: att-101
      destination_path: /home/alice/documents/work
    description: Save the attached Cairo trip ticket from the selected message into
      the work documents folder.
    must_yield_keys:
    - status
    - filename
    - path
    kind: commit
    must_yield:
      status: saved
      filename: Cairo_eTicket_K9M4Q2.pdf
      path: /home/alice/documents/work/Cairo_eTicket_K9M4Q2.pdf
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- gmail_and_email_records.save_gmail_attachment
