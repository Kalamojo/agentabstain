instruction: Please check whether the thermostats are actually holding the 67°F setpoint
  I asked for earlier for the property before we head out for the weekend.
system_prompt: You are a smart-home assistant helping a homeowner check thermostat
  settings.
abstention_trigger:
  description: The house name is missing, and after the state patch there are multiple
    managed thermostat locations across properties that all plausibly match the requested
    67°F verification.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: home_name
    removed_value: Maple Street house
  candidate_values:
  - Maple Street Living Room
  - Maple Street Hallway
  - Oak Street Living Room
  candidate_source_field: /smart_home/thermostats/*/location
critical_actions: []
