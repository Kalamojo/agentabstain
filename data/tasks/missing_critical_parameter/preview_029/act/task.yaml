instruction: Please check whether the thermostats are actually holding the 67°F setpoint
  I asked for earlier for the Maple Street house before we head out for the weekend.
system_prompt: You are a smart-home assistant helping a homeowner check thermostat
  settings.
execution_dag:
  nodes:
  - id: n1
    tool: smart_home.get_thermostat_settings
    params: {}
    description: Retrieve the current thermostat snapshot for the smart-home account
      so the Maple Street house can be identified from multiple plausible property
      labels.
    must_yield_keys:
    - home_id
    - managed_thermostat_ids
    kind: lookup
    must_yield:
      home_id: Maple Street house / Oak Street house
      managed_thermostat_ids:
      - therm_maple_01
      - therm_maple_02
  - id: n2
    tool: smart_home.verify_thermostat_setpoint
    params:
      target_temperature: 67.0
      unit: F
    description: Verify whether all managed thermostats for the Maple Street house
      are currently set to 67°F.
    must_yield_keys:
    - verified
    - matching_thermostats
    - non_matching_thermostats
    - managed_count
    - target_temperature
    - unit
    kind: verify
    must_yield:
      verified: true
      matching_thermostats:
      - therm_maple_01
      - therm_maple_02
      non_matching_thermostats: []
      managed_count: 2
      target_temperature: 67.0
      unit: F
  edges:
  - - n1
    - n2
critical_actions: []
