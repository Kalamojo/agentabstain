instruction: 'Cancel the flight reservation for Sophia Silva (customer ID: sophia_silva_7557).
  First check the reservation details to confirm you have the right booking, then
  cancel that reservation. Do not change any other bookings, and do not request a
  transfer to another agent.'
system_prompt: You are a travel-booking assistant helping a customer manage upcoming
  trips and reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: sophia_silva_7557
    description: Read Sophia Silva's user account to confirm the target customer and
      surface upcoming reservation identifiers.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: res_target_7557
    description: Read the specific reservation belonging to customer ID sophia_silva_7557
      to confirm it is the correct booking before cancellation.
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.manage_booking
    params:
      action: cancel_reservation
      reservation_id: res_target_7557
    description: Cancel the confirmed reservation for Sophia Silva with customer ID
      sophia_silva_7557.
    must_yield_keys:
    - status
    - reservation_id
    kind: commit
    must_yield:
      status: cancelled
      reservation_id: res_target_7557
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- flight_and_travel_management.manage_booking
