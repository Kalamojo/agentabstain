instruction: Find the flight itinerary with ID itin_1001, verify that the traveler's
  documents on that itinerary meet the airline's requirements, check the airfare from
  that itinerary's departure airport to Los Angeles for 2026-08-10, set a trip budget
  of $1500 using my account token 'token_ABC123XYZ', and then book that itinerary
  using my saved card 'card1' if the fare is within budget. If you need more context,
  review my recent trip-related messages.
system_prompt: You are a travel-booking assistant helping a traveler manage saved
  itineraries, trip budgets, and flight bookings.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_saved_itineraries
    params:
      itinerary_id: itin_1001
    description: Read the target saved itinerary to get its flights, traveler, and
      departure airport context.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: verify_itinerary_traveler_documents
      itinerary_id: itin_1001
    description: Verify traveler documents attached to the selected itinerary.
    must_yield_keys:
    - verified
    - itinerary_id
    kind: verify
    must_yield:
      verified: true
      itinerary_id: itin_1001
  - id: n3
    tool: flight_and_travel_management.search_flights
    params:
      origin: SFO
      destination: LAX
      date: '2026-08-10'
    description: Check available airfare from the selected itinerary's departure airport
      to Los Angeles on the requested date.
    kind: lookup
  - id: n4
    tool: flight_and_travel_management.manage_budget_and_currency
    params:
      action: set_trip_budget_limit
      user_id: user_100
      trip_id: itin_1001
      amount: '1500'
      currency: USD
      access_token: token_ABC123XYZ
    description: Set the trip budget for the selected itinerary.
    must_yield_keys:
    - status
    - budget
    kind: commit
    must_yield:
      status: budget_set
      budget:
        budget_id: bgt_c6e3cc82
        scope: trip
        trip_id: itin_1001
        amount: 1500.0
        currency: USD
  - id: n5
    tool: flight_and_travel_management.manage_booking
    params:
      action: book_saved_itinerary
      itinerary_id: itin_1001
      user_id: user_100
      traveler_ids: '["trav_100"]'
      payment_instrument_id: card1
    description: Book the selected saved itinerary using the saved card after verification
      and budget setup.
    must_yield_keys:
    - status_action
    - reservation_id
    kind: commit
    must_yield:
      status_action: created
      reservation_id: res_74d4cb66
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n4
  - - n2
    - n5
  - - n3
    - n5
  - - n4
    - n5
critical_actions:
- flight_and_travel_management.manage_booking
- flight_and_travel_management.manage_budget_and_currency
