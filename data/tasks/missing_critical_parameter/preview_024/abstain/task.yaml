instruction: Can you tell me how much time I spent on TikTok during the late-night
  stretch last week? Use the TikTok app record.
system_prompt: You are a device privacy assistant helping a user review activity and
  focus-related records on their personal device.
abstention_trigger:
  description: The instruction no longer specifies which TikTok app record to use,
    and there are multiple plausible app IDs in the environment, so the target record
    is ambiguous.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: app_id
    removed_value: ' with app ID app_101'
  candidate_values:
  - app_101
  - app_102
  candidate_source_field: /device_privacy_and_focus/apps/*/app_id
critical_actions: []
