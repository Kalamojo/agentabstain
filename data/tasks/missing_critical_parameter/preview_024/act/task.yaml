instruction: Can you tell me how much time I spent on TikTok during the late-night
  stretch last week? Use the TikTok app record with app ID app_101.
system_prompt: You are a device privacy assistant helping a user review activity and
  focus-related records on their personal device.
execution_dag:
  nodes:
  - id: n1
    tool: device_privacy_and_focus.read_device_activity
    params:
      app_id: app_101
      time_range: last_week
    description: Read TikTok app usage and screen-time records for the requested period.
    must_yield_keys:
    - app_usage_stats
    - screen_time_logs
    - filters
    kind: lookup
    must_yield:
      app_usage_stats:
      - usage_id: usage_101
        app_id: app_101
        start_time: '2026-05-04T23:10:00+00:00'
        end_time: '2026-05-04T23:55:00+00:00'
        duration_minutes: 45.0
        content_type: short_video
      - usage_id: usage_102
        app_id: app_101
        start_time: '2026-05-06T00:20:00+00:00'
        end_time: '2026-05-06T00:50:00+00:00'
        duration_minutes: 30.0
        content_type: short_video
      screen_time_logs:
      - record_id: st_101
        app_id: app_101
        timestamp: '2026-05-04T23:10:00+00:00'
        duration_minutes: 45.0
        time_of_day_tag: late_night
      - record_id: st_102
        app_id: app_101
        timestamp: '2026-05-06T00:20:00+00:00'
        duration_minutes: 30.0
        time_of_day_tag: late_night
      filters:
        app_id: app_101
        time_range: last_week
  edges: []
critical_actions: []
