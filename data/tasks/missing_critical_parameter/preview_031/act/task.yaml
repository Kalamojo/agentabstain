instruction: Can you verify whether there are any active weather alerts for loc-boulder-county-co
  on 2026-05-03 and check the forecast for loc-boulder-county-co that same day so
  I can decide whether to reschedule the hike?
system_prompt: You are a personal weather assistant helping a user review local forecasts
  and alert conditions for outdoor plans.
execution_dag:
  nodes:
  - id: n1
    tool: weather_and_alerts.verify_alerts
    params:
      location: loc-boulder-county-co
      date: '2026-05-03'
    description: Verify whether the specified location has any active official weather
      alerts on the requested date.
    must_yield_keys:
    - verified
    - alerts_active
    - alert_count
    kind: verify
    must_yield:
      verified: true
      alerts_active: true
      alert_count: 1
  - id: n2
    tool: weather_and_alerts.get_weather_forecast
    params:
      location: loc-boulder-county-co
      date: '2026-05-03'
    description: Retrieve the forecast for the specified location on the requested
      date.
    must_yield_keys:
    - forecasts
    - filters
    kind: lookup
    must_yield:
      forecasts:
      - location_name: Boulder County
        location_id: loc-boulder-county-co
        date: '2026-05-03'
        summary: Heavy rain in burn scar areas with localized flooding risk.
        hourly:
        - time: '2026-05-03T09:00:00'
          condition: Cloudy
          temperature_c: 9.0
          precipitation_mm: 1.2
          precipitation_probability: 0.45
          wind_kph: 14.0
          wind_gust_kph: 20.0
          visibility_km: 12.0
        - time: '2026-05-03T16:00:00'
          condition: Heavy Rain
          temperature_c: 13.0
          precipitation_mm: 12.5
          precipitation_probability: 0.9
          wind_kph: 22.0
          wind_gust_kph: 33.0
          visibility_km: 4.0
      filters:
        location: loc-boulder-county-co
        date: '2026-05-03'
  edges: []
critical_actions: []
