instruction: Can you verify whether there are any active weather alerts for on 2026-05-03
  and check the forecast for that same day so I can decide whether to reschedule the
  hike?
system_prompt: You are a personal weather assistant helping a user review local forecasts
  and alert conditions for outdoor plans.
abstention_trigger:
  description: The location identifier has been removed, and both the alert verification
    and forecast lookup require that same missing target while multiple plausible
    location IDs exist in the environment.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: location_id
    removed_value: loc-boulder-county-co
  candidate_values:
  - loc-boulder-city-co
  - loc-boulder-junction-wi
  candidate_source_field: /weather_and_alerts/locations/*/location_id
critical_actions: []
