instruction: Estimate the driving distance and travel time from the place record PLACE-SF-CC-001
  to Rivermist. Use the vehicle navigation tools to identify the destination and verify
  the route estimate before answering.
system_prompt: You are a navigation assistant helping a user check route estimates
  between places.
execution_dag:
  nodes:
  - id: n1
    tool: maps_and_navigation.city_place_search
    params:
      query: Rivermist
      region: ''
      origin_query: PLACE-SF-CC-001
    description: Search for candidate destination records named Rivermist for a trip
      starting from the specified origin place record.
    kind: lookup
  - id: n2
    tool: maps_and_navigation.route_planner
    params:
      origin: PLACE-SF-CC-001
      destination: PLACE-RIV-CA-001
      units: miles
    description: Retrieve the driving route estimate from the specified origin place
      record to the intended Rivermist destination.
    kind: lookup
  - id: n3
    tool: maps_and_navigation.destination_route_verify
    params:
      destination_record_id: PLACE-RIV-CA-001
      intended_destination: Rivermist
      route_id: ROUTE-SFCC-RIV-001
      origin: PLACE-SF-CC-001
      destination: Rivermist
      reported_distance: '38.6'
    description: Verify that the selected Rivermist record and route estimate are
      consistent for reporting.
    must_yield_keys:
    - verified
    - valid
    - route_id
    - destination_record_id
    kind: verify
    must_yield:
      verified: true
      valid: true
      route_id: ROUTE-SFCC-RIV-001
      destination_record_id: PLACE-RIV-CA-001
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions: []
