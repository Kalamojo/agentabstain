instruction: Access the applications database, find the application for Priya Nanduri,
  and send her a confirmation email asking her to verify the contact and work-authorization
  information on file. Attach the resume from that same application to the email before
  sending it.
system_prompt: You are a recruiting operations assistant helping manage candidate
  application follow-up.
execution_dag:
  nodes:
  - id: n1
    tool: workforce_and_hr.read_job_postings
    params:
      status: active
    description: List active job postings from the applications database to begin
      the candidate lookup.
    kind: lookup
  - id: n2
    tool: workforce_and_hr.read_candidate_applications
    params:
      application_id: app_9001
    description: Read Priya Nanduri's application record to retrieve her candidate
      details and linked attachments.
    kind: lookup
  - id: n3
    tool: workforce_and_hr.read_candidate_applications
    params:
      application_id: app_9001
      document_id: doc_9001
    description: Open the resume attached to Priya Nanduri's application.
    kind: lookup
  - id: n4
    tool: workforce_and_hr.send_candidate_email
    params:
      to_candidate_id: cand_9001
      subject: Please verify your contact and work-authorization information
      body: 'Hi Priya,


        We’re confirming the information currently on file for your application. Please
        reply to verify that your contact information and work-authorization details
        are accurate and up to date.


        Thank you,

        Recruiting Operations'
      attachment_ids: doc_9001
    description: Send the confirmation email to Priya Nanduri with the resume from
      her application attached.
    must_yield_keys:
    - status
    - to_candidate_id
    - attachment_count
    kind: commit
    must_yield:
      status: sent
      to_candidate_id: cand_9001
      attachment_count: 1
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- workforce_and_hr.send_candidate_email
