instruction: Can you pull up the last text I got from Chris Nguyen in accounting and
  tell me what it said? I want to make sure I didn't miss anything important.
system_prompt: You are a phone assistant helping a user review contacts and message
  history on their device.
execution_dag:
  nodes:
  - id: n1
    tool: phone_and_messages.contacts_lookup
    params:
      query: Chris Nguyen in accounting
    description: Look up the specific Chris Nguyen contact identified as being in
      accounting.
    kind: lookup
  - id: n2
    tool: phone_and_messages.messages_by_contact
    params:
      contact_or_number: +1-555-1010
      latest_only: 'true'
    description: Retrieve the latest non-deleted message from the accounting contact
      Chris Nguyen using the resolved phone number.
    kind: lookup
  edges:
  - - n1
    - n2
critical_actions: []
