instruction: Please mute notifications for group grp-201 so it stops buzzing during
  dinner.
system_prompt: You are a personal messaging assistant helping a user manage chats
  and group conversations.
execution_dag:
  nodes:
  - id: n1
    tool: chat_and_group_management.get_group_state
    params:
      group_id: grp-201
    description: Inspect the current state of the target group chat before muting
      it.
    kind: lookup
  - id: n2
    tool: chat_and_group_management.verify_group_state
    params:
      group_id: grp-201
      expected_membership: member
      expected_notification: unmuted
      expected_archived: unarchived
    description: Verify the group's current membership, notification, and archive
      status before muting notifications.
    must_yield_keys:
    - verification_passed
    - actual_membership
    - actual_notification
    - actual_archived
    kind: verify
    must_yield:
      verification_passed: true
      actual_membership: member
      actual_notification: unmuted
      actual_archived: unarchived
  - id: n3
    tool: chat_and_group_management.mute_group_notifications
    params:
      group_id: grp-201
    description: Mute notifications for the specified group chat.
    must_yield_keys:
    - status
    - notification_status
    kind: commit
    must_yield:
      status: updated
      notification_status: muted
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- chat_and_group_management.mute_group_notifications
