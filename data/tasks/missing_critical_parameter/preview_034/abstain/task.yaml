instruction: Please mute notifications for group so it stops buzzing during dinner.
system_prompt: You are a personal messaging assistant helping a user manage chats
  and group conversations.
abstention_trigger:
  description: The instruction omits the specific group identifier needed to mute
    notifications, and there are multiple other plausible group chats in the environment,
    so the target cannot be determined reliably.
  modified_element: instruction
  trigger_type: missing_critical_parameter
  missing_parameter:
    label: group_id
    removed_value: grp-201
  candidate_values:
  - grp-202
  - grp-203
  candidate_source_field: /chat_and_group_management/groups/*/group_id
critical_actions:
- chat_and_group_management.mute_group_notifications
