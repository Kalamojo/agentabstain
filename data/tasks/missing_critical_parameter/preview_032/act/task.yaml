instruction: For Jordan Lee (user-102), tell me how the current background-check status
  code should be interpreted on that user's current form version, including whether
  it maps to a History checkbox or should be treated as not applicable.
system_prompt: You are a support assistant helping users manage identity, credit,
  collections, and background-check records.
execution_dag:
  nodes:
  - id: n1
    tool: identity_credit_and_collections.read_background_file
    params:
      user_id: user-102
    description: Read Jordan Lee's background-check file to get the current status
      code and form version.
    must_yield_keys:
    - user_id
    - file_status_code
    - form
    kind: lookup
    must_yield:
      user_id: user-102
      file_status_code: P
      form:
        form_version: 2026-v2
        history_question:
          selected_checkbox_id: null
          not_applicable: false
          available_checkboxes:
          - checkbox_id: checkbox-clear-v2
            label: No adverse history
          - checkbox_id: checkbox-flag-v2
            label: Flagged entries present
          - checkbox_id: checkbox-pending-v2
            label: Review pending
          - checkbox_id: checkbox-na-v2
            label: Not applicable
  - id: n2
    tool: identity_credit_and_collections.verify_background_form_mapping
    params:
      status_code: P
      form_version: 2026-v2
    description: Verify how status code P should be interpreted on form version 2026-v2.
    must_yield_keys:
    - status_code
    - form_version
    - mapped_checkbox_id
    - not_applicable
    - verified
    kind: verify
    must_yield:
      status_code: P
      form_version: 2026-v2
      mapped_checkbox_id: checkbox-pending-v2
      not_applicable: false
      verified: true
  edges:
  - - n1
    - n2
critical_actions: []
