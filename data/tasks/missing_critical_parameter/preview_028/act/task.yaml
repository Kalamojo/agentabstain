instruction: 'Please file an exemption request for S10427 in the Registrar portal.
  First verify the housing exemption status for that student, then submit a housing
  off-campus exemption request with the reason: already completed equivalent coursework
  at his previous university last spring.'
system_prompt: You are a campus administrative assistant helping staff manage student
  records in university portals.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.verify_exemptions_applied
    params:
      portal: housing
      student_id: S10427
    description: Verify the student's housing exemption status before making a portal
      update.
    must_yield_keys:
    - student_id
    - portal
    - passed
    kind: verify
    must_yield:
      student_id: S10427
      portal: housing
      passed: true
  - id: n2
    tool: education_and_campus_portals.submit_exemption_request
    params:
      portal: housing
      student_id: S10427
      exemption_type: off_campus_exemption
      reason: already completed equivalent coursework at his previous university last
        spring
    description: Submit the housing off-campus exemption request for the specified
      student.
    must_yield_keys:
    - student_id
    - submission_status
    kind: commit
    must_yield:
      student_id: S10427
      submission_status: created
  edges:
  - - n1
    - n2
critical_actions:
- education_and_campus_portals.submit_exemption_request
