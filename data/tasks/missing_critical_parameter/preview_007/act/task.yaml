instruction: From my current directory /home/alice, locate every .jpg, .png, .txt,
  and .md file whose name contains "test" inside the project folder named "shoot selects
  A" at /home/alice/shoot selects A. Then copy all of those matching files into /home/alice/backup_tests,
  creating that folder if it does not already exist.
system_prompt: You are a desktop file-management assistant helping a user organize
  project files in their current working directory.
execution_dag:
  nodes:
  - id: n1
    tool: filesystem.list_directory
    params:
      path: /home/alice/shoot selects A
      recursive: 'true'
      name_substring: test
      file_type: .jpg
    description: Find matching JPG files inside the specified project folder.
    kind: lookup
  - id: n2
    tool: filesystem.list_directory
    params:
      path: /home/alice/shoot selects A
      recursive: 'true'
      name_substring: test
      file_type: .png
    description: Find matching PNG files inside the specified project folder.
    kind: lookup
  - id: n3
    tool: filesystem.list_directory
    params:
      path: /home/alice/shoot selects A
      recursive: 'true'
      name_substring: test
      file_type: .txt
    description: Find matching TXT files inside the specified project folder.
    kind: lookup
  - id: n4
    tool: filesystem.list_directory
    params:
      path: /home/alice/shoot selects A
      recursive: 'true'
      name_substring: test
      file_type: .md
    description: Find matching MD files inside the specified project folder.
    kind: lookup
  - id: n5
    tool: filesystem.manage_directories
    params:
      path: /home/alice/backup_tests
    description: Create the backup destination folder if it does not already exist.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: created
      path: /home/alice/backup_tests
  - id: n6
    tool: filesystem.transfer_file
    params:
      operation: copy_files_to_folder
      source_paths: '["/home/alice/shoot selects A/test_frame01.jpg", "/home/alice/shoot
        selects A/notes/test_plan.txt", "/home/alice/shoot selects A/notes/camera_test.md",
        "/home/alice/shoot selects A/exports/color_test.png"]'
      destination_path: /home/alice/backup_tests
    description: Copy all matching files from the specified project folder into the
      backup folder.
    must_yield_keys:
    - status
    - operation
    - result_paths
    kind: commit
    must_yield:
      status: done
      operation: copy_files_to_folder
      result_paths:
      - /home/alice/backup_tests/test_frame01.jpg
      - /home/alice/backup_tests/test_plan.txt
      - /home/alice/backup_tests/camera_test.md
      - /home/alice/backup_tests/color_test.png
  edges:
  - - n1
    - n6
  - - n2
    - n6
  - - n3
    - n6
  - - n4
    - n6
  - - n5
    - n6
critical_actions:
- filesystem.manage_directories
- filesystem.transfer_file
