instruction: Review the spreadsheet `sheet_q3_sales_ops`, run the breakdown, and verify
  its schema and sales ranking.
system_prompt: You are a business operations assistant reviewing spreadsheet-based
  performance data.
execution_dag:
  nodes:
  - id: n1
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: sheet_q3_sales_ops
      columns: product,region,revenue,units_sold
    description: Inspect the target Q3 sales spreadsheet schema and read the confirmed
      sales columns.
    kind: verify
  - id: n2
    tool: metrics_and_spreadsheet_analysis.analyze_spreadsheet_metrics
    params:
      spreadsheet_id: sheet_q3_sales_ops
      analysis_type: product_sales_ranking
      group_by: region
    description: Run the requested breakdown and sales ranking grouped by region.
    must_yield_keys:
    - spreadsheet_id
    - analysis_type
    - row_count
    kind: verify
    must_yield:
      spreadsheet_id: sheet_q3_sales_ops
      analysis_type: product_sales_ranking
      row_count: 4
  edges:
  - - n1
    - n2
critical_actions: []
