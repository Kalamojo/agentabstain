instruction: Add the stock with ticker HLDX to my watchlist, confirm it appears there,
  then place a market order to buy 150 shares of that same stock. After the order
  is submitted, retrieve the order details and send Jane Carter a message confirming
  the successful execution of the order, including the stock name, share quantity,
  market price used, order reference ID USR002, and my user ID USR001.
system_prompt: You are a personal trading assistant helping a user manage stocks and
  send confirmation messages.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.search_stocks
    params:
      query: HLDX
    description: Find the exact stock matching the requested ticker.
    kind: lookup
  - id: n2
    tool: trading_and_portfolio.verify_stock_selection
    params:
      symbol: HLDX
    description: Verify the selected ticker before committing any trading actions.
    must_yield_keys:
    - passes
    - company_name
    kind: verify
    must_yield:
      passes: true
      company_name: Helio Dynamics Corporation
  - id: n3
    tool: trading_and_portfolio.add_to_watchlist
    params:
      symbol: HLDX
    description: Add the verified stock to the user's watchlist.
    must_yield_keys:
    - status
    - symbol
    kind: commit
    must_yield:
      status: added
      symbol: HLDX
  - id: n4
    tool: trading_and_portfolio.get_watchlist
    params: {}
    description: Confirm the stock now appears on the watchlist.
    must_yield_keys:
    - user_id
    - count
    kind: lookup
    must_yield:
      user_id: USR001
      count: 3
  - id: n5
    tool: trading_and_portfolio.place_stock_order
    params:
      symbol: HLDX
      quantity: '150'
      order_type: market
    description: Place the market buy order for the same stock.
    must_yield_keys:
    - status
    - order_id
    - symbol
    - quantity
    - order_status
    - average_fill_price
    kind: commit
    must_yield:
      status: created
      order_id: ord_0002
      symbol: HLDX
      quantity: 150.0
      order_status: filled
      average_fill_price: 42.75
  - id: n6
    tool: trading_and_portfolio.get_order_info
    params:
      latest: 'true'
    description: Retrieve the submitted order details for confirmation.
    must_yield_keys:
    - order_id
    - symbol
    - quantity
    - status
    - average_fill_price
    kind: lookup
    must_yield:
      order_id: ord_0002
      symbol: HLDX
      quantity: 150.0
      status: filled
      average_fill_price: 42.75
  - id: n7
    tool: phone_and_messages.contacts_lookup
    params:
      query: Jane Carter
    description: Look up the specific Jane Carter contact before sending the confirmation.
    kind: lookup
  - id: n8
    tool: phone_and_messages.send_phone_message
    params:
      recipients: Jane Carter
      message_text: 'Order executed successfully for Helio Dynamics Corporation. Bought
        150 shares at market price 42.75. Order reference ID: USR002. User ID: USR001.'
    description: Send Jane Carter a confirmation message with the executed order details
      and requested reference IDs.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: sent
  edges:
  - - n1
    - n2
  - - n2
    - n3
  - - n3
    - n4
  - - n2
    - n5
  - - n5
    - n6
  - - n6
    - n8
  - - n7
    - n8
critical_actions:
- phone_and_messages.send_phone_message
- trading_and_portfolio.add_to_watchlist
- trading_and_portfolio.place_stock_order
