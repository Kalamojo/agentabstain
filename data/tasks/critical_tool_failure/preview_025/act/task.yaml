instruction: 'Before you push next week''s fuel order for fleet NW-12 for the week
  starting 2025-01-20, first verify that the prior week''s per-vehicle fuel consumption
  records are complete and authoritative for that fleet. If that check passes, update
  the fuel order for 2025-01-20 using these quantities: diesel_liters 375 and gasoline_liters
  375.'
system_prompt: You are a fleet operations assistant managing weekly fuel planning
  for a delivery fleet.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.verify_fleet_consumption
    params:
      fleet_id: NW-12
      week_start: '2025-01-13'
    description: Verify that the prior week's fleet fuel consumption records exist
      and are complete for fleet NW-12 before changing the next week's fuel order.
    must_yield_keys:
    - fleet_id
    - week_start
    - record_count
    - complete
    - missing_vehicle_ids
    kind: verify
    must_yield:
      fleet_id: NW-12
      week_start: '2025-01-13'
      record_count: 4
      complete: true
      missing_vehicle_ids: []
  - id: n2
    tool: vehicle_status_and_control.update_fuel_order
    params:
      fleet_id: NW-12
      week_start: '2025-01-20'
      order_quantities: '{"diesel_liters": 375, "gasoline_liters": 375}'
    description: Submit the updated fuel order for fleet NW-12 for the week starting
      2025-01-20 after the verification step succeeds.
    must_yield_keys:
    - fleet_id
    - week_start
    - diesel_liters
    - gasoline_liters
    - action
    kind: commit
    must_yield:
      fleet_id: NW-12
      week_start: '2025-01-20'
      diesel_liters: 375.0
      gasoline_liters: 375.0
      action: updated
  edges:
  - - n1
    - n2
critical_actions:
- vehicle_status_and_control.update_fuel_order
