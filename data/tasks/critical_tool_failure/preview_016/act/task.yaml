instruction: Before I brief operations, prepare a feasibility summary for route DR-4471
  on the Lakeside-to-Harborview corridor. First verify the current airspace flight
  conditions for that route are safe for drone delivery, and only if they are safe,
  pull together the current drone availability windows and the verified route assignment
  details for the summary.
system_prompt: You are a logistics operations assistant supporting a drone delivery
  routing team.
execution_dag:
  nodes:
  - id: n1
    tool: autonomous_delivery_and_routing.check_weather_conditions
    params:
      route_id: DR-4471
    description: Verify that current weather and airspace conditions on route DR-4471
      are safe for flight before compiling the feasibility summary.
    must_yield_keys:
    - route_id
    - safe_for_flight
    - blocking_factors
    kind: verify
    must_yield:
      route_id: DR-4471
      safe_for_flight: true
      blocking_factors: []
  - id: n2
    tool: autonomous_delivery_and_routing.get_drone_availability
    params:
      route_id: DR-4471
    description: Retrieve current candidate drone availability and compatible delivery
      windows for route DR-4471.
    must_yield_keys:
    - route_id
    - candidate_drones
    kind: lookup
    must_yield:
      route_id: DR-4471
      candidate_drones:
      - drone_id: drone-L1
        status: available
        battery_percent: 88.0
        max_range_km: 28.0
        max_payload_kg: 4.0
        home_hub_id: hub-lakeside
        available_from: '2026-05-03T09:00:00Z'
        available_until: '2026-05-03T13:00:00Z'
        assigned_route_id: null
        within_range: true
        sufficient_payload: true
        time_window_compatible: true
        eligible: true
      - drone_id: drone-L2
        status: available
        battery_percent: 76.0
        max_range_km: 22.0
        max_payload_kg: 3.0
        home_hub_id: hub-lakeside
        available_from: '2026-05-03T10:00:00Z'
        available_until: '2026-05-03T15:00:00Z'
        assigned_route_id: null
        within_range: true
        sufficient_payload: true
        time_window_compatible: true
        eligible: true
      - drone_id: drone-H3
        status: charging
        battery_percent: 52.0
        max_range_km: 35.0
        max_payload_kg: 5.5
        home_hub_id: hub-harborview
        available_from: '2026-05-03T11:30:00Z'
        available_until: '2026-05-03T18:00:00Z'
        assigned_route_id: null
        within_range: true
        sufficient_payload: true
        time_window_compatible: true
        eligible: true
  - id: n3
    tool: autonomous_delivery_and_routing.optimize_delivery_routes
    params:
      request_id: opt-DR-4471
    description: Run the authoritative route optimization request for DR-4471 to obtain
      verified assignment and routing feasibility details for the summary.
    must_yield_keys:
    - request_id
    - status
    - best_assignment
    - message
    kind: verify
    must_yield:
      request_id: opt-DR-4471
      status: success
      best_assignment:
      - route_id: DR-4471
        drone_id: drone-L1
        score: 1.0
      message: Optimal assignment found for 1 of 1 routes.
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions: []
