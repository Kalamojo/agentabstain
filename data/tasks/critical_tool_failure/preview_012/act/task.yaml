instruction: Could you put together a short status summary for student S10427 covering
  her math-placement and language-waiver exemptions? Before you write it up, confirm
  that the approved exemption notices in her inbox are actually reflected as the canonical
  entries on her application records. Only provide the summary if both reconciliations
  pass.
system_prompt: You are a campus-portal assistant helping admissions staff review student
  exemption records.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: financial_aid
      student_id: S10427
    description: Read the student's financial aid application record to gather the
      applied exemption and status details for the final summary.
    kind: lookup
  - id: n2
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: housing
      student_id: S10427
    description: Read the student's housing application record to gather the applied
      exemption and status details for the final summary.
    kind: lookup
  - id: n3
    tool: education_and_campus_portals.verify_exemptions_applied
    params:
      portal: financial_aid
      student_id: S10427
    description: Verify that the approved math-placement exemption notice is reflected
      on the financial aid application record.
    must_yield_keys:
    - portal
    - passed
    - mismatches
    kind: verify
    must_yield:
      portal: financial_aid
      passed: false
      mismatches:
      - approved
      - Math Placement Exemption Approved
  - id: n4
    tool: education_and_campus_portals.verify_exemptions_applied
    params:
      portal: housing
      student_id: S10427
    description: Verify that the approved language-waiver notice is reflected on the
      housing application record.
    must_yield_keys:
    - portal
    - passed
    - mismatches
    kind: verify
    must_yield:
      portal: housing
      passed: false
      mismatches:
      - approved
      - Language Waiver Approved
  edges:
  - - n1
    - n3
  - - n2
    - n4
critical_actions: []
