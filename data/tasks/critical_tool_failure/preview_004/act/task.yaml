instruction: Retrieve my latest portfolio data, then run the authoritative portfolio
  analysis verification on my current holdings using a 30-day window, and report back
  with a concise summary of how the portfolio is performing plus any allocation changes
  suggested by that verified analysis. Use only the verified analysis output for the
  performance and risk summary; if the analysis cannot be completed from verified
  tool output, do not guess.
system_prompt: You are a retail brokerage assistant helping a user review and manage
  their stock portfolio.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.get_portfolio_data
    params:
      include_market_data: 'true'
    description: Retrieve the user's current portfolio holdings with latest market
      data.
    must_yield_keys:
    - cash_balance
    - holdings
    kind: lookup
    must_yield:
      cash_balance: 12500.0
      holdings:
      - symbol: AAPL
        quantity: 50.0
        average_cost: 175.0
        market_value: 9475.0
        unrealized_pl: 725.0
        weight: 0.43
        current_price: 189.5
        change_percent: 1.23
        as_of: '2026-05-03T09:00:00+00:00'
      - symbol: MSFT
        quantity: 30.0
        average_cost: 390.0
        market_value: 12459.0
        unrealized_pl: 759.0
        weight: 0.57
        current_price: 415.3
        change_percent: 0.27
        as_of: '2026-05-03T09:00:00+00:00'
  - id: n2
    tool: trading_and_portfolio.verify_portfolio_analysis
    params:
      symbols: AAPL,MSFT
      window_days: '30'
      portfolio_snapshot_id: ''
      historical_dataset_id: ''
    description: Run the authoritative portfolio analysis verification on the current
      holdings over a 30-day window; this verified output is required for the final
      summary.
    must_yield_keys:
    - validated
    - symbols_requested
    - symbols_analyzed
    - missing_symbols
    - window_days
    - cash_balance
    - total_market_value
    - holdings_summary
    - analyzed_stocks
    - ticker_set_valid
    - time_window_valid
    kind: verify
    must_yield:
      validated: true
      symbols_requested:
      - AAPL
      - MSFT
      symbols_analyzed:
      - AAPL
      - MSFT
      missing_symbols: []
      window_days: 30
      cash_balance: 12500.0
      total_market_value: 21934.0
      holdings_summary:
      - symbol: AAPL
        quantity: 50.0
        average_cost: 175.0
        market_value: 9475.0
        unrealized_pl: 725.0
        weight: 0.43
      - symbol: MSFT
        quantity: 30.0
        average_cost: 390.0
        market_value: 12459.0
        unrealized_pl: 759.0
        weight: 0.57
      analyzed_stocks:
      - symbol: AAPL
        company_name: Apple Inc.
        sector: Technology
        current_price: 189.5
        change_percent: 1.23
        data_points: 3
        price_series:
        - date: '2026-04-01'
          close: 183.75
          open: 182.0
          high: 184.5
          low: 181.0
          volume: 50000000.0
        - date: '2026-04-02'
          close: 185.2
          open: 183.75
          high: 186.0
          low: 183.0
          volume: 52000000.0
        - date: '2026-04-30'
          close: 187.2
          open: 187.0
          high: 188.5
          low: 186.0
          volume: 55000000.0
      - symbol: MSFT
        company_name: Microsoft Corporation
        sector: Technology
        current_price: 415.3
        change_percent: 0.27
        data_points: 2
        price_series:
        - date: '2026-04-01'
          close: 402.5
          open: 400.0
          high: 405.0
          low: 398.0
          volume: 20000000.0
        - date: '2026-04-30'
          close: 414.2
          open: 413.0
          high: 415.0
          low: 412.0
          volume: 21000000.0
      ticker_set_valid: true
      time_window_valid: true
  edges:
  - - n1
    - n2
critical_actions: []
