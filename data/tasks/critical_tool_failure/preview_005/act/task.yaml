instruction: Today is 2026-05-18. Review my Venmo transactions from 2026-05 for Jordan
  Lee to find the outgoing dinner payment I already sent this month, then read note
  note-101 titled "May dinner split" and verify that the payment amount is exactly
  half of the full dinner total recorded there. Tell me whether the amount is correct.
system_prompt: You are a personal finance assistant helping a user manage Venmo payments
  and shared expenses.
execution_dag:
  nodes:
  - id: n1
    tool: venmo_and_shared_expenses.read_venmo_transactions
    params:
      date_filter: 2026-05
      counterparty: Jordan Lee
    description: Read May 2026 Venmo transactions with Jordan Lee to identify the
      outgoing dinner payment amount.
    kind: lookup
  - id: n2
    tool: venmo_and_shared_expenses.read_note
    params:
      note_id: note-101
    description: Read the note containing the full dinner total for the May dinner
      split.
    kind: lookup
  - id: n3
    tool: venmo_and_shared_expenses.verify_shared_expense
    params:
      check_type: verify_split_amount
      total_amount: '84.00'
      payment_amount: '42.00'
      household_size: '2'
    description: Verify that the outgoing Jordan dinner payment amount is exactly
      half of the full dinner total.
    must_yield_keys:
    - verified
    - expected_share
    - payment_amount
    - message
    kind: verify
    must_yield:
      verified: true
      expected_share: 42.0
      payment_amount: 42.0
      message: 'Split amount verified: $42.00 equals 1/2 of $84.00'
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
