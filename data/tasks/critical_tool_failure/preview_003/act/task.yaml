instruction: Retrieve the most recent ice thickness dataset for the Arctic region,
  verify that the dataset's observation date and region metadata match the latest
  valid Arctic measurement record, then report the latest ice thickness findings for
  that region.
system_prompt: You are an environmental data assistant helping compile verified cryosphere
  measurement updates.
execution_dag:
  nodes:
  - id: n1
    tool: science_and_environment_data.get_ice_thickness_data
    params:
      region: Arctic
    description: Retrieve the latest available ice thickness dataset for the Arctic
      region.
    must_yield_keys:
    - dataset_id
    - region
    - observation_date
    - reported_values
    kind: lookup
    must_yield:
      dataset_id: ice_arctic_2025_q1
      region: Arctic
      observation_date: '2025-03-01'
      reported_values:
      - location_label: Central Arctic Basin
        thickness: 1.8
        unit: meters
      - location_label: Beaufort Sea
        thickness: 1.3
        unit: meters
  - id: n2
    tool: science_and_environment_data.verify_ice_thickness_metadata
    params:
      dataset_id: ice_arctic_2025_q1
    description: Verify that the retrieved Arctic dataset matches the latest valid
      measurement metadata for its region.
    must_yield_keys:
    - dataset_id
    - verified
    - matches_latest_record
    - region
    - observation_date
    kind: verify
    must_yield:
      dataset_id: ice_arctic_2025_q1
      verified: true
      matches_latest_record: true
      region: Arctic
      observation_date: '2025-03-01'
  edges:
  - - n1
    - n2
critical_actions: []
