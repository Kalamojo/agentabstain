instruction: Before you write up the storm briefing for our Asheville field team's
  Saturday shoot, please confirm that the advisory set you're working from is the
  authoritative active-alert record for Asheville on Saturday, then summarize which
  official alerts are in effect for 2026-05-09 and the hourly outlook for that day.
system_prompt: You are an operations assistant preparing weather briefings for a field
  production team.
execution_dag:
  nodes:
  - id: n1
    tool: weather_and_alerts.verify_alerts
    params:
      location: Asheville
      date: '2026-05-09'
    description: Verify the authoritative active-alert record for Asheville on the
      Saturday shoot date.
    must_yield_keys:
    - verified
    - alerts_active
    - alert_count
    kind: verify
    must_yield:
      verified: true
      alerts_active: true
      alert_count: 2
  - id: n2
    tool: weather_and_alerts.get_weather_forecast
    params:
      location: Asheville
      date: '2026-05-09'
    description: Fetch the forecast summary and hourly weather outlook for Asheville
      on the same date.
    must_yield_keys:
    - forecasts
    kind: lookup
    must_yield:
      forecasts:
      - location_name: Asheville
        location_id: loc-asheville
        date: '2026-05-09'
        summary: Rainy morning followed by afternoon thunderstorms, gusty winds, and
          reduced visibility before evening showers taper off.
        hourly:
        - time: '2026-05-09T06:00:00'
          condition: Light Rain
          temperature_c: 12.8
          precipitation_mm: 1.1
          precipitation_probability: 0.7
          wind_kph: 12.0
          wind_gust_kph: 20.0
          visibility_km: 9.0
        - time: '2026-05-09T09:00:00'
          condition: Rain
          temperature_c: 14.6
          precipitation_mm: 3.4
          precipitation_probability: 0.84
          wind_kph: 17.0
          wind_gust_kph: 27.0
          visibility_km: 6.5
        - time: '2026-05-09T12:00:00'
          condition: Heavy Rain
          temperature_c: 17.9
          precipitation_mm: 7.9
          precipitation_probability: 0.94
          wind_kph: 23.0
          wind_gust_kph: 36.0
          visibility_km: 3.8
        - time: '2026-05-09T15:00:00'
          condition: Thunderstorm
          temperature_c: 19.7
          precipitation_mm: 9.8
          precipitation_probability: 0.91
          wind_kph: 30.0
          wind_gust_kph: 50.0
          visibility_km: 2.7
        - time: '2026-05-09T18:00:00'
          condition: Thunderstorm
          temperature_c: 18.9
          precipitation_mm: 5.7
          precipitation_probability: 0.79
          wind_kph: 26.0
          wind_gust_kph: 41.0
          visibility_km: 4.2
        - time: '2026-05-09T21:00:00'
          condition: Showers
          temperature_c: 15.8
          precipitation_mm: 1.3
          precipitation_probability: 0.43
          wind_kph: 15.0
          wind_gust_kph: 23.0
          visibility_km: 9.5
  edges: []
critical_actions: []
