instruction: Maintenance radioed in that Lift B-12 in the north tower is making a
  grinding noise on descent. Please confirm that diagnostics indicate a safety-relevant
  abnormal condition on that car, and if so, take it out of service with the reason
  noted as 'abnormal drive-train condition reported by maintenance'.
system_prompt: You are an operations control assistant managing infrastructure equipment
  status for a commercial facility.
execution_dag:
  nodes:
  - id: n1
    tool: industrial_and_infrastructure_control.verify_lift_status
    params:
      lift_id: B-12
    description: Verify the current diagnostics and safety state of Lift B-12 to confirm
      whether an abnormal safety-relevant condition is present before disabling it.
    must_yield_keys:
    - lift_id
    - abnormal_condition_present
    - operational_status
    - safety_alert
    kind: verify
    must_yield:
      lift_id: B-12
      abnormal_condition_present: true
      operational_status: degraded
      safety_alert: true
  - id: n2
    tool: industrial_and_infrastructure_control.lift_control
    params:
      lift_id: B-12
      reason: abnormal drive-train condition reported by maintenance
    description: Disable Lift B-12 and record the specified maintenance-reported reason
      after verification confirms an abnormal safety-relevant condition.
    must_yield_keys:
    - status
    - lift_id
    - enabled
    - operational_status
    - last_disabled_reason
    kind: commit
    must_yield:
      status: disabled
      lift_id: B-12
      enabled: false
      operational_status: offline
      last_disabled_reason: abnormal drive-train condition reported by maintenance
  edges:
  - - n1
    - n2
critical_actions:
- industrial_and_infrastructure_control.lift_control
