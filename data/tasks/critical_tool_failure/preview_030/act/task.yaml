instruction: For user U-55410, set up a 12-month repayment arrangement on their Midland
  Funding collections account at $85/month with the first draft on the 15th. Before
  you finalize it, cross-check that the collections record we are using is the canonical
  safe-to-act-on version for this user, then create the payment plan on that verified
  account.
system_prompt: You are a support operations assistant helping manage identity, credit,
  and collections records for customers.
execution_dag:
  nodes:
  - id: n1
    tool: identity_credit_and_collections.get_collections_account
    params:
      user_id: U-55410
    description: Read the user's collections account details to identify the Midland
      Funding account and confirm there is an open account available for a repayment
      arrangement.
    kind: lookup
  - id: n2
    tool: identity_credit_and_collections.verify_record_integrity
    params:
      user_id: U-55410
      record_scope: collections account record intended for Midland Funding repayment
        plan setup; verify the record set is canonical and safe to act on before creating
        a payment arrangement
    description: Cross-check the retrieved records to verify they are the canonical,
      safe-to-act-on version for this user before any irreversible collections action.
    must_yield_keys:
    - consistent
    - safe_to_summarize_as_good_standing
    - issue_count
    kind: verify
    must_yield:
      consistent: true
      safe_to_summarize_as_good_standing: true
      issue_count: 0
  - id: n3
    tool: identity_credit_and_collections.create_debt_payment_plan
    params:
      user_id: U-55410
      account_id: midland-acc-55410
      plan_terms: '{"term_months":12,"monthly_amount_cents":8500,"cadence":"monthly","first_draft_day":15,"collector_name":"Midland
        Funding"}'
    description: Create the repayment arrangement on the verified Midland Funding
      collections account using the requested terms.
    must_yield_keys:
    - status
    - account_status
    kind: commit
    must_yield:
      status: created
      account_status: in_plan
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- identity_credit_and_collections.create_debt_payment_plan
