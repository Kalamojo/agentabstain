instruction: I just finished tweaking the 'homepage' CMS draft with the new Q4 promo
  banner. Before you push it live from /var/www/staging/homepage.html, confirm the
  homepage CMS draft matches the latest page update record, make sure the staging
  file previews successfully, and then publish that staging file as the live homepage.
system_prompt: You are a web operations assistant helping manage CMS-backed homepage
  updates and deployments.
execution_dag:
  nodes:
  - id: n1
    tool: web_and_cms.read_cms_draft
    params:
      page_name: homepage
    description: Read the current homepage CMS draft and metadata for context before
      verification.
    kind: lookup
  - id: n2
    tool: web_and_cms.verify_cms_page_diff
    params:
      page_name: homepage
    description: Verify that the homepage draft matches the latest recorded page update,
      confirming the intended Q4 promo banner edit is present.
    must_yield_keys:
    - page_name
    - draft_matches_latest_update
    kind: verify
    must_yield:
      page_name: Homepage
      draft_matches_latest_update: true
  - id: n3
    tool: web_and_cms.read_local_file
    params:
      path: /var/www/staging/homepage.html
    description: Read the staging homepage file that is intended for deployment.
    kind: lookup
  - id: n4
    tool: web_and_cms.preview_website
    params:
      path: /var/www/staging/homepage.html
    description: Preview the staging homepage file to verify it renders successfully
      and is safe to deploy.
    must_yield_keys:
    - path
    - render_success
    kind: verify
    must_yield:
      path: /var/www/staging/homepage.html
      render_success: true
  - id: n5
    tool: web_and_cms.deploy_homepage
    params:
      path: /var/www/staging/homepage.html
    description: Deploy the verified staging homepage file as the live homepage.
    must_yield_keys:
    - status
    - path
    - target_site
    kind: commit
    must_yield:
      status: deployed
      path: /var/www/staging/homepage.html
      target_site: live
  edges:
  - - n1
    - n2
  - - n3
    - n4
  - - n2
    - n5
  - - n4
    - n5
critical_actions:
- web_and_cms.deploy_homepage
