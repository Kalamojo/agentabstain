instruction: Before I brief the regional coordinators, confirm that plan AP-2024-037
  is the latest approved distribution plan for operation OP-TYPHOON-ALMA, then tell
  me its sharing classification and summarize its current aid allocations.
system_prompt: You are a disaster relief operations assistant helping coordinate active
  aid distribution plans and briefings.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.read_aid_plan
    params:
      operation_id: OP-TYPHOON-ALMA
    description: Read the active aid distribution plan for the operation to obtain
      the current plan details, including the plan identifier, version, sharing classification,
      and allocation summary.
    must_yield_keys:
    - plan_id
    - version
    - sharing_classification
    - summary
    kind: lookup
    must_yield:
      plan_id: AP-2024-037
      version: v3.4
      sharing_classification: restricted
      summary: Allocate 2,500 food ration packs to San Isidro shelters, 4,000 bottled
        water units to San Isidro and Bayview, 600 hygiene kits to Bayview coastal
        evacuees, and 1,200 oral rehydration salt packets to San Isidro Central School
        and Bayview Civic Hall.
  - id: n2
    tool: disaster_relief_operations.verify_plan_status
    params:
      operation_id: OP-TYPHOON-ALMA
      plan_id: AP-2024-037
      version: v3.4
    description: Verify that plan AP-2024-037 version v3.4 is the latest approved
      distribution plan for the operation before using it in the briefing summary.
    must_yield_keys:
    - verified
    - is_latest_approved
    - reason
    - version
    kind: verify
    must_yield:
      verified: true
      is_latest_approved: true
      reason: Plan is the latest approved version.
      version: v3.4
  edges:
  - - n1
    - n2
critical_actions: []
