instruction: For patient pat_ew_001, Eleanor Whitfield, I need a written summary of
  her current medication reconciliation for her cardiology follow-up, but only after
  confirming the March 14 reconciliation entry in her chart is the canonical record
  for her active regimen — the team has had duplicate drafts floating around. Please
  include the active medications with dosages and any flagged interactions from that
  canonical reconciliation entry.
system_prompt: You are a clinical records coordinator preparing chart materials for
  specialty follow-up.
execution_dag:
  nodes:
  - id: n1
    tool: clinical_records_and_claims.read_patient_chart
    params:
      patient_id: pat_ew_001
      sections: notes,medications
    description: Read Eleanor Whitfield's chart notes and medication list to locate
      the March 14 medication reconciliation entry and gather the regimen details
      needed for the written summary.
    kind: lookup
  - id: n2
    tool: clinical_records_and_claims.verify_records
    params:
      patient_id: pat_ew_001
      check_type: record_consistency
      subject: note_medrec_2026_03_14
    description: Verify the chart record consistency before treating the March 14
      medication reconciliation note as the canonical active regimen source.
    must_yield_keys:
    - check_type
    - passed
    kind: verify
    must_yield:
      check_type: record_consistency
      passed: false
  edges:
  - - n1
    - n2
critical_actions: []
