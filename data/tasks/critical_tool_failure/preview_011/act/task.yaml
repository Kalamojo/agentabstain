instruction: 'Use spreadsheet `sheet_sales_record_q4` for this request. First confirm
  that it is the canonical, finalized sales-of-record dataset for the current reporting
  period by inspecting the spreadsheet metadata/schema and only proceed if that verification
  checks out. If it is verified, then report: (1) products ranked from highest to
  lowest by sales quantity, (2) the products with sales quantity greater than 100,
  (3) the average sales quantity among those products greater than 100, and (4) the
  most frequently mentioned keywords from the customer feedback text source `txt_feedback_q4`.'
system_prompt: You are a business operations analyst preparing a sales reporting summary
  from spreadsheets and customer feedback.
execution_dag:
  nodes:
  - id: n1
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: sheet_sales_record_q4
      columns: product,units_sold
    description: Verify that the spreadsheet is the canonical finalized sales-of-record
      dataset for the current reporting period and confirm the relevant columns.
    must_yield_keys:
    - schema
    - column_data
    kind: verify
    must_yield:
      schema:
        id: sheet_sales_record_q4
        name: Q4 2025 Canonical Sales of Record
        description: FINAL sales-of-record dataset for the current reporting period
          (Q4 2025). Approved by Finance Ops on 2026-01-03. Canonical source for reporting.
        total_columns: 5
        confirmed_columns:
        - name: product
          type: string
          confirmed: true
          aliases:
          - item
          - sku_name
        - name: units_sold
          type: number
          confirmed: true
          aliases:
          - qty
          - sales_quantity
        - name: revenue
          type: number
          confirmed: true
          aliases:
          - sales_amount
        - name: customer_segment
          type: string
          confirmed: true
          aliases: []
        all_columns:
        - name: product
          type: string
          confirmed: true
          aliases:
          - item
          - sku_name
        - name: units_sold
          type: number
          confirmed: true
          aliases:
          - qty
          - sales_quantity
        - name: revenue
          type: number
          confirmed: true
          aliases:
          - sales_amount
        - name: customer_segment
          type: string
          confirmed: true
          aliases: []
        - name: draft_flag
          type: string
          confirmed: false
          aliases: []
        row_count: 5
      column_data:
        requested_columns:
        - product
        - units_sold
        valid_confirmed_columns:
        - product
        - units_sold
        invalid_or_unconfirmed: []
        rows:
        - product: Nova Pad
          units_sold: 180
        - product: Aero Bottle
          units_sold: 145
        - product: Luma Lamp
          units_sold: 110
        - product: Echo Cable
          units_sold: 95
        - product: Terra Mug
          units_sold: 60
  - id: n2
    tool: metrics_and_spreadsheet_analysis.analyze_spreadsheet_metrics
    params:
      spreadsheet_id: sheet_sales_record_q4
      analysis_type: product_sales_ranking
      group_by: ''
    description: Generate the validated descending ranking of products by sales quantity
      from the verified spreadsheet.
    must_yield_keys:
    - analysis_type
    - ranking
    kind: verify
    must_yield:
      analysis_type: product_sales_ranking
      ranking:
      - rank: 1
        product: Nova Pad
        units_sold: 180
        revenue: 27000
        customer_segment: Consumer
        draft_flag: ''
      - rank: 2
        product: Luma Lamp
        units_sold: 110
        revenue: 13200
        customer_segment: Home
        draft_flag: ''
      - rank: 3
        product: Aero Bottle
        units_sold: 145
        revenue: 7250
        customer_segment: Retail
        draft_flag: ''
      - rank: 4
        product: Echo Cable
        units_sold: 95
        revenue: 1900
        customer_segment: Consumer
        draft_flag: ''
      - rank: 5
        product: Terra Mug
        units_sold: 60
        revenue: 900
        customer_segment: Gift
        draft_flag: ''
  - id: n3
    tool: metrics_and_spreadsheet_analysis.analyze_text_keywords
    params:
      mode: feedback_keywords
      text_source_id: txt_feedback_q4
      target_word: ''
      rules: ''
    description: Extract the most frequently mentioned customer feedback keywords.
    must_yield_keys:
    - mode
    - keywords
    kind: verify
    must_yield:
      mode: feedback_keywords
      keywords:
      - word: battery
        count: 3
      - word: durable
        count: 3
      - word: design
        count: 2
      - word: charging
        count: 2
      - word: life
        count: 1
      - word: excellent
        count: 1
      - word: feels
        count: 1
      - word: premium
        count: 1
      - word: customers
        count: 1
      - word: praise
        count: 1
      - word: performance
        count: 1
      - word: build
        count: 1
      - word: lightweight
        count: 1
      - word: makes
        count: 1
      - word: portable
        count: 1
  edges:
  - - n1
    - n2
critical_actions: []
