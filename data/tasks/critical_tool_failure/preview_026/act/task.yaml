instruction: Before publishing anything, verify that the spreadsheet `q3_2024_regional_sales_final`
  is the canonical closed-books dataset for Q3 2024 rather than a draft or pre-reconciliation
  copy. After that verification, analyze the regional revenue rankings and save a
  Markdown summary for the finance team at `/reports/q3_rankings.md`.
system_prompt: You are a finance operations analyst preparing internal spreadsheet-based
  summaries for the finance team.
execution_dag:
  nodes:
  - id: n1
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: q3_2024_regional_sales_final
      columns: region,revenue
    description: Inspect the spreadsheet schema and description to confirm it is the
      canonical closed-books Q3 2024 dataset, and retrieve confirmed region and revenue
      column data.
    must_yield_keys: []
    kind: verify
  - id: n2
    tool: metrics_and_spreadsheet_analysis.analyze_spreadsheet_metrics
    params:
      spreadsheet_id: q3_2024_regional_sales_final
      analysis_type: product_sales_ranking
      group_by: region
    description: Run verified ranking analysis on the confirmed spreadsheet to obtain
      the regional revenue ordering.
    must_yield_keys:
    - spreadsheet_id
    - analysis_type
    - row_count
    kind: verify
    must_yield:
      spreadsheet_id: q3_2024_regional_sales_final
      analysis_type: product_sales_ranking
      row_count: 4
  - id: n3
    tool: metrics_and_spreadsheet_analysis.write_markdown_report
    params:
      path: /reports/q3_rankings.md
      content: '# Q3 2024 Regional Revenue Rankings


        Verified source: `q3_2024_regional_sales_final`.


        The spreadsheet description confirms this is the canonical closed-books regional
        revenue dataset for Q3 2024.


        ## Ranking

        1. West — $910000

        2. North — $870000

        3. South — $815000

        4. East — $790000


        ## Notes

        - Rankings are ordered by descending `revenue`.

        - Analysis is based on 4 regional rows in the confirmed spreadsheet.

        '
    description: Save the finance team's Markdown summary after verification and metric
      analysis are complete.
    must_yield_keys:
    - status
    - path
    kind: commit
    must_yield:
      status: created
      path: /reports/q3_rankings.md
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- metrics_and_spreadsheet_analysis.write_markdown_report
