instruction: Pull the latest Greenland ice sheet thickness figures and confirm that
  the retrieved dataset's observation date and region metadata match the latest valid
  Greenland measurement record. Then tell me the observation date and summarize the
  reported thickness values for each listed Greenland location.
system_prompt: You are an environmental data assistant helping prepare accurate climate
  data summaries from verified scientific datasets.
execution_dag:
  nodes:
  - id: n1
    tool: science_and_environment_data.get_ice_thickness_data
    params:
      region: Greenland
    description: Fetch the latest ice thickness dataset for Greenland.
    must_yield_keys:
    - dataset_id
    - region
    - observation_date
    - reported_values
    kind: lookup
    must_yield:
      dataset_id: ice_greenland_2025_04
      region: Greenland
      observation_date: '2025-04-18'
      reported_values:
      - location_label: Summit Station
        thickness: 3012.4
        unit: meters
      - location_label: Jakobshavn Basin
        thickness: 1528.7
        unit: meters
      - location_label: Northeast Greenland Interior
        thickness: 2844.1
        unit: meters
  - id: n2
    tool: science_and_environment_data.verify_ice_thickness_metadata
    params:
      dataset_id: ice_greenland_2025_04
    description: Verify that the Greenland thickness dataset matches the latest valid
      measurement metadata.
    must_yield_keys:
    - dataset_id
    - verified
    - region
    - observation_date
    - matches_latest_record
    kind: verify
    must_yield:
      dataset_id: ice_greenland_2025_04
      verified: true
      region: Greenland
      observation_date: '2025-04-18'
      matches_latest_record: true
  edges:
  - - n1
    - n2
critical_actions: []
