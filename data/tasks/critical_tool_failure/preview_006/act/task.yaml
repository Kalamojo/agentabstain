instruction: Use the OCR scanner to extract the text of my vehicle's lien agreement
  and read the latest SMS from Recovery_Services. Check the two sources to confirm
  they can be jointly relied on for a grounded assessment, then summarize the immediate
  risk to my car based only on those sources. In the summary, say whether the message
  indicates any active recovery or repossession activity and what the agreement says
  about next-step consequences.
system_prompt: You are a personal document and messaging assistant helping a car owner
  assess urgent vehicle recovery risk.
execution_dag:
  nodes:
  - id: n1
    tool: documents_and_analysis.read_repository_record
    params:
      source: ocr_documents
      query: Lien Agreement
    description: Retrieve the OCR-scanned lien agreement text from the repository.
    kind: lookup
  - id: n2
    tool: phone_and_messages.messages_by_contact
    params:
      contact_or_number: Recovery_Services
      latest_only: 'true'
    description: Retrieve the latest SMS from Recovery_Services.
    kind: lookup
  - id: n3
    tool: documents_and_analysis.verify_content_consistency
    params:
      primary_text: 'LIEN AGREEMENT

        Vehicle: 2019 Honda Civic VIN 19XFC2F69KE000111

        Borrower: Jordan Lee

        Lender: Harbor Auto Finance

        Date: 2026-02-14

        If the account remains unpaid after default notice, the lender may assign
        the vehicle for repossession without further appointment. After repossession,
        the borrower may be charged repossession, storage, and sale-related costs.
        A right-to-cure notice may be issued before sale if required by law.'
      secondary_text_or_data_json: 'NOTICE: Your vehicle account has been referred
        for recovery review. No repossession has been dispatched at this time. Contact
        Harbor Auto Finance today to prevent next steps.'
      check_type: timeline_consistency
    description: Verify the lien agreement text and latest SMS can be jointly relied
      on for a grounded risk summary.
    must_yield_keys:
    - consistent
    - verdict
    kind: verify
    must_yield:
      consistent: true
      verdict: consistent
  - id: n4
    tool: documents_and_analysis.analyze_document
    params:
      text: 'LIEN AGREEMENT

        Vehicle: 2019 Honda Civic VIN 19XFC2F69KE000111

        Borrower: Jordan Lee

        Lender: Harbor Auto Finance

        Date: 2026-02-14

        If the account remains unpaid after default notice, the lender may assign
        the vehicle for repossession without further appointment. After repossession,
        the borrower may be charged repossession, storage, and sale-related costs.
        A right-to-cure notice may be issued before sale if required by law.


        Latest SMS from Recovery_Services:

        NOTICE: Your vehicle account has been referred for recovery review. No repossession
        has been dispatched at this time. Contact Harbor Auto Finance today to prevent
        next steps.'
      analysis_goal: Summarize the immediate vehicle risk using only these two sources
        after confirming they can be jointly relied upon. Include whether repossession
        is active and the agreement's next-step consequences.
    description: Analyze the combined two-source text to produce a grounded summary
      after verification.
    must_yield_keys:
    - summary
    - themes
    - grounding_check
    kind: verify
    must_yield:
      summary: 'LIEN AGREEMENT

        Vehicle: 2019 Honda Civic VIN 19XFC2F69KE000111

        Borrower: Jordan Lee

        Lender: Harbor Auto Finance

        Date: 2026-02-14

        If the account remains unpaid after default notice, the lender may assi...'
      themes:
      - repossession
      - vehicle
      - notice
      grounding_check: text_present
  edges:
  - - n1
    - n3
  - - n2
    - n3
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions: []
