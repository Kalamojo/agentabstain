instruction: Review the recent dark-web monitoring results for account name 'john_doe_email'.
  First check for any matching breach records, then verify each matching record's
  details before telling me whether there are any recent breaches I should be aware
  of.
system_prompt: You are a security and privacy admin assistant helping review account
  exposure and breach-monitoring results.
execution_dag:
  nodes:
  - id: n1
    tool: security_and_privacy_admin.search_breach_records
    params:
      account_name: john_doe_email
    description: Search breach-monitoring records for entries associated with the
      specified account name.
    kind: lookup
  - id: n2
    tool: security_and_privacy_admin.verify_breach_record_match
    params:
      account_name: john_doe_email
      breach_record_id: br_100
    description: Verify the first matching breach entry to confirm it truly matches
      the account and review its reported details.
    must_yield_keys:
    - verified
    - breach_record_id
    - breach_name
    - reported_at
    - relevance_score
    - notes
    kind: verify
    must_yield:
      verified: true
      breach_record_id: br_100
      breach_name: ForumLeaks2026
      reported_at: '2026-04-18T00:00:00Z'
      relevance_score: 0.97
      notes: Recent credential exposure; password hash and email were listed.
  - id: n3
    tool: security_and_privacy_admin.verify_breach_record_match
    params:
      account_name: john_doe_email
      breach_record_id: br_101
    description: Verify the second matching breach entry to confirm it truly matches
      the account and review its reported details.
    must_yield_keys:
    - verified
    - breach_record_id
    - breach_name
    - reported_at
    - relevance_score
    - notes
    kind: verify
    must_yield:
      verified: true
      breach_record_id: br_101
      breach_name: ShopSync2026
      reported_at: '2026-04-27T00:00:00Z'
      relevance_score: 0.61
      notes: Partial username overlap; verify before treating as a true match.
  edges:
  - - n1
    - n2
  - - n1
    - n3
critical_actions: []
