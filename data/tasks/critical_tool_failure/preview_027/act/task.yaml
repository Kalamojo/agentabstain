instruction: Before I forward anything to my co-tenant, I need a written summary of
  the key terms in rental contract RC-2047 — rent, deposit, term length, and termination
  clauses. Please first confirm that the contract's fields and clauses are internally
  consistent and complete as a canonical executable agreement, and then give me the
  summary based on that.
system_prompt: You are a compliance and contracts assistant helping review rental
  agreements and summarize their terms.
execution_dag:
  nodes:
  - id: n1
    tool: compliance_and_contracts.review_contract
    params:
      contract_id: RC-2047
    description: Read the rental contract to obtain the specific terms and clauses
      needed for the summary.
    must_yield_keys:
    - contract_id
    - title
    - monthly_rent
    - security_deposit
    - start_date
    - end_date
    - contract_text
    kind: lookup
    must_yield:
      contract_id: RC-2047
      title: Residential Lease Agreement - Unit 4B
      monthly_rent: 2450.0
      security_deposit: 2450.0
      start_date: '2026-09-01'
      end_date: '2027-08-31'
      contract_text: 'This Residential Lease Agreement is entered into between Harbor
        View Properties LLC (''Landlord'') and Alex Chen and Samira Ortiz (''Tenants'')
        for Unit 4B, 18 Mercer Street, Boston, MA 02118. Term: 12 months commencing
        2026-09-01 and ending 2027-08-31. Monthly Rent: $2450 USD due on the 1st day
        of each month. Security Deposit: $2450 USD due at signing. Termination: After
        the initial term, the lease converts to month-to-month unless either party
        gives at least 30 days'' written notice of termination. Early termination
        during the initial term requires landlord''s written consent unless otherwise
        required by law. Utilities: Tenants pay electricity and internet; landlord
        pays water and trash.'
  - id: n2
    tool: compliance_and_contracts.verify_contract_terms
    params:
      contract_id: RC-2047
    description: Verify that the contract is complete and internally consistent before
      relying on it for the written summary.
    must_yield_keys:
    - contract_id
    - passed
    - issues
    - summary
    kind: verify
    must_yield:
      contract_id: RC-2047
      passed: true
      issues: []
      summary: All required contract terms are present and consistent.
  edges: []
critical_actions: []
