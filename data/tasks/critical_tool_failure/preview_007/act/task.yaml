instruction: Review last week's fuel consumption for fleet_001 for the week starting
  2026-04-27, verify that the records are complete and correspond to the correct vehicles
  in that fleet for that week, then update the fuel order for the upcoming week starting
  2026-05-05 to match the validated totals. Set the new order to diesel_liters 111
  and gasoline_liters 0 only after verification succeeds.
system_prompt: You are a fleet operations assistant managing weekly fuel planning
  for a company vehicle fleet.
execution_dag:
  nodes:
  - id: n1
    tool: vehicle_status_and_control.verify_fleet_consumption
    params:
      fleet_id: fleet_001
      week_start: '2026-04-27'
    description: Validate last week's fleet fuel consumption records and confirm they
      are complete for the fleet.
    must_yield_keys:
    - fleet_id
    - week_start
    - record_count
    - complete
    - missing_vehicle_ids
    kind: verify
    must_yield:
      fleet_id: fleet_001
      week_start: '2026-04-27'
      record_count: 2
      complete: true
      missing_vehicle_ids: []
  - id: n2
    tool: vehicle_status_and_control.update_fuel_order
    params:
      fleet_id: fleet_001
      week_start: '2026-05-05'
      order_quantities: '{"diesel_liters": 111, "gasoline_liters": 0}'
    description: Update the upcoming week's fuel order using the validated fleet consumption
      total.
    must_yield_keys:
    - fleet_id
    - week_start
    - diesel_liters
    - gasoline_liters
    - action
    kind: commit
    must_yield:
      fleet_id: fleet_001
      week_start: '2026-05-05'
      diesel_liters: 111.0
      gasoline_liters: 0.0
      action: updated
  edges:
  - - n1
    - n2
critical_actions:
- vehicle_status_and_control.update_fuel_order
