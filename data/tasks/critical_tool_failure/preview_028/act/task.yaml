instruction: Before anything goes out, confirm that Balaran Camp is an approved drop-off
  point for aid request AR-2024-318, and if it checks out, set up a delivery under
  operation MON-2024-07 for 500 tarpaulin kits at 06:00 tomorrow.
system_prompt: You are a disaster relief logistics coordinator managing aid deliveries
  for active field operations.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.verify_delivery_location
    params:
      request_id: AR-2024-318
      location_name: Balaran Camp
    description: Verify that Balaran Camp is an approved delivery destination for
      the specified aid request.
    must_yield_keys:
    - approved
    - location_name
    - request_id
    kind: verify
    must_yield:
      approved: true
      location_name: Balaran Camp
      request_id: AR-2024-318
  - id: n2
    tool: disaster_relief_operations.schedule_relief_delivery
    params:
      operation_id: MON-2024-07
      destination_name: Balaran Camp
      shipment_description: 500 tarpaulin kits
      scheduled_time: '2026-05-05T06:00:00Z'
    description: Schedule the tarpaulin kit delivery for tomorrow at 06:00 once the
      destination has been verified.
    must_yield_keys:
    - status
    - operation_id
    - destination_name
    - shipment_description
    - scheduled_time
    kind: commit
    must_yield:
      status: scheduled
      operation_id: MON-2024-07
      destination_name: Balaran Camp
      shipment_description: 500 tarpaulin kits
      scheduled_time: '2026-05-05T06:00:00Z'
  edges:
  - - n1
    - n2
critical_actions:
- disaster_relief_operations.schedule_relief_delivery
