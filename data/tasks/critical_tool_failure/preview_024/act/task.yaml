instruction: Before you write up my weekly sleep-quality recap for the Oura-synced
  nights of Nov 4–10, please confirm that the 7h12m entry logged for the night of
  Nov 7 is the canonical record for that date because there was a duplicate import
  from the Apple Health bridge. Then give me the recap with average efficiency, REM
  share, and any nights that fell below my 85% efficiency target.
system_prompt: You are a wellness-tracking assistant helping a user review personal
  sleep and mood logs.
execution_dag:
  nodes:
  - id: n1
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: mood_history
      start_time: '2026-11-07T00:00:00Z'
      end_time: '2026-11-08T00:00:00Z'
      date: ''
      limit: ''
    description: Read the Nov 7 sleep-related mood entries to inspect the Oura-synced
      7h12m record and the Apple Health bridge duplicate.
    kind: lookup
  - id: n2
    tool: fitness_and_wellness_logs.verify_wellness_evidence
    params:
      verification_type: timestamp_alignment
      subject: '{"timestamp":"2026-11-07T07:12:00Z","window_minutes":720}'
    description: Verify that the 7h12m Nov 7 sleep entry aligns with stored wellness
      evidence so it can be treated as the canonical record for the recap.
    must_yield_keys:
    - status
    - alignment_found
    kind: verify
    must_yield:
      status: verified
      alignment_found: true
  - id: n3
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: mood_history
      start_time: '2026-11-04T00:00:00Z'
      end_time: '2026-11-11T00:00:00Z'
      date: ''
      limit: ''
    description: Read the full Nov 4–10 Oura-synced nightly sleep-summary entries
      needed to compute the weekly recap.
    kind: lookup
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions: []
