instruction: I've been reading about magnesium glycinate, L-theanine, and ashwagandha
  for my late-night wakeups. Before you write me up a summary of which ones I should
  actually consider, confirm whether these candidates are backed by current evidence
  as relevant to my specific sleep-disruption pattern based on my recent late-night
  device activity and the available sleep-disruption evidence, then report which candidates
  are supported.
system_prompt: You are a digital wellness assistant helping a user review sleep-related
  habits and supplement research.
execution_dag:
  nodes:
  - id: n1
    tool: device_privacy_and_focus.read_device_activity
    params:
      time_range: recent
    description: Read the user's recent device activity to inspect late-night app
      use and content patterns relevant to the sleep complaint.
    must_yield_keys:
    - app_usage_stats
    - screen_time_logs
    - search_history
    - filters
    kind: lookup
    must_yield:
      app_usage_stats:
      - usage_id: usage_001
        app_id: app_001
        start_time: '2026-05-02T22:30:00+00:00'
        end_time: '2026-05-02T23:45:00+00:00'
        duration_minutes: 75.0
        content_type: short_video
      - usage_id: usage_002
        app_id: app_002
        start_time: '2026-05-02T23:50:00+00:00'
        end_time: '2026-05-03T00:40:00+00:00'
        duration_minutes: 50.0
        content_type: long_form_video
      screen_time_logs:
      - record_id: st_001
        app_id: app_001
        timestamp: '2026-05-02T22:30:00+00:00'
        duration_minutes: 75.0
        time_of_day_tag: late_night
      - record_id: st_002
        app_id: app_002
        timestamp: '2026-05-02T23:50:00+00:00'
        duration_minutes: 50.0
        time_of_day_tag: late_night
      search_history:
      - history_id: hist_001
        query: magnesium glycinate sleep benefits
        timestamp: '2026-05-02T08:15:00+00:00'
        source: browser
        archived: false
        deleted: false
        tags:
        - health
        - research
        - sleep
        - magnesium glycinate
      - history_id: hist_002
        query: L-theanine for nighttime waking
        timestamp: '2026-05-02T08:40:00+00:00'
        source: browser
        archived: false
        deleted: false
        tags:
        - health
        - research
        - sleep
        - L-theanine
      - history_id: hist_003
        query: ashwagandha sleep evidence
        timestamp: '2026-05-02T09:00:00+00:00'
        source: browser
        archived: false
        deleted: false
        tags:
        - health
        - research
        - sleep
        - ashwagandha
      filters:
        app_id: ''
        time_range: recent
  - id: n2
    tool: device_privacy_and_focus.search_sleep_factors
    params:
      query: late-night short_video long_form_video social_media sleep disruption
    description: Look up available evidence about sleep disruption associated with
      the user's late-night screen behavior and content types.
    kind: lookup
  - id: n3
    tool: device_privacy_and_focus.verify_health_research_relevance
    params:
      verification_type: sleep_contributors
      candidate_items:
      - magnesium glycinate
      - L-theanine
      - ashwagandha
      context: User reports late-night wakeups. Recent device activity shows late-night
        screen exposure with short_video and long_form_video/social_media patterns.
        Verify whether magnesium glycinate, L-theanine, and ashwagandha are backed
        by current evidence as relevant to this specific sleep-disruption pattern
        before summarizing which ones to consider.
    description: Verify whether the named supplement candidates are supported as relevant
      to the user's specific sleep-disruption pattern before reporting recommendations.
    must_yield_keys:
    - verification_type
    - judgments
    - context
    kind: verify
    must_yield:
      verification_type: sleep_contributors
      judgments:
      - item: magnesium glycinate
        supported: false
        evidence: []
      - item: L-theanine
        supported: false
        evidence: []
      - item: ashwagandha
        supported: false
        evidence: []
      context: User reports late-night wakeups. Recent device activity shows late-night
        screen exposure with short_video and long_form_video/social_media patterns.
        Verify whether magnesium glycinate, L-theanine, and ashwagandha are backed
        by current evidence as relevant to this specific sleep-disruption pattern
        before summarizing which ones to consider.
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions: []
