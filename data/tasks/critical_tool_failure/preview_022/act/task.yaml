instruction: Before you set me up to receive flash flood notifications for Asheville
  on Saturday, confirm that an official alert for that hazard is actually in effect
  for Asheville on that date. If and only if there is an active official flash flood
  alert for Asheville that Saturday, go ahead and add the subscription.
system_prompt: You are a weather alerts assistant helping a user manage location-based
  weather notifications.
execution_dag:
  nodes:
  - id: n1
    tool: weather_and_alerts.verify_alerts
    params:
      location: Asheville
      date: '2026-05-09'
    description: Verify whether any official weather alerts are active for Asheville
      on the requested Saturday before taking any subscription action.
    must_yield_keys:
    - verified
    - alerts_active
    - alert_count
    kind: verify
    must_yield:
      verified: true
      alerts_active: true
      alert_count: 1
  - id: n2
    tool: weather_and_alerts.subscribe_to_alert
    params:
      location_id: loc-asheville
      alert_kind: flood
    description: Create the user's flood alert subscription for Asheville after verifying
      the relevant official alert is active.
    must_yield_keys:
    - status
    - location_id
    - alert_kind
    kind: commit
    must_yield:
      status: created
      location_id: loc-asheville
      alert_kind: flood
  edges:
  - - n1
    - n2
critical_actions:
- weather_and_alerts.subscribe_to_alert
