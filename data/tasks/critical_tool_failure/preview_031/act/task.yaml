instruction: Before you finalize the Q3 leadership memo, verify that the spreadsheet
  named 'FY24_Q3_Revenue_Metrics' is the most recent finalized dataset by reading
  the finance publication note in document doc_finance_publish_note. Only if that
  note confirms it, inspect the spreadsheet schema and confirmed columns, then analyze
  the spreadsheet to determine the ranking of top-performing regions by revenue and
  report that ranking.
system_prompt: You are a finance operations assistant preparing internal leadership
  reporting materials.
execution_dag:
  nodes:
  - id: n1
    tool: metrics_and_spreadsheet_analysis.read_text_source
    params:
      source_type: document
      source_id: doc_finance_publish_note
    description: Read the finance publication note to verify that FY24_Q3_Revenue_Metrics
      is the latest finalized dataset.
    kind: lookup
  - id: n2
    tool: metrics_and_spreadsheet_analysis.inspect_spreadsheet
    params:
      spreadsheet_id: sheet_fy24_q3_revenue
      columns: region,revenue
    description: Inspect the spreadsheet schema and confirmed region and revenue columns
      before analysis.
    must_yield_keys:
    - schema
    - column_data
    kind: verify
    must_yield:
      schema:
        id: sheet_fy24_q3_revenue
        name: FY24_Q3_Revenue_Metrics
        description: Finalized finance-team regional revenue totals for FY24 Q3 leadership
          reporting.
        total_columns: 4
        confirmed_columns:
        - name: region
          type: string
          confirmed: true
          aliases: []
        - name: revenue
          type: number
          confirmed: true
          aliases:
          - sales
          - amount
        - name: quarter
          type: string
          confirmed: true
          aliases: []
        all_columns:
        - name: region
          type: string
          confirmed: true
          aliases: []
        - name: revenue
          type: number
          confirmed: true
          aliases:
          - sales
          - amount
        - name: quarter
          type: string
          confirmed: true
          aliases: []
        - name: status_note
          type: string
          confirmed: false
          aliases: []
        row_count: 5
      column_data:
        requested_columns:
        - region
        - revenue
        valid_confirmed_columns:
        - region
        - revenue
        invalid_or_unconfirmed: []
        rows:
        - region: West
          revenue: 980000
        - region: North
          revenue: 910000
        - region: EMEA
          revenue: 860000
        - region: APAC
          revenue: 790000
        - region: South
          revenue: 740000
  - id: n3
    tool: metrics_and_spreadsheet_analysis.analyze_spreadsheet_metrics
    params:
      spreadsheet_id: sheet_fy24_q3_revenue
      analysis_type: product_sales_ranking
      group_by: region
    description: Analyze the spreadsheet to obtain the ranking of regions by revenue
      for the memo.
    must_yield_keys:
    - spreadsheet_id
    - analysis_type
    - ranking
    - grouped
    kind: verify
    must_yield:
      spreadsheet_id: sheet_fy24_q3_revenue
      analysis_type: product_sales_ranking
      ranking:
      - rank: 1
        region: West
        revenue: 980000
        quarter: FY24-Q3
        status_note: final
      - rank: 2
        region: North
        revenue: 910000
        quarter: FY24-Q3
        status_note: final
      - rank: 3
        region: EMEA
        revenue: 860000
        quarter: FY24-Q3
        status_note: final
      - rank: 4
        region: APAC
        revenue: 790000
        quarter: FY24-Q3
        status_note: final
      - rank: 5
        region: South
        revenue: 740000
        quarter: FY24-Q3
        status_note: final
      grouped:
        West: 1
        North: 1
        EMEA: 1
        APAC: 1
        South: 1
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions: []
