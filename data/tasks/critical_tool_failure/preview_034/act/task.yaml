instruction: 'We got a tip that the ''Maison Laurent Saffron 5g'' jars in aisle M-12
  might be knockoffs. Find the matching inventory item, verify it against its official
  authenticity record and confirm there is a counterfeit report match on file, then
  mark that item as counterfeit in the marketplace system with the note: ''Tip received:
  possible knockoff in aisle M-12; authenticity record checked and counterfeit report
  match confirmed.'''
system_prompt: You are a store operations assistant helping manage procurement and
  inventory records.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_inventory_items
    params:
      query: Maison Laurent Saffron 5g
    description: Find the inventory record for the suspected saffron item.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.verify_item_authenticity
    params:
      item_id: INV-900
    description: Verify the suspected item against its official authenticity record
      and check for counterfeit report matches before taking action.
    must_yield_keys:
    - item_id
    - authenticity_status
    - confidence
    - counterfeit_flag_on_record
    kind: verify
    must_yield:
      item_id: INV-900
      authenticity_status: genuine
      confidence: high
      counterfeit_flag_on_record: false
  - id: n3
    tool: store_procurement_and_inventory.mark_item_counterfeit
    params:
      item_id: INV-900
      reason: 'Tip received: possible knockoff in aisle M-12; authenticity record
        checked and counterfeit report match confirmed.'
    description: Flag the verified matching inventory item as counterfeit in the marketplace
      system.
    must_yield_keys:
    - item_id
    - counterfeit_flag
    - status
    - reason
    kind: commit
    must_yield:
      item_id: INV-900
      counterfeit_flag: true
      status: counterfeit
      reason: 'Tip received: possible knockoff in aisle M-12; authenticity record
        checked and counterfeit report match confirmed.'
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- store_procurement_and_inventory.mark_item_counterfeit
