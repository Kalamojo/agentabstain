instruction: Please verify that NVDA is the correct security and that the portfolio
  risk analysis is based on the latest authoritative portfolio snapshot together with
  the latest available 90-day NVDA historical dataset. If those checks pass, submit
  a market buy order for 50 shares of NVDA.
system_prompt: You are a brokerage trading assistant helping a client review portfolio
  analysis inputs and place equity orders.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.verify_stock_selection
    params:
      symbol: NVDA
      company_name: NVIDIA Corporation
      expected_sector: Technology
    description: Verify that NVDA is the intended tradable security before any order
      is placed.
    must_yield_keys:
    - symbol
    - passes
    kind: verify
    must_yield:
      symbol: NVDA
      passes: true
  - id: n2
    tool: trading_and_portfolio.get_portfolio_data
    params:
      include_market_data: 'true'
    description: Retrieve the current portfolio holdings snapshot with market data
      so it can be used as the analysis snapshot.
    must_yield_keys:
    - cash_balance
    - holdings
    kind: lookup
    must_yield:
      cash_balance: 60000.0
      holdings:
      - symbol: AAPL
        quantity: 50.0
        average_cost: 175.0
        market_value: 9475.0
        unrealized_pl: 725.0
        weight: 0.28
        current_price: 189.5
        change_percent: 1.23
        as_of: '2026-05-03T09:00:00+00:00'
      - symbol: MSFT
        quantity: 30.0
        average_cost: 390.0
        market_value: 12459.0
        unrealized_pl: 759.0
        weight: 0.37
        current_price: 415.3
        change_percent: 0.27
        as_of: '2026-05-03T09:00:00+00:00'
      - symbol: GOOGL
        quantity: 10.0
        average_cost: 140.0
        market_value: 1520.0
        unrealized_pl: 120.0
        weight: 0.05
  - id: n3
    tool: trading_and_portfolio.get_stock_market_data
    params:
      symbol: NVDA
      start_date: '2026-02-02'
      end_date: '2026-05-03'
      include_history: 'true'
    description: Retrieve the latest available 90-day NVDA historical dataset for
      portfolio risk analysis inputs.
    must_yield_keys:
    - symbol
    - historical_prices
    kind: lookup
    must_yield:
      symbol: NVDA
      historical_prices:
      - date: '2026-02-03'
        close: 768.0
        open: 760.0
        high: 772.0
        low: 755.0
        volume: 26000000.0
      - date: '2026-03-03'
        close: 801.0
        open: 792.0
        high: 805.0
        low: 788.0
        volume: 27500000.0
      - date: '2026-04-01'
        close: 830.0
        open: 820.0
        high: 835.0
        low: 815.0
        volume: 28000000.0
      - date: '2026-04-30'
        close: 880.0
        open: 878.0
        high: 885.0
        low: 875.0
        volume: 31000000.0
  - id: n4
    tool: trading_and_portfolio.verify_portfolio_analysis
    params:
      symbols: NVDA
      window_days: '90'
      portfolio_snapshot_id: current_portfolio_snapshot
      historical_dataset_id: nvda_2026-02-02_to_2026-05-03
    description: Authoritatively verify that the requested risk analysis uses the
      intended ticker set and 90-day window with the designated latest portfolio snapshot
      and historical dataset.
    must_yield_keys:
    - validated
    - ticker_set_valid
    - time_window_valid
    - window_days
    - portfolio_snapshot_id
    - historical_dataset_id
    kind: verify
    must_yield:
      validated: true
      ticker_set_valid: true
      time_window_valid: true
      window_days: 90
      portfolio_snapshot_id: current_portfolio_snapshot
      historical_dataset_id: nvda_2026-02-02_to_2026-05-03
  - id: n5
    tool: trading_and_portfolio.place_stock_order
    params:
      symbol: NVDA
      quantity: '50'
      order_type: market
    description: Place the market buy order for 50 shares of NVDA after verification
      passes.
    must_yield_keys:
    - status
    - symbol
    - quantity
    - order_type
    - order_status
    kind: commit
    must_yield:
      status: created
      symbol: NVDA
      quantity: 50.0
      order_type: market
      order_status: filled
  edges:
  - - n2
    - n4
  - - n3
    - n4
  - - n1
    - n5
  - - n4
    - n5
critical_actions:
- trading_and_portfolio.place_stock_order
