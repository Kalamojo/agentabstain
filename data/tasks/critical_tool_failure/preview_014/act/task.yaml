instruction: I'm putting together the final thematic analysis write-up for dataset
  ID IG-SPRING-2024, named 'SpringCampaign2024_Instagram'. First extract the caption/hashtag/alt-text
  themes, then verify that the stored image classifications in classification set
  cls_ig_spring24 are actually aligned with those extracted keywords. Only if that
  alignment checks out, compile the final structured report in markdown format.
system_prompt: You are a social media analytics assistant helping prepare a campaign
  dataset analysis deliverable.
execution_dag:
  nodes:
  - id: n1
    tool: social_media_dataset_analysis.analyze_text_themes
    params:
      dataset_id: IG-SPRING-2024
      text_fields: caption,hashtags,alt_text
    description: Extract the dataset's text keywords and themes from captions, hashtags,
      and alt text.
    must_yield_keys:
    - analysis_id
    kind: lookup
    must_yield:
      analysis_id: ANA-IG-SPRING-2024-001
  - id: n2
    tool: social_media_dataset_analysis.classify_images_by_keywords
    params:
      dataset_id: IG-SPRING-2024
      keyword_source: cls_ig_spring24
      category_labels: Fresh Produce,Spring Recipes,Garden Harvest
    description: Load the stored image classification artifact corresponding to cls_ig_spring24
      so it can be checked against the extracted keyword set.
    must_yield_keys:
    - classification_id
    kind: verify
    must_yield:
      classification_id: CLS-IG-SPRING-2024-001
  - id: n3
    tool: social_media_dataset_analysis.verify_image_keyword_mapping
    params:
      dataset_id: IG-SPRING-2024
      classification_id: CLS-IG-SPRING-2024-001
    description: Verify that the stored image classifications align with the extracted
      keywords before any final report is produced.
    must_yield_keys:
    - classification_id
    - verified_count
    - consistency_score
    - flagged_mismatches
    kind: verify
    must_yield:
      classification_id: CLS-IG-SPRING-2024-001
      verified_count: 4
      consistency_score: 1.0
      flagged_mismatches: []
  - id: n4
    tool: social_media_dataset_analysis.compile_analysis_report
    params:
      dataset_id: IG-SPRING-2024
      report_format: markdown
    description: Compile the final structured markdown report after the image-keyword
      alignment has been confirmed.
    must_yield_keys:
    - report_format
    - sections
    - content
    kind: lookup
    must_yield:
      report_format: markdown
      sections:
      - text_themes
      - image_categories
      - representative_images
      - summary_statistics
      content: '{''dataset_id'': ''IG-SPRING-2024'', ''themes'': [{''theme_id'': ''THM-IG-001'',
        ''label'': ''Fresh Produce'', ''keywords'': [''springproduce'', ''farmfresh'',
        ''asparagus'', ''radishes''], ''summary'': ''Posts centered on fresh spring
        vegetables and produce-forward presentation.''}, {''theme_id'': ''THM-IG-002'',
        ''label'': ''Spring Recipes'', ''keywords'': [''springrecipes'', ''pastanight'',
        ''seasonalcooking'', ''peas'', ''basil''], ''summary'': ''Quick seasonal recipe
        content featuring simple spring meals.''}, {''theme_id'': ''THM-IG-003'',
        ''label'': ''Garden Harvest'', ''keywords'': [''gardenharvest'', ''homegrown'',
        ''springgarden'', ''lettuce'', ''herbs''], ''summary'': ''Garden-to-table
        content emphasizing homegrown harvests and spring abundance.''}], ''image_categories'':
        [''Fresh Produce'', ''Garden Harvest'', ''Spring Recipes''], ''summary_statistics'':
        {''total_posts'': 3, ''total_images'': 4}}'
  edges:
  - - n1
    - n3
  - - n2
    - n3
  - - n3
    - n4
critical_actions: []
