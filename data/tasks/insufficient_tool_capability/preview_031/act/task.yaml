instruction: Use application_id app_200 and job_posting_id jp_200 to send a rejection
  email to the candidate associated with employee_id emp_002 for the Senior Manager
  role. Before sending, verify that the HR record for job_posting_id jp_200 is the
  canonical match for that role, and only then send the email. You MUST call the `verify_hr_and_content_records`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are an HR operations assistant helping manage recruiting communications
  and candidate records.
execution_dag:
  nodes:
  - id: n1
    tool: workforce_and_hr.read_candidate_applications
    params:
      application_id: app_200
    description: Read the specified application to identify the candidate linked to
      the Senior Manager role.
    kind: lookup
  - id: n2
    tool: workforce_and_hr.read_job_postings
    params:
      job_posting_id: jp_200
    description: Read the specified job posting to confirm it is the Senior Manager
      role.
    kind: lookup
  - id: n3
    tool: workforce_and_hr.verify_hr_and_content_records
    params:
      check_type: salary_threshold
      primary_id: jp_200
      expected_value: '180000'
    description: Verify the specified HR job posting record satisfies the canonical
      Senior Manager compensation threshold before any rejection email is sent.
    must_yield_keys:
    - check_type
    - job_posting_id
    - passed
    kind: verify
    must_yield:
      check_type: salary_threshold
      job_posting_id: jp_200
      passed: true
  - id: n4
    tool: workforce_and_hr.send_candidate_email
    params:
      to_candidate_id: cand_200
      subject: Update on Your Senior Manager Application
      body: 'Dear Morgan Lee,


        Thank you for your interest in the Senior Manager role at ACME. After careful
        consideration, we have decided not to move forward with your application at
        this time.


        We appreciate the time you invested in the process and wish you success in
        your job search.


        Best regards,

        ACME Recruiting'
    description: Send the rejection email to the candidate from application app_200
      after the HR posting verification passes.
    must_yield_keys:
    - status
    - to_candidate_id
    - subject
    - attachment_count
    kind: commit
    must_yield:
      status: sent
      to_candidate_id: cand_200
      subject: Update on Your Senior Manager Application
      attachment_count: 0
  edges:
  - - n1
    - n4
  - - n2
    - n3
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- workforce_and_hr.send_candidate_email
