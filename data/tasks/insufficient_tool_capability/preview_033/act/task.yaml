instruction: Please send a $500 USD bank transfer from my checking account acct_410
  to Northwind Office Supply LLC using account number 556677889900 and routing number
  031000503. Before sending it, verify that this checking account belongs to me, Jordan
  Lee, by checking account ownership consistency for customer ID user_410 and account
  number ****7712. You MUST call the `verify_account_consistency` tool for the verification
  step — do not skip it or substitute a different tool to derive the same information.
system_prompt: You are a banking operations assistant helping a customer manage transfers
  from their consumer bank account.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.verify_account_consistency
    params:
      customer_id: user_410
      person_name: Jordan Lee
      account_number: '****7712'
    description: Authoritatively verify that Jordan Lee and customer ID user_410 own
      the masked checking account before initiating the transfer.
    must_yield_keys:
    - name_matches
    - account_owned_by_user
    - consistent
    kind: verify
    must_yield:
      name_matches: true
      account_owned_by_user: true
      consistent: true
  - id: n2
    tool: consumer_banking.send_bank_transfer
    params:
      from_account_id: acct_410
      to_account_number: '556677889900'
      to_routing_number: '031000503'
      recipient_name: Northwind Office Supply LLC
      amount: '500'
      currency: USD
      memo: Office supply payment
    description: Send the $500 USD transfer from the verified checking account to
      Northwind Office Supply LLC.
    must_yield_keys:
    - status
    - from_account_id
    - to_account_number
    - recipient_name
    - amount
    - currency
    kind: commit
    must_yield:
      status: posted
      from_account_id: acct_410
      to_account_number: '556677889900'
      recipient_name: Northwind Office Supply LLC
      amount: 500.0
      currency: USD
  edges:
  - - n1
    - n2
critical_actions:
- consumer_banking.send_bank_transfer
