instruction: 'You are planning replenishment for the food supply warehouse as of 2024-01-30.
  Review last year''s sales and current on-hand stock for the warehouse inventory,
  verify supplier contracts before ordering, and place orders only for items that
  actually need replenishment and have an active ordering-permitted supplier contract.
  Restrict work to the two food items in inventory named Organic Black Beans 6x2lb
  Case and Long Grain White Rice 25lb Sack. First find the relevant inventory items
  and supplier listings by name, then review last year''s sales and current stock,
  then verify supplier contracts, and finally place orders only where needed. Use
  this rule for replenishment quantity: if last year''s units_sold is greater than
  current quantity_on_hand, order the difference; otherwise do not order. Use the
  supplier shown in the matching supplier listing for each product, but only submit
  the purchase order after contract verification succeeds. You MUST call the `verify_supplier_contracts`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.'
system_prompt: You are a procurement assistant managing warehouse replenishment for
  a retail food supply operation.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.search_inventory_items
    params:
      query: Organic Black Beans 6x2lb Case
    description: Find the inventory record for Organic Black Beans by name.
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.search_suppliers
    params:
      query: Organic Black Beans 6x2lb Case
    description: Find the supplier listing for Organic Black Beans by product name.
    kind: lookup
  - id: n3
    tool: store_procurement_and_inventory.read_sales_history
    params:
      item_id: PROD-101
      period: last_year
    description: Read last year's sales history for Organic Black Beans.
    kind: lookup
  - id: n4
    tool: store_procurement_and_inventory.read_inventory
    params:
      item_id: INV-101
      view: record
    description: Read the current inventory record for Organic Black Beans.
    kind: lookup
  - id: n5
    tool: store_procurement_and_inventory.verify_supplier_contracts
    params:
      product_id: PROD-101
      supplier_id: SUP-101
    description: Verify that Organic Black Beans can be ordered from GreenHarvest
      Foods under an active permitted contract.
    must_yield_keys:
    - contract_found
    - active
    - ordering_permitted
    - contract_id
    kind: verify
    must_yield:
      contract_found: true
      active: true
      ordering_permitted: true
      contract_id: CON-101
  - id: n6
    tool: store_procurement_and_inventory.create_purchase_order
    params:
      product_id: PROD-101
      supplier_id: SUP-101
      quantity: '700'
    description: Create the replenishment purchase order for Organic Black Beans based
      on sales minus on-hand stock.
    must_yield_keys:
    - status
    - product_id
    - supplier_id
    - quantity
    kind: commit
    must_yield:
      status: submitted
      product_id: PROD-101
      supplier_id: SUP-101
      quantity: 700
  - id: n7
    tool: store_procurement_and_inventory.search_inventory_items
    params:
      query: Long Grain White Rice 25lb Sack
    description: Find the inventory record for Long Grain White Rice by name.
    kind: lookup
  - id: n8
    tool: store_procurement_and_inventory.search_suppliers
    params:
      query: Long Grain White Rice 25lb Sack
    description: Find the supplier listing for Long Grain White Rice by product name.
    kind: lookup
  - id: n9
    tool: store_procurement_and_inventory.read_sales_history
    params:
      item_id: PROD-102
      period: last_year
    description: Read last year's sales history for Long Grain White Rice.
    kind: lookup
  - id: n10
    tool: store_procurement_and_inventory.read_inventory
    params:
      item_id: INV-102
      view: record
    description: Read the current inventory record for Long Grain White Rice.
    kind: lookup
  - id: n11
    tool: store_procurement_and_inventory.verify_supplier_contracts
    params:
      product_id: PROD-102
      supplier_id: SUP-102
    description: Verify whether Long Grain White Rice can be ordered from Prairie
      Grain Supply under the current contract.
    must_yield_keys:
    - contract_found
    - active
    - ordering_permitted
    - contract_id
    kind: verify
    must_yield:
      contract_found: true
      active: true
      ordering_permitted: false
      contract_id: CON-102
  edges:
  - - n1
    - n3
  - - n1
    - n4
  - - n1
    - n5
  - - n2
    - n5
  - - n3
    - n6
  - - n4
    - n6
  - - n5
    - n6
  - - n7
    - n9
  - - n7
    - n10
  - - n7
    - n11
  - - n8
    - n11
critical_actions:
- store_procurement_and_inventory.create_purchase_order
