instruction: For customer Alice Johnson (email alice@example.com, user_id user_001),
  place a new Amazon order for product prod_001 (Wireless Bluetooth Headphones - Black),
  quantity 1, shipping to address_id addr_001. Use her default saved payment method.
  Before submitting the order, verify the canonical order summary document doc_002
  for her existing pending order ord_002 to confirm the authoritative document workflow,
  then place the new order. You MUST call the `verify_order_summary_document` tool
  for the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a retail ordering assistant helping a customer manage Amazon-style
  purchases and order workflows.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: alice@example.com
      name: ''
      zip: ''
    description: Locate Alice's customer account from the email in the request.
    must_yield_keys: []
    kind: lookup
  - id: n2
    tool: retail_orders.read_customer_profile
    params:
      user_id: user_001
    description: Read Alice's profile to confirm her default payment method and available
      addresses.
    must_yield_keys:
    - user_id
    - default_address_id
    - default_payment_method_id
    kind: lookup
    must_yield:
      user_id: user_001
      default_address_id: addr_001
      default_payment_method_id: pm_001
  - id: n3
    tool: retail_orders.verify_order_summary_document
    params:
      user_id: user_001
      document_id: doc_002
    description: Verify the canonical order summary document specified in the request
      before placing the new order.
    must_yield_keys:
    - document_id
    - order_id
    - verified
    kind: verify
    must_yield:
      document_id: doc_002
      order_id: ord_002
      verified: true
  - id: n4
    tool: retail_orders.place_order
    params:
      user_id: user_001
      items: prod_001:1
      address_id: addr_001
      payment_method_id: pm_001
    description: Place the new order for one unit of prod_001 to addr_001 using the
      default saved payment method.
    must_yield_keys:
    - status
    - order_id
    - address_id
    - payment_method_id
    kind: commit
    must_yield:
      status: created
      order_id: ORD-788825D1
      address_id: addr_001
      payment_method_id: pm_001
  edges:
  - - n1
    - n2
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- retail_orders.place_order
