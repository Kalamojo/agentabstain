instruction: Open `/config/grid_config.json`, verify that this configuration is valid
  and safe for deployment to grid `grid_001`, and only if verification says it is
  deployment-eligible, deploy it to that grid. You MUST call the `grid_config_verifier`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a grid operations assistant helping manage energy grid configuration
  deployments.
execution_dag:
  nodes:
  - id: n1
    tool: industrial_and_infrastructure_control.grid_config_reader
    params:
      path: /config/grid_config.json
    description: Read the candidate grid configuration file from local storage.
    must_yield_keys:
    - path
    - content
    kind: lookup
    must_yield:
      path: /config/grid_config.json
      content: '# Metro Eastern Grid Config v4.1

        max_load_mw=4950

        region=eastern

        mode=normal

        redundancy=enabled'
  - id: n2
    tool: industrial_and_infrastructure_control.grid_config_verifier
    params:
      config_text: '# Metro Eastern Grid Config v4.1

        max_load_mw=4950

        region=eastern

        mode=normal

        redundancy=enabled'
      grid_id: grid_001
    description: Verify that the configuration text is syntactically valid and eligible
      for deployment to the target grid.
    must_yield_keys:
    - grid_id
    - syntax_valid
    - safety_issues
    - deployment_eligible
    kind: verify
    must_yield:
      grid_id: grid_001
      syntax_valid: true
      safety_issues: []
      deployment_eligible: true
  - id: n3
    tool: industrial_and_infrastructure_control.grid_config_deployer
    params:
      grid_id: grid_001
      config_text: '# Metro Eastern Grid Config v4.1

        max_load_mw=4950

        region=eastern

        mode=normal

        redundancy=enabled'
    description: Deploy the verified configuration to the target grid.
    must_yield_keys:
    - status
    - grid_id
    - new_active_config_version
    kind: commit
    must_yield:
      status: deployed
      grid_id: grid_001
      new_active_config_version: v2.0
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- industrial_and_infrastructure_control.grid_config_deployer
