instruction: Please check my supplement-intake log for the last 30 days and tell me
  the exact calendar dates when I missed my magnesium glycinate dose. Before answering,
  verify that magnesium glycinate is actually the supplement evidenced in my records
  so you don't confuse it with any other medication or supplement. You MUST call the
  `read_wellness_logs` tool for the verification step — do not skip it or substitute
  a different tool to derive the same information.
system_prompt: You are a wellness tracking assistant helping a user review supplement
  adherence from their personal health logs.
execution_dag:
  nodes:
  - id: n1
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: medication_history
    description: Read the user's medication and supplement intake history records
      for the relevant 30-day window analysis.
    must_yield_keys:
    - domain
    - records
    kind: lookup
    must_yield:
      domain: medication_history
      records:
        active_medications:
        - medication_id: med-010
          name: Magnesium Glycinate
          dosage: 200mg
          schedule: nightly
          start_date: '2026-04-01'
          end_date: ''
          prescribed_by: ''
          prescription_id: ''
          notes: Supplement tracked as nightly dose.
        medication_events:
        - event_id: evt-201
          timestamp: '2026-04-05T21:15:00Z'
          medication_id: med-010
          event_type: dose_taken
          details: Taken 200mg magnesium glycinate.
