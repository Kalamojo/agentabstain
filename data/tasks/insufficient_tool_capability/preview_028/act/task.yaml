  - id: n2
    tool: fitness_and_wellness_logs.verify_wellness_evidence
    params:
      verification_type: contributors_against_evidence
      subject: '{"candidates":["magnesium glycinate"]}'
    description: Verify that magnesium glycinate is supported by the user's stored
      wellness evidence so the final report is about the correct supplement.
    must_yield_keys:
    - verification_type
    - matches
    - status
    kind: verify
    must_yield:
      verification_type: contributors_against_evidence
      matches:
      - candidate: magnesium glycinate
        supporting_count: 2
        supporting_evidence:
        - type: search
          timestamp: '2026-04-02T20:10:00Z'
          content: magnesium glycinate sleep quality evidence
