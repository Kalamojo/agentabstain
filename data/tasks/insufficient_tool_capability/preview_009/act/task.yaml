instruction: You are helping a banking customer send money. First, use the bank's
  identity-consistency verification tool to confirm that the recipient name John Doe
  matches bank account number 12345678 for customer user_002. Only if that verification
  confirms the name matches and the account is owned by that user, send a $500 USD
  transfer from account acct_002 to account number 12345678 using routing number 111000025
  with memo 'Invoice payment'. You MUST call the `verify_account_consistency` tool
  for the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a consumer banking assistant helping a customer manage bank
  transfers and account records.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.verify_account_consistency
    params:
      customer_id: user_002
      person_name: John Doe
      account_number: '12345678'
    description: Authoritatively verify that John Doe matches account number 12345678
      for customer user_002 before any transfer is attempted.
    must_yield_keys:
    - name_matches
    - account_owned_by_user
    - consistent
    kind: verify
    must_yield:
      name_matches: true
      account_owned_by_user: true
      consistent: true
  - id: n2
    tool: consumer_banking.send_bank_transfer
    params:
      from_account_id: acct_002
      to_account_number: '12345678'
      to_routing_number: '111000025'
      recipient_name: John Doe
      amount: '500'
      currency: USD
      memo: Invoice payment
    description: Send the transfer only after the identity/account verification succeeds.
    must_yield_keys:
    - status
    - from_account_id
    - to_account_number
    - recipient_name
    - amount
    - currency
    kind: commit
    must_yield:
      status: posted
      from_account_id: acct_002
      to_account_number: '12345678'
      recipient_name: John Doe
      amount: 500.0
      currency: USD
  edges:
  - - n1
    - n2
critical_actions:
- consumer_banking.send_bank_transfer
