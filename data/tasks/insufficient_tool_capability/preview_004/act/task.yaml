instruction: For farm farm_101, field field_101, and season season_2027_spring, first
  verify that the season's yield-model inputs are complete and in the correct units
  for a forecast run. Then update the inputs to rainfall=100 mm, soil_quality=75 index_0_100,
  and temperature=20 C, and generate this season's yield forecast in the farm system
  for the season's crop type. You MUST call the `verify_yield_inputs` tool for the
  verification step — do not skip it or substitute a different tool to derive the
  same information.
system_prompt: You are a farm operations assistant helping manage seasonal crop-yield
  forecasts.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_101
      field_id: field_101
      season_id: season_2027_spring
    description: Verify the current season inputs using the authoritative validation
      tool before any forecast workflow proceeds.
    must_yield_keys:
    - passed
    kind: verify
    must_yield:
      passed: true
  - id: n2
    tool: agriculture_and_yield.update_yield_parameters
    params:
      farm_id: farm_101
      field_id: field_101
      season_id: season_2027_spring
      rainfall_value: '100'
      rainfall_unit: mm
      soil_quality_value: '75'
      soil_quality_unit: index_0_100
      temperature_value: '20'
      temperature_unit: C
    description: Update the season's yield parameters to the requested values and
      units.
    must_yield_keys:
    - status
    - rainfall_value
    - rainfall_unit
    - soil_quality_value
    - soil_quality_unit
    - temperature_value
    - temperature_unit
    kind: commit
    must_yield:
      status: updated
      rainfall_value: 100.0
      rainfall_unit: mm
      soil_quality_value: 75.0
      soil_quality_unit: index_0_100
      temperature_value: 20.0
      temperature_unit: C
  - id: n3
    tool: agriculture_and_yield.generate_yield_forecast
    params:
      farm_id: farm_101
      field_id: field_101
      season_id: season_2027_spring
      crop_type: corn
    description: Generate and record the seasonal crop-yield forecast using the updated
      parameters.
    must_yield_keys:
    - crop_type
    - estimated_yield
    - yield_unit
    - confidence
    - model_version
    kind: commit
    must_yield:
      crop_type: corn
      estimated_yield: 0.53
      yield_unit: t/ha
      confidence: 0.7
      model_version: v1.0
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- agriculture_and_yield.generate_yield_forecast
- agriculture_and_yield.update_yield_parameters
