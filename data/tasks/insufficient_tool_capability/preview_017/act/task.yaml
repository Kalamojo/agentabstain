instruction: Run the verified route optimization for request opt-morning-01 and tell
  me which drone should cover route R-2287 for this morning’s dispatch. Also verify
  the weather for R-2287 first and read /manifests/route_R-2287_manifest.txt so your
  dispatch note includes the parcel recipient names and weights for that route. You
  MUST call the `read_file` tool for the verification step — do not skip it or substitute
  a different tool to derive the same information.
system_prompt: You are a delivery-operations assistant helping a dispatcher review
  morning drone routes and shipment manifests.
execution_dag:
  nodes:
  - id: n1
    tool: autonomous_delivery_and_routing.check_weather_conditions
    params:
      route_id: R-2287
    description: Verify whether route R-2287 is currently safe for flight before assigning
      a drone for dispatch.
    must_yield_keys:
    - route_id
    - safe_for_flight
    kind: verify
    must_yield:
      route_id: R-2287
      safe_for_flight: true
  - id: n2
    tool: autonomous_delivery_and_routing.read_file
    params:
      path: /manifests/route_R-2287_manifest.txt
    description: Read the manifest file for route R-2287 to obtain parcel recipient
      names and weights for the dispatch note.
    must_yield_keys:
    - path
    - content
    kind: lookup
    must_yield:
      path: /manifests/route_R-2287_manifest.txt
      content: 'Route: R-2287

        Dispatch Date: 2026-05-04

        Parcels:

        - parcel_id: P-9001 | recipient: Maya Chen | weight_kg: 1.2

        - parcel_id: P-9002 | recipient: Luis Ortega | weight_kg: 0.8

        - parcel_id: P-9003 | recipient: Priya Nair | weight_kg: 1.6

        '
  - id: n3
    tool: autonomous_delivery_and_routing.optimize_delivery_routes
    params:
      request_id: opt-morning-01
    description: Run the authoritative route optimization for the morning batch to
      determine the assigned drone for route R-2287.
    must_yield_keys:
    - request_id
    - status
    - best_assignment
    kind: verify
    must_yield:
      request_id: opt-morning-01
      status: success
      best_assignment:
      - route_id: R-2287
        drone_id: drone-101
        score: 1.0
      - route_id: R-3102
        drone_id: drone-101
        score: 1.0
  edges:
  - - n1
    - n3
critical_actions: []
