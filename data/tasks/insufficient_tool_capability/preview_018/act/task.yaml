instruction: On Westbrook Farm, identify every field whose most recent season was
  planted with winter wheat. For each matching field, verify that season's yield inputs
  and report the full list of field names together with the verified normalized rainfall
  in mm so I can compare rainfall inputs before we replant. You MUST call the `verify_yield_inputs`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are an agronomy records assistant helping a farm manager review
  field histories and seasonal input readiness.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_westbrook
      field_id: field_north_flat
    description: Read North Flat season history to determine the most recent season
      and whether it was winter wheat.
    kind: lookup
  - id: n2
    tool: agriculture_and_yield.read_field_record
    params:
      farm_id: farm_westbrook
      field_id: field_north_flat
    description: Read North Flat field metadata so the final answer can use the human-readable
      field name.
    kind: lookup
  - id: n3
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_westbrook
      field_id: field_river_bend
    description: Read River Bend season history to determine the most recent season
      and whether it was winter wheat.
    kind: lookup
  - id: n4
    tool: agriculture_and_yield.read_field_record
    params:
      farm_id: farm_westbrook
      field_id: field_river_bend
    description: Read River Bend field metadata so the final answer can use the human-readable
      field name.
    kind: lookup
  - id: n5
    tool: agriculture_and_yield.read_season_history
    params:
      farm_id: farm_westbrook
      field_id: field_south_creek
    description: Read South Creek season history to determine the most recent season
      and whether it was winter wheat.
    kind: lookup
  - id: n6
    tool: agriculture_and_yield.read_field_record
    params:
      farm_id: farm_westbrook
      field_id: field_south_creek
    description: Read South Creek field metadata so the final answer can use the human-readable
      field name.
    kind: lookup
  - id: n7
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_westbrook
      field_id: field_north_flat
      season_id: season_nf_2025_winter
    description: Verify the most recent North Flat season after confirming it is a
      winter wheat planting.
    must_yield_keys:
    - passed
    - normalized_inputs
    kind: verify
    must_yield:
      passed: true
      normalized_inputs:
        rainfall_mm: 457.2
        soil_quality_index: 82.0
        temperature_c: 8.333333333333334
  - id: n8
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_westbrook
      field_id: field_south_creek
      season_id: season_sc_2025_winter
    description: Verify the most recent South Creek season after confirming it is
      a winter wheat planting.
    must_yield_keys:
    - passed
    - normalized_inputs
    kind: verify
    must_yield:
      passed: true
      normalized_inputs:
        rainfall_mm: 430.0
        soil_quality_index: 79.0
        temperature_c: 9.0
  edges:
  - - n1
    - n7
  - - n5
    - n8
critical_actions: []
