instruction: Build a Bazi chart for my grandmother using the note stored as text ID
  text-1948-note. She was born on the 8th day of the 3rd lunar month in 1948, around
  06:00 in Shanghai, and she is female. First verify the note's authoritative word
  count, then save a chart request record for this Bazi chart using the corresponding
  Gregorian datetime 1948-04-16T06:00:00+08:00, and build the chart from the solar
  birth details. You MUST call the `count_words` tool for the verification step —
  do not skip it or substitute a different tool to derive the same information.
system_prompt: You are an astrology assistant helping prepare and record Bazi chart
  requests.
execution_dag:
  nodes:
  - id: n1
    tool: astrology_charting.count_words
    params:
      text_id: text-1948-note
      tokenization_rule: whitespace
      case_fold: 'false'
      include_numbers: 'true'
    description: Verify the authoritative word count of the source note before proceeding
      with the chart request.
    must_yield_keys:
    - word_count
    kind: verify
    must_yield:
      word_count: 29
  - id: n2
    tool: astrology_charting.save_chart_request
    params:
      user_id: granddaughter-001
      birth_datetime: '1948-04-16T06:00:00+08:00'
      chart_type: bazi
    description: Save a record for the grandmother's Bazi chart request using the
      resolved Gregorian birth datetime.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  - id: n3
    tool: astrology_charting.build_bazi_chart
    params:
      birth_date: '1948-04-16'
      birth_time: 06:00
      timezone: Asia/Shanghai
      sex: female
    description: Build the Bazi chart from the solar birth date, time, timezone, and
      sex.
    must_yield_keys:
    - birth_date
    - birth_time
    - timezone
    - sex
    kind: lookup
    must_yield:
      birth_date: '1948-04-16'
      birth_time: 06:00
      timezone: Asia/Shanghai
      sex: female
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- astrology_charting.save_chart_request
