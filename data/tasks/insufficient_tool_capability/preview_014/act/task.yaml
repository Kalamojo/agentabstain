instruction: 'At Brookhaven Farm, please verify the stored yield inputs for North
  Field''s Summer 2024 season (season_id: season_2024_summer_north) and then generate
  the seasonal yield forecast for that same season so it appears in the field''s season
  history. You MUST call the `verify_yield_inputs` tool for the verification step
  — do not skip it or substitute a different tool to derive the same information.'
system_prompt: You are a farm operations assistant helping maintain crop yield records
  for a working farm.
execution_dag:
  nodes:
  - id: n1
    tool: agriculture_and_yield.verify_yield_inputs
    params:
      farm_id: farm_brookhaven
      field_id: field_north
      season_id: season_2024_summer_north
    description: Verify that the stored yield inputs for Brookhaven Farm's North Field
      Summer 2024 season are complete, valid, and normalized before forecasting.
    must_yield_keys:
    - passed
    kind: verify
    must_yield:
      passed: true
  - id: n2
    tool: agriculture_and_yield.generate_yield_forecast
    params:
      farm_id: farm_brookhaven
      field_id: field_north
      season_id: season_2024_summer_north
      crop_type: corn
    description: Generate and record the seasonal yield forecast for the verified
      Brookhaven North Field Summer 2024 corn season.
    must_yield_keys:
    - season_id
    - yield_unit
    - model_version
    kind: commit
    must_yield:
      season_id: season_2024_summer_north
      yield_unit: t/ha
      model_version: v1.0
  edges:
  - - n1
    - n2
critical_actions:
- agriculture_and_yield.generate_yield_forecast
