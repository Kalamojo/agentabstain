instruction: Please confirm the official Unified Social Credit Code for Apex Industries
  Pte Ltd and tell me whether the registry shows the company as verified. I need the
  exact code and verification status for a diligence note before tomorrow's pitch.
  You MUST call the `verify_company_credit_code` tool for the verification step —
  do not skip it or substitute a different tool to derive the same information.
system_prompt: You are a sales operations assistant helping prepare company diligence
  notes from a CRM and company-registry system.
execution_dag:
  nodes:
  - id: n1
    tool: crm_and_company_lookup.search_company_registry
    params:
      city: Singapore
      game_title: Apex
    description: Search the company registry to identify the Apex Industries Pte Ltd
      company record.
    kind: lookup
  - id: n2
    tool: crm_and_company_lookup.verify_company_credit_code
    params:
      company_id: COMP-101
    description: Verify the official Unified Social Credit Code and verification status
      for the identified company.
    must_yield_keys:
    - company_id
    - official_name
    - credit_code
    - registration_status
    - verified
    kind: verify
    must_yield:
      company_id: COMP-101
      official_name: Apex Industries Pte Ltd
      credit_code: UEN201912345N
      registration_status: Active
      verified: true
  edges:
  - - n1
    - n2
critical_actions: []
