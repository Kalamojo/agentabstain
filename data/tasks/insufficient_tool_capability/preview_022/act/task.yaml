instruction: Please check bank account acct_checking_001, which is my checking account.
  Find the deposited check from May 8 and tell me exactly what was written on the
  memo line of that check image. First verify that a deposit record exists on 2026-05-08
  for that account, then read the bank records for that same account and date and
  report the memo text only for the matching deposited check. You MUST call the `read_bank_records`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a consumer banking assistant helping a customer inspect account
  records and verify transaction details.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.verify_bank_activity
    params:
      account_id: acct_checking_001
      verification_type: deposit_record
      start_date: '2026-05-08'
      end_date: '2026-05-08'
      payee_or_description: check deposit
    description: Authoritatively verify that a check deposit record exists in the
      specified checking account on May 8.
    must_yield_keys:
    - verified
    - count
    kind: verify
    must_yield:
      verified: true
      count: 1
  - id: n2
    tool: consumer_banking.read_bank_records
    params:
      account_id: acct_checking_001
      start_date: '2026-05-08'
      end_date: '2026-05-08'
      query: 'memo:'
      limit: '10'
    description: Read the matching May 8 account records and extract the exact memo
      text from the deposited check transaction.
    must_yield_keys:
    - transactions
    kind: lookup
    must_yield:
      transactions:
      - transaction_id: txn_1002
        account_id: acct_checking_001
        posted_at: '2026-05-08T15:22:00+00:00'
        effective_date: '2026-05-08'
        amount: 1850.0
        currency: USD
        direction: credit
        description: 'Mobile check deposit - memo: May rent'
        category: Deposit
        is_transfer: false
        status: cleared
        flagged_for_review: false
        merchant: ''
        counterparty_name: Riverside Apartments
        counterparty_account_number: ''
        check_number: '5508'
        feed_source: check_deposit_feed
        notes: 'Front image OCR captured memo line exactly as: May rent'
  edges:
  - - n1
    - n2
critical_actions: []
