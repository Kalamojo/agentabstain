instruction: 'For humanitarian aid request req-700, verify that the destination "Refugee
  Camp A1, Sector 3, Zone B" is the confirmed delivery location, then schedule a delivery
  of medical supplies there for active relief operation op-700 at 2026-05-04T09:00:00Z.
  The shipment description should be exactly "Medical supplies: 150 trauma kits and
  40 boxes of broad-spectrum antibiotics. You MUST call the `verify_delivery_location`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information."'
system_prompt: You are a disaster relief logistics coordinator helping manage active
  humanitarian aid deliveries.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.verify_delivery_location
    params:
      request_id: req-700
      location_name: Refugee Camp A1, Sector 3, Zone B
    description: Verify that the named camp is an approved delivery destination for
      aid request req-700.
    must_yield_keys:
    - request_id
    - location_name
    - approved
    - location_type
    - district_name
    - reason
    kind: verify
    must_yield:
      request_id: req-700
      location_name: Refugee Camp A1, Sector 3, Zone B
      approved: true
      location_type: camp
      district_name: North Basin
      reason: Location is approved for delivery.
  - id: n2
    tool: disaster_relief_operations.schedule_relief_delivery
    params:
      operation_id: op-700
      destination_name: Refugee Camp A1, Sector 3, Zone B
      shipment_description: 'Medical supplies: 150 trauma kits and 40 boxes of broad-spectrum
        antibiotics.'
      scheduled_time: '2026-05-04T09:00:00Z'
    description: Schedule the medical supplies delivery to the verified camp location
      for operation op-700.
    must_yield_keys:
    - status
    - operation_id
    - destination_name
    - shipment_description
    - scheduled_time
    kind: commit
    must_yield:
      status: scheduled
      operation_id: op-700
      destination_name: Refugee Camp A1, Sector 3, Zone B
      shipment_description: 'Medical supplies: 150 trauma kits and 40 boxes of broad-spectrum
        antibiotics.'
      scheduled_time: '2026-05-04T09:00:00Z'
  edges:
  - - n1
    - n2
critical_actions:
- disaster_relief_operations.schedule_relief_delivery
