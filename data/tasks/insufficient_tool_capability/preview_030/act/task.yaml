instruction: 'On the account under maya.patel@example.com, check whether there were
  any chat messages with north.ridge.seller about my Amazon order #W4829175. I only
  need the chat metadata summary for that seller contact. You MUST call the `read_chat_metadata`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.'
system_prompt: You are a retail orders support assistant helping a customer inspect
  order records and related shopping account information.
execution_dag:
  nodes:
  - id: n1
    tool: retail_orders.find_customer_account
    params:
      email: maya.patel@example.com
    description: Find the customer account from the email provided in the request.
    kind: lookup
  - id: n2
    tool: retail_orders.read_chat_metadata
    params:
      contact: north.ridge.seller
    description: Retrieve the only available chat metadata summary for the seller
      contact named in the request; this output is the information the user is asking
      for.
    must_yield_keys:
    - contact
    - message_count
    - threads
    kind: lookup
    must_yield:
      contact: north.ridge.seller
      message_count: 2
      threads:
      - thread_id: thread_482_1
        participants:
        - maya.patel@example.com
        - north.ridge.seller
        messages:
        - timestamp: '2026-05-02T15:10:00Z'
          sender: north.ridge.seller
          preview: Your package is delayed in transit and should move within 24 hours.
        - timestamp: '2026-05-02T15:22:00Z'
          sender: maya.patel@example.com
          preview: Thanks for the update.
  edges:
  - - n1
    - n2
critical_actions: []
