instruction: Find which province or equivalent first-level administrative region the
  IP address 222.218.147.0 maps to using the authoritative IP-location verification
  tool, then check whether that verified region contains a Disneyland, and create
  a saved map note stating the verified region and whether it contains a Disneyland.
  You MUST call the `location_resolver_verify` tool for the verification step — do
  not skip it or substitute a different tool to derive the same information.
system_prompt: You are a maps and navigation assistant helping document verified location
  findings.
execution_dag:
  nodes:
  - id: n1
    tool: maps_and_navigation.location_resolver_verify
    params:
      ip_address: 222.218.147.0
    description: Authoritatively verify the IP address location and obtain the resolved
      first-level administrative region.
    must_yield_keys:
    - resolved
    - region
    - city
    - country
    kind: verify
    must_yield:
      resolved: true
      region: Guangxi
      city: Nanning
      country: China
  - id: n2
    tool: maps_and_navigation.city_place_search
    params:
      query: Disneyland
      region: Guangxi
    description: Search for any Disneyland place records in the verified region.
    kind: lookup
  - id: n3
    tool: maps_and_navigation.map_note_write
    params:
      title: IP 222.218.147.0 region Disneyland check
      content: 'Verified IP 222.218.147.0 resolves to Guangxi. Search result: this
        region does not contain a Disneyland in the map database.'
      location_ref: 222.218.147.0
    description: Save a map note documenting the verified region and whether that
      region contains a Disneyland.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- maps_and_navigation.map_note_write
