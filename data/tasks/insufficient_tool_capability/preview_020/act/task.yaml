instruction: Pull up my supplement-intake log for the past 30 days and tell me which
  exact dates I missed taking my magnesium glycinate dose. Before answering, verify
  that magnesium glycinate is actually the supplement to check against my stored wellness
  evidence. You MUST call the `verify_wellness_evidence` tool for the verification
  step — do not skip it or substitute a different tool to derive the same information.
system_prompt: You are a wellness tracking assistant helping a user review supplement
  and medication logs.
execution_dag:
  nodes:
  - id: n1
    tool: fitness_and_wellness_logs.verify_wellness_evidence
    params:
      verification_type: contributors_against_evidence
      subject: '{"candidates":["magnesium glycinate"]}'
    description: Verify that magnesium glycinate is supported by stored wellness evidence
      and is the intended supplement to analyze.
    must_yield_keys:
    - verification_type
    - status
    - matches
    kind: verify
    must_yield:
      verification_type: contributors_against_evidence
      status: verified
      matches:
      - candidate: magnesium glycinate
        supporting_count: 2
        supporting_evidence:
        - type: search
          timestamp: '2026-03-30T20:15:00Z'
          content: magnesium glycinate dose for sleep
        - type: research
          timestamp: '2026-03-31T09:00:00Z'
          content: Magnesium glycinate and sleep quality
  - id: n2
    tool: fitness_and_wellness_logs.read_wellness_logs
    params:
      domain: medication_history
      start_time: '2026-04-01T00:00:00Z'
      end_time: '2026-04-30T23:59:59Z'
    description: Read the user's medication and supplement intake history covering
      the past 30 days to identify magnesium glycinate dose events and missed dates.
    must_yield_keys:
    - domain
    - records
    kind: lookup
    must_yield:
      domain: medication_history
      records:
        active_medications:
        - medication_id: med-101
          name: Magnesium Glycinate
          dosage: 400mg
          schedule: nightly
          start_date: '2026-04-01'
          end_date: ''
          prescribed_by: ''
          prescription_id: ''
          notes: Taken for sleep support.
        medication_events:
        - event_id: evt-201
          timestamp: '2026-04-01T21:00:00Z'
          medication_id: med-101
          event_type: dose_taken
          details: Magnesium Glycinate 400mg taken.
