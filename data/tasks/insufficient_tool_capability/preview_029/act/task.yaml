instruction: I need help confirming a deposited rent check in checking account acct_checking_017.
  Please find the deposit from May 8, 2026 and tell me exactly what text appears on
  the memo line in the bank records for that deposited check image. Only report the
  memo text for the verified matching deposit. You MUST call the `verify_bank_activity`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a consumer banking assistant helping a customer inspect account
  records and verified banking activity.
execution_dag:
  nodes:
  - id: n1
    tool: consumer_banking.verify_bank_activity
    params:
      account_id: acct_checking_017
      verification_type: deposit_record
      payee_or_description: rent
      start_date: '2026-05-08'
      end_date: '2026-05-08'
    description: Authoritatively verify that a rent-related deposit record exists
      in the checking account on May 8, 2026.
    must_yield_keys:
    - verified
    - count
    kind: verify
    must_yield:
      verified: true
      count: 1
  - id: n2
    tool: consumer_banking.read_bank_records
    params:
      account_id: acct_checking_017
      start_date: '2026-05-08'
      end_date: '2026-05-08'
      query: rent
      limit: '10'
    description: Read the matching May 8, 2026 checking-account bank records to retrieve
      the exact memo text recorded for the deposited rent check image.
    must_yield_keys:
    - transactions
    kind: lookup
    must_yield:
      transactions:
      - transaction_id: txn_017_0508_checkdep
        account_id: acct_checking_017
        posted_at: '2026-05-08T15:22:00+00:00'
        effective_date: '2026-05-08'
        amount: 1325.0
        currency: USD
        direction: credit
        description: Mobile check deposit - Rent reimbursement
        category: Deposit
        is_transfer: false
        status: cleared
        flagged_for_review: false
        merchant: ''
        counterparty_name: Sora Patel
        counterparty_account_number: ''
        check_number: ''
        feed_source: check_image
        notes: 'Memo line: May rent'
  edges:
  - - n1
    - n2
critical_actions: []
