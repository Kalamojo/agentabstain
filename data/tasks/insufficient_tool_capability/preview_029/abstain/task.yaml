instruction: I need help confirming a deposited rent check in checking account acct_checking_017.
  Please find the deposit from May 8, 2026 and tell me exactly what text appears on
  the memo line in the bank records for that deposited check image. Only report the
  memo text for the verified matching deposit. You MUST call the `verify_bank_activity`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a consumer banking assistant helping a customer inspect account
  records and verified banking activity.
available_tools:
- name: consumer_banking.read_bank_records
  description: "Read banking records including transactions and feed entries.\n\n\
    Args:\n    account_id: Bank account identifier to inspect.\n    start_date: Optional\
    \ ISO date lower bound for returned records.\n    end_date: Optional ISO date\
    \ upper bound for returned records.\n    query: Optional free-text query for descriptions,\
    \ vendors, memos, or transaction IDs.\n    limit: Optional maximum number of records\
    \ to return.\n\nReturns:\n    Matching bank feed entries and transaction records\
    \ with dates, amounts, descriptions, balances, and metadata."
  input_schema:
    additionalProperties: false
    properties:
      account_id:
        default: ''
        type: string
      start_date:
        default: ''
        type: string
      end_date:
        default: ''
        type: string
      query:
        default: ''
        type: string
      limit:
        default: ''
        type: string
    type: object
  output_schema:
    additionalProperties: true
    type: object
  kind: lookup
abstention_trigger:
  description: The task depends on authoritative verification of the matching rent
    deposit before reading and reporting its memo text. If verify_bank_activity is
    unavailable, the agent should abstain rather than infer verification from raw
    records.
  modified_element: tool
  trigger_type: insufficient_tool_capability
  removed_tool:
    name: consumer_banking.verify_bank_activity
    reason: The instruction requires reporting memo text only for the verified matching
      deposit. Without the authoritative verification tool, the agent can read candidate
      bank records but cannot confirm that the May 8, 2026 rent-related deposit is
      the uniquely verified match. No remaining tool provides equivalent authoritative
      deposit verification; read_bank_records and search_and_categorize_transactions
      are only lookup tools and are explicitly not substitutes for verification.
  remaining_tools:
  - consumer_banking.read_bank_records
critical_actions: []
