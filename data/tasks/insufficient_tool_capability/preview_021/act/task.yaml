instruction: Check student ID stu_003's financial aid application for Spring 2026
  and tell me whether the disbursement schedule has been posted yet. Use the financial
  aid portal record and also check for any financial-aid inbox notice mentioning a
  disbursement schedule so you can report both the application status and whether
  any posted-schedule notice exists. You MUST call the `read_portal_application` tool
  for the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a campus portal assistant helping a student review financial
  aid and related campus notices.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: financial_aid
      student_id: stu_003
    description: Read the student's financial aid application record to get the current
      application status and notes relevant to Spring 2026.
    must_yield_keys:
    - student_id
    - application_status
    - notes
    kind: lookup
    must_yield:
      student_id: stu_003
      application_status: approved
      notes:
      - Spring 2026 award package finalized.
      - Disbursement schedule not yet posted in portal.
  - id: n2
    tool: education_and_campus_portals.search_inbox_notices
    params:
      student_id: stu_003
      portal: financial_aid
      query: disbursement schedule
    description: Search the student's financial aid inbox notices for any message
      mentioning a disbursement schedule.
    kind: lookup
  edges: []
critical_actions: []
