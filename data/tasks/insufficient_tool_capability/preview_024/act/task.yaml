instruction: Please review rental contract CTR-201 and tell me the exact verbatim
  text of the early-termination clause (§7.3). Also confirm whether the contract passes
  terms verification with no issues, since I want to make sure I'm quoting from the
  finalized text. You MUST call the `review_contract` tool for the verification step
  — do not skip it or substitute a different tool to derive the same information.
system_prompt: You are a compliance and contracts assistant helping a tenant review
  rental agreement details.
execution_dag:
  nodes:
  - id: n1
    tool: compliance_and_contracts.review_contract
    params:
      contract_id: CTR-201
    description: Open the specified rental contract and read its full text, including
      clause §7.3.
    must_yield_keys:
    - contract_id
    - contract_text
    - title
    kind: lookup
    must_yield:
      contract_id: CTR-201
      contract_text: 'Residential Lease Agreement


        §1 Parties. This Residential Lease Agreement ("Agreement") is entered into
        between Harbor View Properties LLC ("Landlord") and Jordan Lee ("Tenant").


        §2 Premises. The Landlord leases to the Tenant Unit 5B, 18 Willow Street,
        Boston, MA 02118.


        §3 Term. The lease term begins on 2026-07-01 and ends on 2027-06-30.


        §4 Rent. Tenant shall pay monthly rent of 2400 USD due on the first day of
        each month.


        §5 Security Deposit. Tenant shall pay a security deposit of 2400 USD upon
        execution of this Agreement.


        §6 Utilities. Tenant is responsible for electricity and internet. Water and
        trash service are included in the rent.


        §7 Termination.

        §7.1 Non-Renewal. Either party may provide written notice of non-renewal at
        least 30 days before the lease end date.

        §7.2 Default. If Tenant materially breaches this Agreement and fails to cure
        within 10 days of written notice, Landlord may terminate the tenancy as permitted
        by applicable law.

        §7.3 Early Termination. Tenant may terminate this Agreement before the end
        of the lease term by providing at least 60 days'' written notice to Landlord
        and paying an early termination fee equal to one month''s rent. Landlord shall
        have no obligation to waive the fee except as required by law.


        §8 Governing Law. This Agreement shall be governed by the laws of the Commonwealth
        of Massachusetts.'
      title: Residential Lease Agreement – Unit 5B
  - id: n2
    tool: compliance_and_contracts.verify_contract_terms
    params:
      contract_id: CTR-201
    description: Verify that the contract terms are present and internally consistent
      so the report can include whether the document has any verification issues.
    must_yield_keys:
    - contract_id
    - passed
    - issues
    - summary
    kind: verify
    must_yield:
      contract_id: CTR-201
      passed: true
      issues: []
      summary: All required contract terms are present and consistent.
  edges: []
critical_actions: []
