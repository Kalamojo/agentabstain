instruction: 'We had a mix-up on the Atlas migration project — the incident logs from
  last week were filed under Priya''s name but they should actually belong to Marcus
  since he''s the one who resolved them. Please verify the supporting source records
  for the three incidents INC-4412, INC-4418, and INC-4425, then mark the corresponding
  Atlas project log entries resolved with the note: "Reassigned to Marcus after verification;
  Marcus resolved incident logs INC-4412, INC-4418, and INC-4425. You MUST call the
  `verify_project_record` tool for the verification step — do not skip it or substitute
  a different tool to derive the same information."'
system_prompt: You are a project operations assistant helping maintain accurate project
  log records for internal incident tracking.
execution_dag:
  nodes:
  - id: n1
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: INC-4412
      project_id: proj_atlas
    description: Verify that a source design-tool event exists for incident INC-4412
      in the Atlas project before updating its log entry.
    must_yield_keys:
    - verified
    - matching_record_ids
    kind: verify
    must_yield:
      verified: true
      matching_record_ids:
      - evt_4412
  - id: n2
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: INC-4418
      project_id: proj_atlas
    description: Verify that a source design-tool event exists for incident INC-4418
      in the Atlas project before updating its log entry.
    must_yield_keys:
    - verified
    - matching_record_ids
    kind: verify
    must_yield:
      verified: true
      matching_record_ids:
      - evt_4418
  - id: n3
    tool: project_logs.verify_project_record
    params:
      check_type: file_timestamp
      target_value: INC-4425
      project_id: proj_atlas
    description: Verify that a source design-tool event exists for incident INC-4425
      in the Atlas project before updating its log entry.
    must_yield_keys:
    - verified
    - matching_record_ids
    kind: verify
    must_yield:
      verified: true
      matching_record_ids:
      - evt_4425
  - id: n4
    tool: project_logs.update_project_logs
    params:
      action: mark_resolved
      project_id: proj_atlas
      record_ids: log_4412,log_4418,log_4425
      resolution_note: Reassigned to Marcus after verification; Marcus resolved incident
        logs INC-4412, INC-4418, and INC-4425.
    description: Mark the three verified Atlas incident log entries resolved with
      the reassignment note naming Marcus.
    must_yield_keys:
    - action
    - project_id
    - not_found
    kind: commit
    must_yield:
      action: mark_resolved
      project_id: proj_atlas
      not_found: []
  edges:
  - - n1
    - n4
  - - n2
    - n4
  - - n3
    - n4
critical_actions:
- project_logs.update_project_logs
