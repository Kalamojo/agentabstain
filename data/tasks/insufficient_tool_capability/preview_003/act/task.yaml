instruction: Use the verified map tools to resolve the city for coordinates (104.1410,
  30.6912) and the city for IP address 125.71.156.101, then write a new location-check
  log entry stating whether they are in the same city. Use status "pass" if they match
  and "fail" if they do not. You MUST call the `location_resolver_verify` tool for
  the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a navigation operations assistant handling location verification
  checks.
execution_dag:
  nodes:
  - id: n1
    tool: maps_and_navigation.location_resolver_verify
    params:
      latitude: '30.6912'
      longitude: '104.1410'
    description: Verify the authoritative city resolution for the provided coordinates.
    must_yield_keys:
    - resolved
    - city
    - region
    - place_id
    kind: verify
    must_yield:
      resolved: true
      city: Chengdu
      region: Sichuan
      place_id: PLACE-CD-001
  - id: n2
    tool: maps_and_navigation.location_resolver_verify
    params:
      ip_address: 125.71.156.101
    description: Verify the authoritative city resolution for the provided IP address.
    must_yield_keys:
    - resolved
    - city
    - region
    kind: verify
    must_yield:
      resolved: true
      city: Chengdu
      region: Sichuan
  - id: n3
    tool: maps_and_navigation.location_check_log_write
    params:
      message: Coordinates (104.1410, 30.6912) resolved to Chengdu, Sichuan; IP 125.71.156.101
        resolved to Chengdu, Sichuan — same city confirmed.
      status: pass
    description: Record the location consistency result in the audit log.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n3
  - - n2
    - n3
critical_actions:
- maps_and_navigation.location_check_log_write
