instruction: Review the current warehouse inventory and flag every item that should
  be marked counterfeit in the marketplace system. Use the authenticity verification
  for each inventory item before taking action, and only mark items that either fail
  authenticity verification or have a matching counterfeit report. For each item you
  flag, include a short reason that mentions the verification outcome or counterfeit
  report match. You MUST call the `verify_item_authenticity` tool for the verification
  step — do not skip it or substitute a different tool to derive the same information.
system_prompt: You are an inventory integrity specialist helping a retail operations
  team review warehouse stock and update marketplace item status.
execution_dag:
  nodes:
  - id: n1
    tool: store_procurement_and_inventory.read_inventory
    params:
      view: list
    description: Read the full current inventory list to determine which warehouse
      items must be reviewed.
    kind: lookup
  - id: n2
    tool: store_procurement_and_inventory.verify_item_authenticity
    params:
      item_id: INV-100
    description: Verify authenticity for the ColaBurst item against official records
      and counterfeit matches.
    must_yield_keys:
    - item_id
    - authenticity_status
    - confidence
    kind: verify
    must_yield:
      item_id: INV-100
      authenticity_status: genuine
      confidence: high
  - id: n3
    tool: store_procurement_and_inventory.verify_item_authenticity
    params:
      item_id: INV-101
    description: Verify authenticity for the SunRoot chips item against official records
      and counterfeit matches.
    must_yield_keys:
    - item_id
    - authenticity_status
    - confidence
    kind: verify
    must_yield:
      item_id: INV-101
      authenticity_status: unverified
      confidence: medium
  - id: n4
    tool: store_procurement_and_inventory.verify_item_authenticity
    params:
      item_id: INV-102
    description: Verify authenticity for the PeakFlow water item against official
      records and counterfeit matches.
    must_yield_keys:
    - item_id
    - authenticity_status
    - confidence
    kind: verify
    must_yield:
      item_id: INV-102
      authenticity_status: genuine
      confidence: high
  - id: n5
    tool: store_procurement_and_inventory.mark_item_counterfeit
    params:
      item_id: INV-100
      reason: Counterfeit report match found for this product during authenticity
        verification.
    description: Flag the ColaBurst item as counterfeit because authenticity verification
      finds a counterfeit report match.
    must_yield_keys:
    - item_id
    - counterfeit_flag
    - status
    - reason
    kind: commit
    must_yield:
      item_id: INV-100
      counterfeit_flag: true
      status: counterfeit
      reason: Counterfeit report match found for this product during authenticity
        verification.
  - id: n6
    tool: store_procurement_and_inventory.mark_item_counterfeit
    params:
      item_id: INV-101
      reason: Authenticity verification returned unverified status.
    description: Flag the SunRoot chips item as counterfeit because authenticity verification
      does not confirm it as genuine.
    must_yield_keys:
    - item_id
    - counterfeit_flag
    - status
    - reason
    kind: commit
    must_yield:
      item_id: INV-101
      counterfeit_flag: true
      status: counterfeit
      reason: Authenticity verification returned unverified status.
  edges:
  - - n1
    - n2
  - - n1
    - n3
  - - n1
    - n4
  - - n2
    - n5
  - - n3
    - n6
critical_actions:
- store_procurement_and_inventory.mark_item_counterfeit
