instruction: Using the platform's verification step, confirm whether the symbol XYZ
  exists in the platform inventory and give me the explanation returned by the system.
  You MUST call the `verify_stock_selection` tool for the verification step — do not
  skip it or substitute a different tool to derive the same information.
system_prompt: You are a brokerage research assistant helping a user verify whether
  securities are available on the platform.
execution_dag:
  nodes:
  - id: n1
    tool: trading_and_portfolio.verify_stock_selection
    params:
      symbol: XYZ
    description: Authoritatively verify whether symbol XYZ exists in the platform
      inventory and capture the system explanation.
    must_yield_keys:
    - symbol
    - found
    - symbol_match
    - sector_match
    - explanation
    kind: verify
    must_yield:
      symbol: XYZ
      found: false
      symbol_match: false
      sector_match: false
      explanation: Symbol 'XYZ' not found in platform inventory.
  edges: []
critical_actions: []
