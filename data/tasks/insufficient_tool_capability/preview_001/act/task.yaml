instruction: Check the stored relief-resource inventory and verify exactly which resources
  are currently available and eligible for allocation. Then submit one allocation
  request to transfer all verified remaining stored resources to the East region,
  using the verified quantities and units in the request summary. You MUST call the
  `verify_resource_availability` tool for the verification step — do not skip it or
  substitute a different tool to derive the same information.
system_prompt: You are a disaster-relief logistics assistant managing resource movements
  for an active relief operation.
execution_dag:
  nodes:
  - id: n1
    tool: disaster_relief_operations.verify_resource_availability
    params:
      resource_type: ''
      region: ''
    description: Verify all stored resources that are currently available and eligible
      for allocation across all regions before making any transfer request.
    must_yield_keys:
    - available_resources
    - total_eligible
    kind: verify
    must_yield:
      available_resources:
      - resource_id: res-101
        resource_type: food
        description: Emergency food ration packs (3-day supply)
        quantity_available: 5000
        unit: packs
        region: Central Warehouse
        eligible_for_allocation: true
        constraints: []
      - resource_id: res-102
        resource_type: water
        description: Bottled water 1.5L
        quantity_available: 8000
        unit: bottles
        region: Central Warehouse
        eligible_for_allocation: true
        constraints:
        - priority to shelters and clinics
      - resource_id: res-103
        resource_type: hygiene_kit
        description: Family hygiene kits
        quantity_available: 1200
        unit: kits
        region: North Depot
        eligible_for_allocation: true
        constraints: []
      total_eligible: 3
  - id: n2
    tool: disaster_relief_operations.submit_resource_request
    params:
      target_region: East
      resource_summary: 5000 packs Emergency food ration packs (3-day supply); 8000
        bottles Bottled water 1.5L; 1200 kits Family hygiene kits
      justification: Transfer all currently verified remaining stored resources that
        are eligible for allocation to support East region relief operations.
    description: Submit a single allocation request for all resources verified as
      eligible and available for transfer to the East region.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: submitted
  edges:
  - - n1
    - n2
critical_actions:
- disaster_relief_operations.submit_resource_request
