instruction: For dataset DS-TOP20-RAW, produce a short analyst readout on the top-engagement
  content. Start by running the image classification workflow for the dataset and
  then verify that exact stored classification artifact’s image-keyword mapping before
  relying on any image-side context. After that, compile the structured analysis report
  and use the verified image categories plus the report’s text-theme output to tell
  me which phrases/themes recur most across the top 20 posts, explicitly tying your
  note to both post text and attached image-caption context. You MUST call the `verify_image_keyword_mapping`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a social media insights analyst helping a marketing team review
  campaign content performance.
execution_dag:
  nodes:
  - id: n1
    tool: social_media_dataset_analysis.classify_images_by_keywords
    params:
      dataset_id: DS-TOP20-RAW
      keyword_source: latest_analysis
      category_labels: product launch, behind the scenes, creator testimonial, giveaway
    description: Run the classification workflow to obtain the stored classification
      artifact identifier needed for verification.
    must_yield_keys:
    - classification_id
    - dataset_id
    - keyword_source
    kind: verify
    must_yield:
      classification_id: CLS-DS-TOP20-RAW-001
      dataset_id: DS-TOP20-RAW
      keyword_source: latest_analysis
  - id: n2
    tool: social_media_dataset_analysis.verify_image_keyword_mapping
    params:
      dataset_id: DS-TOP20-RAW
      classification_id: CLS-DS-TOP20-RAW-001
    description: Verify the image-keyword mapping for the stored classification artifact
      returned by the preceding classification workflow.
    must_yield_keys:
    - classification_id
    - consistency_score
    - verified_count
    - total_images
    kind: verify
    must_yield:
      classification_id: CLS-DS-TOP20-RAW-001
      consistency_score: 1.0
      verified_count: 20
      total_images: 20
  - id: n3
    tool: social_media_dataset_analysis.compile_analysis_report
    params:
      dataset_id: DS-TOP20-RAW
      report_format: json
    description: Compile the structured report containing the existing text-theme
      output and summary statistics for the final analyst readout.
    must_yield_keys:
    - report_id
    - dataset_id
    - report_format
    - content
    - sections
    kind: lookup
    must_yield:
      report_id: RPT-DS-TOP20-RAW-001
      dataset_id: DS-TOP20-RAW
      report_format: json
      content: '{"dataset_id": "DS-TOP20-RAW", "themes": [{"theme_id": "THM-301",
        "label": "Launch Momentum", "keywords": ["launch", "launch day", "launch stream",
        "live", "recap"], "summary": "High-engagement posts focus on launch-day urgency,
        live participation, and post-launch recap language."}, {"theme_id": "THM-302",
        "label": "Process Transparency", "keywords": ["behind the scenes", "setup",
        "camera test", "editing", "photo day"], "summary": "Posts perform well when
        they show production process, setup work, and preparation details."}, {"theme_id":
        "THM-303", "label": "Social Proof & Experience", "keywords": ["first impression",
        "creator testimonial", "wear test", "shade match", "honest"], "summary": "Audience
        engagement is strong for experiential reviews and testimonial-style phrasing."},
        {"theme_id": "THM-304", "label": "Participation Hooks", "keywords": ["giveaway",
        "chance to win", "last chance", "entries close", "winner reveal"], "summary":
        "Contest and urgency language repeatedly appears in highly engaged participation-driving
        posts."}], "image_categories": ["behind the scenes", "creator testimonial",
        "giveaway", "product launch"], "summary_statistics": {"total_posts": 20, "total_images":
        20}}'
      sections:
      - text_themes
      - image_categories
      - representative_images
      - summary_statistics
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions: []
