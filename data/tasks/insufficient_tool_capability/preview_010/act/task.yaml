instruction: Look up the official station code for Beijing South Railway Station,
  make sure it is the actual Beijing South station and not some other Beijing-area
  station, then save a map note titled 'Beijing South Station Code' containing the
  station code for later reference. You MUST call the `station_identity_verify` tool
  for the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a maps and navigation assistant helping a user verify station
  information and save reference notes.
execution_dag:
  nodes:
  - id: n1
    tool: maps_and_navigation.station_registry_search
    params:
      station_name: Beijing South
    description: Search the station registry for Beijing South station candidates.
    kind: lookup
  - id: n2
    tool: maps_and_navigation.station_identity_verify
    params:
      station_code: BJP
      intended_name: Beijing South Railway Station
      expected_city: Beijing
    description: Verify that station code BJP is the intended Beijing South Railway
      Station in Beijing rather than another similarly named station.
    must_yield_keys:
    - station_code
    - verified
    - identity_confirmed
    kind: verify
    must_yield:
      station_code: BJP
      verified: true
      identity_confirmed: true
  - id: n3
    tool: maps_and_navigation.map_note_write
    params:
      title: Beijing South Station Code
      content: 'Official station code for Beijing South Railway Station: BJP'
      location_ref: BJP
    description: Save a map note recording the verified station code for later reference.
    must_yield_keys:
    - status
    kind: commit
    must_yield:
      status: created
  edges:
  - - n1
    - n2
  - - n2
    - n3
critical_actions:
- maps_and_navigation.map_note_write
