instruction: Check my financial aid application for term Spring 2026 for student ID
  stu_001 and tell me whether the disbursement schedule has been posted yet. Use the
  financial aid portal record and also verify whether any approved financial-aid notices
  have already been applied, then report whether there is any sign that a disbursement
  schedule is available yet. You MUST call the `read_portal_application` tool for
  the verification step — do not skip it or substitute a different tool to derive
  the same information.
system_prompt: You are a campus portal assistant helping a student review university
  application and notice information.
execution_dag:
  nodes:
  - id: n1
    tool: education_and_campus_portals.read_portal_application
    params:
      portal: financial_aid
      student_id: stu_001
    description: Read the student's financial aid application record to inspect status
      and notes for any mention of a posted disbursement schedule.
    must_yield_keys:
    - application_status
    - notes
    - applied_exemptions
    kind: lookup
    must_yield:
      application_status: under_review
      notes:
      - Spring 2026 aid package is still under review.
      - Disbursement schedule has not been posted yet.
      applied_exemptions:
      - professional_judgment
  - id: n2
    tool: education_and_campus_portals.verify_exemptions_applied
    params:
      portal: financial_aid
      student_id: stu_001
    description: Verify whether approved financial-aid notices are reflected in the
      application record, since that verification result is part of the requested
      status report.
    must_yield_keys:
    - approved_notices
    - applied_exemptions
    - mismatches
    - passed
    kind: verify
    must_yield:
      approved_notices: []
      applied_exemptions:
      - professional_judgment
      mismatches: []
      passed: true
  edges: []
critical_actions: []
