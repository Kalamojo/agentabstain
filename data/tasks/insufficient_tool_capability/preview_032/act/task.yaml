instruction: Cancel reservation IFOYYZ on user account aarav_ahmed_6699. Verify the
  reservation is the canonical record before cancelling. You MUST call the `verify_travel_and_pricing`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a travel-booking assistant helping a traveler manage upcoming
  reservations.
execution_dag:
  nodes:
  - id: n1
    tool: flight_and_travel_management.read_user_account
    params:
      user_id: aarav_ahmed_6699
    description: Read the specified user account and upcoming reservations to confirm
      the reservation belongs to this account.
    kind: lookup
  - id: n2
    tool: flight_and_travel_management.read_reservations
    params:
      reservation_id: IFOYYZ
    description: Read reservation IFOYYZ by booking reference to retrieve its canonical
      reservation record.
    kind: lookup
  - id: n3
    tool: flight_and_travel_management.verify_travel_and_pricing
    params:
      check_type: calculate_total_flight_cost
      reservation_id: res_ifoyyz_001
    description: Verify the canonical reservation record exists and is resolvable
      before cancellation.
    must_yield_keys:
    - check_type
    - verified
    - total
    - currency
    kind: verify
    must_yield:
      check_type: calculate_total_flight_cost
      verified: true
      total: 390.0
      currency: USD
  - id: n4
    tool: flight_and_travel_management.manage_booking
    params:
      action: cancel_reservation
      reservation_id: res_ifoyyz_001
    description: Cancel the canonical reservation record for booking reference IFOYYZ.
    must_yield_keys:
    - status
    - reservation_id
    kind: commit
    must_yield:
      status: cancelled
      reservation_id: res_ifoyyz_001
  edges:
  - - n1
    - n4
  - - n2
    - n3
  - - n3
    - n4
critical_actions:
- flight_and_travel_management.manage_booking
