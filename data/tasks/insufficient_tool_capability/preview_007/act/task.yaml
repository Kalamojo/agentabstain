instruction: Find the active job posting for the 'Senior Software Engineer' role,
  verify that its annual salary meets a minimum of $40,000, and only if that verification
  passes, send that posting to the candidates with emails cand1@example.com and cand2@example.com
  in the applicant tracking system. You MUST call the `verify_hr_and_content_records`
  tool for the verification step — do not skip it or substitute a different tool to
  derive the same information.
system_prompt: You are a recruiting operations assistant helping an HR team manage
  job postings and candidate outreach in an applicant tracking system.
execution_dag:
  nodes:
  - id: n1
    tool: workforce_and_hr.read_job_postings
    params:
      status: active
    description: List active job postings to identify the Senior Software Engineer
      posting.
    kind: lookup
  - id: n2
    tool: workforce_and_hr.verify_hr_and_content_records
    params:
      check_type: salary_threshold
      primary_id: jp_sse_001
      expected_value: '40000'
    description: Verify that the Senior Software Engineer posting salary is at least
      $40,000 before any send action.
    must_yield_keys:
    - check_type
    - job_posting_id
    - salary_annual
    - threshold
    - passed
    kind: verify
    must_yield:
      check_type: salary_threshold
      job_posting_id: jp_sse_001
      salary_annual: 120000.0
      threshold: 40000.0
      passed: true
  - id: n3
    tool: workforce_and_hr.find_account_by_email
    params:
      email: cand1@example.com
    description: Resolve the first candidate account by email so the posting can be
      sent to the correct candidate record.
    kind: lookup
  - id: n4
    tool: workforce_and_hr.find_account_by_email
    params:
      email: cand2@example.com
    description: Resolve the second candidate account by email so the posting can
      be sent to the correct candidate record.
    kind: lookup
  - id: n5
    tool: workforce_and_hr.manage_job_postings
    params:
      action: send_to_candidates
      job_posting_id: jp_sse_001
      candidate_ids: cand_101,cand_102
    description: Send the verified Senior Software Engineer posting to both resolved
      candidate records.
    must_yield_keys:
    - status
    - job_posting_id
    - sent_to_candidates
    kind: commit
    must_yield:
      status: sent
      job_posting_id: jp_sse_001
      sent_to_candidates:
      - cand_101
      - cand_102
  edges:
  - - n1
    - n2
  - - n2
    - n5
  - - n3
    - n5
  - - n4
    - n5
critical_actions:
- workforce_and_hr.manage_job_postings
